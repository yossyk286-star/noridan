// ---------- 反射神経バトル ----------
// 1人ずつ。画面が緑になった瞬間にタップ。フライングした人は罰、おらんかったら一番遅い人が罰。
// 普通はたまにフェイク、地獄はフェイクが何回も（地獄でも出えへん回がある）。緑になる時間も毎回バラバラ
const RF_LATE = 1500; // これより遅かったら「遅すぎ」で打ち切り

function rfHeats() {
  const n = S.members.length, k = Math.ceil(n / 4), out = [];
  let i = 0;
  for (let h = 0; h < k; h++) { const size = Math.floor(n / k) + (h < n % k ? 1 : 0); out.push(Array.from({ length: size }, () => i++)); }
  return out;
}
function rfRound() {
  const rf = S.game.rf;
  rf.round++; rf.k = 0; rf.res = Array(S.members.length).fill(null); rf.losers = [];
  if (rf.style === "multi") { rf.heats = rfHeats(); rf.h = 0; rf.phase = "mhand"; S.game.doer = -1; return; }
  rfBegin();
}
// 緑の時間とフェイク（色・出る時間）を決める。フェイクは1.5秒以上ためてから0.8秒、緑の0.4秒前までに消える
function rfPlan(level) {
  const go = 5000 + Math.random() * 10000; // 5〜15秒
  const want = level === "yurume" ? 0 : level === "futsu" ? (Math.random() < 0.55 ? 1 : 0) : [0, 1, 1, 2, 2, 3][rnd(6)];
  const fakes = [];
  for (let t = 0; t < 40 && fakes.length < want; t++) {
    const at = 1500 + Math.random() * (go - 1500 - 1200);
    if (at < 1500 || fakes.some((f) => Math.abs(f.at - at) < 1100)) continue;
    fakes.push({ at, kind: level === "futsu" ? "yellow" : ["yellow", "red", "mada"][rnd(3)] });
  }
  return { go, fakes: fakes.sort((a, b) => a.at - b.at) };
}
const rfWho = (rf) => (rf.k + rf.round - 1) % S.members.length;
function rfBegin() { const rf = S.game.rf; rf.who = rfWho(rf); S.game.doer = rf.who; rf.phase = "hand"; }
function rfGo() {
  const rf = S.game.rf, now = Date.now();
  // フェイク（緑になる前に出る）
  const W = rf.style === "multi" ? "mwait" : "wait";
  // 緑になるのは毎回バラバラ（5〜15秒のどこか）。フェイクも数・時間・色がバラバラで、緑の直前とは限らへん
  const plan = rfPlan(S.level);
  rf.phase = W; rf.color = "wait"; rf.goAt = now + plan.go; rf.timers = [];
  plan.fakes.forEach(({ kind, at }) => {
    rf.timers.push(setTimeout(() => { if (S.game?.rf !== rf || rf.phase !== W) return; rf.color = kind; rfPaint(); rf.timers.push(setTimeout(() => { if (rf.phase === W && rf.color === kind) { rf.color = "wait"; rfPaint(); } }, 800)); }, at));
  });
  rf.timers.push(setTimeout(() => { if (S.game?.rf !== rf || rf.phase !== W) return; rf.color = "go"; rf.goShown = performance.now(); rfPaint(); play("pop"); }, rf.goAt - now));
  rf.timers.push(setTimeout(() => { if (S.game?.rf === rf && rf.phase === W && rf.color === "go") { if (W === "mwait") rfHeatEnd(); else rfTap(true); } }, rf.goAt - now + RF_LATE));

}
const rfLabel = (c) => (c === "go" ? "今！" : c === "mada" ? "まだ！" : c === "wait" ? "待って…" : "まだやで");
function rfPaint() {

  const rf = S.game.rf;
  box.className = "rf-box " + rf.color + (rf.style === "multi" ? " multi" : "");
  box.querySelector(".rf-label").textContent = rfLabel(rf.color);
}
function rfTap(late = false) {
  const g = S.game, rf = g.rf;
  if (rf.phase !== "wait") return;
  rf.timers.forEach(clearTimeout);
  const fly = rf.color !== "go";
  const ms = fly ? null : late ? RF_LATE : Math.round(performance.now() - rf.goShown);
  rf.res[rf.who] = { fly, ms };
  if (!fly && (rf.best[rf.who] == null || ms < rf.best[rf.who])) rf.best[rf.who] = ms;
  g.turn++;
  play(fly ? "boom" : "coin");
  if (rf.k + 1 >= S.members.length) { rfFinal(); return; }
  rf.phase = "done";

// みんな同時：自分のエリアを押した瞬間。緑になる前ならその人だけフライング
function rfZoneTap(i, ts) {
  const g = S.game, rf = g.rf;
  if (rf.phase !== "mwait" || rf.res[i] || !rf.heats[rf.h].includes(i)) return;
  const fly = rf.color !== "go";
  const ms = fly ? null : Math.max(0, Math.round((ts ?? performance.now()) - rf.goShown));
  rf.res[i] = { fly, ms: fly ? null : Math.min(ms, RF_LATE) };
  play(fly ? "boom" : "coin");
  const z = document.querySelector(`[data-zone="${i}"]`);
  if (z) { z.classList.add(fly ? "fly" : "hit"); z.querySelector(".rf-zv").textContent = fly ? "フライング" : `${rf.res[i].ms}ms`; }
  if (rf.heats[rf.h].every((j) => rf.res[j])) rfHeatEnd();

    const r = rf.res[j];
    if (!r.fly && r.ms < RF_LATE && (rf.best[j] == null || r.ms < rf.best[j])) rf.best[j] = r.ms;
  }
  g.turn++;

  rfFinal();
}
// 全員終わった：罰の人を決めて、ドラムロールでためてから順位発表
function rfFinal() {
  const g = S.game, rf = g.rf, idx = S.members.map((_, i) => i), flyers = idx.filter((i) => rf.res[i].fly || rf.res[i].ms >= RF_LATE); // フライングと遅すぎはアウト
  if (flyers.length) rf.losers = flyers;
  else { const worst = Math.max(...idx.map((i) => rf.res[i].ms)); rf.losers = idx.filter((i) => rf.res[i].ms === worst); }

// ---------- 声デカ選手権 ----------
// 1人ずつ5秒間、スマホに向かって叫ぶ。声が一番小さかった人が罰（地獄は罰2倍）。マイクが使えへん時はみんなで判定
const VC_SEC = 5;
const vcMic = { stream: null, an: null, src: null, ctx: null, buf: null, perm: "unknown" };
// iPhone は「タップの中で起こした AudioContext」やないと音が来えへん（suspended のまま0になる）ので、
// 効果音と同じ AudioContext をタップの瞬間に起こして使う。マイクを開いた後に止まることがあるのでもう一回起こす
async function vcAsk() {
  if (vcMic.an) return true;
  const ctx = SFX.ctx(); // ← await より前（タップの中）で起こす
  try {
    if (!navigator.mediaDevices?.getUserMedia || !ctx) throw new Error("no mic");
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (ctx.state !== "running") { try { await ctx.resume(); } catch {} }
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    const src = ctx.createMediaStreamSource(stream);
    src.connect(an);
    // Safari は出口（スピーカー）につながってへんと音を流さへんことがあるので、音量0でつないでおく
    const mute = ctx.createGain(); mute.gain.value = 0; an.connect(mute).connect(ctx.destination);
    Object.assign(vcMic, { stream, ctx, an, src, buf: new Uint8Array(an.fftSize), perm: "granted" });
    return true;
  } catch { vcMic.perm = "denied"; return false; }
}
function vcRelease() {
  try { vcMic.stream?.getTracks().forEach((t) => t.stop()); vcMic.src?.disconnect(); } catch {}
  Object.assign(vcMic, { stream: null, an: null, src: null, buf: null }); // AudioContext は効果音と共用なので閉じへん
}
// 今の声の大きさ 0〜100（dBFS -60〜0 をならす）
function vcLevel() {
  if (!vcMic.an) return 0;
  vcMic.an.getByteTimeDomainData(vcMic.buf); // Float版より古いiPhoneでも動く
  let sum = 0; for (const b of vcMic.buf) { const v = (b - 128) / 128; sum += v * v; }
  const db = 20 * Math.log10(Math.sqrt(sum / vcMic.buf.length) || 1e-6);
  return Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
}
function vcRound() {
  const vc = S.game.vc;
  vc.round++; vc.k = 0; vc.res = Array(S.members.length).fill(null); vc.losers = [];
  vcBegin();
}
const vcWho = (vc) => (vc.k + vc.round - 1) % S.members.length;
function vcBegin() { const vc = S.game.vc; vc.who = vcWho(vc); S.game.doer = vc.who; vc.phase = "hand"; }
// 「叫ぶ！」を押したら3・2・1で息を吸う時間をとってからスタート
function vcCount() {
  if (vcMic.ctx?.state !== "running") vcMic.ctx?.resume(); // タップの中で起こしなおす
  count3(S.game.vc, vcGo, 800);
}
function vcGo() {
  const vc = S.game.vc;
  vc.phase = "play"; vc.peak = 0; vc.cur = 0; vc.endAt = Date.now() + VC_SEC * 1000; vc.sec = VC_SEC;
  if (vcMic.ctx?.state === "suspended") vcMic.ctx.resume();
  play("coin"); render(true);
  secClock(vc, () => S.game?.vc === vc, vcDone);
  const loop = () => {
    if (S.game?.vc !== vc || vc.phase !== "play") return;
    const lv = vcLevel();
    vc.cur = vc.cur * 0.6 + lv * 0.4; // ちょっとならす
    if (vc.cur > vc.peak) vc.peak = vc.cur;
    const m = document.getElementById("vcMeter"); if (m) m.style.setProperty("--m", (vc.cur / 100).toFixed(3));
    const p = document.getElementById("vcPeak"); if (p) p.textContent = Math.round(vc.peak);
    vc.raf = requestAnimationFrame(loop);
  };

}

  const g = S.game, vc = g.vc;
  cancelAnimationFrame(vc.raf); stopTimer();
  const score = Math.round(vc.peak);
  vc.res[vc.who] = score;
  if (score > (vc.best[vc.who] ?? -1)) vc.best[vc.who] = score;
  g.turn++;
  if (vc.k + 1 >= S.members.length) { vc.phase = "tally"; hold("結果は…", 1800, vcRank); return; }
  play("fanfare");
  vc.phase = "done";
  render(true);
}

  const g = S.game, vc = g.vc, idx = S.members.map((_, i) => i);
  g.doer = -1; vc.phase = "rank";

// ---------- ピッタリ予想 ----------
// 数字のお題に1人ずつこっそり予想を入れる。答え合わせで一番遠い人が罰。誰かがピッタリなら罰2倍
function ptRound() {

  const q = deckPop("pit_" + S.level, DATA.pittari[S.level]);
  pt.q = q.t; pt.u = q.u;

  pt.guess = Array(n).fill(null);
  pt.k = 0; pt.input = ""; pt.answer = null; pt.losers = []; pt.exact = [];

}

// ---------- 神経衰弱 ----------
// 裏向きのカードに「お題に関係するマーク」だけ（スマホのマークならスマホ系のお題）。同じお題の2枚を揃えたら全文が出て、答えたら+1点でもう1回。
// 答えられへんかったら罰ガチャ。ドクロはめくった瞬間に罰ガチャ（天使なら続けてめくれる）。最後に点数が一番低い人が罰
const MM_PAIRS = 7, MM_SKULLS = 2;
// マークにできるお題：「{P}、」で始まる1人用のお題で、マーク表のどれかの言葉が入ってるもの
const MARK_RE = DATA.marks.map(([re, m]) => [new RegExp(re), m]);
function markOf(t) {
  const s = t.replace(/\{[PXY]\}/g, "誰か");
  const hit = MARK_RE.find(([re]) => re.test(s));
  return hit ? hit[1] : null;
}
const mmOk = (t) => /^\{P\}、/.test(t) && usable(t) && !!markOf(t);
function mmDeal() {
  const g = S.game, n = S.members.length;
  g.doer = 0; g.cur = 0;
  // 夜・深夜はお題も夜寄りに混ぜる（下ネタNGの人がおる時は、誰が揃えるか分からんので混ぜへん）
  const pools = [DATA.odai[S.level]];
  if (S.night && !S.members.some((m) => m.ng)) pools.push(DATA.odai.yoru);
  if (S.night === "shinya" && !S.members.some((m) => m.ng)) pools.push(DATA.odai.shinya, DATA.odai.shinya);
  const used = new Set(), pairs = [];
  for (let k = 0; k < 400 && pairs.length < MM_PAIRS; k++) {
    const pool = pick(pools), t = pick(pool);
    if (!mmOk(t)) continue;
    const ch = markOf(t);
    if (used.has(ch)) continue;
    used.add(ch);
    pairs.push({ tpl: t, ch, yoru: pool === DATA.odai.yoru || pool === DATA.odai.shinya, deep: pool === DATA.odai.shinya });
  }
  const cards = [];
  pairs.forEach((p, id) => { cards.push({ id, ...p }, { id, ...p }); });
  for (let k = 0; k < MM_SKULLS; k++) cards.push({ id: -1 - k, skull: true, ch: "" });

  g.turn = 0;
}
function mmNextPlayer() {
  const g = S.game;
  tickRule();
  g.cur = (g.cur + 1) % S.members.length;
  g.doer = g.cur;
  g.mm.turns++;
  g.mm.open = [];
  g.mm.phase = "pick";
}
function mmFlip(k) {

  if (mm.phase !== "pick" || c.up || c.gone) return;
  c.up = true;
  mm.open.push(k);
  if (c.skull) {
    // ドクロ：その場で罰ガチャ。開いてた1枚目は裏に戻す
    c.gone = true;
    mm.open.filter((x) => x !== k).forEach((x) => (mm.cards[x].up = false));
    mm.open = [];

    g.phase = "batsu"; mm.phase = "skull";

  }
  if (mm.open.length < 2) return;
  const [a, b] = mm.open.map((x) => mm.cards[x]);
  if (a.id === b.id) {
    // 揃った！お題の全文を出す（{P}はめくった人）
    mm.card = makeCard(a.deep ? "深夜お題" : a.yoru ? "夜お題" : `アホお題・${LV[S.level]}`, a.tpl, g.doer, { noNg: a.yoru }, { yoru: a.yoru });
    mm.phase = "match";
  } else mm.phase = "miss";
}
// 揃ったお題の結果。答えたら+1点でもう1回、答えられへんかったら罰ガチャで次の人へ
function mmAnswer(ok) {
  const g = S.game, mm = g.mm;
  mm.open.forEach((x) => { mm.cards[x].gone = true; mm.cards[x].owner = ok ? g.doer : -1; });
  mm.done++; g.turn = mm.done;
  if (ok) {
    mm.score[g.doer]++;
    // 「次の自分の番まで〜」のお題は上に出す
    if (PERSONAL.test(mm.card.tpl)) addRule({ html: mm.card.html, left: untilNext(g.doer), who: g.doer });
    mm.open = []; mm.card = null;
    mm.phase = mm.done >= mm.pairs ? "over" : "pick";
  } else {
    mm.open = [];
    g.add = new Map([[g.doer, 1]]); g.addReason = "mfail";
    g.gacha = [{ i: g.doer, n: 1, ...drawBatsu(g.doer) }];
    g.phase = "batsu"; mm.phase = "fail";
  }
}
// 罰ガチャを受け入れた後
function mmAfterBatsu() {
  const g = S.game, mm = g.mm;
  const lucky = g.gacha.every((x) => x.lucky);
  applyAdds();
  g.gacha = []; g.phase = "play";
  if (mm.phase === "low") { mm.phase = "end"; return; }
  if (mm.done >= mm.pairs) { mm.phase = "over"; return; }
  // ドクロで天使が出たら、そのまま続けてめくれる
  if (mm.phase === "skull" && lucky) { mm.phase = "pick"; mm.open = []; return; }
  mmNextPlayer();
}
// 全部揃ったら、点数が一番低い人が罰ガチャ
function mmLowest() {
  const sc = S.game.mm.score, m = Math.min(...sc);
  return sc.map((v, i) => (v === m ? i : -1)).filter((i) => i >= 0);
}

// ---------- 価値観ナンバー ----------
// 全員にこっそり1〜100の数字。お題（例：怖いもの）に合わせて自分の数字っぽいものを言って、全員で小さい順に並べる。
// 答え合わせで、隣どうしの順番が逆になってた2人が罰
function itRound() {
  const g = S.game, it = g.it, n = S.members.length;
  it.round++;
  // 夜・深夜はお題も夜寄りに（下ネタNGの人がおる時は混ぜへん）
  let key = S.level;
  if (S.night && !S.members.some((m) => m.ng) && Math.random() < (S.night === "shinya" ? 0.6 : 0.3)) key = S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru";
  it.night = key === "yoru" || key === "shinya" ? key : false;
  it.topic = itTopic(key);
  const nums = shuffle(Array.from({ length: 100 }, (_, i) => i + 1)).slice(0, n);
  it.nums = nums;
  it.order = [];
  it.dealing = true;
  it.viewer = (it.round - 1) % n; // 配る順番も毎回ずらす
  it.seen = 0;
  it.phase = "hand";
  it.bad = [];
}
// お題の山札（文字列やないので普通の draw は使わへん）
function itTopic(key) {
  const k = "ito_" + key;
  if (!decks[k] || !decks[k].length) decks[k] = shuffle(DATA.ito[key]);
  return decks[k].pop();
}
// 並べた順で、隣どうしの数字が逆になってる2人
function itCheck() {
  const it = S.game.it, bad = new Set();
  for (let k = 1; k < it.order.length; k++) {
    const a = it.order[k - 1], b = it.order[k];
    if (it.nums[a] > it.nums[b]) { bad.add(a); bad.add(b); }
  }
  it.bad = [...bad];
  it.phase = "reveal";
  S.game.turn++;
}

// ---------- 時計（ジェスチャー・褒め殺し共通） ----------
// endAt まで数えて、0になったら onEnd を呼ぶ。画面は #modeTimer の数字だけ書き換える
let modeTimer = null;
function startTimer(sec, onEnd, fmt, quiet = false) {
  stopTimer();
  const endAt = Date.now() + sec * 1000;
  modeTimer = setInterval(() => {
    const left = endAt - Date.now();
    const el = document.getElementById("modeTimer");
    if (!quiet) hurryFx(left);
    if (left <= 0) { stopTimer(); if (!quiet) play("timeup"); vib([80, 40, 160]); onEnd(); return; }
    if (el) { el.textContent = fmt ? fmt(left) : Math.ceil(left / 1000); el.classList.toggle("hurry", left < (fmt ? 30000 : 10000)); }
  }, 200);
  return endAt;
}
function stopTimer() { if (modeTimer) { clearInterval(modeTimer); modeTimer = null; } hurryOff(); }

// ---------- 最初の人ルーレット（ジェスチャー・褒め殺し） ----------
// 名前のタイルを光らせながら回して、だんだん遅くなって1人に止まる
function spinRoulette(onDone) {
  S.spinning = true;
  const n = S.members.length, goal = rnd(n);
  const base = 16 + rnd(n);
  const steps = base + ((goal - (base % n) + n) % n); // steps % n === goal で止まる
  let k = 0, idx = 0;
  const tick = () => {
    idx = k % n;
    document.querySelectorAll(".roul-chip").forEach((el, j) => el.classList.toggle("on", j === idx));
    play("tick");
    vib(5);
    if (k >= steps) { setTimeout(() => { S.spinning = false; onDone(idx); }, 450); return; }
    k++;
    const p = k / steps;
    setTimeout(tick, 55 + p * p * 330);
  };
  tick();
}

// ---------- 早押しジェスチャー ----------
// 番の人だけお題を見て、声を出さずに体で伝える。当てた人と演じた人に1点。
// 1人演じ終わるごとに罰：ノルマ（持ち時間15秒ごとに1問）に届かんかったら演じた人、届いたら当てた数が一番少ない人
const gsQuota = (sec) => Math.max(1, Math.round(sec / 15));
function gsWord() {
  let key = S.level;
  if (S.night && !S.members.some((m) => m.ng) && Math.random() < (S.night === "shinya" ? 0.4 : 0.25)) key = S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru";
  return { text: draw("gs_" + key, DATA.gesture[key]), night: key === "yoru" || key === "shinya" ? key : false };
}
function gsStart() {
  const g = S.game, gs = g.gs;
  gs.phase = "act"; gs.got = 0; gs.word = gsWord(); gs.turnHits = Array(S.members.length).fill(0);
  gs.endAt = startTimer(gs.sec, () => { gs.phase = "timeup"; render(true); });
}
function gsHit(i) {
  const g = S.game, gs = g.gs;
  gs.score[i]++; gs.score[gs.actor]++; gs.got++; g.turn++;
  gs.turnHits[i]++;
  gs.last = i;
  gs.word = gsWord();
}
function gsNextActor() {
  const g = S.game, gs = g.gs;
  gs.acted++;
  if (gs.acted >= S.members.length) { gs.phase = "over"; return; }
  gs.actor = (gs.actor + 1) % S.members.length;
  g.doer = g.cur = gs.actor;
  gs.phase = "hand";
}
// このターンの罰の人：ノルマ未達なら演じた人、達成なら当てた数が一番少ない人（当てる側）
function gsTurnLosers() {
  const gs = S.game.gs, n = S.members.length;
  if (gs.got < gsQuota(gs.sec)) return { why: "quota", who: [gs.actor] };
  const guessers = S.members.map((_, i) => i).filter((i) => i !== gs.actor);
  const m = Math.min(...guessers.map((i) => gs.turnHits[i]));
  return { why: "few", who: guessers.filter((i) => gs.turnHits[i] === m), min: m, n };
}
function gsLowest() {
  const sc = S.game.gs.score, m = Math.min(...sc);
  return sc.map((v, i) => (v === m ? i : -1)).filter((i) => i >= 0);
}

// ---------- 褒め殺し ----------
// 番の人がランダムな1人を褒め続ける。褒められた側が笑ったり照れたりしたら褒められた側の負け、時間いっぱい耐えたら褒めた側の負け
function hmRound() {
  const g = S.game, hm = g.hm;
  hm.target = pick(others(hm.praiser));
  const night = S.night && okForYoru(hm.target) && okForYoru(hm.praiser) && Math.random() < (S.night === "shinya" ? 0.5 : 0.3);
  const key = night ? (S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru") : "normal";
  hm.theme = draw("hm_" + key, DATA.homeru[key]);
  hm.night = key === "normal" ? false : key;
  hm.loser = null;
  hm.phase = "ready";
  g.doer = g.cur = hm.praiser;
}
function hmLose(i) {
  const g = S.game, hm = g.hm;
  stopTimer();
  hm.loser = i;
  g.turn++;
  g.add = new Map([[i, 1]]); g.addReason = i === hm.target ? "hmlaugh" : "hmfail";
  g.gacha = [{ i, n: 1, ...drawBatsu(i) }];
  g.phase = "batsu"; hm.phase = "batsu";
}

  return clash ? Array.from(nm.trim()).slice(0, 2).join("") : f;

function vChips(head, act, list, showCount = true) {
  const g = S.game;
  return `
  <div class="pen">
    <h3>${head}</h3>
    <div class="chips">
      ${list.map((i) => {
        const on = g.add.has(i) && act === "pen";
        return `<button class="chip" style="--mc:${colorOf(i)}" data-act="${act}" data-i="${i}" aria-pressed="${on}"><span class="dot"></span>${esc(S.members[i].name)}${showCount ? `<span class="n">${g.pen[i]}</span>` : ""}${g.rev[i] ? `<span class="rv" title="リベンジ権あり">↺</span>` : ""}</button>`;
      }).join("")}
    </div>
  </div>`;
}

// 罰をつける人を選ぶタイル。押すと赤くなって「罰」のハンコ
// 罰の人を選ぶ時の聞き方（お題に合わせる）
function penQuestion() {
  const g = S.game, c = g.card || {};
  if (c.bombCond) return `${c.bombCond}人は？`;
  if (g.penOpen === c && c.solo && !needsPick(c.tpl)) return "罰をつける人は？";
  return penHead(c.tpl);
}
function vPenGrid() {
  const g = S.game;
  return `
  <div class="pen-grid-wrap">
    <p class="pen-q">${esc(penQuestion())}<span>タップで罰</span></p>
    <div class="pen-grid ${S.members.length > 6 ? "many" : ""}">
      ${S.members.map((m, i) => {
        const on = g.add.has(i);
        return `<button class="pen-tile ${i === g.doer ? "is-doer" : ""}" style="--mc:${colorOf(i)}" data-act="pen" data-i="${i}" aria-pressed="${on}">
          <span class="bar"></span>
          <span class="nm">${esc(m.name)}</span>
          <span class="meta">${i === g.doer ? `<span class="doer-lbl">いまの番</span>` : ""}${g.rev[i] ? " ↺" : ""}<em>罰${g.pen[i]}</em></span>
          ${on ? `<span class="stamp">罰</span>` : ""}
        </button>`;
      }).join("")}
    </div>
  </div>`;
}
function nextText(base) {
  const g = S.game;
  if (!g.add.size && mustPick(g.card?.tpl)) return `${penHead(g.card.tpl).replace(/は？$/, "")}を選んで`;
  if (!g.add.size) return `アウトなし → ${base}`;
  const names = [...g.add.keys()].map((i) => esc(S.members[i].name));
  return `${names.length > 2 ? names.slice(0, 2).join("・") + ` ほか${names.length - 2}人` : names.join("・")}に罰 → ${base}`;
}

function vControls() {
  const g = S.game, all = S.members.map((_, i) => i);
  const nextLabel = g.mode === "sugoroku" ? (g.done ? "結果発表へ" : "次の人へ") : "次へ";
  switch (g.phase) {
    case "offer":
      return `<div class="choices">
        <button class="choice hot" data-act="double" data-v="1">倍プッシュ<small><span class="nw">成功→誰かに罰</span><span class="nw">失敗→罰2倍</span></small></button>
        <button class="choice" data-act="double" data-v="0">普通に見る<small>いつも通り</small></button>
      </div>`;
    case "revenge":
      return `${vChips(`${esc(S.members[g.doer].name)}のリベンジ。誰に押し付ける？`, "revTo", others(g.doer).filter((i) => !g.card.yoru || okForYoru(i)), false)}
        <button class="ghost" data-act="revCancel">やっぱやめる</button>`;
    case "push":
      return vChips("成功！罰を押し付ける相手をタップ", "pushTo", others(g.doer), false);
    case "batsu":
      return `<button class="big" data-act="accept">${g.gacha.every((x) => x.lucky) ? "ラッキー！" : "受け入れた"} → ${nextLabel}</button>`;
    case "bombSet":
      return `<button class="big" data-act="bombPeek">${esc(S.members[g.doer].name)}が見る</button>`;
    case "bombPeek":
      return `<button class="big" data-act="bombHide">見た！隠して続ける</button>`;
    default: {
      if (g.double) {
        return `<div class="choices">
          <button class="choice hot" data-act="dWin">成功！<small>誰かに罰を押し付ける</small></button>
          <button class="choice" data-act="dLose">失敗…<small>罰2倍</small></button>
        </div>`;
      }
      // 続くルールを出した指令は、今は誰も罰にならへん。上に出しといて、破った時に「違反者に罰」
      if (g.card.ruleCard) return `<button class="big" data-act="next">ルール開始 → ${nextLabel}</button>`;
      const subs = [
        g.card.solo && !g.card.passed && isSituational(g.card.tpl) ? `<button data-act="notme">当てはまらん → 誰かに回す</button>` : "",
        g.card.yoru ? `<button data-act="pass">無理！罰なしでパス</button>` : "",
        g.card.solo && g.rev[g.doer] ? `<button class="revenge" data-act="revenge">↺ リベンジ権を使う</button>` : "",
      ].join("");
      // 1人用のお題は「やった／できんかった」の2択（札のスワイプでもOK）。他の人に罰をつけたい時だけ一覧を開く
      if (g.card.solo && !needsPick(g.card.tpl) && g.penOpen !== g.card) {
        return `
        ${subs ? `<div class="sub-acts">${subs}</div>` : ""}
        <div class="verdict">
          <button class="vd ng" data-act="fail"><b>アウト</b><small>${esc(S.members[g.doer].name)}に罰</small></button>
          <button class="vd ok" data-act="clear"><b>セーフ！</b><small>→ ${nextLabel}</small></button>
        </div>
        <p class="swipe-hint">${earlyTurns() ? `<span>← アウト</span>` : ""}<button class="link" data-act="penOpen">他の人に罰をつける</button>${earlyTurns() ? `<span>セーフ →</span>` : ""}</p>`;
      }
      return `
        ${subs ? `<div class="sub-acts">${subs}</div>` : ""}
        ${vPenGrid()}
        <button class="big ${g.add.size ? "has-pen" : ""}" data-act="next" ${!g.add.size && mustPick(g.card.tpl) ? "disabled" : ""}>${nextText(nextLabel)}</button>`;
    }
  }
}
// 操作のヒントは最初の3枚だけ（慣れたら消えてスッキリ）
const earlyTurns = () => (S.game?.cards ?? 0) < 3;

function cardClass(c) {
  if (c.bomb) return "bombc";
  if (c.kind?.includes("深夜")) return "deep";
  if (c.yoru) return "yoru";
  if (c.alert) return "event";
  return "";
}
function vCard() {
  const g = S.game, anim = S.anim ? (g.card?.alert ? "shake" : "in") : "";
  if (g.phase === "batsu") {
    const allLucky = g.gacha.every((x) => x.lucky);
    const mixed = !allLucky && g.gacha.some((x) => x.lucky);
    const drum = S.anim; // 画面が切り替わった時だけマシンを回す（メニュー開閉などの再描画では回さへん）
    if (drum) S.gIntro = true;
    return `<div class="odai ${allLucky ? "lucky" : "batsu"} ${drum ? "drum" : anim}" id="card">
      ${drum ? gachaMachine(allLucky) : ""}
      <div class="head"><span>罰ガチャ</span></div>
      ${S.dual ? `<div class="mirror-list">${g.gacha.map((x) => `<p><b>${esc(S.members[x.i].name)}${x.lucky ? "はセーフ" : "の罰"}</b>${x.lucky ? x.html : doubledPlain(x.html, x.n)}</p>`).join("")}</div><hr class="dual-line">` : ""}
      ${(() => { const dbl = !allLucky && g.gacha.some((x) => x.n > 1 && !x.lucky); return `<div class="skull-wrap ${dbl ? "x2" : ""}">${allLucky ? `${ANGEL}<b>ラッキー！セーフ</b>` : dbl ? `<div class="x2-skulls">${SKULL}${SKULL}${X2_BURST}</div><b>罰ゲーム2倍！</b>` : `${SKULL}<b>罰ゲーム確定</b>`}</div>`; })()}
      <div class="gacha">${g.gacha.map((x, k) => `
        <div class="gacha-item ${x.night ? "night " + x.night : ""}" style="--d:calc(var(--gt, 0s) + ${(k * 0.35).toFixed(2)}s);--mc:${colorOf(x.i)}">
          <div class="capsule"><i class="top"></i><i class="bot"></i><i class="res ${x.lucky ? "ok" : ""}">${x.lucky ? "天" : "罰"}</i></div>
          <div class="gacha-txt"><b>${mixed ? `<span class="mark ${x.lucky ? "ok" : "ng"}">${x.lucky ? "天使" : "ドクロ"}</span>` : ""}${esc(S.members[x.i].name)}${x.lucky ? "はセーフ" : x.night === "shinya" ? "の深夜の罰" : x.night ? "の夜の罰" : "の罰"} ${x.n > 1 && !x.lucky ? `<span class="x2-badge">×${x.n}</span>` : ""}</b><p>${x.lucky ? x.html : doubleHtml(x.html, x.n)}</p>${!x.lucky && x.n > 1 ? x2Meter(x.html, x.n) : ""}</div>
        </div>`).join("")}</div>
    </div>`;
  }
  const c = g.card;
  const badge = g.double && g.phase === "play" ? `<span class="badge">倍プッシュ中</span>` : "";
  const art = g.phase === "bombSet" || g.phase === "bombPeek" ? BOMB_ART
    : g.phase === "offer" ? `<div class="coin-wrap"><div class="coin">倍</div></div>` : "";
  // 向かい合わせ：同じお題を上下逆さにもう1枚（仕掛け人だけが見る爆弾の中身は出さない）
  const dual = S.dual && g.phase !== "bombPeek" && g.phase !== "bombSet";
  return `<div class="odai ${cardClass(c)} ${anim}" id="card">
    <div class="head">${vWho()}<span class="meta">${plainKind(c) ? "" : `<span class="kind">${esc(shortKind(c.kind))}</span>`}${cardTag(c) && g.phase === "play" ? `<i class="tag">${cardTag(c)}</i>` : ""}${badge}</span></div>
    ${c.solo && !needsPick(c.tpl) && g.phase === "play" && !g.double ? `<i class="sw-stamp ok">セーフ</i><i class="sw-stamp ng">アウト</i>` : ""}
    ${art}
    ${dual ? `<p class="txt mirror" aria-hidden="true" style="font-size:${fitSize(c.html, g.mode === "sugoroku", 0.74)}"><span>${c.html}</span></p><hr class="dual-line">` : ""}
    <p class="txt" style="font-size:${fitSize(c.html, g.mode === "sugoroku", dual ? 0.74 : 1)}"><span>${c.html}</span></p>
  </div>`;
}
// お題の長さで文字サイズを決める（短いほど大きく）
function fitSize(html, small, scale = 1) {
  const n = html.replace(/<[^>]+>/g, "").length;
  const px = n <= 12 ? 46 : n <= 20 ? 40 : n <= 30 ? 34 : n <= 42 ? 29 : n <= 56 ? 25 : 22;
  const v = (small ? px * 0.88 : px) * scale;
  return `clamp(${Math.round(v * 0.62)}px, ${(v / 3.9).toFixed(1)}vw, ${Math.round(v)}px)`;
}
function vRule() {
  const g = S.game;
  const bomb = g.bomb && !g.phase.startsWith("bomb")
    ? `<div class="rule bomb"><span class="fuse" aria-hidden="true"></span><span><b>時限爆弾 作動中</b><br><span class="nowrap">仕掛け人：${esc(S.members[g.bomb.owner].name)}</span></span><button class="rule-out look" data-act="bombLook">中身を見る</button></div>` : "";
  // ルールが出た札そのものを見てる間は、上の枠は出さへん（同じ文が2回並ぶので）
  // 新しい順に2つまで（画面を圧迫せんように）
  const list = g.rules.map((r, k) => ({ r, k })).filter(({ r }) => !(r.card && r.card === g.card && g.phase === "play")).reverse();
  // 小さい画面で時限爆弾も出てる時は1つまで（札が潰れんように）。残りは「ほか○件」
  const room = window.innerHeight < 740 && bomb ? 1 : 2;
  const shown = list.slice(0, room);
  return bomb + shown.map(({ r, k }, j) => `<div class="rule"><span class="rule-txt"><b>${r.who != null ? `${esc(S.members[r.who].name)}の次の番まで` : `発動中 残り${r.left}ターン`}${j === 0 && list.length > room ? `<em>ほか${list.length - room}件</em>` : ""}</b><span>${r.html}</span></span><button class="rule-out" data-act="ruleOpen" data-k="${k}">違反者に罰</button></div>`).join("");
}

function vWho() {
  const g = S.game;
  const label = g.card?.bomb ? "が仕掛け人" : g.card?.passed ? "に回ってきた" : g.doer !== g.cur ? "に押し付けられた" : "の番";

// 上のバー：左に罰スコアの顔アイコン列、右に「⋯」メニューだけ
function vBar() {
  const g = S.game, n = S.members.length;
  // 右のボタン（結果発表・上下反転・⋯）の分をよけて、入る人数だけ顔を出す。入りきらん分は「…」にまとめる
  const frameW = Math.min(window.innerWidth, 560) - 32;
  const fit = Math.max(2, Math.floor((frameW - 2 * 46 - 46 - 18) / 44)); // 右：結果発表・上下反転・⋯（向かい合わせは設定の中）
  let shown = S.members.map((_, i) => i);
  if (n > fit) {
    shown = shown.slice(0, fit - 1);
    if (g.doer >= 0 && !shown.includes(g.doer)) shown[shown.length - 1] = g.doer; // 今の番の人は必ず見せる
  }
  // 罰が一番多い人に王冠（同点なら全員）。入りきらん時も王冠の人は顔を出す
  const maxPen = Math.max(...g.pen);
  const kings = maxPen > 0 ? g.pen.map((v, i) => (v === maxPen ? i : -1)).filter((i) => i >= 0) : [];
  if (n > fit) kings.forEach((kI) => { if (!shown.includes(kI) && shown.length >= 2) { const slot = shown.length - (shown[shown.length - 1] === g.doer ? 2 : 1); if (slot >= 0 && shown[slot] !== g.doer) shown[slot] = kI; } });
  // 罰が増えた人はポンと跳ねる
  const prev = S.prevPen && S.prevPen.length === n ? S.prevPen : g.pen;
  const bump = (i) => g.pen[i] > prev[i];
  S.prevPen = [...g.pen];
  const hidden = n - shown.length;
  const rv = (i) => g.rev[i] && (g.mode === "odai" || g.mode === "sugoroku");
  return `<div class="bar">
    <div class="score" aria-label="罰スコア">${shown.map((i) => `
      <span class="av ${i === g.doer ? "is-turn" : ""} ${bump(i) ? "bump" : ""}" style="--mc:${colorOf(i)}" title="${esc(S.members[i].name)} 罰${g.pen[i]}">
        ${kings.includes(i) ? CROWN : ""}${ini(i)}${g.pen[i] ? `<b class="cnt">${g.pen[i]}</b>` : ""}${rv(i) ? `<i class="rv">↺</i>` : ""}
      </span>`).join("")}${hidden ? `<button class="av more" data-act="scores" aria-label="全員の罰を見る">…<b class="cnt">${hidden}</b></button>` : ""}</div>
    <button class="bar-res" data-act="endArm" aria-label="結果発表">${ICON.flag}<span>結果</span></button>
    <button class="icon-btn bar-btn" data-act="flip" aria-pressed="${S.flip}" aria-label="上下反転">${ICON.flip}</button>
    <button class="icon-btn menu-btn" data-act="menu" aria-label="メニュー">${ICON.more}</button>
  </div>`;
}

// ---------- 分かりやすさ ----------
// 押し付け・当てはまらんの時は（）の中だけ出す（「〜の番」と同じ情報が並ばんように）
function shortKind(k) {
  const m = k.match(/（(.*)）$/);
  return m ? m[1] : k;
}
// 普通のお題は種類名を出さへん（地獄度は画面の色で分かる）。夜・緊急・押し付けなどの時だけ出す
function plainKind(c) {
  return !!c.kind && !c.kind.includes("（") && /^(\d+マス目・)?(アホお題|全員参加)/.test(c.kind);
}
// 札の種類タグ（誰が動くお題か）
function cardTag(c) {
  if (!c || c.bomb || !c.tpl) return "";
  if (c.ruleCard) return "ルール";
  if (c.alert) return "緊急";
  if (mustPick(c.tpl)) return "勝負";
  if (!c.solo) return "全員";
  return needsPick(c.tpl) ? "みんなで判定" : "ひとり";
}
// 初めて出てきた仕組みだけ、札の下にひとこと説明（1回見たら二度と出えへん）
const COACH = {
  double: "倍プッシュ：できたら誰かに罰、できんかったら罰2回",
  bomb: "時限爆弾：仕掛け人だけがNG行動を知ってる。やった人は後で全員罰",
  rule: "このルールは上に出しとく。破った人が出たら「違反者に罰」",
  event: "緊急指令：アウトの人を下で選ぶ",
  contest: "負けた人を下で選んでから「次へ」",
  swipe: "できたらセーフ、できんかったらアウト。札を左右にスワイプでもOK",
  notme: "当てはまらん時は、罰なしで誰かに回せる",
  pass: "夜のお題は「無理！」で罰なしパスできる",
  revenge: "リベンジ権 ↺：このお題を1回だけ誰かに押し付けられる",
};
function coachKey() {
  const g = S.game, c = g.card || {};
  const keys = [];
  if (g.phase === "offer") keys.push("double");
  if (g.phase === "bombSet") keys.push("bomb");
  if (g.phase === "play" && !g.double) {
    if (c.ruleCard) keys.push("rule");
    else if (c.alert && !c.bomb) keys.push("event");
    if (mustPick(c.tpl)) keys.push("contest");
    if (c.solo && !needsPick(c.tpl) && g.penOpen !== c) keys.push("swipe");
    if (c.solo && !c.passed && isSituational(c.tpl)) keys.push("notme");
    if (c.yoru) keys.push("pass");
    if (c.solo && g.rev[g.doer]) keys.push("revenge");
  }
  return keys.find((k) => !S.seen[k]) || null;
}
function vCoach() {
  const k = coachKey();
  if (!k) return "";
  return `<div class="coach" role="note"><span>${esc(COACH[k])}</span><button data-act="coachOk" data-k="${k}">わかった</button></div>`;
}

// 票のバー。画面が切り替わった時は 0 から1票ずつ数え上げる（postFx が動かす）
function vbars(rows, max, isTop, stamp) {
  const count = S.anim && rows.some((r) => r.v > 0);
  return `<ul class="vbars ${count ? "count" : ""}" data-max="${max}">${rows.map((r, k) => `<li class="${isTop(r.i) ? "top" : ""} ${r.i < 0 ? "none" : ""}" data-v="${r.v}" style="--mc:${r.i < 0 ? "#8d857a" : colorOf(r.i)};--d:${(0.15 + (rows.length - k) * 0.12).toFixed(2)}s"><span class="nm">${r.i < 0 ? "ウルフはおらん" : mName(r.i)}</span><span class="bar"><i style="--w:${count ? 0 : max ? (r.v / max) * 100 : 0}%"></i></span><b>${count ? 0 : r.v}</b>${stamp && isTop(r.i) ? `<span class="stamp">罰</span>` : ""}</li>`).join("")}</ul>`;
}
// 数え上げにかかる時間（秒）
const voteStep = (total) => Math.max(0.12, Math.min(0.42, 3.2 / Math.max(1, total)));
const voteFxTime = (counts) => { const t = (counts || []).reduce((a, b) => a + b, 0); return t ? 0.3 + t * voteStep(t) : 0; };

      return `<div class="odai mode-card" id="card">
        <div class="head"><span class="who"><b>第${wf.round}回戦</b></span><span class="meta"><i class="tag">結果</i></span></div>
        ${vbars(rows, max, (i) => isWolf(i), false)}
        ${words(!wf.caught)}
        <p class="vote-rule ${wf.caught || (wf.allCit && !lose.length) ? "good" : "bad"}">${res}</p>
      </div>`;
    }
    case "guess": return `<div class="odai mode-card center" id="card">
      <p class="prog">逆転チャンス</p>

          <p class="hand-note">${ok ? "全員が「ウルフはおらん」に入れた。全員セーフ" : "誰かを疑った人の負け"}</p>

          <p class="vote-rule ${ok ? "good" : "bad"}">${ok ? "今回は罰なし" : `${lose.map(mName).join("・")}に罰`}</p>
        </div>`;
      }

      const how = wolfLose ? "ウルフをつかまえた" : wf.caught ? "ウルフが市民のお題を当てた" : wf.top.length > 1 ? "同票でウルフを決められへんかった" : wf.top[0] === WF_NONE ? "「ウルフはおらん」にだまされた" : "ウルフを見抜けへんかった";
      return `<div class="odai mode-card center wf-res ${wolfLose ? "cit" : "wolf"}" id="card">
        <p class="prog">第${wf.round}回戦</p>
        <div class="wf-wolf ${wolfLose ? "caught" : "win"}">${wolfRow(wolfLose ? "caught" : "win")}<em class="wf-stamp">${wolfLose ? "御用！" : wf.caught ? "逆転！" : "逃げ切り！"}</em><span>ウルフは${wolfNames()}</span></div>
        <p class="wf-win">${wolfLose ? "市民の勝ち！" : wf.caught ? "ウルフの逆転勝ち！" : "ウルフの勝ち！"}</p>
        <p class="hand-note">${how}</p>
        ${words(true)}
        <p class="vote-rule bad">${wolfLose ? `ウルフの${wolfNames()}に罰` : `市民の${lose.length}人全員に罰`}</p>
      </div>`;
    }
    case "group": { const r = wf.res; if (S.anim) S.gIntro = true; return `<div class="odai ${r.lucky ? "lucky" : "batsu"} mode-card center ${S.anim ? "drum" : ""}" id="card">
      ${S.anim ? gachaMachine(r.lucky) : ""}
      <p class="prog">市民全員の罰</p>
      <div class="skull-wrap sm">${r.lucky ? `${ANGEL}<b>天使！全員セーフ</b>` : `${SKULL}<b>罰ゲーム</b>`}</div>

      <p class="hand-note">${wfLosers().map(mName).join("・")}</p>
    </div>`; }
    case "batsu": return vCard();

  return "";
}
function vWfControls() {

// 1回戦が終わった時：もう1回戦か、ここで結果発表か（罰ガチャのあとは「受け入れて」）
function roundEnd(nextAct, batsu = false) {
  const g = S.game, lucky = batsu && g.gacha.every((x) => x.lucky);
  return `<div class="row2 round-end"><button class="ghost" data-act="end">${ICON.flag}<span>結果発表へ</span></button><button class="big" data-act="${nextAct}">${batsu ? `<small>${lucky ? "ラッキー！" : "受け入れて"}</small>` : ""}もう1回戦</button></div>`;
}

// ---------- ため：結果の前にドラムロール（タップで飛ばせる） ----------
// hold("結果は…", 1800, () => { 次の画面にする }) で、その間「結果は…」を出してドラムロール
function hold(text, ms, then) {
  clearTimeout(S.holdT);
  S.hold = { text, then, sc: S.screen, ms };
  if (S.sound) try { SFX.drumroll(Math.max(0.4, ms / 1000 - 0.35)); } catch {}
  S.holdT = setTimeout(holdDone, ms);
  render(true);
}
function holdDone() {
  const h = S.hold; if (!h) return;
  clearTimeout(S.holdT); S.hold = null;
  if (S.screen !== h.sc) return;
  h.then(); render(true);
}
const vHold = () => stageWrap(`<div class="odai mode-card center hold-card" id="card" data-act="holdSkip" style="--hold:${(S.hold.ms / 1000).toFixed(2)}s"><p class="hold-t">${esc(S.hold.text)}</p><p class="hold-dots" aria-hidden="true"><i></i><i></i><i></i></p><i class="hold-bar" aria-hidden="true"></i><p class="hand-note">タップで飛ばす</p></div>`, `<p class="hint">ドゥルルルル…</p>`);
// 1人ずつ出す演出：順位表の行に rv-item と --d（何秒後に出るか）。最後の人（罰の人）が出た瞬間に画面が赤く光る
const RV_STEP = 0.55, RV_START = 0.25;
const rvD = (k) => (RV_START + k * RV_STEP).toFixed(2);
// 札につける：data-rv=全部出るまでの秒数、data-rv-lose=罰の人が出る秒数
const rvCard = (count) => `data-act="rvSkip" data-rv="${(RV_START + count * RV_STEP + 0.15).toFixed(2)}"`;
const rvLate = (count) => `rv-late" style="--d:${(RV_START + count * RV_STEP).toFixed(2)}s`;

// ---------- ピタッとストップ（画面） ----------
const SP_RATE_TXT = { 0.5: "ゆっくり進む", 1.5: "ちょっと速く進む", 2: "倍の速さで進む" };
const spRateBox = (sp) => `<p class="sp-rate-box ${sp.rate > 1 ? "fast" : "slow"}"><small>今回の速さ</small><b>×${sp.rate}</b><span>${SP_RATE_TXT[sp.rate] || ""}（最後までこの速さ）</span></p>`;
const spGoal = (sp) => sp.dir === "down" ? "0.00" : `${sp.target}.00`;
const spDiffText = (r) => r.exact ? "ピッタリ！" : r.over ? `${Math.abs(r.diff).toFixed(2)}秒オーバー` : `あと${r.diff.toFixed(2)}秒`;
function spBoard(hi, rv = false) {
  const sp = S.game.sp;
  const rows = S.members.map((_, i) => i).filter((i) => sp.res[i]).sort((a, b) => {
    const A = sp.res[a], B = sp.res[b];
    if (A.over !== B.over) return A.over ? 1 : -1;
    return Math.abs(A.diff) - Math.abs(B.diff);
  });
  const lose = sp.phase === "rank" || sp.phase === "batsu" ? sp.losers : [];
  return `<ol class="sk-board sp-board">${rows.map((i, r) => { const x = sp.res[i]; return `<li class="${rv ? "rv-item" : ""} ${lose.includes(i) ? "lose" : ""} ${i === hi ? "me" : ""} ${x.exact ? "exact" : ""}" style="--mc:${colorOf(i)}${rv ? `;--d:${rvD(r)}s` : ""}">
      <span class="sk-rk">${x.over ? "×" : r + 1}</span><span class="sk-nm">${esc(S.members[i].name)}</span><span class="sp-v">${spFmt(x.v)}</span><b>${spDiffText(x)}</b>
    </li>`; }).join("")}${S.members.map((_, i) => i).filter((i) => !sp.res[i]).map((i) => `<li class="wait" style="--mc:${colorOf(i)}"><span class="sk-rk">-</span><span class="sk-nm">${esc(S.members[i].name)}</span><span class="sp-v"></span><b>?</b></li>`).join("")}</ol>`;
}
function vStopCard() {
  const g = S.game, sp = g.sp, n = S.members.length;
  switch (sp.phase) {

      ${sp.rate !== 1 ? spRateBox(sp) : ""}

      <p class="hand-note">${sp.dir === "down" ? "0を過ぎたらオーバー" : `${sp.target}秒を過ぎたらオーバー`}</p>

    case "done": { const r = sp.res[sp.who]; return `<div class="odai mode-card center board-card ${n >= 7 ? "dense" : ""} ${r.over ? "batsu" : ""}" id="card">

function vStopControls() {

    case "rank": return sp.losers.length ? `<button class="big has-pen" data-act="spGacha">${sp.losers.map(mName).join("・")}に罰ガチャ</button>` : roundEnd("spAgain");
    case "batsu": return roundEnd("spAccept", true);

}
function vStop() {
  const sp = S.game.sp;
  if (sp.phase === "intro") {
    const lv = S.level === "yurume" ? "ふつうの速さ" : S.level === "futsu" ? "番ごとに速さが×0.5・×1.5・×2のどれか" : "番ごとに速さが変わる（×0.5〜×2）＋数字が消える＋邪魔が入る";

// ---------- 新しい5つ（ロシアンタップ・爆弾パス・ハイ&ロー・反射神経バトル・声デカ選手権） ----------
// 罰ガチャまでの共通の流れ：losers に罰ガチャ → 受け入れたら「もう1回戦／結果発表へ」
function startGacha(losers, n, reason, st) {
  const g = S.game;
  g.add = new Map(losers.map((t) => [t, n])); g.addReason = reason;
  g.gacha = losers.map((t) => ({ i: t, n, ...drawBatsu(t, n) }));
  g.doer = -1; g.phase = "batsu"; st.phase = "batsu";
}
const stageWrap = (card, controls) => `<div id="stage" class="${S.flip ? "flipped" : ""}">${vBar()}<div class="deck">${card}</div>${controls}</div>`;
// 順位表（反射神経・声デカ）：rows = [{i, v(表示), bad, sub}]
function rankList(rows, hi = -1, rv = false) {
  return `<ol class="sk-board sp-board">${rows.map((r, k) => `<li class="${rv ? "rv-item" : ""} ${r.bad ? "lose" : ""} ${r.i === hi ? "me" : ""} ${r.wait ? "wait" : ""}" style="--mc:${colorOf(r.i)}${rv ? `;--d:${rvD(k)}s` : ""}"><span class="sk-rk">${r.wait ? "-" : r.rk ?? k + 1}</span><span class="sk-nm">${esc(S.members[r.i].name)}</span><span class="sp-v">${r.sub || ""}</span><b>${r.v}</b></li>`).join("")}</ol>`;
}

// ロシアンタップ
function vRtap() {
  const g = S.game, rt = g.rt;
  if (rt.phase === "intro") return vIntroStage("rtap", { extra: lvBox(`パネル${RT_TILES[S.level]}枚の中に爆弾が1つ`, false), btn: "スタート", act: "rtStart" });
  if (rt.phase === "batsu") return stageWrap(vCard(), roundEnd("rtAccept", true));
  const boom = rt.phase === "boom", cols = rt.tiles <= 9 ? 3 : 4;
  const card = `<div class="odai mode-card center ${boom ? "batsu" : ""}" id="card">
    <p class="prog">第${rt.round}回戦・残り${rt.tiles - rt.open.length}枚</p>
    <p class="rt-who">${boom ? `${mName(rt.loser)}がドカン！` : `${mName(rt.who)}の番。1枚めくって`}</p>
    <div class="rt-grid" style="grid-template-columns:repeat(${cols},1fr)">${Array.from({ length: rt.tiles }, (_, t) => {
      const open = rt.open.includes(t), bomb = t === rt.bomb && (open || boom);
      return `<button class="rt-tile ${open ? "open" : ""} ${bomb ? "bomb" : ""}" data-act="rtTap" data-i="${t}" ${open || boom ? "disabled" : ""} aria-label="${open ? "めくった" : "パネル"}">${bomb ? "💣" : open ? "🍺" : "?"}</button>`;
    }).join("")}</div>
  </div>`;
  const controls = boom ? `<button class="big has-pen" data-act="rtGacha">${mName(rt.loser)}に罰ガチャ</button>` : `<p class="hint">1枚だけ爆弾。めくった人が罰</p>`;
  return stageWrap(card, controls);
}

// 爆弾パス
function vBpass() {
  const g = S.game, bp = g.bp;
  if (bp.phase === "intro") return vIntroStage("bpass", { extra: `${lvBox(`爆発まで${BP_SEC[S.level][0]}〜${BP_SEC[S.level][1]}秒のどこか`, false)}<div class="sk-safe" role="note"><b>⚠ スマホは手渡しで</b><span>投げたらアカン。落とさんように両手で渡す</span></div>`, btn: "スタート", act: "bpStart" });
  if (bp.phase === "batsu") return stageWrap(vCard(), roundEnd("bpAccept", true));
  let card, controls;
  if (bp.phase === "ready") {
    card = `<div class="odai mode-card center board-card bp-card" id="card"><p class="prog">第${bp.round}回戦</p><p class="bp-topic-l"><span>お題</span></p><p class="bp-topic bp-hidden">？？？</p><p class="hand-note">1つ言えたら「パス」を押して次の人（${mName((bp.holder + 1) % S.members.length)}の方）へ手渡し。<br>お題はスタートを押したら出る（先に考えるのはナシ）。毎回変わって、だんだん難しくなる</p>${bigWho(bp.holder, "から")}</div>`;
    controls = `<button class="big" data-act="bpGo">スタート</button>`;
  } else if (bp.phase === "play") {
    card = `<div class="odai mode-card center board-card bp-card bp-play" id="card"><p class="bp-topic-l"><span>お題</span><span class="bp-tier ${bp.tier}">${BP_TIER_LABEL[bp.tier] || ""}</span></p><p class="bp-topic">${esc(bp.topic)}</p><div class="bp-bomb" aria-hidden="true">💣</div>${bigWho(bp.holder, "が持ってる")}<p class="hand-note">${bp.passes}回パス</p></div>`;
    controls = `<button class="big bp-pass" data-act="bpPass">言えた！パス → ${mName((bp.holder + 1) % S.members.length)}</button>`;
  } else {
    card = `<div class="odai batsu mode-card center ${S.anim ? "shake" : ""}" id="card"><p class="tl-big q-ng bp-boom-t">ドカーン！</p>${bigWho(bp.loser, "が持ってた")}<p class="hand-note">${bp.passes}回パスで爆発</p></div>`;
    controls = `<button class="big has-pen" data-act="bpGacha">${mName(bp.loser)}に罰ガチャ</button>`;
  }
  return stageWrap(card, controls);
}

// ハイ&ロー
const HL_SUITS = ["♠", "♥", "♦", "♣"];
const hlCard = (v, s, cls = "") => `<div class="hl-card ${s === 1 || s === 2 ? "red" : ""} ${cls}"><span>${hlFace(v)}</span><i>${HL_SUITS[s]}</i></div>`;
function vHilo() {
  const g = S.game, hl = g.hl;
  if (hl.phase === "intro") return vIntroStage("hilo", { extra: lvBox(S.level === "jigoku" ? "同じ数字もアウト。3連続のあとに外したら罰2倍" : S.level === "futsu" ? "5連続のあとに外したら罰2倍" : "同じ数字はセーフ", false), btn: "スタート", act: "hlStart" });
  if (hl.phase === "batsu") return stageWrap(vCard(), roundEnd("hlAccept", true));
  let card, controls;
  if (hl.phase === "guess") {
    card = `<div class="odai mode-card center board-card hl-cardwrap" id="card"><p class="prog">第${hl.round}回戦・${hl.streak}連続中</p>${bigWho(hl.who, "の番")}<div class="hl-row">${hlCard(hl.cur, hl.suit)}<div class="hl-card back">?</div></div><p class="hand-note">次のカードは<b>${hlFace(hl.cur)}</b>より大きい？小さい？${S.level === "jigoku" ? "（同じ数字はアウト）" : "（同じ数字はセーフ）"}</p></div>`;
    controls = `<div class="row2"><button class="big hl-btn" data-act="hlGuess" data-v="down">▼ ロー</button><button class="big hl-btn" data-act="hlGuess" data-v="up">▲ ハイ</button></div>`;
  } else {
    card = `<div class="odai mode-card center ${hl.ok ? "" : "batsu"}" id="card"><p class="prog">${mName(hl.who)}は「${hl.up ? "ハイ" : "ロー"}」</p><div class="hl-row">${hlCard(hl.cur, hl.suit, "dim")}${hlCard(hl.next, hl.nsuit, "flip")}</div><p class="tl-big sp-verdict ${hl.ok ? "q-ok" : "q-ng"}">${hl.ok ? (hl.same ? "同じでセーフ" : "当たり！") : hl.same ? "同じでアウト" : "ハズレ！"}</p><p class="hand-note">${hl.ok ? `${hl.streak}連続` : `${hl.streak}連続で止まった${hl.x > 1 ? "（罰2倍）" : ""}`}</p></div>`;
    controls = hl.ok ? `<button class="big" data-act="hlNext">次は${mName((hl.who + 1) % S.members.length)}</button>` : `<button class="big has-pen" data-act="hlGacha">${mName(hl.loser)}に罰ガチャ</button>`;
  }
  return stageWrap(card, controls);
}

// 反射神経：アウトの理由（フライング・遅すぎ）
const rfOutWord = (rf) => { const f = rf.losers.some((i) => rf.res[i].fly), l = rf.losers.some((i) => !rf.res[i].fly && rf.res[i].ms >= RF_LATE); return f && l ? "フライング・遅すぎでアウト" : f ? "フライング" : "遅すぎでアウト"; };
// 反射神経バトル
function rfRows(rf) {
  const idx = S.members.map((_, i) => i), lose = rf.phase === "rank" || rf.phase === "batsu" ? rf.losers : [];
  const done = idx.filter((i) => rf.res[i]).sort((a, b) => (rf.res[a].fly ? 1e9 : rf.res[a].ms) - (rf.res[b].fly ? 1e9 : rf.res[b].ms));
  return [...done.map((i) => ({ i, v: rf.res[i].fly ? "フライング" : rf.res[i].ms >= RF_LATE ? "遅すぎ" : `${rf.res[i].ms}ms`, bad: lose.includes(i), rk: rf.res[i].fly || rf.res[i].ms >= RF_LATE ? "×" : undefined })), ...idx.filter((i) => !rf.res[i]).map((i) => ({ i, v: "?", wait: true }))];
}
function vReflex() {
  const g = S.game, rf = g.rf, n = S.members.length;
  if (rf.phase === "intro") return vIntroStage("reflex", { extra: `${lvBox(S.level === "yurume" ? "フェイクなし" : S.level === "futsu" ? "たまにフェイクが出る" : "フェイクが何回も出る", false)}<div class="sp-dir" role="group" aria-label="やり方">
        <button data-act="rfStyle" data-v="solo" aria-pressed="${rf.style !== "multi"}"><b>1人ずつ</b><small>順番にじっくり</small></button>
        <button data-act="rfStyle" data-v="multi" aria-pressed="${rf.style === "multi"}"><b>みんな同時</b><small>${n > 4 ? `4人までの${rfHeats().length}組に分けて` : "画面を分けて一斉に"}</small></button>
      </div>`, btn: "スタート", act: "rfStart" });
  if (rf.phase === "mhand" || rf.phase === "mwait" || rf.phase === "mdone") return vReflexMulti();
  if (rf.phase === "batsu") return stageWrap(vCard(), roundEnd("rfAccept", true));
  let card, controls;
  if (rf.phase === "hand") {
    card = `<div class="odai mode-card center" id="card"><p class="prog">第${rf.round}回戦・${rf.k + 1}/${n}人目</p>${bigWho(rf.who, "の番")}<p class="hand-note">画面が<b class="rf-g">緑</b>になった瞬間にタップ。<br>緑になる前に押したらフライングで罰</p></div>`;
    controls = `<button class="big" data-act="rfGo">準備OK</button>`;
  } else if (rf.phase === "wait") {
    card = `<div class="odai mode-card center rf-play" id="card" data-tap="rf"><div class="rf-box ${rf.color}" id="rfBox"><b class="rf-label">${rfLabel(rf.color)}</b></div><p class="hand-note">${mName(rf.who)}・緑になったらタップ</p></div>`;
    controls = `<p class="hint">画面のどこを押してもOK</p>`;
  } else {
    const r = rf.res[rf.who];
    card = `<div class="odai mode-card center board-card ${n >= 7 ? "dense" : ""} ${rf.phase === "rank" || r.fly || r.ms >= RF_LATE ? "batsu" : ""}" id="card" ${rf.phase === "rank" ? rvCard(n) : ""}><p class="prog">${rf.phase === "rank" ? `第${rf.round}回戦の結果` : `${mName(rf.who)}の記録`}</p>${rf.phase === "done" ? `<p class="sp-num sp-res ${r.fly || r.ms >= RF_LATE ? "over rf-fly" : ""}">${r.fly ? "フライング" : r.ms >= RF_LATE ? "遅すぎ" : r.ms + "<small>ms</small>"}</p>` : ""}${rankList(rfRows(rf), rf.phase === "done" ? rf.who : -1, rf.phase === "rank")}${rf.phase === "rank" ? `<p class="ng-lead ${rvLate(n)}">${rf.losers.map(mName).join("・")}が${rf.losers.some((i) => rf.res[i].fly || rf.res[i].ms >= RF_LATE) ? rfOutWord(rf) : "一番遅い"}</p>` : ""}</div>`;
    controls = rf.phase === "rank" ? `<button class="big has-pen" data-act="rfGacha">${rf.losers.map(mName).join("・")}に罰ガチャ</button>` : `<button class="big" data-act="rfNext">次は${mName(rfWho({ k: rf.k + 1, round: rf.round }))}</button>`;
  }
  return stageWrap(card, controls);
}

// 反射神経バトル（みんな同時）：組ごとに画面を区切る。向かいの人が読めるように上の段は逆さま
function rfZones(heat, live) {
  const rf = S.game.rf, m = heat.length, cols = m <= 2 ? 1 : 2, rows = Math.ceil(m / cols);
  return `<div class="rf-zones" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${heat.map((i, k) => {
    const r = rf.res[i], top = k < cols && rows > 1;
    return `<div class="rf-zone ${top ? "top" : ""} ${r ? (r.fly ? "fly" : "hit") : ""}" ${live ? `data-zone="${i}"` : ""} style="--mc:${colorOf(i)}"><span><b>${esc(S.members[i].name)}</b><i class="rf-zv">${r ? (r.fly ? "フライング" : r.ms >= RF_LATE ? "遅すぎ" : `${r.ms}ms`) : ""}</i></span></div>`;
  }).join("")}</div>`;
}
function vReflexMulti() {
  const g = S.game, rf = g.rf, heat = rf.heats[rf.h], many = rf.heats.length > 1;
  const head = `第${rf.round}回戦${many ? `・${rf.h + 1}組目（全${rf.heats.length}組）` : ""}`;
  let card, controls;
  if (rf.phase === "mhand") {
    card = `<div class="odai mode-card center board-card" id="card"><p class="prog">${head}</p><p class="ng-lead">${heat.map(mName).join("・")}</p>${rfZones(heat, false)}<p class="hand-note">スマホを真ん中に置いて、<b>自分のエリアの上に指1本</b>で構えて（まだ触らんといて）。<br>緑になる前に触ったらフライング</p></div>`;
    controls = `<button class="big" data-act="rfGo">準備OK</button>`;
  } else if (rf.phase === "mwait") {
    card = `<div class="odai mode-card center rf-play rf-multi" id="card"><div class="rf-box ${rf.color} multi" id="rfBox">${rfZones(heat, true)}<b class="rf-label">${rfLabel(rf.color)}</b></div></div>`;
    controls = `<p class="hint">緑になったら自分のエリアをタップ（隙間は数えへん）</p>`;
  } else {
    const rows = heat.map((i) => ({ i, r: rf.res[i] })).sort((a, b) => (a.r.fly ? 1e9 : a.r.ms) - (b.r.fly ? 1e9 : b.r.ms)).map(({ i, r }) => ({ i, v: r.fly ? "フライング" : r.ms >= RF_LATE ? "遅すぎ" : `${r.ms}ms`, rk: r.fly ? "×" : undefined }));
    const next = rf.heats[rf.h + 1];
    card = `<div class="odai mode-card center board-card" id="card"><p class="prog">${head}の記録</p>${rankList(rows)}<p class="hand-note">次の組：${next.map(mName).join("・")}</p></div>`;
    controls = `<button class="big" data-act="rfMNext">次の組へ</button>`;
  }
  return stageWrap(card, controls);
}

// 声デカ選手権
function vVoice() {
  const g = S.game, vc = g.vc, n = S.members.length;
  if (vc.phase === "intro") return vIntroStage("voice", { extra: `${lvBox(S.level === "jigoku" ? "一番小さい人の罰が2倍" : "一番小さい人が罰", false)}<p class="how-note">次にマイクの許可を聞かれるので「許可」を押してな。録音はせえへん（大きさを測るだけ）</p>`, btn: "スタート", act: "vcStart" });
  if (vc.phase === "batsu") return stageWrap(vCard(), roundEnd("vcAccept", true));
  const rows = () => { const idx = S.members.map((_, i) => i), lose = vc.phase === "rank" ? vc.losers : []; return [...idx.filter((i) => vc.res[i] != null).sort((a, b) => vc.res[b] - vc.res[a]).map((i) => ({ i, v: vc.res[i], bad: lose.includes(i) })), ...idx.filter((i) => vc.res[i] == null).map((i) => ({ i, v: "?", wait: true }))]; };
  let card, controls;
  if (vc.noMic && vc.phase !== "pick") vc.phase = vc.phase === "hand" || vc.phase === "play" || vc.phase === "done" ? "pick" : vc.phase;
  if (vc.phase === "pick") {
    card = `<div class="odai mode-card center" id="card"><p class="prog">第${vc.round}回戦（マイクが使えへんのでみんなで判定）</p><p class="ng-lead">1人ずつ5秒叫んで、<br>一番小さかった人をタップ</p><div class="vc-pick">${S.members.map((m, i) => `<button class="vc-name" data-act="vcPick" data-i="${i}" style="--mc:${colorOf(i)}">${esc(m.name)}</button>`).join("")}</div></div>`;
    controls = `<p class="hint">マイクの許可を「許可しない」にしてたら、設定から許可すると測れる</p>`;
  } else if (vc.phase === "hand") {
    card = `<div class="odai mode-card center" id="card"><p class="prog">第${vc.round}回戦・${vc.k + 1}/${n}人目</p>${bigWho(vc.who, "の番")}<p class="hand-note">スマホに向かって${VC_SEC}秒間、全力で叫ぶ。<br>なんでもOK（「ノリダーン！」とか）</p></div>`;
    controls = `<button class="big" data-act="vcGo">叫ぶ！スタート</button>`;
  } else if (vc.phase === "count") {
    card = `<div class="odai mode-card center" id="card"><p class="prog">${mName(vc.who)}、息を吸って…</p><p class="tl-count">${vc.n}</p><p class="hand-note">0になったら${VC_SEC}秒間叫ぶ</p></div>`;
    controls = `<p class="hint">スマホを口の前に</p>`;
  } else if (vc.phase === "play") {
    card = `<div class="odai mode-card center tl-play" id="card"><div class="tl-clock" id="tlClock"><p class="tl-sec"><b id="tlSec">${VC_SEC}</b><span id="tlFrac">.0</span><small>秒</small></p><div class="tl-pips">${Array.from({ length: VC_SEC }, (_, i) => `<i class="tl-pip${i < VC_SEC - 1 ? " on" : " now"}"></i>`).join("")}</div></div><div class="tl-mid"><div class="vc-meter" id="vcMeter"><i></i></div><p class="sk-cnt"><b id="vcPeak">0</b><small>最大</small></p><p class="hand-note">${mName(vc.who)}、叫べ！</p></div></div>`;
    controls = `<p class="hint">大きさだけ測ってる（録音はしてへん）</p>`;
  } else {
    card = `<div class="odai mode-card center board-card ${n >= 7 ? "dense" : ""} ${vc.phase === "rank" ? "batsu" : ""}" id="card" ${vc.phase === "rank" ? rvCard(n) : ""}><p class="prog">${vc.phase === "rank" ? `第${vc.round}回戦の結果` : `${mName(vc.who)}の記録`}</p>${vc.phase === "done" ? `<p class="sk-cnt sk-cnt-l"><b>${vc.res[vc.who]}</b><small>点</small></p>` : ""}${rankList(rows(), vc.phase === "done" ? vc.who : -1, vc.phase === "rank")}${vc.phase === "rank" ? `<p class="ng-lead ${rvLate(n)}">${vc.losers.map(mName).join("・")}が一番小さい${S.level === "jigoku" ? "（罰2倍）" : ""}</p>` : ""}</div>`;
    controls = vc.phase === "rank" ? `<button class="big has-pen" data-act="vcGacha">${vc.losers.map(mName).join("・")}に罰ガチャ</button>` : `<button class="big" data-act="vcNext">次は${mName(vcWho({ k: vc.k + 1, round: vc.round }))}</button>`;
  }
  return stageWrap(card, controls);
}

// ---------- 全力シェイク（画面） ----------
const skSafe = () => `<div class="sk-safe" role="note"><b>⚠ スマホが飛ばんように</b><span>ガッチリ握る（ストラップは手首に）・周りの人やグラスから離れる・濡れた手はNG・手は絶対に離さへん</span></div>`;
function skBoard(hi, rv = false) {
  const sk = S.game.sk, n = S.members.length;
  const rows = S.members.map((_, i) => i).filter((i) => sk.cnt[i] != null).sort((a, b) => sk.cnt[b] - sk.cnt[a]);
  const max = Math.max(1, ...rows.map((i) => sk.cnt[i]));
  const lose = sk.phase === "rank" || sk.phase === "batsu" ? sk.losers : [];
  return `<ol class="sk-board">${rows.map((i, r) => `<li class="${rv ? "rv-item" : ""} ${lose.includes(i) ? "lose" : ""} ${i === hi ? "me" : ""}" style="--mc:${colorOf(i)};--w:${(sk.cnt[i] / max).toFixed(3)}${rv ? `;--d:${rvD(r)}s` : ""}">
      <span class="sk-rk">${r + 1}</span><span class="sk-nm">${esc(S.members[i].name)}</span><i class="sk-bar"></i><b>${sk.cnt[i]}</b>${sk.tapped[i] ? `<small>連打</small>` : ""}
    </li>`).join("")}${S.members.map((_, i) => i).filter((i) => sk.cnt[i] == null).map((i) => `<li class="wait" style="--mc:${colorOf(i)}"><span class="sk-rk">-</span><span class="sk-nm">${esc(S.members[i].name)}</span><i class="sk-bar"></i><b>?</b></li>`).join("")}</ol>`;
}
function vShakeCard() {
  const g = S.game, sk = g.sk, n = S.members.length;
  switch (sk.phase) {
    case "hand": return `<div class="odai mode-card center sk-hand" id="card">
      <p class="prog">第${sk.round}回戦・${sk.k + 1}/${n}人目</p>
      ${bigWho(sk.who, "の番")}
      ${skSafe()}
      <p class="hand-note">3・2・1のあと${SK_SEC}秒間、ひたすら振る</p>
    </div>`;
    case "count": return `<div class="odai mode-card center" id="card">
      <p class="prog">${mName(sk.who)}、ガッチリ握って…</p>
      <p class="tl-count">${sk.n}</p>
      <p class="hand-note">手は絶対に離さへんこと</p>
    </div>`;
    case "play": return `<div class="odai mode-card center tl-play sk-play" id="card" ${sk.manual ? `data-tap="sk"` : ""}>
      <div class="tl-clock" id="tlClock">
        <p class="tl-sec"><b id="tlSec">${SK_SEC}</b><span id="tlFrac">.0</span><small>秒</small></p>
        <div class="tl-pips">${Array.from({ length: SK_SEC }, (_, i) => `<i class="tl-pip${i < SK_SEC - 1 ? " on" : " now"}"></i>`).join("")}</div>
      </div>
      <div class="tl-mid">
        <i class="sk-phone" id="skPhone">${ICON.shake}</i>
        <p class="sk-cnt"><b id="skCnt">0</b><small>回</small></p>
        ${sk.manual ? `<p class="hand-note">このスマホは振ったのがとられへんので、<b>画面を連打</b>した回数で勝負</p>` : `<div class="sk-meter" id="skMeter"><i></i></div>`}
      </div>
    </div>`;
    case "done": return `<div class="odai mode-card center board-card ${n >= 7 ? "dense" : ""}" id="card">
      <p class="prog">${mName(sk.who)}の記録</p>
      <p class="sk-cnt sk-cnt-l"><b>${sk.cnt[sk.who]}</b><small>回</small></p>
      ${skBoard(sk.who)}
    </div>`;
    case "rank": return `<div class="odai batsu mode-card center board-card ${n >= 7 ? "dense" : ""}" id="card" ${rvCard(n)}>
      <p class="prog">第${sk.round}回戦の結果</p>
      ${skBoard(-1, true)}
      <p class="ng-lead ${rvLate(n)}">${sk.losers.map(mName).join("・")}が最下位${S.level === "jigoku" ? "（罰2倍）" : ""}</p>
    </div>`;
    case "batsu": return vCard();
  }
  return "";
}
function vShakeControls() {
  const g = S.game, sk = g.sk, n = S.members.length;
  switch (sk.phase) {
    case "hand": return `<button class="big" data-act="skReady">ガッチリ握った → カウントダウン</button>`;
    case "count": return `<p class="hint">まだ振らんといて</p>`;
    case "play": return `<p class="hint">${sk.manual ? "画面を連打！" : "振れ振れ振れ！（手は離さへん）"}</p>`;
    case "done": return `<button class="big" data-act="skNext">次は${mName(skWho({ k: sk.k + 1, round: sk.round }))}</button>`;
    case "rank": return `<button class="big has-pen" data-act="skGacha">${sk.losers.map(mName).join("・")}に罰ガチャ</button>`;
    case "batsu": return roundEnd("skAccept", true);
  }
  return "";
}
function vShake() {
  const sk = S.game.sk;
  if (sk.phase === "intro") {
    const none = typeof window.DeviceMotionEvent === "undefined";
    return vIntroStage("shake", { extra: `${lvBox(S.level === "jigoku" ? "最下位の罰が2倍" : "最下位が罰", false)}${skSafe()}<p class="how-note">${none ? "このブラウザは振ったのがとられへんので、画面の連打で勝負するモードになる" : "iPhoneは次に「動きと方向へのアクセス」を聞かれるので「許可」を押してな"}</p>`, btn: "スタート", act: "skStart" });
  }
  return `<div id="stage" class="${S.flip ? "flipped" : ""}">
    ${vBar()}
    <div class="deck">${vShakeCard()}</div>
    ${vShakeControls()}
  </div>`;
}

// ---------- 傾けたらアウト（画面） ----------
function vTiltCard() {
  const g = S.game, tl = g.tl, lim = tiltLimit();
  switch (tl.phase) {
    case "hand": return `<div class="odai mode-card center" id="card">
      <p class="prog">第${Math.floor(tl.k / S.members.length) + 1}回戦・${tl.k % S.members.length + 1}/${S.members.length}人目</p>
      ${bigWho(tl.who, "の番")}

// ---------- すごろく盤 ----------
const COLS = 6;
const ROWS = Math.ceil(DATA.board.length / COLS);
// ヘビ型：偶数行は左→右、奇数行は右→左
const cellXY = (i) => { const r = Math.floor(i / COLS), c = r % 2 === 0 ? i % COLS : COLS - 1 - (i % COLS); return { r, c }; };
const pct = (i) => { const { r, c } = cellXY(i); return { x: ((c + 0.5) / COLS) * 100, y: ((r + 0.5) / ROWS) * 100 }; };
function cellFace(c) {
  switch (c.type) {
    case "start": return { cls: "c-start", g: "START" };
    case "goal": return { cls: "c-goal", g: "GOAL" };
    case "odai": return { cls: "c-odai", g: "お題" };
    case "move": return { cls: c.value > 0 ? "c-plus" : "c-minus", g: (c.value > 0 ? "+" : "−") + Math.abs(c.value) };
    case "skip": return { cls: "c-skip", g: "休" };
    case "swap": return { cls: "c-swap", g: "⇄" };
    case "event": return { cls: "c-event", g: "！" };
    default: return { cls: "c-text", g: c.short || c.label };
  }
}
function tokenStyle(i) {
  const g = S.game, p = g.vpos[i];
  const same = g.vpos.map((q, k) => (q === p ? k : -1)).filter((k) => k >= 0);
  const k = same.indexOf(i), n = same.length;
  // STARTはコマを下に横並び（「START」の字が隠れんように）。それ以外は重なったら少しずらす
  const off = p === 0 ? [(k - (n - 1) / 2) * Math.min(14, 44 / Math.max(1, n - 1)), 18]
    : n === 1 ? [0, 0] : [((k % 2) - 0.5) * 18, (Math.floor(k / 2) - (n > 2 ? 0.5 : 0)) * 18];
  const { x, y } = pct(p);
  return `left:calc(${x}% + ${off[0]}px);top:calc(${y}% + ${off[1]}px);--mc:${colorOf(i)}${p === 0 ? ";--s:.62" : ""}`;
}
function vBoard() {
  const g = S.game;
  const pts = DATA.board.map((_, i) => { const { x, y } = pct(i); return `${x * 6},${y * ROWS}`; }).join(" ");
  return `<div class="sg-board" id="board" style="aspect-ratio:${COLS}/${ROWS};--rows:${ROWS}" aria-label="すごろく盤">
    <svg class="sg-path" viewBox="0 0 600 ${ROWS * 100}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>
    ${DATA.board.map((c, i) => {
      const { r, c: col } = cellXY(i), f = cellFace(c);
      return `<div class="sg-cell ${f.cls}" style="left:${(col / COLS) * 100}%;top:${(r / ROWS) * 100}%;width:${100 / COLS}%;height:${100 / ROWS}%" title="${esc(c.label || "お題")}">
        <div class="in"><span class="no">${c.type === "start" || c.type === "goal" ? "" : i}</span><b>${esc(f.g)}</b></div></div>`;
    }).join("")}
    ${sgArrows()}
    ${S.members.map((m, i) => `<div class="sg-tok ${i === g.cur ? "is-cur" : ""}" id="tok${i}" style="${tokenStyle(i)}">${ini(i)}</div>`).join("")}
  </div>`;
}
// 進む向きの矢印：マスとマスの間に「›」。曲がり角でも向きがわかるように線の向きに回す
function sgArrows() {
  return DATA.board.slice(0, -1).map((_, i) => {
    const a = pct(i), b = pct(i + 1);
    const deg = (Math.atan2((b.y - a.y) * ROWS, (b.x - a.x) * COLS) * 180) / Math.PI;
    return `<i class="sg-arrow" style="left:${((a.x + b.x) / 2).toFixed(2)}%;top:${((a.y + b.y) / 2).toFixed(2)}%;--a:${deg.toFixed(0)}deg" aria-hidden="true"></i>`;
  }).join("");
}
// コマだけ動かす（DOMを作り直さないのでスッと動く）
function paintBoard() {
  S.members.forEach((_, i) => {
    const el = document.getElementById("tok" + i);
    if (!el) return;
    el.setAttribute("style", tokenStyle(i));
    if (i === S.game.cur) { el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); }

  const r = document.getElementById("ranks");

function vRanks() {

const cuedGacha = new WeakSet();
function batsuCue() {
  const g = S.game, gs = g.gacha || [];
  if (!gs.length) return "";
  const lucky = gs.every((x) => x.lucky), intro = S.gIntro;
  if (intro) play(lucky ? "lucky" : "pop"); // ガラガラ → パカッ
  else if (lucky) play("lucky");
  // 連続で罰の人を数える（描き直しで2回数えへんように）
  let streak = null;
  if (!cuedGacha.has(gs)) {
    cuedGacha.add(gs);
    const losers = gs.filter((x) => !x.lucky).map((x) => x.i);
    g.stk = S.members.map((_, i) => (losers.includes(i) ? ((g.stk && g.stk[i]) || 0) + 1 : 0));
    const top = losers.filter((i) => g.stk[i] >= 2).sort((a, b) => g.stk[b] - g.stk[a])[0];
    if (top != null) streak = { i: top, n: g.stk[top] };
  }
  const fx = () => {
    if (lucky) { play("kira"); goldFx(); }
    else { play(Math.random() < 0.5 ? "sad" : "chin"); quakeFx(); }
    if (streak) S.cueTs.push(setTimeout(() => streakFx(streak), 700));
  };
  if (intro) S.cueTs.push(setTimeout(fx, GACHA_T * 1000 + 60)); else fx();
  return "";
}

  if (sc === "memory") { const p = S.game.mm.phase; play(p === "skull" ? "boom" : p === "fail" || p === "low" ? batsuCue() : p === "match" ? "pinpon" : p === "miss" ? "buzzer" : p === "over" ? "fanfare" : "flip"); if (p === "skull") boomFlash(); return; }
  if (["rtap", "bpass", "hilo", "reflex", "voice"].includes(sc)) { if (S.game.phase === "batsu") batsuCue(); return; }
  if (sc === "stop") { if (S.game.sp.phase === "batsu") batsuCue(); return; }
  if (sc === "shake") { if (S.game.sk.phase === "batsu") batsuCue(); return; }
  if (sc === "tilt") { if (S.game.tl.phase === "batsu") batsuCue(); return; }
  if (sc === "wolf") { const p = S.game.wf.phase; play(p === "batsu" ? batsuCue() : p === "group" ? (S.game.wf.res.lucky ? "lucky" : "pop") : p === "reveal" || p === "result" ? "fanfare" : "flip"); return; }
  if (sc === "pittari") { const p = S.game.pt.phase; if (p === "input" || p === "answer") return; play(p === "batsu" ? batsuCue() : p === "reveal" ? "fanfare" : "flip"); return; }
  if (sc === "vote") { const p = S.game.vt.phase; play(p === "batsu" ? batsuCue() : p === "reveal" ? "fanfare" : "flip"); return; }
  if (sc !== "odai" && sc !== "sugoroku") return;
  const g = S.game, c = g.card || {};
  if (g.intro) { play("flip"); return; }
  if (sc === "sugoroku" && !g.rolled) return; // サイコロ待ちの時は鳴らさない
  if (g.phase === "batsu") batsuCue();
  else if (c.kind?.includes("ドカン")) { play("boom"); boomFlash(); }
  else if (g.phase === "bombSet") play("alarm");
  else if (g.phase === "offer") play("coin");

}

function modeFrame() {

  if (g.ng && ["confirm", "out", "eyes", "newword"].includes(g.ng.phase)) return colorOf(g.ng.out);

  if (g.wf && ["hand", "look"].includes(g.wf.phase)) return colorOf(g.wf.viewer);
  if (g.wf && ["vhand", "vote"].includes(g.wf.phase)) return colorOf(g.wf.order[g.wf.k]);
  if (g.wf && g.wf.phase === "guess" && g.wf.wolves.length) return colorOf(g.wf.wolves[0]);
  if (g.pt && ["hand", "input"].includes(g.pt.phase)) return colorOf(g.pt.order[g.pt.k]);
  if ((g.rf && g.rf.phase === "rank") || (g.vc && g.vc.phase === "rank") || (g.rt && g.rt.phase === "boom") || (g.bp && g.bp.phase === "boom") || (g.hl && g.hl.phase === "reveal" && !g.hl.ok)) return "#ff2a2a";
  if (g.sp && g.sp.phase === "rank" && g.sp.losers.length) return "#ff2a2a";
  if (g.sp && g.sp.phase === "done" && g.sp.res[g.sp.who]?.over) return "#ff2a2a";
  if (g.sp && g.sp.who != null && g.sp.phase !== "intro") return colorOf(g.sp.who);
  if (g.sk && g.sk.phase === "rank" && g.sk.losers.length) return "#ff2a2a";
  if (g.sk && g.sk.who != null && g.sk.phase !== "intro") return colorOf(g.sk.who);

const snapKey = (g) => { try { return JSON.stringify(g, (k, v) => (v instanceof Map || v instanceof Set ? [...v] : v)); } catch { return ""; } };
function busyGame() { const g = S.game; return !!(g && (g.rolling || g.hopping || S.spinning || modeTimer)); }
function rememberStep(act) {
  if (act === "undo" || !S.game || !isStage(S.screen) || busyGame()) return;
  const g = S.game, key = snapKey(g);
  let snap;
  try { snap = structuredClone(g); } catch { return; }
  queueMicrotask(() => {
    if (S.game !== g || !isStage(S.screen) || snapKey(g) === key) return;
    S.hist.push(snap);

  });
}
