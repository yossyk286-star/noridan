<title>ノリダン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen party app. A paper お題札 sits on a flat color field (= 地獄度); the frame glows in the current player's color. */
:root {
  color-scheme: dark;
  --ink: #141210;
  --paper: #f7f3ea;
  --cream: #fffaf0;
  --yuru: #ffd23f;
  --futsu: #ff5d8f;
  --jigoku: #0d0b0b;
  --blood: #ff2a2a;
  --night: #b69cff;
  --deep: #ff4fa8;
  --muted: #8d857a;
  --line: rgba(247,243,234,.16);
  --chip: rgba(247,243,234,.08);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

  /* stage surface, switched by data-level */
  --bg: var(--ink);
  --fg: var(--paper);
  --card-bg: var(--cream);
  --card-fg: var(--ink);
  --card-edge: transparent;
  --pc: var(--yuru); /* current player color */
}
html, body { height: 100%; }
html { height: 100%; background: var(--ink); }
body {
  margin: 0; min-height: 100%; min-height: 100dvh;
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-weight: 500;
  -webkit-tap-highlight-color: transparent;
  transition: background .35s ease, color .35s ease;
  overflow-x: hidden;
}
body.stage[data-level="yurume"] { --bg: var(--yuru); --fg: var(--ink); --muted: rgba(20,18,16,.6); --chip: rgba(20,18,16,.12); --line: rgba(20,18,16,.2); }
body.stage[data-level="futsu"]  { --bg: var(--futsu); --fg: var(--ink); --muted: rgba(20,18,16,.62); --chip: rgba(20,18,16,.12); --line: rgba(20,18,16,.22); }
body.stage[data-level="jigoku"] { --bg: var(--jigoku); --fg: var(--blood); --muted: rgba(255,42,42,.65); --chip: rgba(255,42,42,.14); --line: rgba(255,42,42,.3); --card-bg: #170b0b; --card-fg: var(--blood); --card-edge: rgba(255,42,42,.55); }

#app {
  min-height: 100%; min-height: 100dvh; box-sizing: border-box;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* ホーム画面に追加した時は時計・電池の下から始める */
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 24px;
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yuru); outline-offset: 2px; }
mark { background: none; color: inherit; }

/* player-color frame around the whole screen */
.frame { position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100%); pointer-events: none; z-index: 5; box-shadow: inset 0 0 0 6px var(--pc), inset 0 0 38px color-mix(in srgb, var(--pc) 55%, transparent); transition: box-shadow .4s ease; }
body:not(.stage) .frame { display: none; }

/* ---------- shared bits ---------- */
.h2 { margin: 0; font-size: 12px; letter-spacing: .24em; font-weight: 900; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; }
.warn { font-size: 12px; color: var(--futsu); margin: 0; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.big { width: 100%; padding: 18px; border-radius: 16px; background: var(--fg); color: var(--bg); font-family: var(--display); font-size: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
.big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.big:disabled { opacity: .35; box-shadow: none; }
.ghost { padding: 15px; border-radius: 14px; border: 2px solid var(--line); font-weight: 900; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { margin: -6px 0 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }

/* ---------- home ---------- */
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.logo { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 17vw, 96px); line-height: .95; color: var(--yuru); white-space: nowrap; }
.logo.is-night { color: var(--night); }
.logo.is-deep { color: var(--deep); }
.logo-btn { font: inherit; color: inherit; padding: 0; line-height: inherit; -webkit-user-select: none; user-select: none; }
.catch { margin: 6px 0 0; font-size: 13px; font-weight: 900; letter-spacing: .3em; color: var(--muted); }
.step-dots { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 900; color: var(--muted); letter-spacing: .14em; }
.step-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.step-dots i.on { background: var(--yuru); }

.members { display: flex; flex-direction: column; gap: 8px; }
.mem { display: grid; grid-template-columns: 34px minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 10px 6px 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.mem .dot, .mchip .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: var(--ink); font-size: 15px; }
.mem .nm b { display: block; font-size: 17px; }
.mem .nm span { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.mem .x { width: 36px; height: 36px; border-radius: 8px; color: var(--muted); font-size: 20px; }
.ng { font-size: 11px; font-weight: 900; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ng[aria-pressed="true"] { background: var(--night); color: var(--ink); border-color: transparent; }
.add { display: grid; gap: 8px; }
.add .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.add input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: rgba(247,243,234,.06); color: var(--paper); }
.add input::placeholder { color: var(--muted); }
.btn-add { padding: 0 18px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 900; }
.dock { position: sticky; bottom: 0; padding-block: 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--chip); font-weight: 900; font-size: 14px; }
.mchip .dot { width: 26px; height: 26px; font-size: 12px; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lv { padding: 18px 6px 14px; border-radius: 14px; font-weight: 900; font-size: 17px; border: 2px solid transparent; opacity: .5; transition: opacity .2s, transform .2s; }
.lv[data-v="yurume"] { background: var(--yuru); color: var(--ink); }
.lv[data-v="futsu"] { background: var(--futsu); color: var(--ink); }
.lv[data-v="jigoku"] { background: #000; color: var(--blood); border-color: var(--blood); }
.lv[aria-pressed="true"] { opacity: 1; transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0,0,0,.4); }
.lv small { display: block; font-size: 10px; font-weight: 700; opacity: .75; margin-top: 3px; }
.modes { display: grid; gap: 10px; }
.mode { text-align: left; padding: 18px 16px; border-radius: 16px; background: var(--paper); color: var(--ink); display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.mode b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; }
.mode span { grid-column: 1; font-size: 12px; color: #5d564c; line-height: 1.5; }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-size: 15px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 999px; }
.mode:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }

/* settings sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; box-sizing: border-box; background: #1d1a17; color: var(--paper); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto; animation: rise .28s cubic-bezier(.2,1.2,.4,1); }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(247,243,234,.25); align-self: center; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(247,243,234,.16); font-weight: 900; font-size: 15px; text-align: left; }
.toggle small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.toggle b { padding: 5px 12px; border-radius: 999px; background: rgba(247,243,234,.1); font-size: 12px; flex: none; }
.toggle[aria-pressed="true"] b { background: var(--yuru); color: var(--ink); }
.night-box { padding: 14px; border-radius: 12px; border: 1px solid var(--night); display: flex; flex-direction: column; gap: 10px; }
.night-box .h2 { color: var(--night); }
.night-lv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.night-lv button { padding: 12px 8px; border-radius: 10px; border: 1px solid var(--night); font-weight: 900; font-size: 16px; opacity: .55; }
.night-lv button small { display: block; font-size: 10px; font-weight: 700; margin-top: 2px; }
.night-lv button[aria-pressed="true"] { opacity: 1; background: var(--night); color: var(--ink); }
.night-lv button[data-v="shinya"][aria-pressed="true"] { background: var(--deep); border-color: var(--deep); }
.sheet .ghost { border-color: rgba(247,243,234,.16); }

/* night ask */
.night-ask { display: flex; flex-direction: column; gap: 18px; padding-top: 24px; }
.night-ask .h2 { color: var(--night); }
.night-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 17vw, 96px); line-height: 1; color: var(--night); }
.night-lead { margin: 0; font-size: 16px; line-height: 1.8; font-weight: 700; }
.night-rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.night-ask .big { background: var(--paper); color: var(--ink); }

/* ---------- tutorial ---------- */
.tut { position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.tut-in { max-width: 520px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.tut-top { display: flex; justify-content: space-between; align-items: center; }
.tut-skip { font-weight: 900; color: var(--muted); padding: 8px; }
.tut-dots { display: flex; gap: 6px; }
.tut-dots i { width: 26px; height: 5px; border-radius: 3px; background: rgba(247,243,234,.18); }
.tut-dots i.on { background: var(--yuru); }
.tut-art { flex: 1; display: grid; place-items: center; min-height: 200px; }
.tut-step { font-size: 12px; font-weight: 900; letter-spacing: .24em; color: var(--yuru); }
.tut h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.2; text-wrap: balance; }
.tut p { margin: 0; font-size: 15px; line-height: 1.85; color: #cfc7bb; font-weight: 700; }
.tut p b { color: var(--paper); }
.tut .big { background: var(--yuru); color: var(--ink); }
.mini-card { width: min(260px, 70vw); aspect-ratio: 3 / 4; border-radius: 18px; background: var(--cream); color: var(--ink); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 10px; box-shadow: 0 0 0 5px var(--pink, var(--futsu)), 0 12px 0 rgba(0,0,0,.4); transform: rotate(-4deg); animation: flipIn .7s cubic-bezier(.2,1.3,.4,1) both; }
.mini-card small { font-size: 10px; font-weight: 900; letter-spacing: .2em; color: #8d857a; }
.mini-card b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.4; }
.tut-icons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
.tut-icons div { border: 1px solid rgba(247,243,234,.16); border-radius: 14px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.tut-icons b { font-size: 15px; }
.tut-icons span { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ---------- stage ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar .pill { font-weight: 900; font-size: 13px; padding: 9px 12px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.bar .tag { font-size: 11px; font-weight: 900; letter-spacing: .18em; color: var(--muted); text-align: center; min-width: 0; }
.bar .tools { display: flex; gap: 6px; }
.bar .icon-btn { width: 38px; height: 38px; border-radius: 999px; }
.bar .icon-btn svg { width: 18px; height: 18px; }
.flipped { transform: rotate(180deg); }
#stage { display: flex; flex-direction: column; gap: 14px; flex: 1; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }

.turn { display: flex; align-items: center; gap: 12px; min-width: 0; }
.turn .who { width: 14px; height: 54px; border-radius: 7px; background: var(--pc); flex: none; box-shadow: 0 0 0 2px var(--fg); }
.turn small { display: block; font-size: 13px; font-weight: 900; letter-spacing: .08em; }
.turn em { display: block; font-style: normal; font-family: var(--display); font-size: clamp(38px, 12vw, 56px); line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rule { border: 2px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.rule b { font-size: 11px; letter-spacing: .12em; white-space: nowrap; }
.rule.bomb { border-style: solid; border-color: var(--fg); }
.fuse { position: relative; width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.fuse::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--fg) 0 6px, transparent 6px 10px); animation: burn 1.2s linear infinite; }
@keyframes burn { from { transform: translateX(-10px); } to { transform: translateX(0); } }

.deck { flex: 1; display: flex; flex-direction: column; padding: 6px 0 4px; perspective: 1000px; min-height: 280px; }
.odai { flex: 1; width: 100%; box-sizing: border-box; border-radius: 22px; background: var(--card-bg); color: var(--card-fg); padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 2px var(--card-edge); position: relative; transform-origin: 50% 50%; }
.odai .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; letter-spacing: .18em; opacity: .62; }
.odai .no { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.odai .txt { flex: 1; display: flex; align-items: center; margin: 0; font-family: var(--display); font-size: clamp(26px, 8vw, 38px); line-height: 1.38; overflow-wrap: anywhere; text-wrap: pretty; }
.odai .txt mark { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--mc, var(--yuru)) 75%, transparent) 58%); padding: 0 .06em; }
body[data-level="jigoku"] .odai .txt mark { background: none; text-decoration: underline; text-decoration-color: var(--mc); text-decoration-thickness: .1em; text-underline-offset: .14em; }
.odai .txt.mirror { transform: rotate(180deg); opacity: .92; }
.dual-line { border: 0; border-top: 2px dashed currentColor; opacity: .22; margin: 0; width: 100%; }
.mirror-list { transform: rotate(180deg); display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; }
.mirror-list p { margin: 0; } .mirror-list b { margin-right: 6px; opacity: .75; }
.odai .foot { font-size: 11px; font-weight: 700; opacity: .55; }
.odai.yoru { --card-bg: #1c1328; --card-fg: #f1e8ff; box-shadow: 0 0 0 2px var(--night); }
.odai.deep { --card-bg: #2a0f1f; --card-fg: #ffe3f1; box-shadow: 0 0 0 2px var(--deep); }
.odai.event { --card-bg: var(--ink); --card-fg: var(--yuru); box-shadow: 0 0 0 3px var(--yuru); }
.odai.bombc { --card-bg: #0e0e0e; --card-fg: #fff; box-shadow: 0 0 0 3px #ff7a1a; }
.badge { display: inline-block; font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 999px; background: var(--card-fg); color: var(--card-bg); letter-spacing: .04em; }
.in { animation: flipIn .5s cubic-bezier(.2,1.25,.4,1) both; }
@keyframes flipIn { from { transform: rotateY(-100deg) scale(.92); opacity: .2; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
.shake { animation: flipIn .5s cubic-bezier(.2,1.25,.4,1) both, jolt .5s .45s; }
@keyframes jolt { 0%,100%{transform:none} 15%{transform:translate(-7px,2px) rotate(-1.5deg)} 30%{transform:translate(7px,-2px) rotate(1deg)} 45%{transform:translate(-4px,1px)} 60%{transform:translate(3px,0)} 80%{transform:translate(-1px,0)} }

/* bomb art */
.bomb-art { width: 92px; height: 92px; align-self: center; }
.bomb-art .spark { transform-origin: 70px 14px; animation: spark .18s steps(2) infinite alternate; }
@keyframes spark { from { transform: scale(.7) rotate(0deg); } to { transform: scale(1.15) rotate(25deg); } }
.flash { position: fixed; inset: 0; z-index: 25; pointer-events: none; background: radial-gradient(circle at 50% 55%, #fff 0, #ffd23f 25%, #ff3b1a 55%, transparent 80%); animation: flash .9s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.6); } }

/* coin (double up) */
.coin-wrap { display: flex; justify-content: center; perspective: 600px; }
.coin { width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffd23f 45%, #c9971a); color: #6b4a00; display: grid; place-items: center; font-family: var(--display); font-size: 34px; box-shadow: inset 0 0 0 5px #e8b52a, 0 8px 0 rgba(0,0,0,.25); animation: spinY 1.1s linear infinite; }
@keyframes spinY { to { transform: rotateY(360deg); } }

/* 罰ガチャ：ドクロ */
.odai.batsu { --card-bg: #1a0606; --card-fg: #fff; box-shadow: 0 0 0 3px #e8202a; }
.skull-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.skull-wrap b { font-family: var(--display); font-weight: 400; font-size: 22px; color: #e8202a; letter-spacing: .08em; animation: reveal .3s .35s ease-out both; }
.skull { width: 104px; height: 104px; animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both, skullBob 1.4s .6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)); }
.skull .eye { animation: glow .9s ease-in-out infinite alternate; }
@keyframes skullIn { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.18) rotate(8deg); } to { transform: none; } }
@keyframes skullBob { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
@keyframes glow { from { fill: #e8202a; } to { fill: #ff8a1a; } }
.odai.batsu .gacha-txt b { opacity: .75; }
.odai.batsu .gacha-item.night .gacha-txt b { opacity: 1; color: var(--night); }
.odai.batsu .gacha-item.shinya .gacha-txt b { opacity: 1; color: var(--deep); }
.odai.lucky { --card-bg: #eef6ff; --card-fg: #1c2a4a; box-shadow: 0 0 0 3px #ffd23f; background-image: radial-gradient(circle at 50% 20%, #fffbe6 0, transparent 60%); }
.odai.lucky .skull-wrap b { color: #d99a00; }
.angel { width: 128px; height: 106px; animation: skullIn .6s cubic-bezier(.3,1.7,.5,1) both, float 1.8s .6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
.angel .halo { animation: halo 1.2s ease-in-out infinite alternate; transform-origin: 60px 14px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes halo { from { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1.12); opacity: .7; } }
.gacha-txt .mark { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.gacha-txt .mark.ok { background: #ffd23f; color: #141210; }
.gacha-txt .mark.ng { background: #e8202a; color: #fff; }

/* gacha capsules */
.gacha { display: flex; flex-direction: column; gap: 14px; width: 100%; }
.gacha-item { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; align-items: center; }
.gacha-item .capsule { overflow: visible; }
.capsule { position: relative; width: 64px; height: 64px; animation: drop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d); }
.capsule i { position: absolute; left: 0; right: 0; height: 50%; }
.capsule .top { top: 0; border-radius: 32px 32px 0 0; background: var(--mc); box-shadow: inset -6px 6px 0 rgba(255,255,255,.35); animation: popTop .5s calc(var(--d) + .55s) ease-out both; transform-origin: 10% 100%; }
.capsule .bot { bottom: 0; border-radius: 0 0 32px 32px; background: #f2ede4; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08); }
.capsule::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
@keyframes drop { from { transform: translateY(-140px) rotate(-200deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes popTop { 60% { opacity: 1; } to { transform: rotate(-50deg) translate(-2px,-8px); opacity: 0; } }
@keyframes capFade { to { opacity: 0; transform: scale(.6); } }
@keyframes badgeIn { from { opacity: 0; transform: scale(.3) rotate(-20deg); } to { opacity: 1; transform: none; } }
.capsule .bot { animation: capFade .3s calc(var(--d) + .95s) ease-in both; }
.capsule::after { animation: capFade .3s calc(var(--d) + .95s) ease-in both; }
.capsule .res { font-style: normal; position: absolute; inset: 6px; height: auto; display: grid; place-items: center; border-radius: 50%; background: #e8202a; color: #fff; font-family: var(--display); font-size: 22px; animation: badgeIn .35s calc(var(--d) + 1.05s) cubic-bezier(.3,1.6,.5,1) both; box-shadow: 0 0 0 3px var(--mc); }
.capsule .res.ok { background: #ffd23f; color: #141210; }
.gacha-txt { animation: reveal .4s calc(var(--d) + .8s) ease-out both; }
.gacha-txt b { display: block; font-size: 12px; font-weight: 900; letter-spacing: .1em; opacity: .7; }
.gacha-txt p { margin: 2px 0 0; font-family: var(--display); font-size: clamp(19px, 5.6vw, 24px); line-height: 1.4; overflow-wrap: anywhere; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 罰タイル */
.pen-grid-wrap { display: flex; flex-direction: column; gap: 8px; }
.pen-q { margin: 0; display: flex; align-items: baseline; justify-content: space-between; font-size: 16px; font-weight: 900; }
.pen-q span { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.pen-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pen-tile { position: relative; min-height: 64px; border-radius: 14px; background: var(--chip); border: 2px solid var(--line); padding: 8px 10px 8px 16px; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; transition: transform .1s, background .15s; }
.pen-tile:active { transform: scale(.96); }
.pen-tile .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--mc); }
.pen-tile .nm { font-size: 17px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pen-tile .meta { display: flex; gap: 6px; font-size: 10px; font-weight: 900; opacity: .7; }
.pen-tile .meta em { font-style: normal; margin-left: auto; font-variant-numeric: tabular-nums; }
.pen-tile.is-doer { border-color: var(--fg); }
.pen-tile[aria-pressed="true"] { background: #e8202a; border-color: #e8202a; color: #fff; }
.pen-tile .stamp { position: absolute; right: 6px; top: 50%; transform: translateY(-50%) rotate(-14deg); width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; font-family: var(--display); font-size: 18px; color: #fff; animation: stamp .22s cubic-bezier(.3,1.6,.5,1); }
.pen-tile[aria-pressed="true"] .meta em { visibility: hidden; }
@keyframes stamp { from { transform: translateY(-50%) rotate(-14deg) scale(2.2); opacity: 0; } }
.big.has-pen { background: #e8202a; color: #fff; }
body[data-level="jigoku"] .pen-tile[aria-pressed="true"] { background: var(--blood); color: #000; border-color: var(--blood); }
body[data-level="jigoku"] .pen-tile[aria-pressed="true"] .stamp { border-color: #000; color: #000; }
body[data-level="jigoku"] .big.has-pen { background: var(--blood); color: #000; }

/* controls */
.pen h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; font-weight: 900; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px 10px 10px; border-radius: 999px; background: var(--chip); font-weight: 900; font-size: 15px; border: 2px solid transparent; min-height: 44px; box-sizing: border-box; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 1.5px rgba(0,0,0,.25); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip .n { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
.chip .rv { font-size: 12px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { padding: 16px 10px; border-radius: 16px; font-weight: 900; font-size: 15px; line-height: 1.35; background: var(--chip); border: 2px solid var(--fg); }
.choice.hot { background: var(--fg); color: var(--bg); font-family: var(--display); font-weight: 400; font-size: 19px; }
.choice small { display: block; font-family: var(--body); font-weight: 700; font-size: 11px; opacity: .75; margin-top: 4px; }
.sub-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.sub-acts button { padding: 10px 14px; border-radius: 999px; font-weight: 900; font-size: 14px; background: var(--chip); }
.sub-acts .revenge { border: 2px dashed var(--fg); background: none; }

/* ---------- すごろく ---------- */
.sg-callout { --tx: -50%; --ax: 50%; position: absolute; z-index: 5; transform: translate(var(--tx), -150%); white-space: nowrap; font-family: var(--display); font-size: 20px; padding: 8px 14px; border-radius: 14px; box-shadow: 0 0 0 3px var(--ink), 0 6px 0 rgba(0,0,0,.35); animation: callout 1.5s cubic-bezier(.3,1.6,.5,1) both; pointer-events: none; }
.sg-callout::after { content: ""; position: absolute; left: var(--ax); bottom: -9px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: inherit; }
.sg-callout.minus { background: #ff5a4f; color: #fff; border-top-color: #ff5a4f; }
.sg-callout.plus { background: #3fd16b; color: #062a12; border-top-color: #3fd16b; }
.sg-callout.swap { background: #b69cff; color: #1c1328; border-top-color: #b69cff; }
@keyframes callout { 0% { transform: translate(var(--tx), -100%) scale(0); } 15% { transform: translate(var(--tx), -150%) scale(1.15); } 25%, 85% { transform: translate(var(--tx), -150%) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), -170%) scale(.9); opacity: 0; } }
.sugo2 { gap: 12px; }
.sg-board { position: relative; width: 100%; max-width: 100%; }
.sg-path { position: absolute; inset: 0; width: 100%; height: 100%; }
.sg-path polyline { fill: none; stroke: var(--fg); stroke-opacity: .28; stroke-width: 14; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sg-cell { position: absolute; box-sizing: border-box; padding: 4px; }
.sg-cell .in { width: 100%; height: 100%; box-sizing: border-box; border-radius: 12px; background: var(--card-bg); color: var(--card-fg); display: grid; place-items: center; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.sg-cell .no { position: absolute; left: 5px; top: 3px; font-size: 9px; font-weight: 900; opacity: .45; font-variant-numeric: tabular-nums; }
.sg-cell b { font-family: var(--display); font-weight: 400; font-size: clamp(11px, 3.6vw, 17px); line-height: 1.05; text-align: center; padding: 0 2px; overflow-wrap: anywhere; }
.c-odai b { font-family: var(--body); font-weight: 900; font-size: clamp(10px, 2.8vw, 13px); opacity: .55; }
.c-text b { font-family: var(--body); font-weight: 900; font-size: clamp(8px, 2.4vw, 11px); }
.c-plus .in { background: #3fd16b; color: #062a12; }
.c-minus .in { background: #ff5a4f; color: #fff; }
.c-skip .in { background: #7b8db8; color: #fff; }
.c-swap .in { background: #b69cff; color: #1c1328; }
.c-event .in { background: repeating-linear-gradient(-45deg, #ffd23f 0 6px, #141210 6px 12px); color: #141210; }
.c-event b { background: #ffd23f; border-radius: 8px; padding: 0 6px; }
.c-text .in { background: #ff9a3c; color: #2a1200; }
.c-start .in { background: var(--ink); color: var(--paper); }
.c-goal .in { background: conic-gradient(#141210 25%, #fff 0 50%, #141210 0 75%, #fff 0) 0 0 / 14px 14px; }
.c-goal b, .c-start b { font-size: clamp(10px, 3vw, 14px); }
.c-goal b { background: var(--yuru); color: var(--ink); border-radius: 6px; padding: 2px 4px; }
body[data-level="jigoku"] .sg-cell .in { box-shadow: 0 0 0 1px rgba(255,42,42,.3); }

.sg-tok { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--mc); color: var(--ink); font-weight: 900; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 2.5px var(--ink), 0 4px 0 rgba(0,0,0,.35); transition: left .24s ease, top .24s ease; z-index: 2; }
.sg-tok.is-cur { width: 32px; height: 32px; margin: -16px 0 0 -16px; font-size: 15px; z-index: 3; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--mc), 0 5px 0 rgba(0,0,0,.35); animation: pulse 1.2s ease-in-out infinite; }
.sg-tok.hop { animation: hopUp .26s ease-out; }
@keyframes hopUp { 50% { transform: translateY(-14px) scale(1.12); } }
@keyframes pulse { 50% { transform: scale(1.08); } }

.sg-ranks { display: flex; flex-direction: column; gap: 4px; }
.sg-rank { display: grid; grid-template-columns: minmax(0, 5em) minmax(0,1fr) 3em; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; }
.sg-rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-rank .nm small { margin-left: 4px; font-size: 9px; padding: 1px 4px; border-radius: 4px; background: var(--fg); color: var(--bg); }
.sg-rank .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.sg-rank .bar i { display: block; height: 100%; background: var(--mc); border-radius: 4px; transition: width .2s; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.25); }
.sg-rank .ps { text-align: right; font-variant-numeric: tabular-nums; }
.sg-rank.is-cur { font-size: 13px; }

.dice-dock { display: flex; align-items: center; gap: 16px; margin-top: auto; padding-top: 4px; }
.die3d { width: 84px; height: 84px; flex: none; border-radius: 18px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 13px; box-sizing: border-box; gap: 3px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 7px 0 rgba(0,0,0,.35); transition: transform .1s; }
.die3d i { border-radius: 50%; margin: 2px; }
.die3d i.on { background: #141210; }
.die3d i.on:nth-child(5):only-of-type { background: #e8202a; }
.die3d em { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 40px; color: #141210; }
.die3d:not(:disabled) { animation: wiggle 2.4s ease-in-out infinite; }
.die3d:active:not(:disabled) { transform: translateY(5px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 2px 0 rgba(0,0,0,.35); }
.die3d.roll { animation: tumble .3s linear infinite; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(180deg) translateY(-10px); } 100% { transform: rotate(360deg) translateY(0); } }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(7deg); } 95% { transform: rotate(-4deg); } }
.dice-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dice-txt b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; }

.sg-sheet-back { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.35); animation: fade .2s; }
.sg-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 560px; margin: 0 auto; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: var(--bg); border-radius: 24px 24px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.35), 0 0 0 4px var(--pc); animation: sheetUp .38s cubic-bezier(.2,1.2,.4,1); }
.sg-sheet.flipped { top: 0; bottom: auto; border-radius: 0 0 24px 24px; transform: rotate(180deg); animation: none; }
.sg-sheet .deck { min-height: 230px; }
.sg-sheet .odai .txt { font-size: clamp(24px, 7vw, 34px); }
@keyframes sheetUp { from { transform: translateY(100%); } }

/* ---------- result ---------- */
.res-head { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 14vw, 68px); line-height: 1; margin: 18px 0 0; color: var(--blood); }
.res-sub { margin: 0; color: var(--muted); font-weight: 700; }
.mvp { padding: 22px 18px; border-radius: 20px; background: var(--yuru); color: var(--ink); display: flex; flex-direction: column; gap: 4px; animation: flipIn .7s cubic-bezier(.2,1.3,.4,1) both; box-shadow: 0 10px 0 rgba(0,0,0,.35); }
.mvp small { font-size: 11px; letter-spacing: .24em; font-weight: 900; }
.mvp b { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 11vw, 48px); line-height: 1.1; overflow-wrap: anywhere; }
.mvp span { font-weight: 700; }
.res-h2 { margin: 6px 0 -4px; font-size: 12px; letter-spacing: .22em; color: var(--muted); font-weight: 900; }
.titles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.titles li { padding: 12px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; animation: flipIn .6s cubic-bezier(.2,1.3,.4,1) var(--d, 0s) both; }
.titles small { color: var(--yuru); font-weight: 900; font-size: 12px; }
.titles b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.titles span { color: var(--muted); font-size: 11px; font-weight: 700; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 28px 14px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-weight: 900; }
.rank .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.rank .pc { border-color: transparent; }
.rank .ct { font-family: var(--display); font-variant-numeric: tabular-nums; }
.result .big { background: var(--paper); color: var(--ink); }

/* ---------- モダン化 ---------- */
/* 画面切り替え */
#app.enter-fwd { animation: enterFwd .32s cubic-bezier(.2,.9,.3,1); }
#app.enter-back { animation: enterBack .32s cubic-bezier(.2,.9,.3,1); }
@keyframes enterFwd { from { transform: translateX(28px); opacity: 0; } }
@keyframes enterBack { from { transform: translateX(-28px); opacity: 0; } }

/* 上のバー：罰スコアの顔アイコン列 */
.bar { align-items: center; }
.score { display: flex; gap: 10px; flex: 1; min-width: 0; overflow-x: auto; padding: 10px 10px 10px 8px; margin: -4px 0; scrollbar-width: none; }
.score::-webkit-scrollbar { display: none; }
.av { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--mc); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 0 0 2px var(--ink); transition: transform .2s; }
.av.is-turn { transform: scale(1.08); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--bg), 0 0 0 6px var(--fg); }
.av .cnt { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #e8202a; color: #fff; font-size: 11px; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.av .rv { position: absolute; bottom: -5px; right: -5px; font-style: normal; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.av.sm { width: 22px; height: 22px; font-size: 11px; box-shadow: none; }
.menu-btn { width: 42px; height: 42px; border-radius: 50%; }
.menu-btn svg { width: 20px; height: 20px; }
.sheet.menu { gap: 8px; }
.menu-meta { margin: 0 0 4px; font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--muted); }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(247,243,234,.06); text-align: left; font-weight: 900; font-size: 16px; }
.menu-item svg { width: 22px; height: 22px; flex: none; }
.menu-item span { flex: 1; }
.menu-item small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.menu-item b { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(247,243,234,.1); }
.menu-item.danger { color: #ff6b62; }

/* 次の番の予告 */
.next-up { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--muted); }
.next-up svg { width: 14px; height: 14px; }
.next-up .av { margin-left: 2px; }

/* 山札（札の後ろにカードが重なって見える） */
.deck { position: relative; isolation: isolate; }
.deck::before, .deck::after { content: ""; position: absolute; left: 12px; right: 12px; top: 14px; bottom: -2px; border-radius: 22px; background: var(--card-bg); z-index: -1; }
.deck::before { transform: rotate(1.6deg) translateY(5px); opacity: .5; }
.deck::after { transform: rotate(-1.2deg) translateY(9px); opacity: .28; }
.odai { position: relative; z-index: 1; }

/* メンバー入力 */
.add1 { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.add1 input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 15px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(247,243,234,.06); color: var(--paper); }
.add1 input:focus { border-color: var(--yuru); outline: none; }
.add1 input::placeholder { color: var(--muted); }
.add-btn { width: 54px; border-radius: 14px; background: var(--yuru); color: var(--ink); display: grid; place-items: center; }
.add-btn svg { width: 24px; height: 24px; }
.mem-head { display: flex; justify-content: space-between; align-items: center; }
.text-btn { font-size: 12px; font-weight: 900; color: var(--futsu); padding: 6px 4px; }
.mem .nm { text-align: left; min-width: 0; padding: 2px 0; }
.mem .nm span { color: var(--muted); }
.mem .x { display: grid; place-items: center; }
.mem .x svg { width: 18px; height: 18px; }
.mem.editing { border-color: var(--yuru); grid-template-columns: 34px minmax(0,1fr) auto; }
.mem.editing input { width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(247,243,234,.08); color: var(--paper); }
.ok-btn { padding: 10px 14px; border-radius: 10px; background: var(--yuru); color: var(--ink); font-weight: 900; }
.groups { display: flex; flex-direction: column; gap: 8px; }
.group { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); text-align: left; font-weight: 900; font-size: 14px; color: var(--paper); }
.group svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.group span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 結果のシェア */
.result { display: flex; flex-direction: column; gap: 16px; }
.share-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #ff5d8f, #ff9a3c); color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.share-btn svg { width: 22px; height: 22px; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== 夜モード：ネオン看板 ===== */
@keyframes neonFlicker { 0%, 18%, 20.5%, 23%, 61%, 63.5%, 100% { opacity: 1; } 19%, 22%, 62% { opacity: .42; } }
@keyframes neonOn { 0% { opacity: .2; } 8% { opacity: 1; } 12% { opacity: .3; } 20%, 100% { opacity: 1; } }
.neon-text { color: #fff; text-shadow: 0 0 2px #fff, 0 0 8px var(--nc), 0 0 18px var(--nc), 0 0 36px var(--nc); }
/* ホーム：夜モード中はロゴがネオン管になって、背景は暗い壁 */
body.night-home { --nc: var(--night); background-color: #0b0812; background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px); background-size: 52px 26px, 26px 26px; }
body.night-home.deep { --nc: var(--deep); }
.logo.is-night, .logo.is-deep, .night-title { color: #fff; text-shadow: 0 0 2px #fff, 0 0 8px var(--nc, var(--night)), 0 0 20px var(--nc, var(--night)), 0 0 44px var(--nc, var(--night)); animation: neonFlicker 7s infinite; }
.logo.is-deep { --nc: var(--deep); }
.logo.is-night .logo-btn, .logo.is-deep .logo-btn { text-shadow: inherit; }
body.night-home .catch { color: var(--nc); text-shadow: 0 0 8px var(--nc); }
/* ゲーム中：夜お題・深夜お題が出たら店の照明が落ちてネオン看板になる */
body.stage { transition: background-color .45s ease; }
body.stage.neon { --nc: var(--night); --bg: #0b0812; --fg: #f4ecff; --muted: rgba(244,236,255,.62); --chip: rgba(244,236,255,.1); --line: rgba(244,236,255,.2);
  background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px); background-size: 52px 26px, 26px 26px; }
body.stage.neon.deep { --nc: var(--deep); }
body.stage.neon .deck::before, body.stage.neon .deck::after { background: color-mix(in srgb, var(--nc) 22%, #0b0812); }
body.stage.neon .turn em { color: #fff; text-shadow: 0 0 8px var(--nc), 0 0 22px var(--nc); }
.odai.yoru, .odai.deep { --card-bg: #120c1d; --card-fg: #fff; box-shadow: 0 0 0 2px var(--nc), 0 0 16px color-mix(in srgb, var(--nc) 60%, transparent), inset 0 0 18px color-mix(in srgb, var(--nc) 35%, transparent); }
.odai.yoru { --nc: var(--night); } .odai.deep { --nc: var(--deep); }
.odai.yoru.in, .odai.deep.in { animation: flipIn .5s cubic-bezier(.2,1.3,.4,1) both, neonOn .9s linear both; }
.odai.yoru .head, .odai.deep .head { opacity: 1; color: var(--nc); text-shadow: 0 0 6px var(--nc); }
.odai.yoru .txt, .odai.deep .txt { text-shadow: 0 0 10px color-mix(in srgb, var(--nc) 45%, transparent); }
.odai.yoru .txt mark, .odai.deep .txt mark { background: none; color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px var(--mc), 0 0 24px var(--mc); text-decoration: none; }
body.stage.neon .big { background: transparent; color: #fff; border: 2px solid var(--nc); text-shadow: 0 0 8px var(--nc); box-shadow: 0 0 14px color-mix(in srgb, var(--nc) 55%, transparent), inset 0 0 14px color-mix(in srgb, var(--nc) 30%, transparent); }
body.stage.neon .big.has-pen { background: var(--nc); color: #0b0812; text-shadow: none; }
body.stage.neon .sub-acts button { border-color: color-mix(in srgb, var(--nc) 60%, transparent); }

/* ===== 押した感触：沈んで、ぷにっと戻る ===== */
button { transition: transform .26s cubic-bezier(.3, 1.8, .5, 1), box-shadow .2s ease, background-color .2s ease, opacity .2s ease; }
button:active:not(:disabled) { transform: scale(.95); transition-duration: .06s; }
.big:active:not(:disabled) { transform: translateY(4px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.28); transition-duration: .06s; }
.mode:active { transform: translateY(4px) scale(.985); transition-duration: .06s; }
.die3d:active:not(:disabled) { transform: translateY(5px) scale(.97); transition-duration: .06s; }
.logo-btn:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) {
  .logo.is-night, .logo.is-deep, .night-title, .odai.yoru.in, .odai.deep.in { animation: none; }
  button, button:active:not(:disabled) { transition: none; }
}

/* ===== ゲーム中は1画面に固定（スクロールしない・引っ張っても動かない） ===== */
html, body { overscroll-behavior: none; }
html:has(body.stage) { overflow: hidden; }
body.stage { height: 100vh; height: var(--app-h, 100dvh); overflow: hidden; }
body.stage #app { height: 100vh; height: var(--app-h, 100dvh); min-height: 0; overflow: hidden; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
body.stage #stage { min-height: 0; gap: 10px; }
body.stage #stage .deck { min-height: 0; flex: 1 1 0; }
body.stage .odai { min-height: 0; overflow: hidden; }
body.stage .odai .txt { min-height: 0; overflow: hidden; }
body.stage .odai .gacha { overflow-y: auto; min-height: 0; flex: 1; }
/* すごろく：盤は残りの高さに収まるサイズに */
/* すごろく盤は横幅いっぱい、縦は残りの高さいっぱいまで伸ばす（マスは縦長になってもOK、伸ばしすぎない） */
body.stage .sugo2 .sg-board { flex: 1 1 0; min-height: 0; width: 100%; aspect-ratio: auto !important; max-height: calc((100vw - 32px) * var(--rows) / 6 * 1.5); }
body.stage .sugo2 .c-start b { font-size: clamp(9px, 2.6vw, 13px); white-space: nowrap; letter-spacing: -.02em; }
/* 背の低いスマホ・人数が多い時は詰める */
@media (max-height: 740px) {
  body.stage .turn em { font-size: clamp(30px, 9vw, 40px); }
  body.stage .turn .who { height: 40px; }
  body.stage .pen-tile { min-height: 50px; }
  body.stage .big { padding: 14px; font-size: 20px; }
}
body.stage .pen-grid.many .pen-tile { min-height: 46px; padding-block: 5px; }
body.stage .pen-grid.many { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
body.stage .pen-grid.many .doer-lbl { display: none; }
@media (max-height: 740px) { body.stage .sg-sheet .deck { min-height: 160px; } }
body.stage .sg-ranks.many { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }

/* ===== 隠しモードのヒント ===== */
@keyframes whisperIn { from { opacity: 0; transform: translateY(4px); } to { opacity: .8; transform: none; } }
@keyframes whisperPulse { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
.whisper { margin: 10px 0 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--night); letter-spacing: .06em; animation: whisperIn .8s ease .6s both, whisperPulse 3.2s ease-in-out 1.4s infinite; }
.whisper.deep { color: var(--deep); }
.whisper svg, .tip svg { width: 14px; height: 14px; flex: none; }
.tip { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
/* ロゴ連打で震える */
@keyframes tease { 0%, 100% { transform: none; } 25% { transform: rotate(-2deg) translateX(-2px); } 75% { transform: rotate(2deg) translateX(2px); } }
.logo.tease { animation: tease .2s ease 2; }
.logo.tease .logo-btn { text-shadow: 0 0 10px var(--night), 0 0 30px var(--night); }
.logo.is-night.tease .logo-btn { text-shadow: 0 0 2px #fff, 0 0 12px var(--deep), 0 0 34px var(--deep); }
/* 深夜の確認画面 */
.night-ask.deep .h2 { color: var(--deep); }
.night-title.is-deep { --nc: var(--deep); }
.night-ask.deep .big { background: var(--deep); color: var(--ink); }
.night-switch { display: flex; flex-direction: column; gap: 10px; }
.night-switch .night-lv button[data-v="shinya"] { border-color: var(--deep); }

/* ===== やった／できんかった の2択 ===== */
.verdict { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.vd { border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
.vd b { font-family: var(--display); font-weight: 400; font-size: clamp(17px, 5.4vw, 22px); white-space: nowrap; line-height: 1.15; }
.vd small { font-size: 12px; font-weight: 900; opacity: .8; }
.vd.ok { background: var(--fg); color: var(--bg); }
.vd.ng { background: #e8202a; color: #fff; }
body[data-level="jigoku"] .vd.ng { background: var(--blood); color: #000; }
body[data-level="jigoku"] .vd.ok { background: transparent; color: var(--blood); border: 2px solid var(--blood); }
.vd small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
body.stage.neon .vd.ok { background: transparent; color: #fff; border: 2px solid var(--nc); box-shadow: 0 0 14px color-mix(in srgb, var(--nc) 55%, transparent); }
.vd:active { transform: translateY(4px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.28); transition-duration: .06s; }
.swipe-hint { margin: -2px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 900; color: var(--muted); letter-spacing: .08em; }
.swipe-hint .link { margin-inline: auto; }
.link { font-size: 12px; font-weight: 900; text-decoration: underline; text-underline-offset: 3px; color: var(--fg); opacity: .8; padding: 6px 4px; }
/* スワイプ中の札 */
#card { touch-action: pan-y; }
#card.dragging { transition: none !important; animation: none !important; user-select: none; }
.sw-stamp { position: absolute; top: 46px; font-style: normal; font-family: var(--display); font-size: 30px; padding: 4px 14px; border: 4px solid; border-radius: 10px; pointer-events: none; z-index: 3; opacity: 0; }
.sw-stamp.ok { left: 18px; color: #1aa64b; transform: rotate(-12deg); opacity: var(--ok, 0); }
.sw-stamp.ng { right: 18px; color: #e8202a; transform: rotate(12deg); opacity: var(--ng, 0); }

/* ===== ルール違反 ===== */
.rule span { flex: 1; min-width: 0; }
.rule .rule-txt { display: flex; flex-direction: column; gap: 2px; line-break: strict; }
.rule .rule-txt > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rule .rule-txt em { font-style: normal; margin-left: 8px; opacity: .7; }
.rule + .rule { margin-top: -8px; }
.rule .nowrap { white-space: nowrap; }
.rule-out { flex: none; padding: 8px 10px; border-radius: 999px; background: #e8202a; color: #fff; font-size: 12px; font-weight: 900; white-space: nowrap; }
body[data-level="jigoku"] .rule-out { background: var(--blood); color: #000; }
.rule-sheet { --muted: rgba(247,243,234,.62); }
.rule-sheet .h2 { color: #ff6b6b; margin: 0; }
.rule-sheet .chip { background: rgba(247,243,234,.08); color: var(--paper); }
.rule-sheet h2 { margin: 4px 0 0; font-size: 18px; }
.rule-now { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.rule-sheet .skull-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
.rule-sheet .skull-wrap b { font-family: var(--display); font-weight: 400; font-size: 24px; color: #ff3b3b; }
.rule-sheet.lucky .skull-wrap b { color: var(--yuru); }
.rule-sheet .skull-wrap svg { width: 84px; height: 84px; }
.rule-pen { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.45; text-align: center; }
.rule-sheet .big { background: var(--paper); color: var(--ink); }

/* ===== 分かりやすさ ===== */
.odai .head .tag { font-style: normal; display: inline-block; margin-right: 8px; padding: 2px 8px; border-radius: 999px; background: currentColor; letter-spacing: .06em; }
.odai .head .tag { color: inherit; background: color-mix(in srgb, currentColor 14%, transparent); border: 1px solid color-mix(in srgb, currentColor 45%, transparent); }
.coach { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 700; line-height: 1.5; position: relative; animation: rise .3s cubic-bezier(.2,1.2,.4,1); }
.coach::before { content: ""; position: absolute; top: -6px; left: 28px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); }
.coach span { flex: 1; }
.coach button { flex: none; padding: 8px 12px; border-radius: 999px; background: var(--yuru); color: var(--ink); font-size: 12px; font-weight: 900; }
body[data-level="jigoku"] .coach { background: #2a0d0d; border: 1px solid var(--blood); }
body.stage.neon .coach { background: #1a1228; border: 1px solid var(--nc); }
.rules { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.rules div { padding: 10px 12px; border-radius: 12px; background: rgba(247,243,234,.06); }
.rules dt { font-weight: 900; color: var(--yuru); font-size: 14px; }
.rules dd { margin: 2px 0 0; font-size: 13px; line-height: 1.6; color: rgba(247,243,234,.85); }
.rules-sheet h2 { margin: 0; }
.rank .nm { display: flex; flex-direction: column; min-width: 0; }
.rank .nm small { font-size: 11px; font-weight: 700; color: var(--muted); }

/* START のコマは小さく下に並べる */
.sg-tok { scale: var(--s, 1); }
.c-start .in { align-content: start; padding-top: 10px; }
.c-text b { white-space: nowrap; }
/* 遊び方1枚目：札とセーフ／アウト */
.tut-play { display: flex; flex-direction: column; gap: 10px; width: min(100%, 260px); }
.tut-play .mini-card { position: relative; width: 100%; aspect-ratio: auto; min-height: 150px; transform: none; }
.tut-play .tag { font-style: normal; padding: 1px 7px; border: 1px solid currentColor; border-radius: 999px; opacity: .7; }
.swipe-arrows { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; font-weight: 900; opacity: .5; }
.swipe-arrows em { font-style: normal; }
.mini-verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-verdict span { border-radius: 12px; padding: 10px 6px; text-align: center; font-family: var(--display); font-size: 17px; line-height: 1.2; }
.mini-verdict small { display: block; font-family: var(--body); font-size: 10px; font-weight: 900; opacity: .8; }
.mini-verdict .ng { background: #e8202a; color: #fff; }
.mini-verdict .ok { background: var(--paper); color: var(--ink); }
/* メンバー登録の初回説明 */
.home-coach { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: rgba(255,210,63,.1); border: 1px solid rgba(255,210,63,.4); font-size: 13px; line-height: 1.6; font-weight: 700; }
.home-coach b { color: var(--yuru); }
.home-coach ol { margin: 0; padding-left: 1.3em; }
.home-coach button { align-self: flex-end; padding: 8px 14px; border-radius: 999px; background: var(--yuru); color: var(--ink); font-size: 12px; font-weight: 900; }

/* =====================================================================
   v2：見やすさの土台
   - 背景はどの地獄度も暗い色にそろえて、地獄度の色は札の縁と上の帯だけ
   - 太い字体はお題と名前だけ。ほかは普通の太字・字間なし
   - ボタンは「塗り（大事）」「枠（次に大事）」「文字リンク（たまに）」の3種類
   ===================================================================== */
body.stage[data-level] { --bg: #141210; --fg: var(--paper); --muted: rgba(247,243,234,.66); --chip: rgba(247,243,234,.08); --line: rgba(247,243,234,.2); }
body.stage[data-level="yurume"] { --acc: var(--yuru); --card-edge: var(--yuru); }
body.stage[data-level="futsu"]  { --acc: var(--futsu); --card-edge: var(--futsu); }
body.stage[data-level="jigoku"] { --acc: var(--blood); --card-edge: var(--blood); --fg: var(--paper); --muted: rgba(247,243,234,.66); }
.frame { box-shadow: inset 0 0 0 3px var(--pc); }
.odai { box-shadow: 0 0 0 3px var(--card-edge); }
/* 札の上の1行：誰の番か＋種類 */
.odai .head { opacity: 1; letter-spacing: .02em; font-size: 12px; align-items: center; }
.odai .head .meta { display: flex; align-items: center; gap: 6px; min-width: 0; opacity: .7; }
.odai .head .kind { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.odai .head .tag { margin: 0; }
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.who i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 30%, transparent); }
.who b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { font-size: 13px; font-weight: 900; white-space: nowrap; }
/* 文字：字間を詰めて、小さすぎ・薄すぎをなくす */
.h2, .res-h2, .menu-meta { letter-spacing: .04em; font-size: 13px; }
.catch { letter-spacing: .08em; }
.step-dots { letter-spacing: .04em; font-size: 12px; }
.pen-q span, .hint, .swipe-hint { letter-spacing: .02em; font-size: 12px; }
.rule b { letter-spacing: .02em; }
.big { font-family: var(--body); font-weight: 900; font-size: 19px; }
.vd b { font-family: var(--body); font-weight: 900; font-size: 20px; }
.choice.hot { font-family: var(--body); font-weight: 900; font-size: 17px; }
.dice-txt b { font-family: var(--body); font-weight: 900; font-size: 18px; }
.dice-txt .who b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.mode b { font-family: var(--body); font-weight: 900; font-size: 22px; }
.mode .go { font-family: var(--body); font-weight: 900; font-style: normal; }
.mode-ic { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(20,18,16,.08); }
.mode-ic svg { width: 24px; height: 24px; }
.mode { grid-template-columns: auto minmax(0,1fr) auto; }
.mode b, .mode span { grid-column: 2; }
.mode .go { grid-column: 3; }
/* ボタン：枠だけ（2番目に大事） */
.sub-acts button, .sub-acts .revenge { background: transparent; border: 1.5px solid rgba(247,243,234,.35); border-radius: 12px; font-size: 14px; }
.sub-acts .revenge { border-color: var(--acc, var(--fg)); }
.choice { background: transparent; border: 1.5px solid rgba(247,243,234,.35); }
.choice.hot { background: var(--fg); color: var(--bg); border-color: transparent; }
.ghost { border-width: 1.5px; }
.rule-out { background: transparent; color: #ff7a7a; border: 1.5px solid #ff7a7a; }
.coach { background: #26221e; border: 1px solid rgba(255,210,63,.35); }
.coach::before { background: #26221e; border-left: 1px solid rgba(255,210,63,.35); border-top: 1px solid rgba(255,210,63,.35); }
/* 準備画面の番号つき見出し */
.step-h { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 900; color: var(--paper); }
.step-h .num { color: var(--yuru); }
.step-h small { font-size: 12px; font-weight: 700; color: var(--muted); }
.home-coach { font-size: 14px; }
.ghost-sub { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
/* 倍プッシュのコイン・爆弾の絵は、お題の文と一緒に札の真ん中へ */
.odai .coin-wrap, .odai .bomb-art { margin-top: auto; }
.odai .coin-wrap + .txt, .odai .bomb-art + .txt { flex: 0 1 auto; margin-top: auto; margin-bottom: auto; }
.night-lv.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.night-lv button[data-v="off"] { border-color: rgba(247,243,234,.35); }
/* 札の上の行：名前は切らさず、種類・タグ・バッジは入りきらん時だけ2行目へ */
.odai .head { flex-wrap: wrap; row-gap: 6px; }
.odai .head .who { flex: 1 0 auto; white-space: nowrap; max-width: 100%; overflow: hidden; }
.odai .head .who b { min-width: 0; flex-shrink: 1; }
.odai .head .who small { flex: none; }
/* 日本語の改行ルール：小さい「ュ」「ッ」や「。」が行の頭に来んようにする */
.odai .txt, .gacha-txt p, .rule-pen, .mini-card b, .coach span, .rule span { line-break: strict; }
.odai .head .meta { margin-left: auto; flex: 0 1 auto; max-width: 100%; }
.tag, .badge { white-space: nowrap; flex: none; }
.pen-tile .nm { font-size: 15px; }
/* ---------- NGワード・ぶっちゃけ投票 ---------- */
.mode { padding-top: 14px; padding-bottom: 14px; }
.mode[disabled] { opacity: .45; box-shadow: none; }
.mode-card { gap: 12px; overflow: hidden; }
.mode-card.center { align-items: center; justify-content: center; text-align: center; }
.mode-card .head { width: 100%; }
.how { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; font-weight: 700; line-break: strict; }
.how b { font-weight: 900; }
.how-note { margin: 0; font-size: 12px; font-weight: 700; opacity: .65; line-height: 1.5; line-break: strict; }
.ng-min-wrap { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.ng-min-h { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: .1em; opacity: .65; }
.ng-min { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.ng-min button { padding: 11px 0; border-radius: 12px; border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent); font-weight: 900; font-size: 15px; white-space: nowrap; }
.ng-min button[aria-pressed="true"] { background: var(--card-fg); color: var(--card-bg); border-color: transparent; }
.prog { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .08em; opacity: .65; line-break: strict; }
.hand-who { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hand-dot { width: 72px; height: 72px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-family: var(--display); font-size: 34px; }
