.sg-arrow::before { content: ""; position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #ffd23f; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.sg-arrow::after { content: ""; position: absolute; left: -4px; top: -4px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid #141210; }
.sg-cell { position: absolute; box-sizing: border-box; padding: 4px; }
.sg-cell .in { width: 100%; height: 100%; box-sizing: border-box; border-radius: 12px; background: var(--card-bg); color: var(--card-fg); display: grid; place-items: center; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.sg-cell .no { position: absolute; left: 5px; top: 3px; font-size: 9px; font-weight: 900; opacity: .45; font-variant-numeric: tabular-nums; }
.sg-cell b { font-family: var(--display); font-weight: 400; font-size: clamp(11px, 3.6vw, 17px); line-height: 1.05; text-align: center; padding: 0 2px; overflow-wrap: anywhere; }
.c-odai b { font-family: var(--body); font-weight: 900; font-size: clamp(10px, 2.8vw, 13px); opacity: .55; }
.c-text b { font-family: var(--body); font-weight: 900; font-size: clamp(8px, 2.4vw, 11px); }
.c-plus .in { background: #3fd16b; color: #062a12; }
.c-minus .in { background: #ff5a4f; color: #fff; }
.c-skip .in { background: #7b8db8; color: #fff; }
.c-swap .in { background: #b69cff; color: #1c1328; }
.c-event .in { background: repeating-linear-gradient(-45deg, #ffd23f 0 6px, #141210 6px 12px); color: #141210; }
.c-event b { background: #ffd23f; border-radius: 8px; padding: 0 6px; }
.c-text .in { background: #ff9a3c; color: #2a1200; }
.c-start .in { background: var(--ink); color: var(--paper); }
.c-goal .in { background: conic-gradient(#141210 25%, #fff 0 50%, #141210 0 75%, #fff 0) 0 0 / 14px 14px; }
.c-goal b, .c-start b { font-size: clamp(10px, 3vw, 14px); }
.c-goal b { background: var(--yuru); color: var(--ink); border-radius: 6px; padding: 2px 4px; }
body[data-level="jigoku"] .sg-cell .in { box-shadow: 0 0 0 1px rgba(255,42,42,.3); }

.sg-tok { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--mc); color: var(--ink); font-weight: 900; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 2.5px var(--ink), 0 4px 0 rgba(0,0,0,.35); transition: left .24s ease, top .24s ease; z-index: 2; }
.sg-tok.is-cur { width: 32px; height: 32px; margin: -16px 0 0 -16px; font-size: 15px; z-index: 3; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--mc), 0 5px 0 rgba(0,0,0,.35); animation: pulse 1.2s ease-in-out infinite; }
.sg-tok.hop { animation: hopUp .26s ease-out; }
@keyframes hopUp { 50% { transform: translateY(-14px) scale(1.12); } }
@keyframes pulse { 50% { transform: scale(1.08); } }

.sg-ranks { display: flex; flex-direction: column; gap: 4px; }
.sg-rank { display: grid; grid-template-columns: minmax(0, 5em) minmax(0,1fr) 3em; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; }
.sg-rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-rank .nm small { margin-left: 4px; font-size: 9px; padding: 1px 4px; border-radius: 4px; background: var(--fg); color: var(--bg); }
.sg-rank .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.sg-rank .bar i { display: block; height: 100%; background: var(--mc); border-radius: 4px; transition: width .2s; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.25); }
.sg-rank .ps { text-align: right; font-variant-numeric: tabular-nums; }
.sg-rank.is-cur { font-size: 13px; }

.dice-dock { display: flex; align-items: center; gap: 16px; margin-top: auto; padding-top: 4px; }
.die3d { width: 84px; height: 84px; flex: none; border-radius: 18px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 13px; box-sizing: border-box; gap: 3px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 7px 0 rgba(0,0,0,.35); transition: transform .1s; }
.die3d i { border-radius: 50%; margin: 2px; }
.die3d i.on { background: #141210; }
.die3d i.on:nth-child(5):only-of-type { background: #e8202a; }
.die3d em { grid-column: 1 / -1; grid-row: 1 / -1; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 40px; color: #141210; }
.die3d:not(:disabled) { animation: wiggle 2.4s ease-in-out infinite; }
.die3d:active:not(:disabled) { transform: translateY(5px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), 0 2px 0 rgba(0,0,0,.35); }
.die3d.roll { animation: tumble .3s linear infinite; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(180deg) translateY(-10px); } 100% { transform: rotate(360deg) translateY(0); } }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(7deg); } 95% { transform: rotate(-4deg); } }
.dice-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dice-txt b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; }

.sg-sheet-back { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.35); animation: fade .2s; }
.sg-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; max-width: 560px; margin: 0 auto; max-height: 88%; overflow-y: auto; box-sizing: border-box; background: var(--bg); border-radius: 24px 24px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.35), 0 0 0 4px var(--pc); animation: sheetUp .38s cubic-bezier(.2,1.2,.4,1); }
.sg-sheet.flipped { top: 0; bottom: auto; border-radius: 0 0 24px 24px; transform: rotate(180deg); animation: none; }
.sg-sheet { min-height: min(76%, 640px); }
.sg-sheet .deck { min-height: 230px; flex: 1 1 auto; display: flex; flex-direction: column; }
.sg-sheet .deck > .odai { flex: 1 1 auto; }
.sg-sheet .odai .txt { font-size: clamp(24px, 7vw, 34px); }
@keyframes sheetUp { from { transform: translateY(100%); } }

/* ---------- result ---------- */
.res-head { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 14vw, 68px); line-height: 1; margin: 18px 0 0; color: var(--blood); }
.res-sub { margin: 0; color: var(--muted); font-weight: 700; }
.mvp { padding: 22px 18px; border-radius: 20px; background: var(--yuru); color: var(--ink); display: flex; flex-direction: column; gap: 4px; animation: flipIn .7s cubic-bezier(.2,1.3,.4,1) both; box-shadow: 0 10px 0 rgba(0,0,0,.35); }
/* 結果発表：左上の戻るボタンと、下の「遊び方を選ぶ」「メンバーを変える」 */
.res-back { position: absolute; top: 14px; left: 0; z-index: 5; width: 40px; height: 40px; border-radius: 50%; background: rgba(247,243,234,.1); }
.res-back svg { width: 20px; height: 20px; }
.result { position: relative; }
.result .row2 .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.result .row2 .ghost svg { width: 18px; height: 18px; }
.res-link { align-self: center; padding: 6px 12px; font-size: 13px; font-weight: 900; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.result.wait:not(.landed) .res-back { visibility: visible; }
/* 結果発表：放射光の上に、リボンの見出し・表彰台・MVP */
.res-hero { position: relative; isolation: isolate; margin: 0 -16px; padding: 18px 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; text-align: center; }
.rays { position: absolute; inset: -40% -40% auto; height: 180%; z-index: -1; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(232,32,42,.22) 0 9deg, transparent 9deg 18deg); -webkit-mask: radial-gradient(circle at 50% 50%, #000 0, transparent 62%); mask: radial-gradient(circle at 50% 50%, #000 0, transparent 62%); animation: raySpin 30s linear infinite; }
@keyframes raySpin { to { transform: rotate(360deg); } }
.res-hero .res-sub { font-size: 12px; }
.res-head { margin: 0; }
.res-head span { display: inline-block; padding: 6px 22px 10px; background: var(--blood); color: #fff; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,.4); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); font-size: clamp(36px, 11vw, 54px); }
.podium { width: 100%; display: grid; align-items: end; gap: 8px; margin-top: 8px; }
.podium.n3 { grid-template-columns: 1fr 1.15fr 1fr; }
.podium.n2 { grid-template-columns: 1fr 1.15fr; }
.podium.n1 { grid-template-columns: 1fr; max-width: 200px; }
.pod { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; position: relative; }
.pod-skull { position: relative; width: 74px; margin-bottom: -6px; }
.pod-skull .skull { width: 74px; height: 74px; animation: skullBob 1.4s ease-in-out infinite; }
.pod-skull .crown { position: absolute; top: -14px; left: 50%; width: 40px; height: 27px; transform: translateX(-50%) rotate(-8deg); z-index: 2; animation: none; }
@keyframes skullDrop { from { transform: translateY(-60px) scale(.3) rotate(-30deg); opacity: 0; } }
.pod-av { width: 52px; height: 52px; border-radius: 50%; background: var(--mc); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 21px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--mc); animation: skullIn .5s var(--d) cubic-bezier(.3,1.6,.5,1) both; }
.pod.first .pod-av { width: 64px; height: 64px; font-size: 26px; }
.pod-nm { font-family: var(--display); font-weight: 400; font-size: clamp(15px, 4.4vw, 19px); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: reveal .3s calc(var(--d) + .2s) both; }
.pod-block { width: 100%; border-radius: 12px 12px 4px 4px; background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 85%, #fff), var(--mc)); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 6px 0 rgba(0,0,0,.35); animation: podUp .55s var(--d) cubic-bezier(.3,1.4,.5,1) both; transform-origin: bottom; }
.pod-block em { font-style: normal; font-family: var(--display); font-size: 30px; line-height: 1; }
.pod-block span { font-size: 12px; font-weight: 900; opacity: .75; }
.pod.p1 .pod-block { height: 104px; }
.pod.p2 .pod-block { height: 76px; }
.pod.p3 .pod-block { height: 56px; }
@keyframes podUp { from { transform: scaleY(0); } }
.res-hero .mvp { width: 100%; box-sizing: border-box; padding: 12px 16px; flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 10px; text-align: center; }
.res-hero .mvp small { width: 100%; }
.res-hero .mvp b { font-size: clamp(26px, 8vw, 36px); }
.res-safe { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 6px; }
.res-safe b { font-family: var(--display); font-weight: 400; font-size: 36px; color: var(--yuru); }
.res-safe span { color: var(--muted); font-weight: 700; }
/* 称号：メダルつきのバッジ */
.titles li { flex-direction: row !important; align-items: center; gap: 10px !important; }
.titles li > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.medal { width: 38px; height: 38px; flex: none; color: var(--fg, #f7f3ea); }
.medal svg { width: 100%; height: 100%; }
/* 罰ランキング：顔アイコン・名前・バー・数 */
.rank li { grid-template-columns: 26px 34px minmax(0,1fr) minmax(48px, 30%) 30px !important; animation: reveal .35s var(--d) both; }
.rank .no { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: rgba(247,243,234,.1); color: var(--fg) !important; }
.rank .no.top { background: var(--blood); color: #fff !important; }
.r-av { width: 32px; height: 32px; border-radius: 50%; background: var(--mc); color: var(--ink); display: grid; place-items: center; font-size: 14px; }
.r-bar { height: 12px; border-radius: 6px; background: rgba(247,243,234,.1); overflow: hidden; }
.r-bar i { display: block; height: 100%; width: var(--w); border-radius: 6px; background: var(--mc); animation: grow .7s calc(var(--d) + .2s) cubic-bezier(.3,1.2,.5,1) both; }
.rank .ct { text-align: right; font-size: 20px; }
/* 結果発表：名前がスロットで回って、止まったら揺れる */
.mvp[data-slot] b { font-variant-numeric: tabular-nums; }
.mvp.landed { animation: mvpLand .7s cubic-bezier(.3,1.7,.5,1) both; }
@keyframes mvpLand { 0% { transform: scale(1.18) rotate(-3deg); } 40% { transform: scale(.96) rotate(2deg); } 70% { transform: scale(1.03) rotate(-1deg); } 100% { transform: none; } }
.result.landed .res-head { animation: jolt .5s both; }
/* 名前が止まるまで、下の称号やランキング（答えがバレる所）は隠しとく */
.result.wait > :not(.res-hero) { visibility: hidden; }
.result.wait.landed > :not(.res-hero) { visibility: visible; animation: reveal .5s .2s ease-out both; }
.result.wait:not(.landed) .pod.first .real { display: none; }
.result:not(.wait) .pod .q, .result.landed .pod .q { display: none; }
.result.wait:not(.landed) .pod-skull { opacity: 0; }
.result.wait.landed .pod-skull { animation: skullDrop .6s cubic-bezier(.3,1.6,.5,1) both; }
.result.wait:not(.landed) .pod.first .pod-block { height: 30px; }
.result.wait.landed .pod.first .pod-block { transition: height .5s cubic-bezier(.3,1.5,.5,1); }
.result.wait .mvp span { visibility: hidden; }
.result.wait.landed .mvp span { visibility: visible; animation: reveal .4s both; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -20px; border-radius: 2px; animation: confFall var(--t) var(--d) cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes confFall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }
.mvp small { font-size: 11px; letter-spacing: .24em; font-weight: 900; }
.mvp b { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 11vw, 48px); line-height: 1.1; overflow-wrap: anywhere; }
.mvp span { font-weight: 700; }
.res-h2 { margin: 6px 0 -4px; font-size: 12px; letter-spacing: .22em; color: var(--muted); font-weight: 900; }
.titles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.titles li { padding: 12px; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; animation: flipIn .6s cubic-bezier(.2,1.3,.4,1) var(--d, 0s) both; }
.titles small { color: var(--yuru); font-weight: 900; font-size: 12px; }
.titles b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.titles span { color: var(--muted); font-size: 11px; font-weight: 700; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 28px 14px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-weight: 900; }
.rank .no { color: var(--muted); font-variant-numeric: tabular-nums; }
.rank .pc { border-color: transparent; }
.rank .ct { font-family: var(--display); font-variant-numeric: tabular-nums; }
.result .big { background: var(--paper); color: var(--ink); }

/* ---------- モダン化 ---------- */
/* 画面切り替え */
#app.enter-fwd { animation: enterFwd .32s cubic-bezier(.2,.9,.3,1); }
#app.enter-back { animation: enterBack .32s cubic-bezier(.2,.9,.3,1); }
@keyframes enterFwd { from { transform: translateX(28px); opacity: 0; } }
@keyframes enterBack { from { transform: translateX(-28px); opacity: 0; } }

/* 上のバー：罰スコアの顔アイコン列 */
.bar { align-items: center; }
.score { display: flex; gap: 10px; flex: 1; min-width: 0; overflow-x: auto; padding: 10px 10px 10px 8px; margin: -4px 0; scrollbar-width: none; }
.score::-webkit-scrollbar { display: none; }
.av { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--mc); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 0 0 2px var(--ink); transition: transform .2s; }
.av.is-turn { transform: scale(1.08); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--bg), 0 0 0 6px var(--fg); }
.av .cnt { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #e8202a; color: #fff; font-size: 11px; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.av .rv { position: absolute; bottom: -5px; right: -5px; font-style: normal; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
.av.sm { width: 22px; height: 22px; font-size: 11px; box-shadow: none; }
.menu-btn { width: 42px; height: 42px; border-radius: 50%; }
.menu-btn svg { width: 20px; height: 20px; }
.sheet.menu { gap: 8px; }
.menu-meta { margin: 0 0 4px; font-size: 12px; font-weight: 900; letter-spacing: .14em; color: var(--muted); }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(247,243,234,.06); text-align: left; font-weight: 900; font-size: 16px; }
.menu-item svg { width: 22px; height: 22px; flex: none; }
.menu-item span { flex: 1; }
.menu-item small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.menu-item b { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(247,243,234,.1); }
.menu-item.danger { color: #ff6b62; }

/* 次の番の予告 */
.next-up { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--muted); }
.next-up svg { width: 14px; height: 14px; }
.next-up .av { margin-left: 2px; }

/* 山札（札の後ろにカードが重なって見える） */
.deck { position: relative; isolation: isolate; }
/* 後ろの山札は .deck の中に収める（下の文字やボタンに被らんように、札の下に14px空けてそこに覗かせる） */
.deck { padding-bottom: 14px !important; }
.deck::before, .deck::after { content: ""; position: absolute; left: 14px; right: 14px; top: 14px; bottom: 11px; border-radius: 22px; background: var(--card-bg); z-index: -1; }
.deck::before { transform: rotate(1.1deg) translateY(4px); opacity: .5; }
.deck::after { transform: rotate(-.8deg) translateY(8px); opacity: .28; }
.odai { position: relative; z-index: 1; }

/* メンバー入力 */
.add1 { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.add1 input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 15px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(247,243,234,.06); color: var(--paper); }
.add1 input:focus { border-color: var(--yuru); outline: none; }
.add1 input::placeholder { color: var(--muted); }
.add-btn { width: 54px; border-radius: 14px; background: var(--yuru); color: var(--ink); display: grid; place-items: center; }
.add-btn svg { width: 24px; height: 24px; }
.mem-head { display: flex; justify-content: space-between; align-items: center; }
.text-btn { font-size: 12px; font-weight: 900; color: var(--futsu); padding: 6px 4px; }
.mem .nm { text-align: left; min-width: 0; padding: 2px 0; }
.mem .nm span { color: var(--muted); }
.mem .x { display: grid; place-items: center; }
.mem .x svg { width: 18px; height: 18px; }
.mem.editing { border-color: var(--yuru); grid-template-columns: 34px minmax(0,1fr) auto; }
.mem.editing input { width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(247,243,234,.08); color: var(--paper); }
.ok-btn { padding: 10px 14px; border-radius: 10px; background: var(--yuru); color: var(--ink); font-weight: 900; }
.groups { display: flex; flex-direction: column; gap: 8px; }
.group { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); text-align: left; font-weight: 900; font-size: 14px; color: var(--paper); }
.group svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.group span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 結果のシェア */
.result { display: flex; flex-direction: column; gap: 16px; }
.share-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, #ff5d8f, #ff9a3c); color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.share-btn svg { width: 22px; height: 22px; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== 夜モード：ネオン看板 ===== */
@keyframes neonFlicker { 0%, 18%, 20.5%, 23%, 61%, 63.5%, 100% { opacity: 1; } 19%, 22%, 62% { opacity: .42; } }
@keyframes neonOn { 0% { opacity: .2; } 8% { opacity: 1; } 12% { opacity: .3; } 20%, 100% { opacity: 1; } }
.neon-text { color: #fff; text-shadow: 0 0 2px #fff, 0 0 8px var(--nc), 0 0 18px var(--nc), 0 0 36px var(--nc); }
/* ホーム：夜モード中はロゴがネオン管になって、背景は暗い壁 */
body.night-home { --nc: var(--night); background-color: #0b0812; background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px); background-size: 52px 26px, 26px 26px; }
body.night-home.deep { --nc: var(--deep); }
.logo.is-night, .logo.is-deep, .night-title { color: #fff; text-shadow: 0 0 2px #fff, 0 0 8px var(--nc, var(--night)), 0 0 20px var(--nc, var(--night)), 0 0 44px var(--nc, var(--night)); animation: neonFlicker 7s infinite; }
.logo.is-deep { --nc: var(--deep); }
.logo.is-night .logo-btn, .logo.is-deep .logo-btn { text-shadow: inherit; }
body.night-home .catch { color: var(--nc); text-shadow: 0 0 8px var(--nc); }
/* ゲーム中：夜お題・深夜お題が出たら店の照明が落ちてネオン看板になる */
body.stage { transition: background-color .45s ease; }
body.stage.neon { --nc: var(--night); --bg: #0b0812; --fg: #f4ecff; --muted: rgba(244,236,255,.62); --chip: rgba(244,236,255,.1); --line: rgba(244,236,255,.2);
  background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px); background-size: 52px 26px, 26px 26px; }
body.stage.neon.deep { --nc: var(--deep); }
body.stage.neon .deck::before, body.stage.neon .deck::after { background: color-mix(in srgb, var(--nc) 22%, #0b0812); }
body.stage.neon .turn em { color: #fff; text-shadow: 0 0 8px var(--nc), 0 0 22px var(--nc); }
.odai.yoru, .odai.deep { --card-bg: #120c1d; --card-fg: #fff; box-shadow: 0 0 0 2px var(--nc), 0 0 16px color-mix(in srgb, var(--nc) 60%, transparent), inset 0 0 18px color-mix(in srgb, var(--nc) 35%, transparent); }
.odai.yoru { --nc: var(--night); } .odai.deep { --nc: var(--deep); }
.odai.yoru.in, .odai.deep.in { animation: flipIn .5s cubic-bezier(.2,1.3,.4,1) both, neonOn .9s linear both; }
.odai.yoru .head, .odai.deep .head { opacity: 1; color: var(--nc); text-shadow: 0 0 6px var(--nc); }
.odai.yoru .txt, .odai.deep .txt { text-shadow: 0 0 10px color-mix(in srgb, var(--nc) 45%, transparent); }
.odai.yoru .txt mark, .odai.deep .txt mark { background: none; color: #fff; text-shadow: 0 0 4px #fff, 0 0 12px var(--mc), 0 0 24px var(--mc); text-decoration: none; }
body.stage.neon .big { background: transparent; color: #fff; border: 2px solid var(--nc); text-shadow: 0 0 8px var(--nc); box-shadow: 0 0 14px color-mix(in srgb, var(--nc) 55%, transparent), inset 0 0 14px color-mix(in srgb, var(--nc) 30%, transparent); }
body.stage.neon .big.has-pen { background: var(--nc); color: #0b0812; text-shadow: none; }
body.stage.neon .sub-acts button { border-color: color-mix(in srgb, var(--nc) 60%, transparent); }

/* ===== 押した感触：沈んで、ぷにっと戻る ===== */
button { transition: transform .26s cubic-bezier(.3, 1.8, .5, 1), box-shadow .2s ease, background-color .2s ease, opacity .2s ease; }
button:active:not(:disabled) { transform: scale(.95); transition-duration: .06s; }
.big:active:not(:disabled) { transform: translateY(4px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.28); transition-duration: .06s; }
.mode:active { transform: translateY(4px) scale(.985); transition-duration: .06s; }
.die3d:active:not(:disabled) { transform: translateY(5px) scale(.97); transition-duration: .06s; }
.logo-btn:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) {
  .logo.is-night, .logo.is-deep, .night-title, .odai.yoru.in, .odai.deep.in { animation: none; }
  button, button:active:not(:disabled) { transition: none; }
}

/* ===== ゲーム中は1画面に固定（スクロールしない・引っ張っても動かない） ===== */
html, body { overscroll-behavior: none; }
html:has(body.stage) { overflow: hidden; }
body.stage { height: 100vh; height: var(--app-h, 100dvh); overflow: hidden; }
body.stage #app { height: 100vh; height: var(--app-h, 100dvh); min-height: 0; overflow: hidden; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
body.stage #stage { min-height: 0; gap: 10px; }
body.stage #stage .deck { min-height: 0; flex: 1 1 0; }
body.stage .odai { min-height: 0; overflow: hidden; }
body.stage .odai .txt { min-height: 0; overflow: hidden; }
body.stage .odai .gacha { overflow-y: auto; min-height: 0; flex: 1; }
/* すごろく：盤は残りの高さに収まるサイズに */
/* すごろく盤は横幅いっぱい、縦は残りの高さいっぱいまで伸ばす（マスは縦長になってもOK、伸ばしすぎない） */
body.stage .sugo2 .sg-board { flex: 1 1 0; min-height: 0; width: 100%; aspect-ratio: auto !important; max-height: calc((100vw - 32px) * var(--rows) / 6 * 1.5); }
body.stage .sugo2 .c-start b { font-size: clamp(9px, 2.6vw, 13px); white-space: nowrap; letter-spacing: -.02em; }
/* 背の低いスマホ・人数が多い時は詰める */
@media (max-height: 740px) {
  body.stage .turn em { font-size: clamp(30px, 9vw, 40px); }
  body.stage .turn .who { height: 40px; }
  body.stage .pen-tile { min-height: 50px; }
  body.stage .big { padding: 14px; font-size: 20px; }
}
body.stage .pen-grid.many .pen-tile { min-height: 46px; padding-block: 5px; }
body.stage .pen-grid.many { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
body.stage .pen-grid.many .doer-lbl { display: none; }
@media (max-height: 740px) { body.stage .sg-sheet .deck { min-height: 160px; } }
body.stage .sg-ranks.many { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }

/* ===== 隠しモードのヒント ===== */
@keyframes whisperIn { from { opacity: 0; transform: translateY(4px); } to { opacity: .8; transform: none; } }
@keyframes whisperPulse { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
.whisper { margin: 10px 0 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--night); letter-spacing: .06em; animation: whisperIn .8s ease .6s both, whisperPulse 3.2s ease-in-out 1.4s infinite; }
.whisper.deep { color: var(--deep); }
.whisper svg, .tip svg { width: 14px; height: 14px; flex: none; }
.tip { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
/* ロゴ連打で震える */
@keyframes tease { 0%, 100% { transform: none; } 25% { transform: rotate(-2deg) translateX(-2px); } 75% { transform: rotate(2deg) translateX(2px); } }
.logo.tease { animation: tease .2s ease 2; }
.logo.tease .logo-btn { text-shadow: 0 0 10px var(--night), 0 0 30px var(--night); }
.logo.is-night.tease .logo-btn { text-shadow: 0 0 2px #fff, 0 0 12px var(--deep), 0 0 34px var(--deep); }
/* 深夜の確認画面 */
.night-ask.deep .h2 { color: var(--deep); }
.night-title.is-deep { --nc: var(--deep); }
.night-title small { display: block; font-size: .36em; margin-top: 8px; white-space: nowrap; }
.night-ask.deep .big { background: var(--deep); color: var(--ink); }
.night-switch { display: flex; flex-direction: column; gap: 10px; }
.night-switch .night-lv button[data-v="shinya"] { border-color: var(--deep); }

/* ===== やった／できんかった の2択 ===== */
.verdict { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.vd { border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
.vd b { font-family: var(--display); font-weight: 400; font-size: clamp(17px, 5.4vw, 22px); white-space: nowrap; line-height: 1.15; }
.vd small { font-size: 12px; font-weight: 900; opacity: .8; }
.vd.ok { background: var(--fg); color: var(--bg); }
.vd.ng { background: #e8202a; color: #fff; }
body[data-level="jigoku"] .vd.ng { background: var(--blood); color: #000; }
body[data-level="jigoku"] .vd.ok { background: transparent; color: var(--blood); border: 2px solid var(--blood); }
.vd small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
body.stage.neon .vd.ok { background: transparent; color: #fff; border: 2px solid var(--nc); box-shadow: 0 0 14px color-mix(in srgb, var(--nc) 55%, transparent); }
.vd:active { transform: translateY(4px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.28); transition-duration: .06s; }
.swipe-hint { margin: -2px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 900; color: var(--muted); letter-spacing: .08em; }
.swipe-hint .link { margin-inline: auto; }
.link { font-size: 12px; font-weight: 900; text-decoration: underline; text-underline-offset: 3px; color: var(--fg); opacity: .8; padding: 6px 4px; }
/* スワイプ中の札 */
#card { touch-action: pan-y; }
#card.dragging { transition: none !important; animation: none !important; user-select: none; }
.sw-stamp { position: absolute; top: 46px; font-style: normal; font-family: var(--display); font-size: 30px; padding: 4px 14px; border: 4px solid; border-radius: 10px; pointer-events: none; z-index: 3; opacity: 0; }
.sw-stamp.ok { left: 18px; color: #1aa64b; transform: rotate(-12deg); opacity: var(--ok, 0); }
.sw-stamp.ng { right: 18px; color: #e8202a; transform: rotate(12deg); opacity: var(--ng, 0); }

/* ===== ルール違反 ===== */
.rule span { flex: 1; min-width: 0; }
.rule .rule-txt { display: flex; flex-direction: column; gap: 2px; line-break: strict; }
.rule .rule-txt > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rule .rule-txt em { font-style: normal; margin-left: 8px; opacity: .7; }
/* 小さい画面：ルールの枠は1行に詰めて、札が潰れんようにする（全文は「違反者に罰」を押すと出る） */
@media (max-height: 740px) {
  .rule { padding: 5px 10px; }
  .rule .rule-txt > span { -webkit-line-clamp: 1; }
  .rule .rule-out { padding: 6px 9px; font-size: 11px; }
}
.rule + .rule { margin-top: -8px; }
.rule .nowrap { white-space: nowrap; }
.rule-out { flex: none; padding: 8px 10px; border-radius: 999px; background: #e8202a; color: #fff; font-size: 12px; font-weight: 900; white-space: nowrap; }
body[data-level="jigoku"] .rule-out { background: var(--blood); color: #000; }
.rule-sheet { --muted: rgba(247,243,234,.62); }
.rule-sheet .h2 { color: #ff6b6b; margin: 0; }
.rule-sheet .chip { background: rgba(247,243,234,.08); color: var(--paper); }
.rule-sheet h2 { margin: 4px 0 0; font-size: 18px; }
.rule-now { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.rule-sheet .skull-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
.rule-sheet .skull-wrap b { font-family: var(--display); font-weight: 400; font-size: 24px; color: #ff3b3b; }
.rule-sheet.lucky .skull-wrap b { color: var(--yuru); }
.rule-sheet .skull-wrap svg { width: 84px; height: 84px; }
.rule-pen { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.45; text-align: center; }
.rule-sheet .big { background: var(--paper); color: var(--ink); }

/* ===== 分かりやすさ ===== */
.odai .head .tag { font-style: normal; display: inline-block; margin-right: 8px; padding: 2px 8px; border-radius: 999px; background: currentColor; letter-spacing: .06em; }
.odai .head .tag { color: inherit; background: color-mix(in srgb, currentColor 14%, transparent); border: 1px solid color-mix(in srgb, currentColor 45%, transparent); }
.coach { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 700; line-height: 1.5; position: relative; animation: fadeIn .25s ease-out; }
.coach::before { content: ""; position: absolute; top: -6px; left: 28px; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); }
.coach span { flex: 1; }
.coach button { flex: none; padding: 8px 12px; border-radius: 999px; background: var(--yuru); color: var(--ink); font-size: 12px; font-weight: 900; }
body[data-level="jigoku"] .coach { background: #2a0d0d; border: 1px solid var(--blood); }
body.stage.neon .coach { background: #1a1228; border: 1px solid var(--nc); }
.rules { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.rules div { padding: 10px 12px; border-radius: 12px; background: rgba(247,243,234,.06); }
.rules dt { font-weight: 900; color: var(--yuru); font-size: 14px; }
.rules dd { margin: 2px 0 0; font-size: 13px; line-height: 1.6; color: rgba(247,243,234,.85); }
.rules-sheet h2 { margin: 0; }
.rank .nm { display: flex; flex-direction: column; min-width: 0; }
.rank .nm small { font-size: 11px; font-weight: 700; color: var(--muted); }

/* START のコマは小さく下に並べる */
.sg-tok { scale: var(--s, 1); }
.c-start .in { align-content: start; padding-top: 10px; }
.c-text b { white-space: nowrap; }
/* 遊び方1枚目：札とセーフ／アウト */
.tut-play { display: flex; flex-direction: column; gap: 10px; width: min(100%, 260px); }
.tut-play .mini-card { position: relative; width: 100%; aspect-ratio: auto; min-height: 150px; transform: none; }
.tut-play .tag { font-style: normal; padding: 1px 7px; border: 1px solid currentColor; border-radius: 999px; opacity: .7; }
.swipe-arrows { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; font-weight: 900; opacity: .5; }
.swipe-arrows em { font-style: normal; }
.mini-verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-verdict span { border-radius: 12px; padding: 10px 6px; text-align: center; font-family: var(--display); font-size: 17px; line-height: 1.2; }
.mini-verdict small { display: block; font-family: var(--body); font-size: 10px; font-weight: 900; opacity: .8; }
.mini-verdict .ng { background: #e8202a; color: #fff; }
.mini-verdict .ok { background: var(--paper); color: var(--ink); }
/* メンバー登録の初回説明 */
.home-coach { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: rgba(255,210,63,.1); border: 1px solid rgba(255,210,63,.4); font-size: 13px; line-height: 1.6; font-weight: 700; }
.home-coach b { color: var(--yuru); }
.home-coach ol { margin: 0; padding-left: 1.3em; }
.home-coach button { align-self: flex-end; padding: 8px 14px; border-radius: 999px; background: var(--yuru); color: var(--ink); font-size: 12px; font-weight: 900; }

/* =====================================================================
  v2：見やすさの土台
  - 背景はどの地獄度も暗い色にそろえて、地獄度の色は札の縁と上の帯だけ
  - 太い字体はお題と名前だけ。ほかは普通の太字・字間なし
  - ボタンは「塗り（大事）」「枠（次に大事）」「文字リンク（たまに）」の3種類
  ===================================================================== */
body.stage[data-level] { --bg: #141210; --fg: var(--paper); --muted: rgba(247,243,234,.66); --chip: rgba(247,243,234,.08); --line: rgba(247,243,234,.2); }
body.stage[data-level="yurume"] { --acc: var(--yuru); --card-edge: var(--yuru); }
body.stage[data-level="futsu"]  { --acc: var(--futsu); --card-edge: var(--futsu); }
body.stage[data-level="jigoku"] { --acc: var(--blood); --card-edge: var(--blood); --fg: var(--paper); --muted: rgba(247,243,234,.66); }
.frame { box-shadow: inset 0 0 0 3px var(--pc); }
.odai { box-shadow: 0 0 0 3px var(--card-edge); }
/* 札の上の1行：誰の番か＋種類 */
.odai .head { opacity: 1; letter-spacing: .02em; font-size: 12px; align-items: center; }
.odai .head .meta { display: flex; align-items: center; gap: 6px; min-width: 0; opacity: .7; }
.odai .head .kind { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.odai .head .tag { margin: 0; }
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.who i { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 30%, transparent); }
.who b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { font-size: 13px; font-weight: 900; white-space: nowrap; }
/* 文字：字間を詰めて、小さすぎ・薄すぎをなくす */
.h2, .res-h2, .menu-meta { letter-spacing: .04em; font-size: 13px; }
.catch { letter-spacing: .08em; }
.step-dots { letter-spacing: .04em; font-size: 12px; }
.pen-q span, .hint, .swipe-hint { letter-spacing: .02em; font-size: 12px; }
.rule b { letter-spacing: .02em; }
.big { font-family: var(--body); font-weight: 900; font-size: 19px; }
.vd b { font-family: var(--body); font-weight: 900; font-size: 20px; }
.choice.hot { font-family: var(--body); font-weight: 900; font-size: 17px; }
.dice-txt b { font-family: var(--body); font-weight: 900; font-size: 18px; }
.dice-txt .who b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.mode b { font-family: var(--body); font-weight: 900; font-size: 22px; }
.mode .go { font-family: var(--body); font-weight: 900; font-style: normal; }
.mode-ic { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(20,18,16,.08); }
.mode-ic svg { width: 24px; height: 24px; }
.mode { grid-template-columns: auto minmax(0,1fr) auto; }
.mode b, .mode span { grid-column: 2; }
.mode .go { grid-column: 3; }
/* ボタン：枠だけ（2番目に大事） */
.sub-acts button, .sub-acts .revenge { background: transparent; border: 1.5px solid rgba(247,243,234,.35); border-radius: 12px; font-size: 14px; }
.sub-acts .revenge { border-color: var(--acc, var(--fg)); }
.choice { background: transparent; border: 1.5px solid rgba(247,243,234,.35); }
.choice.hot { background: var(--fg); color: var(--bg); border-color: transparent; }
.ghost { border-width: 1.5px; }
.rule-out { background: transparent; color: #ff7a7a; border: 1.5px solid #ff7a7a; }
.coach { background: #26221e; border: 1px solid rgba(255,210,63,.35); }
.coach::before { background: #26221e; border-left: 1px solid rgba(255,210,63,.35); border-top: 1px solid rgba(255,210,63,.35); }
/* 準備画面の番号つき見出し */
.step-h { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 900; color: var(--paper); }
.step-h .num { color: var(--yuru); }
.step-h small { font-size: 12px; font-weight: 700; color: var(--muted); }
.home-coach { font-size: 14px; }
.ghost-sub { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
/* 倍プッシュのコイン・爆弾の絵は、お題の文と一緒に札の真ん中へ */
.odai .coin-wrap, .odai .bomb-art { margin-top: auto; }
.odai .coin-wrap + .txt, .odai .bomb-art + .txt { flex: 0 1 auto; margin-top: auto; margin-bottom: auto; }
.night-lv.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.night-lv button[data-v="off"] { border-color: rgba(247,243,234,.35); }
/* 札の上の行：名前は切らさず、種類・タグ・バッジは入りきらん時だけ2行目へ */
.odai .head { flex-wrap: wrap; row-gap: 6px; }
.odai .head .who { flex: 1 0 auto; white-space: nowrap; max-width: 100%; overflow: hidden; }
.odai .head .who b { min-width: 0; flex-shrink: 1; }
.odai .head .who small { flex: none; }
/* 日本語の改行ルール：小さい「ュ」「ッ」や「。」が行の頭に来んようにする */
.odai .txt, .gacha-txt p, .rule-pen, .mini-card b, .coach span, .rule span { line-break: strict; }
.odai .head .meta { margin-left: auto; flex: 0 1 auto; max-width: 100%; }
.tag, .badge { white-space: nowrap; flex: none; }
.pen-tile .nm { font-size: 15px; }
/* ---------- NGワード・ぶっちゃけ投票 ---------- */
.mode { padding-top: 14px; padding-bottom: 14px; }
.mode[disabled] { opacity: .45; box-shadow: none; }
.mode-card { gap: 12px; overflow: hidden; }
.mode-card.center { align-items: center; justify-content: center; text-align: center; }
.mode-card .head { width: 100%; }
.how { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; font-weight: 700; line-break: strict; }
.how b { font-weight: 900; }
.how-note { margin: 0; font-size: 12px; font-weight: 700; opacity: .65; line-height: 1.5; line-break: strict; }
.ng-min-wrap { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.ng-min-h { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: .1em; opacity: .65; }
.ng-min { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.ng-min button { padding: 11px 0; border-radius: 12px; border: 1.5px solid color-mix(in srgb, currentColor 30%, transparent); font-weight: 900; font-size: 15px; white-space: nowrap; }
.ng-min button[aria-pressed="true"] { background: var(--card-fg); color: var(--card-bg); border-color: transparent; }
.prog { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .08em; opacity: .65; line-break: strict; }
.hand-who { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hand-dot { width: 72px; height: 72px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-family: var(--display); font-size: 34px; }
.hand-who b { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 10vw, 44px); line-height: 1.1; word-break: break-all; }
.hand-who small { font-size: 18px; font-weight: 900; }
.hand-note { margin: 0; font-size: 14px; font-weight: 700; opacity: .75; line-height: 1.6; line-break: strict; }
.ng-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.ng-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, currentColor 8%, transparent); border-left: 6px solid var(--mc); }
.ng-list .nm { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ng-list .nm i { display: none; }
.ng-list b { font-family: var(--display); font-weight: 400; font-size: 24px; white-space: nowrap; }
.ng-list.res { flex: none; overflow: visible; color: var(--fg); }
.ng-timer { margin: 0; font-family: var(--display); font-size: clamp(56px, 20vw, 88px); line-height: 1; font-variant-numeric: tabular-nums; }
.ng-timer.hurry { color: #ff3b3b; animation: pulse 1s ease-in-out infinite; }
.ng-timer.free { opacity: .5; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.ng-lead { margin: 0; font-family: var(--display); font-size: clamp(22px, 7vw, 30px); line-height: 1.35; line-break: strict; }
.ng-topic { margin: 0; padding: 10px 16px; border-radius: 14px; border: 1.5px dashed color-mix(in srgb, currentColor 40%, transparent); font-weight: 900; font-size: 17px; line-break: strict; }
.ng-topic small { display: block; font-size: 11px; letter-spacing: .14em; opacity: .6; }
.ng-reveal { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.ng-reveal small { font-size: 13px; font-weight: 900; opacity: .7; }
.ng-reveal b { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 11vw, 46px); line-height: 1.15; word-break: keep-all; overflow-wrap: anywhere; max-width: 100%; }
.skull-wrap.sm svg { width: 64px; height: 64px; }
.mode-card .rule-pen { font-size: 19px; line-break: strict; }
.sub-acts.two { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
.sub-acts.two button { padding: 12px 6px; font-weight: 900; white-space: nowrap; }
.vote-q { margin: 0; font-family: var(--display); font-size: clamp(18px, 5.6vw, 23px); line-height: 1.4; line-break: strict; }
body.stage .pen-grid.vote-grid { margin-top: auto; grid-template-columns: repeat(2, minmax(0,1fr)); }
.vote-grid .pen-tile { min-height: 62px; background: color-mix(in srgb, currentColor 7%, transparent); border-color: color-mix(in srgb, currentColor 22%, transparent); color: inherit; }
.vbars { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.vbars li { position: relative; display: grid; grid-template-columns: minmax(0, 6.5em) minmax(0,1fr) 2em; align-items: center; gap: 10px; }
.vbars .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vbars .bar { height: 18px; border-radius: 9px; background: color-mix(in srgb, currentColor 10%, transparent); overflow: hidden; }
.vbars .bar i { display: block; height: 100%; width: var(--w); background: var(--mc); border-radius: 9px; animation: grow .7s var(--d) cubic-bezier(.3,1.2,.5,1) both; }
.vbars b { font-family: var(--display); font-weight: 400; font-size: 22px; text-align: right; animation: reveal .3s calc(var(--d) + .5s) both; }
.vbars li.top .nm { color: #ff3b3b; }
.vbars .stamp { position: absolute; right: 2.6em; top: 50%; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #ff3b3b; color: #ff3b3b; display: grid; place-items: center; font-family: var(--display); font-size: 15px; transform: translateY(-50%) rotate(-14deg); animation: stamp .25s calc(var(--d) + .8s) cubic-bezier(.3,1.6,.5,1) both; }
@keyframes grow { from { width: 0; } }
/* 票の数え上げ：数えてる間はバーの伸びと数字の出方を JS に任せる。罰のハンコ・赤字は数え終わってから */
.vbars.count .bar i { animation: none; transition: width .25s cubic-bezier(.3,1.4,.5,1); }
.vbars.count b { animation: none; }
.vbars.count li.hit b { animation: votePop .3s cubic-bezier(.3,1.8,.5,1); }
@keyframes votePop { 0% { transform: scale(1.8); color: var(--mc); } 100% { transform: scale(1); } }
.vbars.count li.top .nm { color: inherit; transition: color .2s; }
.vbars.count.done li.top .nm { color: #ff3b3b; }
.vbars.count .stamp { animation: none; opacity: 0; }
.vbars.count.done .stamp { animation: stamp .25s cubic-bezier(.3,1.6,.5,1) both; opacity: 1; }
.vbars.count.done li.top { animation: jolt .45s both; }
/* ワードウルフ：ウルフの顔・勝ち負けの見出し */
.wf-words .w small { display: inline-flex; align-items: center; gap: 4px; color: #ff3b3b; opacity: 1; }
.wf-words .w small .wolf { width: 22px; height: 22px; }
.wf-words .w { box-shadow: inset 0 0 0 2px rgba(255,59,59,.45); }
.wf-wolf { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wf-wolf .wolf { width: 104px; height: 104px; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both; }
.wf-wolf.win .wolf { animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both, wolfHowl 1.6s .6s ease-in-out infinite; transform-origin: 50% 90%; }
.wf-wolf.caught .wolf { animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both, wolfSob .5s .6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wolfSob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(1px) rotate(-2deg); } 75% { transform: translateY(1px) rotate(2deg); } }
.w-tear { animation: tearDrop 1.1s ease-in infinite; }
.w-tear.r { animation-delay: .55s; }
@keyframes tearDrop { 0% { transform: translateY(-4px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
.w-mouth { animation: mouthWob .3s steps(2) infinite; transform-origin: 50px 80px; }
@keyframes mouthWob { 50% { transform: translateY(1px) scaleX(.94); } }
.wf-wolf.win .w-glow { animation: wGlow 1.2s ease-in-out infinite alternate; }
@keyframes wGlow { from { opacity: .12; } to { opacity: .45; } }
.wf-wolf > span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, currentColor 8%, transparent); font-weight: 900; font-size: 14px; }
.wf-wolf > span i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); }
.wf-stamp { position: absolute; top: 6px; right: -54px; font-style: normal; font-family: var(--display); font-size: 18px; padding: 2px 8px; border: 3px solid currentColor; border-radius: 8px; transform: rotate(14deg); animation: stamp2 .35s .7s cubic-bezier(.3,1.6,.5,1) both; white-space: nowrap; }
.wf-res.cit .wf-stamp { color: #1f9d55; }
.wf-res.wolf .wf-stamp { color: #ff3b3b; }
@keyframes stamp2 { from { transform: rotate(14deg) scale(2.4); opacity: 0; } }
@keyframes wolfHowl { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg) translateY(-3px); } }
.wf-win { margin: 0; font-family: var(--display); font-size: clamp(24px, 7.6vw, 34px); white-space: nowrap; line-height: 1.15; animation: reveal .4s .5s both; }
.wf-res.cit .wf-win { color: #1f9d55; }
.wf-res.wolf .wf-win { color: #ff3b3b; }
.wf-res .hand-note { margin-top: -6px; }
/* ワードウルフ：ウルフが複数・全員市民 */
.wf-row { display: flex; justify-content: center; align-items: flex-end; }
.wf-row.n2 .wolf, .wf-row.n3 .wolf { width: 80px !important; height: 80px !important; margin: 0 -6px; }
.wf-row.n3 .wolf:nth-child(2) { width: 92px !important; height: 92px !important; z-index: 1; }
.wf-wolf.ghost .wolf { opacity: .22; filter: grayscale(1); animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both; }
.wf-res.cit .wf-wolf.ghost .wf-stamp { color: #1f9d55; }
.wf-words.one { grid-template-columns: 1fr; }
.wf-words .wn { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; }
.wf-words .wn > span { display: inline-flex; align-items: center; gap: 4px; }
.wf-words .wn i { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); }
.wf-wolf > span i { background: var(--mc); }
.pen-tile.none { grid-column: 1 / -1; border-style: dashed; }
.vbars li.none .nm { opacity: .75; font-size: 13px; }
.ng-min.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.ng-min button small { display: block; font-size: 10px; opacity: .7; }
.ng-min button:disabled { opacity: .3; }
.wf-sets { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.wf-set { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wf-set > span { font-size: 12px; font-weight: 900; opacity: .7; white-space: nowrap; }
.wf-set .seg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.wf-set .seg button { padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 900; border: 1.5px solid color-mix(in srgb, currentColor 25%, transparent); white-space: nowrap; }
.wf-set .seg button[aria-pressed="true"] { background: var(--card-fg, #141210); color: var(--card-bg, #fff8ec); border-color: transparent; }
/* ワードウルフ：数え終わってからウルフの正体がめくれる */
.wf-words.late p:first-child { animation: wfFlip .6s var(--late) cubic-bezier(.2,1.3,.4,1) both; }
@keyframes wfFlip { 0% { transform: rotateY(-100deg) scale(.9); opacity: 0; } 40% { opacity: 1; } 100% { transform: none; opacity: 1; } }
.wf-words.late p:last-child { animation: reveal .4s calc(var(--late) + .3s) both; }
/* 点数・票のバーは人数が多い時だけ札の中でスクロール */
.mode-card .vbars { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.mode-card .vbars li { flex: none; }
/* ワードウルフ */
.wf-word b { font-size: clamp(34px, 12vw, 52px); }
.wf-words { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 0; }
.wf-words p { margin: 0; padding: 10px 8px; border-radius: 14px; background: color-mix(in srgb, currentColor 8%, transparent); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.wf-words small { font-size: 12px; font-weight: 900; opacity: .65; }
.wf-words b { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 6vw, 24px); line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
.wf-words span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 900; opacity: .8; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-words span i { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); flex: none; }
.mode-card .vbars + .wf-words { margin-top: 2px; }
/* ピッタリ予想 */
.pt-disp, .pt-ans { margin: auto 0; display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pt-disp small, .pt-ans small { width: 100%; text-align: center; font-size: 13px; font-weight: 900; opacity: .65; }
.pt-disp b, .pt-ans b { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 17vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.pt-disp b i { font-style: normal; opacity: .3; }
.pt-disp span, .pt-ans span { font-weight: 900; font-size: 18px; }
.pt-ans { margin: 0; }
.pt-ans b { font-size: clamp(40px, 13vw, 56px); }
.pt-pad { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.pt-pad button { height: 52px; border-radius: 14px; background: var(--chip); font-family: var(--display); font-size: 24px; color: var(--fg); }
.pt-pad button.fn { font-family: inherit; font-size: 18px; font-weight: 900; opacity: .8; }
.pt-pad button:active { transform: scale(.96); }
@media (max-height: 700px) { .pt-pad button { height: 44px; } .pt-pad { gap: 6px; } }
.pt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.ng-gres li { grid-template-columns: minmax(0, 4.6em) minmax(0, 1fr) auto !important; }
.pt-list.ng-gres li .stamp { display: none !important; }
.ng-gres b { font-size: 16px !important; overflow-wrap: anywhere; line-height: 1.3; }
.pt-list li { position: relative; flex: none; display: grid; grid-template-columns: minmax(0,1fr) 28px auto 5.2em; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, currentColor 7%, transparent); border-left: 6px solid var(--mc); animation: reveal .3s var(--d) both; }
.pt-list .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-list .nm i { display: none; }
.pt-list b { font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.pt-list em { font-style: normal; font-size: 12px; font-weight: 900; opacity: .7; text-align: right; white-space: nowrap; }
.pt-list li.hit em { opacity: 1; color: #1f9d55; }
.pt-list li.lose .nm { color: #ff3b3b; }
.pt-list .stamp { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #ff3b3b; color: #ff3b3b; display: grid; place-items: center; font-family: var(--display); font-size: 13px; transform: rotate(-14deg); animation: stamp .25s calc(var(--d) + .4s) cubic-bezier(.3,1.6,.5,1) both; }
.pt-card .vote-q { font-size: clamp(16px, 5vw, 20px); }
/* 早押しジェスチャー・褒め殺し */
.ng-min.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.gs-timer { margin: 0; font-family: var(--display); font-size: clamp(48px, 15vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.gs-timer.hurry { color: #ff3b3b; animation: pulse 1s ease-in-out infinite; }
.gs-word { margin: 0; font-family: var(--display); font-size: clamp(36px, 12vw, 60px); line-height: 1.2; text-align: center; word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }
.hm-vs { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; }
.hm-vs span { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.hm-vs span i { width: 60px; height: 60px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 28px; }
.hm-vs span b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 6vw, 28px); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-vs span small { font-size: 12px; font-weight: 900; opacity: .7; }
.hm-vs em { font-style: normal; font-family: var(--display); font-size: 28px; opacity: .6; }
.hm-result { margin: 0; text-align: center; font-family: var(--display); font-size: 22px; color: var(--fg); }
/* 始める前の説明：マークつきで大きめに */
.how.ic { list-style: none; padding: 0; gap: clamp(12px, 2.4vh, 22px); }
.how.ic li { display: grid; grid-template-columns: 1.6em minmax(0,1fr); gap: 10px; align-items: start; font-size: clamp(16px, 2.6vh, 22px); line-height: 1.5; }
.how.ic .ic { display: grid; place-items: center; width: 1.6em; height: 1.5em; color: var(--card-edge); }
.how.ic .ic svg { width: 1.25em; height: 1.25em; }
/* 遊び方（チュートリアル）の絵 */
.tut-modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; width: 100%; max-width: 300px; }
.tut-modes span { padding: 10px 8px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 900; font-size: 14px; text-align: center; white-space: nowrap; }
.tut-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 260px; }
.tut-menu span { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #26221e; color: var(--paper); font-weight: 900; font-size: 15px; }
.tut-menu svg { width: 20px; height: 20px; color: var(--yuru); }
/* 最初の人ルーレット */
.roul { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; width: 100%; }
.roul.many { grid-template-columns: repeat(4, minmax(0,1fr)); }
.roul-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px; border: 2px solid color-mix(in srgb, currentColor 15%, transparent); transition: transform .08s, background-color .08s; min-width: 0; }
.roul-chip i { width: 40px; height: 40px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 20px; opacity: .45; }
.roul-chip b { font-size: 13px; font-weight: 900; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .55; }
.roul-chip.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 22%, transparent); transform: scale(1.06); }
.roul-chip.on i, .roul-chip.on b { opacity: 1; }
.roul-chip.hit { animation: roulHit .5s cubic-bezier(.3,1.6,.5,1); box-shadow: 0 0 0 3px var(--mc); }
@keyframes roulHit { from { transform: scale(1.35); } to { transform: scale(1.06); } }
.roul-res { min-height: 1.4em; }
/* 価値観ナンバー */
.it-num { margin: 0; font-family: var(--display); font-size: clamp(90px, 30vw, 150px); line-height: 1; font-variant-numeric: tabular-nums; }
.it-topic { margin: 0; font-size: 18px; font-weight: 900; }
.it-big { margin: 0; font-family: var(--display); font-size: clamp(30px, 9vw, 44px); line-height: 1.25; text-align: center; line-break: strict; }
.it-scale { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; font-weight: 900; }
.it-scale span { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 7.5em; text-align: center; line-break: strict; }
.it-scale span b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.it-scale i { height: 6px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, currentColor 15%, transparent), currentColor); }
.it-line { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
.it-line li { display: grid; grid-template-columns: 1.6em minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, currentColor 7%, transparent); border-left: 6px solid var(--mc); font-weight: 900; }
.it-line li em { font-style: normal; opacity: .55; font-variant-numeric: tabular-nums; }
.it-line li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it-line li.empty { border-left-color: transparent; border: 1.5px dashed color-mix(in srgb, currentColor 30%, transparent); background: none; font-weight: 700; opacity: .7; }
.it-line li b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.it-line.reveal li b { animation: reveal .35s var(--d) both; }
.it-line.reveal li.bad { background: rgba(255,59,59,.14); }
.it-line.reveal li.bad b { color: #ff3b3b; }
.mode-card .vote-rule[style*="--d"] { animation: reveal .35s var(--d) both; }
/* 神経衰弱 */
#stage.mm { gap: 10px; }
.mm-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mm-info .who b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.mm-hint { font-size: 14px; font-weight: 900; color: var(--muted); white-space: nowrap; }
.mm-scores { display: flex; flex-wrap: wrap; gap: 6px; }
.mm-scores span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 900; border: 1.5px solid transparent; }
.mm-scores span.on { border-color: var(--mc); }
.mm-scores i { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); }
.mm-scores b { font-family: var(--display); font-weight: 400; font-size: 15px; }

  if (!Array.isArray(v)) return null;
  const seen = new Set(), out = [];
  for (const m of v) {
    const name = String(m?.name ?? "").trim().slice(0, 10);
    if (!name || seen.has(name)) continue;
    seen.add(name); out.push(m.ng ? { name, ng: true } : { name });

  }
  return out.length ? out : null;
};

    g.die = 1 + rnd(6); paintDie();
    if (++k >= 10) { clearInterval(t); g.rolling = false; land(g.die); }
  }, 75);
}
// コマを1マスずつ動かす（表示用の vpos を target まで進める）
function hop(me, target, done) {
  const g = S.game;
  const step = () => {
    if (g.vpos[me] === target) { done(); return; }
    g.vpos[me] += target > g.vpos[me] ? 1 : -1;
    play("step");
    paintBoard();
    setTimeout(step, 260);
  };
  setTimeout(step, 200);
}
// 止まったマスの上に吹き出しを出す（−3マス戻る！など）
function callout(text, at, kind) {
  const b = document.getElementById("board");
  if (!b) return;
  const el = document.createElement("div");
  const { x, y } = pct(at);
  el.className = "sg-callout " + kind;
  el.textContent = text;
  el.style.left = x + "%";
  el.style.top = y + "%";
  // 端のマスでは吹き出しが盤の外にはみ出さんように寄せる
  const tx = x > 66 ? 82 : x < 34 ? 18 : 50;
  el.style.setProperty("--tx", `-${tx}%`);
  el.style.setProperty("--ax", `${tx}%`);
  b.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function land(n) {
  const g = S.game, me = g.cur;
  g.turn++;
  g.hopping = true; render();
  const target = Math.min(GOAL, g.pos[me] + n);
  hop(me, target, () => {
    g.pos[me] = target;
    play("land");
    resolveCell(me); // 進む・戻る・入れ替えで pos が変わることがある
    const after = g.pos.slice();
    // 入れ替えで動いた人はワープ、自分は続けてピョンピョン
    // （入れ替えの相手も吹き出しの後で動かす）
    const finish = () => { g.hopping = false; g.rolled = true; render(true); };
    const c = DATA.board[target];
    if (g.vpos[me] !== after[me] || c.type === "swap") {
      // マイナス・プラス・入れ替えは、いったん止まって吹き出しを出してから動く
      const diff = after[me] - target;
      const text = c.type === "swap" ? "入れ替え！" : diff > 0 ? `+${diff}マス進む！` : `${diff}マス戻る…`;
      callout(text, target, c.type === "swap" ? "swap" : diff > 0 ? "plus" : "minus");
      play(diff < 0 ? "warn" : "coin");
      vib(diff < 0 ? [60, 40, 60] : 40);
      const wait = 1200;
      if (c.type === "swap" || Math.abs(diff) > 6) {
        setTimeout(() => { g.vpos = after.slice(); paintBoard(); setTimeout(finish, 450); }, wait);
      } else setTimeout(() => hop(me, after[me], finish), wait);
    } else setTimeout(finish, 350);
  });
}
function resolveCell(me, pre = "", depth = 0) {
  const g = S.game;
  const c = DATA.board[g.pos[me]];
  const head = `${pre}${g.pos[me]}マス目`;
  const show = (card) => { g.phase = "play"; g.double = false; g.card = card; };
  if (c.type === "start") {
    show({ kind: "START", html: `${nm(me)}はスタートに戻った。次の番まで待機` });
  } else if (c.type === "goal") {
    g.done = true;
    show({ kind: "GOAL", html: `${nm(me)}がゴール！最後に罰が一番多い奴は誰や` });
  } else if (c.type === "odai") {
    const o = drawOdai(me); o.kind = `${head}・${o.kind}`; present(o);
  } else if (c.type === "event") {
    const e = drawEvent(me); if (e.rule) addRule(e.rule); e.card.kind = `${head}・${e.card.kind}`; show(e.card);
  } else if (c.type === "move") {
    g.pos[me] = Math.max(0, Math.min(GOAL, g.pos[me] + c.value));
    // 進むマス：進んだ先のマスのお題もやる（進んだ先がまた進む・戻るなら、そこで止まる）
    if (c.value > 0 && g.pos[me] < GOAL && !depth) { resolveCell(me, `${c.label}で+${c.value}→`, 1); return; }
    const card = { kind: `${head}・${c.label}`, html: fill(c.text, me) };
    if (g.pos[me] === GOAL) { g.done = true; card.html += "　そのままゴール！"; }
    show(card);
  } else if (c.type === "skip") {
    g.skip[me] = true; show({ kind: `${head}・${c.label}`, html: fill(c.text, me) });
  } else if (c.type === "swap") {
    const x = pick(others(me));
    [g.pos[me], g.pos[x]] = [g.pos[x], g.pos[me]];
    show({ kind: `${head}・${c.label}`, html: esc(c.text).replace("{X}", nm(x)) });
  } else if (!usable(c.text)) {
    // 2人やと成立せんマス（指差しとか）は普通のお題に差し替え
    const o = drawOdai(me); o.kind = `${head}・${o.kind}`; present(o);
  } else {
    show(makeCard(`${head}・${c.label}`, c.text, me));
  }
}

// ---------- 称号 ----------
// 結果発表で戦犯以外にもあだ名をつける。同点は並べる
function titles() {
  const g = S.game, st = g.st, n = S.members.length;
  if (!st) return [];
  const out = [];
  const top = (arr, min) => {
    const m = Math.max(...arr);
    if (m < min) return null;
    return arr.map((v, i) => (v === m ? i : -1)).filter((i) => i >= 0);
  };
  const add = (title, idx, desc) => { if (idx && idx.length && idx.length < n) out.push({ title, idx, desc }); };
  // 逃げ切り王：罰が一番少ない（誰かは罰を食らってる時だけ）
  // ノリの化身：パスも当てはまらんも使わず、3枚以上やって罰ゼロ
  const brave = S.members.map((_, i) => i).filter((i) => g.pen[i] === 0 && st.pass[i] === 0 && st.solo[i] >= 3 && !st.notme[i]);
  if (brave.length) add("ノリの化身", brave, "全部やり切って罰ゼロ");
  const maxPen = Math.max(...g.pen), minPen = Math.min(...g.pen);
  const esc2 = g.pen.map((v, i) => (v === minPen && !brave.includes(i) ? i : -1)).filter((i) => i >= 0);
  if (maxPen > 0) add("逃げ切り王", esc2, `罰 ${minPen}回で逃げ切った`);
  const l = top(st.lucky, 1); if (l) add("天使に愛された人", l, `天使 ${st.lucky[l[0]]}回`);
  const r = top(st.rev, 1); if (r) add("リベンジの鬼", r, `押し付け ${st.rev[r[0]]}回`);
  const h = top(st.hit, 2); if (h) add("押し付けられ体質", h, `押し付けられ ${st.hit[h[0]]}回`);
  if (g.mode === "pittari") { const e = top(st.exact, 1); if (e) add("ピッタリ職人", e, `ピッタリ ${st.exact[e[0]]}回`); }
  if (g.mode === "tilt" && g.tl) { const tl = g.tl, ok = S.members.map((_, i) => i).filter((i) => tl.tries[i] && tl.max[i] != null); if (ok.length > 1) { const m = Math.min(...ok.map((i) => tl.max[i])); add("鋼の手", ok.filter((i) => tl.max[i] === m), `最大でも ${m.toFixed(1)}°`); } }
  if (g.mode === "reflex" && g.rf) { const ok = S.members.map((_, i) => i).filter((i) => g.rf.best[i] != null); if (ok.length > 1) { const m = Math.min(...ok.map((i) => g.rf.best[i])); add("反射神経王", ok.filter((i) => g.rf.best[i] === m), `最速 ${m}ミリ秒`); } }
  if (g.mode === "voice" && g.vc) { const b = g.vc.best.map((v) => v ?? 0); const t = top(b, 1); if (t) add("声量おばけ", t, `最大 ${b[t[0]]}`); }
  if (g.mode === "hilo" && g.hl) { const t = top(g.hl.hits, 2); if (t) add("読みの達人", t, `当てた ${g.hl.hits[t[0]]}回`); }
  if (g.mode === "stop" && g.sp) { const t = top(g.sp.exact, 1); if (t) add("ピタ止め職人", t, `ピッタリ ${g.sp.exact[t[0]]}回`); }
  if (g.mode === "shake" && g.sk) { const b = g.sk.best.map((v) => v ?? 0); const t = top(b, 1); if (t && S.members.length > 1) add("シェイク王", t, `10秒で ${b[t[0]]}回`); }
  if (g.mode === "wolf") { const w = top(st.wolf, 1); if (w) add("名演技", w, `ウルフで逃げ切り ${st.wolf[w[0]]}回`); }
  if (g.mode === "vote" && st.votes) { const v = top(st.votes, 2); if (v) add("みんなの的", v, `合計 ${st.votes[v[0]]}票`); }
  const d = top(st.dbl, 1); if (d) add("ギャンブラー", d, `倍プッシュ ${st.dbl[d[0]]}回（成功${st.dwin[d[0]]}）`);
  const p = top(st.pass, 2); if (p) add("パス魔", p, `パス ${st.pass[p[0]]}回`);
  const nm2 = top(st.notme, 2); if (nm2) add("当てはまらん人生", nm2, `当てはまらん ${st.notme[nm2[0]]}回`);
  // 準戦犯：罰が2番目に多い（戦犯とは別の人）
  const sorted = [...new Set(g.pen)].sort((a, b) => b - a);
  if (sorted.length > 2 && sorted[1] > 0) add("あと一歩で戦犯", S.members.map((_, i) => i).filter((i) => g.pen[i] === sorted[1]), `罰 ${sorted[1]}回`);
  // 罰を1人で半分以上背負った
  const total = g.pen.reduce((a, b) => a + b, 0);
  if (total >= 4) { const big = S.members.map((_, i) => i).filter((i) => g.pen[i] * 2 > total); if (big.length) add("全部背負った人", big, `全体の罰の${Math.round((g.pen[big[0]] / total) * 100)}%`); }
  // 天使に見放された：罰3回以上で天使0回
  const nolucky = S.members.map((_, i) => i).filter((i) => g.pen[i] >= 3 && !st.lucky[i] && g.pen[i] === maxPen);

  const whyTop = (key, min, title, unit) => { if (whyN >= 3) return; const a = S.members.map((_, i) => st.why[i]?.[key] || 0); const t = top(a, min); if (t && t.length < n) { add(title, t, `${unit} ${a[t[0]]}回`); whyN++; } };
  whyTop("rule", 2, "ルール破りの常習犯", "違反");
  whyTop("bomb", 1, "爆弾処理班（失敗）", "爆発");
  whyTop("skull", 2, "ドクロの申し子", "ドクロ");
  whyTop("ng", 2, "口がすべる人", "NGワード");
  whyTop("hmlaugh", 1, "笑いの沸点ゼロ", "笑った");
  whyTop("double", 1, "倍プッシュ爆死", "失敗");
  whyTop("stop", 2, "止まられへん人", "止め負け");
  whyTop("reflex", 2, "反応遅め", "負け");
  whyTop("rtap", 2, "爆弾に好かれる人", "爆弾");
  return out.slice(0, 8);
}

// ---------- ワードウルフ ----------
// 全員にお題。ウルフだけちょっと違うお題で、自分がどっちかは分からへん。話して投票（「ウルフはおらん」も選べる）。

//   市民・同票・「おらん」が一番なら、ウルフの勝ちで市民全員の負け
// ・全員市民の回（4人以上、たまに）：「おらん」に入れんかった人（誰かを疑った人）の負け
const WF_MIN = [2, 3, 5];
const WF_NONE = -1; // 投票の「ウルフはおらん」
const wfAuto = (n) => (n >= 10 ? 3 : n >= 7 ? 2 : 1);

const wfCount = (wf, n) => Math.min(wfMax(n), wf.count || wfAuto(n));
const wfPeaceOk = (wf, n) => wf.peace && n >= 4;
function wfRound() {
  const g = S.game, wf = g.wf, n = S.members.length;
  wf.round++;
  let key = S.level;
  if (S.night && !S.members.some((m) => m.ng) && Math.random() < (S.night === "shinya" ? 0.5 : 0.3)) key = S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru";
  wf.night = key === "yoru" || key === "shinya" ? key : false;
  const pair = deckPop("wolf_" + key, DATA.wolf[key]);
  const sw = Math.random() < 0.5;
  wf.maj = sw ? pair[1] : pair[0];
  wf.min = sw ? pair[0] : pair[1];
  // 全員市民の回は6回に1回くらい
  wf.allCit = wfPeaceOk(wf, n) && Math.random() < 1 / 6;
  wf.wolves = wf.allCit ? [] : shuffle(S.members.map((_, i) => i)).slice(0, wfCount(wf, n)).sort((x, y) => x - y);
  const s0 = (wf.round - 1) % n;
  wf.order = S.members.map((_, k) => (s0 + k) % n);
  wf.viewer = wf.order[0]; wf.dealt = 0; wf.dealing = true;
  wf.votes = Array(n).fill(null); wf.k = 0;
  wf.timeUp = false; wf.endAt = 0; wf.top = []; wf.caught = false; wf.guessed = null;
  wf.phase = "hand";

}
const isWolf = (i) => S.game.wf.wolves.includes(i);

// ---------- 傾けたらアウト ----------

const TILT_SEC = 10;

const tiltLive = () => tiltSensor.at && Date.now() - tiltSensor.at < 1500; // センサーの値が来てるか
function tiltBegin() {

// 3・2・1のカウントダウン（傾けたらアウト・全力シェイク・ピタッとストップ共通）。st.n を減らして描き直し、0で go
function count3(st, go, ms) {

  const step = () => {
    if (!Object.values(S.game || {}).includes(st) || st.phase !== "count") return;
    st.n--;

}
function tiltCount() { count3(S.game.tl, tiltGo, 800); }
function tiltGo() {

  const paint = () => {

    const left = tl.endAt - Date.now();

    if (!clock) return;

    clock.querySelector("#tlSec").textContent = s;

    clock.querySelectorAll(".tl-pip").forEach((p, i) => { p.classList.toggle("on", i < sec - 1); p.classList.toggle("now", i === sec - 1); });

// ---------- 全力シェイク ----------
// 1人ずつ10秒間スマホを振って、振った回数を数える。全員振ったら一番少ない人が罰（地獄は2倍）
// 縦・横・前後どの向きでもOK。強い加速度の向きが切り返すのを見て、1往復（振り下ろして戻す）で1回。
// 激しく振ると加速度が下がりきらへんので、強さが落ちるのを待たんと向きで数える。センサーが無いスマホは画面の連打
const SK_SEC = 10;
const SK_HI = 10; // m/s²（重力ぬき）。これより強い揺れだけ数える
const SK_GAP = 70; // ms。これより短い間隔は同じ1回
const skSensor = { at: 0, on: false, perm: "unknown", g: null };
function skListen() {
  if (skSensor.on || typeof window.DeviceMotionEvent === "undefined") return;
  skSensor.on = true;
  window.addEventListener("devicemotion", (e) => {
    let a = e.acceleration, x, y, z;
    if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
    else {
      const G = e.accelerationIncludingGravity; if (!G || G.x == null) return;
      // 重力をゆっくり追いかけて引く
      const g = skSensor.g || (skSensor.g = [G.x, G.y, G.z]);
      for (let k = 0; k < 3; k++) g[k] += ([G.x, G.y, G.z][k] - g[k]) * 0.1;
      x = G.x - g[0]; y = G.y - g[1]; z = G.z - g[2];
    }
    skSensor.at = Date.now();
    skTick(x, y, z);
  });
}
async function skAsk() {
  if (typeof window.DeviceMotionEvent === "undefined") { skSensor.perm = "none"; return; }
  try {
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      skSensor.perm = r === "granted" ? "granted" : "denied";
    } else skSensor.perm = "granted";
  } catch { skSensor.perm = "denied"; }
  if (skSensor.perm === "granted") skListen();
}
const skLive = () => skSensor.at && Date.now() - skSensor.at < 1500;
// 今回の順番（毎回スタートの人をずらす）
const skWho = (sk) => (sk.k + sk.round - 1) % S.members.length;
function skBegin() {
  const sk = S.game.sk;
  sk.who = skWho(sk);
  S.game.doer = sk.who;
  sk.phase = "hand"; sk.cur = 0; sk.dir = null; sk.mag = 0; sk.manual = false;
}
function skCount() { count3(S.game.sk, skGo, 800); }
function skGo() {
  const sk = S.game.sk;
  sk.manual = !skLive();
  sk.phase = "play"; sk.cur = 0; sk.dir = null; sk.flip = 0; sk.last = 0;
  sk.endAt = Date.now() + SK_SEC * 1000; sk.sec = SK_SEC;
  play("coin");
  render(true);
  secClock(sk, () => S.game?.sk === sk, skDone);
}
function skTick(x, y, z) {
  const sk = S.game?.sk;
  if (!sk || sk.phase !== "play" || sk.manual || S.screen !== "shake") return;
  const mag = Math.hypot(x, y, z);
  sk.mag = mag;
  if (mag > SK_HI && Date.now() - sk.last > SK_GAP) {
    const u = [x / mag, y / mag, z / mag], d = sk.dir;
    // 最初の1回か、前に数えた向きと逆向き（切り返し）なら1回
    if (!d) sk.dir = u;
    else if (u[0] * d[0] + u[1] * d[1] + u[2] * d[2] < -0.3) {
      // 切り返しは1往復で2回来るので、1回おきに数える
      sk.dir = u; sk.flip = (sk.flip || 0) + 1; sk.last = Date.now();
      if (sk.flip % 2 === 1) skHit();
    }
  }
  if (!sk.raf) sk.raf = requestAnimationFrame(() => { sk.raf = 0; skPaint(); });
}
function skHit() {
  const sk = S.game.sk;
  sk.cur++; sk.last = Date.now();
  const el = document.getElementById("skCnt");
  if (el) { el.textContent = sk.cur; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  const ph = document.getElementById("skPhone");
  if (ph) ph.style.setProperty("--r", (sk.cur % 2 ? 1 : -1) * 16 + "deg");
}
function skPaint() {
  const sk = S.game?.sk; if (!sk) return;
  const m = document.getElementById("skMeter");
  if (m) m.style.setProperty("--m", Math.min(1, sk.mag / 40).toFixed(3));
}
function skDone() {
  const g = S.game, sk = g.sk;
  stopTimer();
  sk.cnt[sk.who] = sk.cur;
  if (sk.cur > (sk.best[sk.who] ?? -1)) sk.best[sk.who] = sk.cur;
  if (sk.manual) sk.tapped[sk.who] = true;
  g.turn++;
  play("timeup"); vib([250, 120, 250]); // タイムアップの「ブブッ」（Androidだけ。iPhoneのブラウザはバイブ不可）
  if (sk.k + 1 >= S.members.length) {
    // 全員振った：ドラムロールでためてから順位発表
    const min = Math.min(...sk.cnt);
    sk.losers = S.members.map((_, i) => i).filter((i) => sk.cnt[i] === min);
    sk.phase = "tally";
    hold("結果は…", 1800, () => { sk.phase = "rank"; g.doer = -1; });
    return;
  }
  sk.phase = "done";
  render(true);
}
function skRound() {
  const sk = S.game.sk;
  sk.round++; sk.k = 0; sk.cnt = Array(S.members.length).fill(null); sk.losers = [];
  skBegin();
}

// ---------- ピタッとストップ ----------
// 数字が減っていく（or 増えていく）のを、0（or 目標の秒数）ちょうどで止める。行き過ぎたらオーバーでアウト。
// ゆるめ＝ふつうの速さ／普通＝最初に見せた倍率（×0.5・×1.5・×2）でずっと進む／地獄＝それに加えて数字が消えたり邪魔が入ったり
// 全員1回ずつ止めたら答え合わせ：オーバーした人が罰。誰もオーバーしてへんかったら一番遠い人が罰。ピッタリが出たら罰2倍
const SP_RATES = [0.5, 1.5, 2];
const SP_OVER = 1.5; // これだけ行き過ぎたら勝手に止まる
const spLen = (sp) => sp.target; // 動く秒数（表示上）
function spRound() {
  const sp = S.game.sp;
  sp.round++; sp.k = 0; sp.res = Array(S.members.length).fill(null); sp.losers = []; sp.exactAny = false;
  spBegin();
}
const spWho = (sp) => (sp.k + sp.round - 1) % S.members.length;
function spBegin() {
  const sp = S.game.sp;
  sp.who = spWho(sp); S.game.doer = sp.who;
  // 普通・地獄はこの番の倍率を先に決めて見せる。止めるまでずっとこの倍率（体内時計はふつうの速さ）
  sp.rate = S.level === "yurume" || sp.dir === "blind" ? 1 : SP_RATES[rnd(SP_RATES.length)];
  // 目標の秒数は1人ずつ。実際にかかる時間が10秒を超えんように（×0.5の時は3〜5、それ以外は6〜10）
  sp.target = sp.rate < 1 ? 3 + rnd(3) : 6 + rnd(5);
  sp.phase = "hand";
}
function spCount() { count3(S.game.sp, spGo, 700); }
// 表示上の経過（0→target）。dir=down なら target-経過 を見せる
function spGo() {
  const sp = S.game.sp, now = performance.now();
  sp.phase = "play"; sp.el = 0; sp.t0 = now; sp.prev = now;
  sp.hideUntil = 0; sp.nextHide = now + 1400 + Math.random() * 1500;
  sp.jamUntil = 0; sp.jamVal = 0; sp.nextJam = now + 1100 + Math.random() * 1600;
  play("coin");
  render(true);
  cancelAnimationFrame(sp.raf);
  const loop = (t) => {
    if (S.game?.sp !== sp || sp.phase !== "play") return;
    const dt = (t - sp.prev) / 1000; sp.prev = t;
    sp.el += dt * sp.rate;
    if (S.level === "jigoku" && sp.dir !== "blind") {
      // 数字が消える
      if (t > sp.nextHide && sp.hideUntil < t) { sp.hideUntil = t + 600 + Math.random() * 900; sp.nextHide = sp.hideUntil + 900 + Math.random() * 1500; }
      // 邪魔：ウソの数字がチラッと出る・画面がブレる
      if (t > sp.nextJam && sp.jamUntil < t) { sp.jamUntil = t + 220 + Math.random() * 200; sp.jamVal = Math.random() * sp.target; sp.jamKind = rnd(2); sp.nextJam = sp.jamUntil + 700 + Math.random() * 1400; if (sp.jamKind === 1) play("tick"); }
    }
    if (sp.el - spLen(sp) > SP_OVER) { spStop(true); return; }

}
const spFmt = (v) => { const r = Math.round(v * 100) / 100; return (r < 0 ? "-" : "") + Math.abs(r).toFixed(2); }; // -0.00 にならんように
function spShown(sp, el) { return sp.dir === "down" ? sp.target - el : el; }
// 体内時計：最初だけ数字が見えて、あとは頭の中で数える（ゆるめ3秒・普通1秒・地獄0秒）
const SP_PEEK = { yurume: 3, futsu: 1, jigoku: 0 };
function spPaint(t) {
  const sp = S.game.sp, num = document.getElementById("spNum"), box = document.getElementById("spBox");
  if (!num || !box) return;
  const hide = t < sp.hideUntil || (sp.dir === "blind" && sp.el >= (SP_PEEK[S.level] ?? 1)), jam = t < sp.jamUntil;
  num.textContent = hide ? "??.??" : jam && sp.jamKind === 0 ? spFmt(spShown(sp, sp.jamVal)) : spFmt(spShown(sp, sp.el));
  box.classList.toggle("hide", hide);
  box.classList.toggle("jam", jam);
  box.classList.toggle("over", !hide && sp.el > spLen(sp));

  const diff = Math.round((spLen(sp) - sp.el) * 100) / 100; // ＋なら手前、−ならオーバー
  const over = diff < 0, exact = diff === 0;
  sp.res[sp.who] = { v: spShown(sp, sp.el), diff, over, exact };
  if (exact) { sp.exactAny = true; sp.exact[sp.who]++; }
  if (!over && (sp.best[sp.who] == null || diff < sp.best[sp.who])) sp.best[sp.who] = diff;
  g.turn++;
  // まず止めた秒数だけ見せて、ボタンで答え合わせ

  }

}

// 止めた秒数を見たあと：結果を出す
function spReveal() {
  const sp = S.game.sp, r = sp.res[sp.who];
  // ちょっとためてから判定。最後の人はそのまま順位発表まで
  const go = () => {
    if (r.over) { play("boom"); vib([120, 60, 200]); }
    else if (sp.after !== "rank") play(r.exact ? "fanfare" : "coin");
    sp.phase = sp.after;
    if (sp.phase === "rank") S.game.doer = -1;
  };
  // 1人ずつの判定はすぐ。最後の人のあとの順位発表だけためる
  if (sp.after === "rank") hold("結果は…", 1800, go);

}

// ---------- ロシアンタップ ----------

const RT_TILES = { yurume: 20, futsu: 12, jigoku: 8 };
function rtRound() {

// ---------- 爆弾パス ----------
// お題に合うものを言えたら次の人へ渡す。いつ爆発するか分からん。爆発した時に持ってた人が罰
const BP_SEC = { yurume: [15, 30], futsu: [10, 24], jigoku: [6, 16] };
// お題はパスするたびに変わる。パスが進むほど かんたん → ふつう → むずい（地獄は最初から1段上）
const BP_STEP = { yurume: 5, futsu: 4, jigoku: 3 };
const BP_TIER = ["easy", "normal", "hard"], BP_TIER_LABEL = { easy: "かんたん", normal: "ふつう", hard: "むずい" };
function bpTier(bp) { return BP_TIER[Math.min(2, Math.floor(bp.passes / (BP_STEP[S.level] || 4)) + (S.level === "jigoku" ? 1 : 0))]; }

}

  const g = S.game, bp = g.bp, [a, b] = BP_SEC[S.level] || BP_SEC.futsu;

// ---------- ハイ&ロー ----------
