// ---------- helpers ----------
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const colorOf = (i) => COLORS[i % COLORS.length];
const nm = (i) => `<mark style="--mc:${colorOf(i)}">${esc(S.members[i]?.name ?? "誰か")}</mark>`;
const others = (i) => S.members.map((_, j) => j).filter((j) => j !== i);

// {P}{X}{Y}{NETA} を埋める
function fill(tpl, pIdx, opts = {}) {
  const ms = S.members;
  const os = others(pIdx).filter((i) => !opts.noNg || !ms[i].ng);
  let pool = opts.needNeta ? os.filter((i) => ms[i].neta) : os;
  if (!pool.length) pool = os;
  const x = pick(pool);
  const y = pick(os.filter((i) => i !== x));
  return esc(tpl)
    .replaceAll("{P}", nm(pIdx))
    .replaceAll("{X}", nm(x))
    .replaceAll("{Y}", nm(y ?? x))
    .replaceAll("{NETA}", esc(ms[x]?.neta || "アレ"));
}
const textOf = (t) => (typeof t === "string" ? t : t.text);
// 3人以上おらんと成立せえへんお題（2人やと必ず引き分け・全員該当になる）
const NEEDS_3 = /少数派|被らんかった|多数決|一番指された|指差せ|一番似てない|一番低い点|ひとりぼっち|被ったら/;
function usable(t) {
  const s = textOf(t), n = S.members.length;
  if (NEEDS_3.test(s) && n < 3) return false;
  if (s.includes("{Y}") && n < 3) return false;
  if (s.includes("{X}") && n < 2) return false;
  return true;
}

// 人によっては当てはまらんお題（恋人・経験・その場の状況など）。この時だけ「当てはまらん」ボタンを出す
const SITUATIONAL = /元恋人|恋人|キス|初体験|ラブホ|ワンナイト|付き合|好きやった|ドキッとした相手|グイグイ|トイレ|親に|寝言|夢/;
const isSituational = (tpl) => !!tpl && SITUATIONAL.test(tpl);

// 山札：同じお題が続かないように
const decks = {};
function draw(key, list) {
  if (!decks[key] || !decks[key].length) decks[key] = shuffle(list.filter(usable));
  return decks[key].pop(); // 人数的に使えるお題が無ければ undefined
}

// solo=true のカードは「その人がやるお題」= リベンジ・ダブルアップの対象
function makeCard(kind, tpl, p, opts = {}, extra = {}) {
  return { kind, tpl, opts, html: fill(tpl, p, opts), solo: tpl.includes("{P}"), ...extra };
}
// お題の文から「誰が罰か」を読み取って、罰の人を選ぶ時の聞き方にする（例：一番遅い奴が罰 → 一番遅い人は？）
function penHead(tpl) {
  if (!tpl) return "アウトの人は？";
  const s = tpl.replace(/（[^）]*）/g, "");
  if (/黙秘/.test(s)) return "黙秘した人は？";
  if (/一番指された人/.test(s)) return "一番指された人は？";
  if (/一番似てない/.test(s)) return "一番似てなかった人は？";
  if (/詰まったら/.test(s)) return "詰まった人は？";
  const ok = (w) => w && !w.includes("{") && !/^(と|なら|どっち|も|なっ)/.test(w);
  let m = s.match(/([^。、！？「」\s]+?)(?:が|は)罰/);
  if (m) {
    const w = m[1].replace(/奴$/, "人").replace(/^.*?で/, "");
    if (ok(w)) return w + "は？";
  }
  m = s.match(/([^。、！？「」\s]+?)たら(?:\{[PXY]\}が)?(?:2人とも)?罰/);
  if (m) {
    const w = m[1].replace(/^.*[をがにでま]/, "");
    if (ok(w)) return w + "た人は？";
  }
  return "アウトの人は？";
}
// 番の人以外が罰になりうるお題か（勝負・多数決など）。そういう札は「アウト／セーフ」やなくて一覧から選ぶ
function needsPick(tpl) {
  if (!tpl) return true;
  if (/黙秘は罰/.test(tpl)) return false;
  return /が罰|は罰|2人とも罰|両方罰/.test(tpl) || /^\{P\}と\{X\}/.test(tpl);
}
// 勝負のお題（負けた方・先に笑った方…）は誰かが必ずアウトになる
function mustPick(tpl) {
  return !!tpl && /方が罰|2人とも罰/.test(tpl);
}
// 夜お題に巻き込める人（下ネタNGの人は外す）
const okForYoru = (i) => !S.members[i].ng;
function canYoru(tpl, p) {
  // 全員参加の夜お題は、NGの人も指差される側に入ってしまうので、NGが1人でもいたら出さない
  if (tpl.startsWith("全員") && S.members.some((m) => m.ng)) return false;
  const ok = others(p).filter(okForYoru).length;
  if (tpl.includes("{Y}") && ok < 2) return false;
  if (tpl.includes("{X}") && ok < 1) return false;
  return true;
}
function drawOdai(p) {
  // 夜は3回に1回くらい、深夜は毎回下ネタ（NGの人の番だけ普通のお題）
  const rate = S.night === "shinya" ? 1 : CHANCE.yoru;
  if (S.night && okForYoru(p) && Math.random() < rate) {
    for (let k = 0; k < 4; k++) {
      // 深夜×地獄は全部下ネタ（深夜お題だけ）。それ以外の深夜は6割が深夜お題、4割が夜お題
      const deep = S.night === "shinya" && (S.level === "jigoku" || Math.random() < 0.6);
      const tpl = deep ? draw("shinya", DATA.odai.shinya) : draw("yoru", DATA.odai.yoru);
      if (tpl && canYoru(tpl, p)) return makeCard(deep ? "深夜お題" : "夜お題", tpl, p, { noNg: true }, { yoru: true });
    }
  }
  const hasNeta = S.members.some((m, i) => i !== p && m.neta);
  const r = Math.random();
  if (hasNeta && r < CHANCE.neta) { const t = draw("neta", DATA.odai.neta); if (t) return makeCard("イジりお題", t, p, { needNeta: true }); }
  if (r < CHANCE.neta + CHANCE.minna) { const t = draw("minna", DATA.odai.minna); if (t) return makeCard("全員参加", t, p, {}, { solo: false }); }
  return makeCard(`アホお題・${LV[S.level]}`, draw(S.level, DATA.odai[S.level]), p);
}
// 「次の自分の番まで語尾が〜」みたいな、しばらく続く罰・お題
const PERSONAL = /次の(自分の)?番まで/;
// その人の次の番が終わるまで何ターンあるか（すぐ次がその人でも、その番の間は出しとく）
function untilNext(i) { const n = S.members.length; return (((i - S.game.cur + n) % n) || n) + 1; }
function addRule(r) {
  const g = S.game;
  if (!g || (g.mode !== "odai" && g.mode !== "sugoroku" && g.mode !== "memory")) return;
  if (r.who != null) r = { ...r, html: r.html.replace(/次の(自分の)?番まで[、,]?/, "") }; // 「〇〇の次の番まで」は見出しに出すので本文からは省く
  g.rules = [...g.rules.filter((x) => x.html !== r.html), r].slice(-4);
}
function drawEvent(p) {
  const ev = draw("ev", DATA.events);
  const card = makeCard("緊急指令", ev.text, p, {}, { alert: true, solo: false, ruleCard: !!ev.turns });
  // 「次の自分の番まで〜」の指令も、その人の次の番まで上に出しておく（破ったら罰をつけられる）
  const personal = !ev.turns && PERSONAL.test(ev.text);
  if (personal) card.ruleCard = true;
  return { card, rule: ev.turns ? { html: card.html, left: ev.turns, card } : personal ? { html: card.html, left: S.members.length + 1, who: p, card } : null };
}

// ---------- game state ----------
const MODE_NAME = { odai: "アホお題", sugoroku: "すごろく", memory: "神経衰弱", ito: "価値観ナンバー", ngword: "NGワード", vote: "ぶっちゃけ投票" };
const isStage = (sc) => sc in MODE_NAME;
// 結果画面などの「アホお題・普通・12ターン」。NGワードは地獄度を使わへん
const modeLine = (g) => g.mode === "ngword" ? `NGワード・${LV[S.level]}・アウト${g.pen.reduce((a, b) => a + b, 0)}回` : `${MODE_NAME[g.mode]}・${LV[S.level]}・${g.turn || "-"}${g.mode === "vote" || g.mode === "ito" ? "問" : g.mode === "memory" ? "ペア" : "ターン"}`;
function newGame(mode) {
  const n = S.members.length;
  S.game = {
    mode, turn: 0, cur: 0, doer: 0,
    pen: Array(n).fill(0), rev: Array(n).fill(false),
    add: new Map(), rules: [], card: null, pending: null,
    phase: "play", double: false, gacha: [],
    pos: Array(n).fill(0), vpos: Array(n).fill(0), skip: Array(n).fill(false), hopping: false,
    rolled: false, rolling: false, die: 0, done: false,
    bomb: null, bombJust: false, cards: 0,
    // 称号用の記録
    st: { lucky: Array(n).fill(0), pass: Array(n).fill(0), rev: Array(n).fill(0), hit: Array(n).fill(0), dbl: Array(n).fill(0), dwin: Array(n).fill(0), notme: Array(n).fill(0), solo: Array(n).fill(0), votes: Array(n).fill(0), why: Array.from({ length: n }, () => ({})) },
  };
  S.ruleSheet = null;
  S.screen = mode;
  if (mode === "ngword") { S.game.doer = -1; S.game.ng = { phase: "setup", minutes: store.get("nd_ng_min", 10), words: [], viewer: 0, dealing: false, out: null, res: null, left: 0, endAt: 0, topic: null }; render(true); return; }
  if (mode === "vote") { S.game.doer = -1; S.game.vt = { phase: "q", round: 0 }; startVoteRound(); render(true); return; }
  if (mode === "memory") { mmDeal(); render(true); return; }
  if (mode === "ito") { S.game.doer = -1; S.game.it = { phase: "intro", round: 0 }; render(true); return; }
  if (mode === "odai") startOdaiTurn();
  else S.game.card = { kind: "すごろく", html: `${nm(0)}からスタート。サイコロ振れ！` };
  render(true);
}

// 引いたカードを出す。たまにダブルアップチャンスを挟む
function present(card) {
  const g = S.game;
  g.double = false;
  if (card.solo && g.turn > 1 && Math.random() < CHANCE.double) {
    g.pending = card;
    g.phase = "offer";
    g.card = { kind: "倍プッシュのチャンス", html: `${nm(g.doer)}、お題を見る前に倍プッシュするか？` };
  } else {
    g.phase = "play";
    g.card = card;
  }
}

function startOdaiTurn() {
  const g = S.game;
  g.turn++;
  g.doer = g.cur;
  if (g.turn > 2 && Math.random() < CHANCE.event) {
    const e = drawEvent(g.cur);
    if (e.rule) addRule(e.rule);
    g.double = false; g.phase = "play"; g.card = e.card;
  } else {
    present(drawOdai(g.cur));
  }
}

function tickRule() {
  const g = S.game;
  g.rules = g.rules.map((r) => ({ ...r, left: r.left - 1 })).filter((r) => r.left > 0);
}
function addPen(i, n = 1) { const g = S.game; g.add.set(i, (g.add.get(i) || 0) + n); }

// 罰が出たら罰ガチャを挟む。なければそのまま次へ
function finishCard() {
  const g = S.game;
  if (g.card?.solo && g.st) g.st.solo[g.doer]++;
  // 「次の自分の番まで〜」のお題をやり切った（セーフ）なら、その人の次の番までルールとして上に出す
  const c = g.card;
  if (c?.tpl && c.solo && !c.alert && PERSONAL.test(c.tpl) && !g.add.has(g.doer)) addRule({ html: c.html, left: untilNext(g.doer), who: g.doer, card: c });
  if (g.add.size) {
    // たまにラッキー（天使）で帳消し
    g.gacha = [...g.add].map(([i, n]) => ({ i, n, ...drawBatsu(i) }));
    g.phase = "batsu";
    render(true);
  } else advance();
}
// 罰ガチャの中身を1つ引く。夜・深夜は罰も過激に（下ネタNGの人には普通の罰）
function drawBatsu(i) {
  if (Math.random() < CHANCE.lucky) return { lucky: true, html: fill(draw("lucky", DATA.batsu.lucky), i) };
  let list = "bad";
  if (S.night && !S.members[i].ng) {
    const r = Math.random();
    list = S.night === "shinya" ? (S.level === "jigoku" || r < 0.65 ? "shinya" : r < 0.85 ? "yoru" : "bad") : r < 0.4 ? "yoru" : "bad";
  }
  if (list !== "bad") {
    const tpl = draw("batsu_" + list, DATA.batsu[list]);
    // 巻き込む相手（{X}）も下ネタNGやない人だけ。おらんかったら普通の罰
    if (tpl && (!tpl.includes("{X}") || others(i).some(okForYoru))) return { lucky: false, night: list, html: fill(tpl, i, { noNg: true }) };
  }
  return { lucky: false, html: fill(draw("batsu", DATA.batsu.bad), i) };
}
function applyAdds() {
  const g = S.game;
  const saved = new Set((g.gacha || []).filter((x) => x.lucky).map((x) => x.i)); // ラッキーの人は罰なし
  saved.forEach((i) => { if (g.st) g.st.lucky[i]++; });
  // 罰の理由（結果発表の内訳用）
  const why = g.addReason || (g.card?.bomb ? "bomb" : "out");
  // 「次の自分の番まで語尾が〜」の罰は、その人の次の番まで上に出す
  (g.gacha || []).forEach((x) => { if (!x.lucky && PERSONAL.test(x.html)) addRule({ html: `${nm(x.i)}の罰：${x.html}`, left: untilNext(x.i), who: x.i }); });
  g.add.forEach((n, i) => {
    if (saved.has(i)) return;
    g.pen[i] += n; g.rev[i] = true;
    if (g.st) g.st.why[i][why] = (g.st.why[i][why] || 0) + n;
  });
  g.add = new Map();
  g.addReason = null;
}
// カード1枚が終わったあと。時限爆弾の爆発・設置をここで挟む
function advance() {
  const g = S.game;
  applyAdds();
  g.gacha = [];
  g.cards++;
  if (!g.bombJust && g.bomb) {
    if (--g.bomb.left <= 0) {
      const b = g.bomb;
      g.bomb = null; g.bombJust = true;
      g.doer = b.owner; g.double = false; g.phase = "play";
      g.card = { kind: "時限爆弾 ドカン！", bomb: true, alert: true, solo: false, bombCond: b.cond,
        html: `仕掛け人${nm(b.owner)}が発表！爆弾が仕掛けられてから<mark>${esc(b.cond)}</mark>奴は全員罰。自首するか告発しろ` };
      render(true); return;
    }
  } else if (!g.bombJust && !g.done && g.cards >= 2 && Math.random() < CHANCE.bomb) {
    const owner = rnd(S.members.length);
    g.bomb = { cond: draw("bomb", DATA.bombs), owner, left: 3 + rnd(3) };
    g.bombJust = true; g.doer = owner; g.double = false; g.phase = "bombSet";
    g.card = { kind: "時限爆弾セット", bomb: true, alert: true, html: `${nm(owner)}だけ画面を見ろ。他の奴は目そらせ！` };
    render(true); return;
  }
  g.bombJust = false;
  proceed();
}
function proceed() {
  const g = S.game;
  if (g.mode === "odai") {
    tickRule();
    g.cur = (g.cur + 1) % S.members.length;
    startOdaiTurn();
    render(true);
  } else sugoNext();
}

// sugoroku
function rollDice() {
  const g = S.game;
  if (g.rolling || g.rolled) return;
  g.doer = g.cur;
  if (g.skip[g.cur]) {
    g.skip[g.cur] = false;
    g.rolled = true; g.phase = "play";
    g.card = { kind: "1回休み", html: `${nm(g.cur)}は休み。おとなしく見とけ` };
    render(true); return;
  }
  g.rolling = true; render();
  let k = 0;
  const t = setInterval(() => {
    g.die = 1 + rnd(6); paintDie();
    if (++k >= 10) { clearInterval(t); g.rolling = false; land(g.die); }
  }, 75);
}
// コマを1マスずつ動かす（表示用の vpos を target まで進める）
function hop(me, target, done) {
  const g = S.game;
  const step = () => {
    if (g.vpos[me] === target) { done(); return; }
    g.vpos[me] += target > g.vpos[me] ? 1 : -1;
    play("tick");
    paintBoard();
    setTimeout(step, 260);
  };
  setTimeout(step, 200);
}
// 止まったマスの上に吹き出しを出す（−3マス戻る！など）
function callout(text, at, kind) {
  const b = document.getElementById("board");
  if (!b) return;
  const el = document.createElement("div");
  const { x, y } = pct(at);
  el.className = "sg-callout " + kind;
  el.textContent = text;
  el.style.left = x + "%";
  el.style.top = y + "%";
  // 端のマスでは吹き出しが盤の外にはみ出さんように寄せる
  const tx = x > 66 ? 82 : x < 34 ? 18 : 50;
  el.style.setProperty("--tx", `-${tx}%`);
  el.style.setProperty("--ax", `${tx}%`);
  b.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function land(n) {
  const g = S.game, me = g.cur;
  g.turn++;
  g.hopping = true; render();
  const target = Math.min(GOAL, g.pos[me] + n);
  hop(me, target, () => {
    g.pos[me] = target;
    resolveCell(me); // 進む・戻る・入れ替えで pos が変わることがある
    const after = g.pos.slice();
    // 入れ替えで動いた人はワープ、自分は続けてピョンピョン
    // （入れ替えの相手も吹き出しの後で動かす）
    const finish = () => { g.hopping = false; g.rolled = true; render(true); };
    const c = DATA.board[target];
    if (g.vpos[me] !== after[me] || c.type === "swap") {
      // マイナス・プラス・入れ替えは、いったん止まって吹き出しを出してから動く
      const diff = after[me] - target;
      const text = c.type === "swap" ? "入れ替え！" : diff > 0 ? `+${diff}マス進む！` : `${diff}マス戻る…`;
      callout(text, target, c.type === "swap" ? "swap" : diff > 0 ? "plus" : "minus");
      play(diff < 0 ? "warn" : "coin");
      if (navigator.vibrate) navigator.vibrate(diff < 0 ? [60, 40, 60] : 40);
      const wait = 1200;
      if (c.type === "swap" || Math.abs(diff) > 6) {
        setTimeout(() => { g.vpos = after.slice(); paintBoard(); setTimeout(finish, 450); }, wait);
      } else setTimeout(() => hop(me, after[me], finish), wait);
    } else setTimeout(finish, 350);
  });
}
function resolveCell(me) {
  const g = S.game;
  const c = DATA.board[g.pos[me]];
  const head = `${g.pos[me]}マス目`;
  const show = (card) => { g.phase = "play"; g.double = false; g.card = card; };
  if (c.type === "goal") {
    g.done = true;
    show({ kind: "GOAL", html: `${nm(me)}がゴール！最後に罰が一番多い奴は誰や` });
  } else if (c.type === "odai") {
    const o = drawOdai(me); o.kind = `${head}・${o.kind}`; present(o);
  } else if (c.type === "event") {
    const e = drawEvent(me); if (e.rule) addRule(e.rule); e.card.kind = `${head}・${e.card.kind}`; show(e.card);
  } else if (c.type === "move") {
    g.pos[me] = Math.max(0, Math.min(GOAL, g.pos[me] + c.value));
    const card = { kind: `${head}・${c.label}`, html: fill(c.text, me) };
    if (g.pos[me] === GOAL) { g.done = true; card.html += "　そのままゴール！"; }
    show(card);
  } else if (c.type === "skip") {
    g.skip[me] = true; show({ kind: `${head}・${c.label}`, html: fill(c.text, me) });
  } else if (c.type === "swap") {
    const x = pick(others(me));
    [g.pos[me], g.pos[x]] = [g.pos[x], g.pos[me]];
    show({ kind: `${head}・${c.label}`, html: esc(c.text).replace("{X}", nm(x)) });
  } else if (!usable(c.text)) {
    // 2人やと成立せんマス（指差しとか）は普通のお題に差し替え
    const o = drawOdai(me); o.kind = `${head}・${o.kind}`; present(o);
  } else {
    show(makeCard(`${head}・${c.label}`, c.text, me));
  }
}
function sugoNext() {
  const g = S.game;
  if (g.done) { S.screen = "result"; render(true); return; }
  tickRule();
  g.cur = (g.cur + 1) % S.members.length;
  g.doer = g.cur;
  g.rolled = false; g.die = 0; g.phase = "play"; g.double = false;
  g.card = { kind: "すごろく", html: `次は${nm(g.cur)}の番。サイコロ振れ！` };
  render(true);
}

// ---------- 称号 ----------
// 結果発表で戦犯以外にもあだ名をつける。同点は並べる
function titles() {
  const g = S.game, st = g.st, n = S.members.length;
  if (!st) return [];
  const out = [];
  const top = (arr, min) => {
    const m = Math.max(...arr);
    if (m < min) return null;
    return arr.map((v, i) => (v === m ? i : -1)).filter((i) => i >= 0);
  };
  const add = (title, idx, desc) => { if (idx && idx.length && idx.length < n) out.push({ title, idx, desc }); };
  // 逃げ切り王：罰が一番少ない（誰かは罰を食らってる時だけ）
  // ノリの化身：パスも当てはまらんも使わず、3枚以上やって罰ゼロ
  const brave = S.members.map((_, i) => i).filter((i) => g.pen[i] === 0 && st.pass[i] === 0 && st.solo[i] >= 3 && !st.notme[i]);
  if (brave.length) add("ノリの化身", brave, "全部やり切って罰ゼロ");
  const maxPen = Math.max(...g.pen), minPen = Math.min(...g.pen);
  const esc2 = g.pen.map((v, i) => (v === minPen && !brave.includes(i) ? i : -1)).filter((i) => i >= 0);
  if (maxPen > 0) add("逃げ切り王", esc2, `罰 ${minPen}回で逃げ切った`);
  const l = top(st.lucky, 1); if (l) add("天使に愛された人", l, `天使 ${st.lucky[l[0]]}回`);
  const r = top(st.rev, 1); if (r) add("リベンジの鬼", r, `押し付け ${st.rev[r[0]]}回`);
  const h = top(st.hit, 2); if (h) add("押し付けられ体質", h, `押し付けられ ${st.hit[h[0]]}回`);
  if (g.mode === "vote" && st.votes) { const v = top(st.votes, 2); if (v) add("みんなの的", v, `合計 ${st.votes[v[0]]}票`); }
  const d = top(st.dbl, 1); if (d) add("ギャンブラー", d, `倍プッシュ ${st.dbl[d[0]]}回（成功${st.dwin[d[0]]}）`);
  const p = top(st.pass, 2); if (p) add("パス魔", p, `パス ${st.pass[p[0]]}回`);
  const nm2 = top(st.notme, 2); if (nm2) add("当てはまらん人生", nm2, `当てはまらん ${st.notme[nm2[0]]}回`);
  return out.slice(0, 6);
}
const titleNames = (t) => t.idx.map((i) => S.members[i].name).join("・");

// ---------- 画面スリープ防止 ----------
// ゲーム中だけ画面を消さない（対応してないブラウザでは何もしない）
let wakeLock = null;
async function syncWake() {
  const want = isStage(S.screen) && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { syncWake(); });

// ---------- お題の読み上げ ----------
const plain = (html) => html.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
function speak(text) {
  if (!S.voice || !text) return;
  try {
    const sy = window.speechSynthesis;
    if (!sy) return;
    sy.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 1.05; u.pitch = 1.1;
    const v = sy.getVoices().find((x) => x.lang?.startsWith("ja"));
    if (v) u.voice = v;
    sy.speak(u);
  } catch {}
}
function stopSpeak() { try { window.speechSynthesis?.cancel(); } catch {} }
// 今の札の読み上げ用テキスト（仕掛け人だけが見る爆弾の中身は絶対読まない）
function cardSpeech() {
  const g = S.game;
  if (!g) return "";
  if (g.phase === "bombPeek") return "";
  if (g.phase === "batsu") {
    return g.gacha.map((x) => `${S.members[x.i].name}${x.lucky ? "はセーフ。" : "の罰。"}${plain(x.html)}`).join("。");
  }
  return g.card ? plain(g.card.html) : "";
}

// ---------- NGワード ----------
// 1人ずつスマホを回して「自分以外のNGワード」を覚える。自分のワードは自分だけ知らん。言わされたらアウト
// 地獄度で言葉の言いやすさが変わる（ゆるめ=たまにしか言わん、地獄=絶対言うてまう口ぐせ）。
// 夜・深夜は恋愛・下ネタ寄りのワードも混ざる（下ネタNGの人には配らへん）
const NG_LV = { yurume: "たまにしか言わん言葉", futsu: "そこそこ言う言葉", jigoku: "絶対言うてまう口ぐせ" };
function ngPick(exclude, i) {
  const used = new Set(exclude);
  let key = S.level;
  if (S.night && i != null && okForYoru(i) && Math.random() < (S.night === "shinya" ? 0.5 : 0.3)) {
    key = S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru";
  }
  const list = DATA.ngwords.words[key];
  for (let k = 0; k < 50; k++) { const w = draw("ngw_" + key, list); if (w && !used.has(w)) return w; }
  return pick(DATA.ngwords.words[S.level].filter((w) => !used.has(w)));
}
function ngDeal() {
  const ng = S.game.ng;
  ng.words = [];
  S.members.forEach((_, i) => ng.words.push(ngPick(ng.words, i)));
  ng.dealing = true; ng.viewer = 0; ng.phase = "hand";
  ng.left = ng.minutes * 60000;
}
// プレイ中だけ時計が進む（見直し・アウト処理の間は止める）
function ngPlay() {
  const ng = S.game.ng;
  ng.phase = "play";
  ng.endAt = ng.minutes ? Date.now() + ng.left : 0;
}
function ngPause() {
  const ng = S.game.ng;
  if (ng.phase === "play" && ng.endAt) ng.left = Math.max(0, ng.endAt - Date.now());
  ng.endAt = 0;
}
function ngOut(i) {
  const g = S.game, ng = g.ng;
  ng.out = i;
  ng.res = drawBatsu(i);
  if (ng.res.lucky) g.st.lucky[i]++;
  else { g.pen[i]++; g.st.why[i].ng = (g.st.why[i].ng || 0) + 1; }
  g.turn++;
  ng.phase = "out";
}
const fmtTime = (ms) => { const t = Math.ceil(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
setInterval(() => {
  const g = S.game;
  if (S.screen !== "ngword" || !g?.ng || g.ng.phase !== "play" || !g.ng.endAt) return;
  const left = g.ng.endAt - Date.now();
  const el = document.getElementById("ngTimer");
  if (left <= 0) { g.ng.left = 0; g.ng.endAt = 0; g.ng.phase = "over"; render(true); return; }
  if (el) { el.textContent = fmtTime(left); el.classList.toggle("hurry", left < 30000); }
}, 250);

// ---------- ぶっちゃけ投票 ----------
// 「この中で一番○○なのは？」に全員がこっそり投票。一番票を集めた人が罰
function startVoteRound() {
  const g = S.game, vt = g.vt, n = S.members.length;
  vt.round++;
  const okIdx = S.members.map((_, i) => i).filter(okForYoru);
  let key = S.level;
  if (S.night && okIdx.length >= 3 && Math.random() < (S.night === "shinya" ? 0.75 : 0.35)) {
    key = S.night === "shinya" && (S.level === "jigoku" || Math.random() < 0.6) ? "shinya" : "yoru";
  }
  vt.night = key === "yoru" || key === "shinya" ? key : false;
  const q = draw("vote_" + key, DATA.vote[key]);
  vt.q = textOf(q);
  vt.good = typeof q === "object" && !!q.good; // 褒める系は票が一番少ない人、イジる系は一番多い人が罰
  // 夜の質問は下ネタNGの人を候補から外す
  vt.cands = S.members.map((_, i) => i).filter((i) => !vt.night || okForYoru(i));
  vt.votes = Array(n).fill(null);
  const s0 = (vt.round - 1) % n;
  vt.order = S.members.map((_, k) => (s0 + k) % n);
  vt.k = 0; vt.phase = "q";
  g.phase = "play"; g.gacha = [];
}
function voteCounts() {
  const vt = S.game.vt, c = Array(S.members.length).fill(0);
  vt.votes.forEach((t) => { if (t != null) c[t]++; });
  return c;
}
function voteReveal() {
  const g = S.game, c = voteCounts();
  c.forEach((v, i) => (g.st.votes[i] += v));
  g.turn++;
  const vt = g.vt, cv = vt.cands.map((i) => c[i]);
  const goal = vt.good ? Math.min(...cv) : Math.max(...cv);
  vt.top = vt.cands.filter((i) => c[i] === goal);
  g.vt.phase = "reveal";
}

// ---------- 神経衰弱 ----------
// 裏向きのカードに「お題に関係するマーク」だけ（📱ならスマホ系のお題）。同じお題の2枚を揃えたら全文が出て、答えたら+1点でもう1回。
// 答えられへんかったら罰ガチャ。ドクロはめくった瞬間に罰ガチャ（天使なら続けてめくれる）。最後に点数が一番低い人が罰
const MM_PAIRS = 7, MM_SKULLS = 2;
// マークにできるお題：「{P}、」で始まる1人用のお題で、マーク表のどれかの言葉が入ってるもの
const MARK_RE = DATA.marks.map(([re, m]) => [new RegExp(re), m]);
function markOf(t) {
  const s = t.replace(/\{[PXY]\}/g, "誰か");
  const hit = MARK_RE.find(([re]) => re.test(s));
  return hit ? hit[1] : null;
}
const mmOk = (t) => /^\{P\}、/.test(t) && usable(t) && !!markOf(t);
function mmDeal() {
  const g = S.game, n = S.members.length;
  g.doer = 0; g.cur = 0;
  // 夜・深夜はお題も夜寄りに混ぜる（下ネタNGの人がおる時は、誰が揃えるか分からんので混ぜへん）
  const pools = [DATA.odai[S.level]];
  if (S.night && !S.members.some((m) => m.ng)) pools.push(DATA.odai.yoru);
  if (S.night === "shinya" && !S.members.some((m) => m.ng)) pools.push(DATA.odai.shinya, DATA.odai.shinya);
  const used = new Set(), pairs = [];
  for (let k = 0; k < 400 && pairs.length < MM_PAIRS; k++) {
    const pool = pick(pools), t = pick(pool);
    if (!mmOk(t)) continue;
    const ch = markOf(t);
    if (used.has(ch)) continue;
    used.add(ch);
    pairs.push({ tpl: t, ch, yoru: pool === DATA.odai.yoru || pool === DATA.odai.shinya, deep: pool === DATA.odai.shinya });
  }
  const cards = [];
  pairs.forEach((p, id) => { cards.push({ id, ...p }, { id, ...p }); });
  for (let k = 0; k < MM_SKULLS; k++) cards.push({ id: -1 - k, skull: true, ch: "" });
  g.mm = { phase: "intro", cards: shuffle(cards).map((c) => ({ ...c, up: false, gone: false, owner: null })), open: [], score: Array(n).fill(0), pairs: pairs.length, done: 0, card: null, res: null, turns: 0 };
  g.turn = 0;
}
function mmNextPlayer() {
  const g = S.game;
  tickRule();
  g.cur = (g.cur + 1) % S.members.length;
  g.doer = g.cur;
  g.mm.turns++;
  g.mm.open = [];
  g.mm.phase = "pick";
}
function mmFlip(k) {
  const g = S.game, mm = g.mm, c = mm.cards[k];
  if (mm.phase !== "pick" || c.up || c.gone) return;
  c.up = true;
  mm.open.push(k);
  if (c.skull) {
    // ドクロ：その場で罰ガチャ。開いてた1枚目は裏に戻す
    c.gone = true;
    mm.open.filter((x) => x !== k).forEach((x) => (mm.cards[x].up = false));
    mm.open = [];
    g.add = new Map([[g.doer, 1]]); g.addReason = "skull";
    g.gacha = [{ i: g.doer, n: 1, ...drawBatsu(g.doer) }];
    g.phase = "batsu"; mm.phase = "skull";
    return;
  }
  if (mm.open.length < 2) return;
  const [a, b] = mm.open.map((x) => mm.cards[x]);
  if (a.id === b.id) {
    // 揃った！お題の全文を出す（{P}はめくった人）
    mm.card = makeCard(a.deep ? "深夜お題" : a.yoru ? "夜お題" : `アホお題・${LV[S.level]}`, a.tpl, g.doer, { noNg: a.yoru }, { yoru: a.yoru });
    mm.phase = "match";
  } else mm.phase = "miss";
}
// 揃ったお題の結果。答えたら+1点でもう1回、答えられへんかったら罰ガチャで次の人へ
function mmAnswer(ok) {
  const g = S.game, mm = g.mm;
  mm.open.forEach((x) => { mm.cards[x].gone = true; mm.cards[x].owner = ok ? g.doer : -1; });
  mm.done++; g.turn = mm.done;
  if (ok) {
    mm.score[g.doer]++;
    // 「次の自分の番まで〜」のお題は上に出す
    if (PERSONAL.test(mm.card.tpl)) addRule({ html: mm.card.html, left: untilNext(g.doer), who: g.doer });
    mm.open = []; mm.card = null;
    mm.phase = mm.done >= mm.pairs ? "over" : "pick";
  } else {
    mm.open = [];
    g.add = new Map([[g.doer, 1]]); g.addReason = "mfail";
    g.gacha = [{ i: g.doer, n: 1, ...drawBatsu(g.doer) }];
    g.phase = "batsu"; mm.phase = "fail";
  }
}
// 罰ガチャを受け入れた後
function mmAfterBatsu() {
  const g = S.game, mm = g.mm;
  const lucky = g.gacha.every((x) => x.lucky);
  applyAdds();
  g.gacha = []; g.phase = "play";
  if (mm.phase === "low") { mm.phase = "end"; return; }
  if (mm.done >= mm.pairs) { mm.phase = "over"; return; }
  // ドクロで天使が出たら、そのまま続けてめくれる
  if (mm.phase === "skull" && lucky) { mm.phase = "pick"; mm.open = []; return; }
  mmNextPlayer();
}
// 全部揃ったら、点数が一番低い人が罰ガチャ
function mmLowest() {
  const sc = S.game.mm.score, m = Math.min(...sc);
  return sc.map((v, i) => (v === m ? i : -1)).filter((i) => i >= 0);
}

// ---------- 価値観ナンバー ----------
// 全員にこっそり1〜100の数字。お題（例：怖いもの）に合わせて自分の数字っぽいものを言って、全員で小さい順に並べる。
// 答え合わせで、隣どうしの順番が逆になってた2人が罰
function itRound() {
  const g = S.game, it = g.it, n = S.members.length;
  it.round++;
  // 夜・深夜はお題も夜寄りに（下ネタNGの人がおる時は混ぜへん）
  let key = S.level;
  if (S.night && !S.members.some((m) => m.ng) && Math.random() < (S.night === "shinya" ? 0.6 : 0.3)) key = S.night === "shinya" && Math.random() < 0.6 ? "shinya" : "yoru";
  it.night = key === "yoru" || key === "shinya" ? key : false;
  it.topic = itTopic(key);
  const nums = shuffle(Array.from({ length: 100 }, (_, i) => i + 1)).slice(0, n);
  it.nums = nums;
  it.order = [];
  it.dealing = true;
  it.viewer = (it.round - 1) % n; // 配る順番も毎回ずらす
  it.seen = 0;
  it.phase = "hand";
  it.bad = [];
}
// お題の山札（文字列やないので普通の draw は使わへん）
function itTopic(key) {
  const k = "ito_" + key;
  if (!decks[k] || !decks[k].length) decks[k] = shuffle(DATA.ito[key]);
  return decks[k].pop();
}
// 並べた順で、隣どうしの数字が逆になってる2人
function itCheck() {
  const it = S.game.it, bad = new Set();
  for (let k = 1; k < it.order.length; k++) {
    const a = it.order[k - 1], b = it.order[k];
    if (it.nums[a] > it.nums[b]) { bad.add(a); bad.add(b); }
  }
  it.bad = [...bad];
  it.phase = "reveal";
  S.game.turn++;
}

// ---------- sound (WebAudio synth, no files) ----------
const SFX = (() => {
  let ctx = null;
  const ac = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch { return null; }
  };
  function tone(freq, dur, type = "sine", vol = 0.2, slideTo = 0, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.3, cutoff = 2000, delay = 0) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay, len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "lowpass"; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  return {
    unlock: () => ac(),
    flip: () => { noise(0.09, 0.22, 3500); tone(420, 0.07, "triangle", 0.06, 700, 0.02); },
    tick: () => tone(1500, 0.025, "square", 0.04),
    coin: () => { tone(1320, 0.07, "square", 0.06); tone(1760, 0.16, "square", 0.06, 0, 0.08); },
    pop: () => { tone(500, 0.09, "sine", 0.22, 1100); tone(900, 0.12, "sine", 0.16, 1500, 0.09); },
    alarm: () => { [0, 0.18, 0.36].forEach((d) => tone(880, 0.12, "square", 0.07, 0, d)); },
    boom: () => { noise(1.1, 0.7, 700); tone(90, 0.8, "sine", 0.55, 35); },
    warn: () => { tone(660, 0.12, "sawtooth", 0.06); tone(440, 0.18, "sawtooth", 0.06, 0, 0.12); },
    lucky: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, "sine", 0.14, 0, i * 0.07)); },
    fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.45 : 0.13, "triangle", 0.16, 0, i * 0.12)); },
  };
})();

// ---------- views: stage ----------
function vChips(head, act, list, showCount = true) {
  const g = S.game;
  return `
  <div class="pen">
    <h3>${head}</h3>
    <div class="chips">
      ${list.map((i) => {
        const on = g.add.has(i) && act === "pen";
        return `<button class="chip" style="--mc:${colorOf(i)}" data-act="${act}" data-i="${i}" aria-pressed="${on}"><span class="dot"></span>${esc(S.members[i].name)}${showCount ? `<span class="n">${g.pen[i]}</span>` : ""}${g.rev[i] ? `<span class="rv" title="リベンジ権あり">↺</span>` : ""}</button>`;
      }).join("")}
    </div>
  </div>`;
}

// 罰をつける人を選ぶタイル。押すと赤くなって「罰」のハンコ
// 罰の人を選ぶ時の聞き方（お題に合わせる）
function penQuestion() {
  const g = S.game, c = g.card || {};
  if (c.bombCond) return `${c.bombCond}人は？`;
  if (g.penOpen === c && c.solo && !needsPick(c.tpl)) return "罰をつける人は？";
  return penHead(c.tpl);
}
function vPenGrid() {
  const g = S.game;
  return `
  <div class="pen-grid-wrap">
    <p class="pen-q">${esc(penQuestion())}<span>タップで罰</span></p>
    <div class="pen-grid ${S.members.length > 6 ? "many" : ""}">
      ${S.members.map((m, i) => {
        const on = g.add.has(i);
        return `<button class="pen-tile ${i === g.doer ? "is-doer" : ""}" style="--mc:${colorOf(i)}" data-act="pen" data-i="${i}" aria-pressed="${on}">
          <span class="bar"></span>
          <span class="nm">${esc(m.name)}</span>
          <span class="meta">${i === g.doer ? `<span class="doer-lbl">いまの番</span>` : ""}${g.rev[i] ? " ↺" : ""}<em>罰${g.pen[i]}</em></span>
          ${on ? `<span class="stamp">罰</span>` : ""}
        </button>`;
      }).join("")}
    </div>
  </div>`;
}
function nextText(base) {
  const g = S.game;
  if (!g.add.size && mustPick(g.card?.tpl)) return `${penHead(g.card.tpl).replace(/は？$/, "")}を選んで`;
  if (!g.add.size) return `アウトなし → ${base}`;
  const names = [...g.add.keys()].map((i) => S.members[i].name);
  return `${names.length > 2 ? names.slice(0, 2).join("・") + ` ほか${names.length - 2}人` : names.join("・")}に罰 → ${base}`;
}

function vControls() {
  const g = S.game, all = S.members.map((_, i) => i);
  const nextLabel = g.mode === "sugoroku" ? (g.done ? "結果発表へ" : "次の人へ") : "次へ";
  switch (g.phase) {
    case "offer":
      return `<div class="choices">
        <button class="choice hot" data-act="double" data-v="1">倍プッシュ<small>成功→押し付け／失敗→罰2倍</small></button>
        <button class="choice" data-act="double" data-v="0">普通に見る<small>いつも通り</small></button>
      </div>`;
    case "revenge":
      return `${vChips(`${esc(S.members[g.doer].name)}のリベンジ。誰に押し付ける？`, "revTo", others(g.doer).filter((i) => !g.card.yoru || okForYoru(i)), false)}
        <button class="ghost" data-act="revCancel">やっぱやめる</button>`;
    case "push":
      return vChips("成功！罰を押し付ける相手をタップ", "pushTo", others(g.doer), false);
    case "batsu":
      return `<button class="big" data-act="accept">${g.gacha.every((x) => x.lucky) ? "ラッキー！" : "受け入れた"} → ${nextLabel}</button>`;
    case "bombSet":
      return `<button class="big" data-act="bombPeek">${esc(S.members[g.doer].name)}が見る</button>`;
    case "bombPeek":
      return `<button class="big" data-act="bombHide">見た！隠して続ける</button>`;
    default: {
      if (g.double) {
        return `<div class="choices">
          <button class="choice hot" data-act="dWin">成功！<small>誰かに罰を押し付ける</small></button>
          <button class="choice" data-act="dLose">失敗…<small>罰2倍</small></button>
        </div>`;
      }
      // 続くルールを出した指令は、今は誰も罰にならへん。上に出しといて、破った時に「違反者に罰」
      if (g.card.ruleCard) return `<button class="big" data-act="next">ルール開始 → ${nextLabel}</button>`;
      const subs = [
        g.card.solo && !g.card.passed && isSituational(g.card.tpl) ? `<button data-act="notme">当てはまらん → 誰かに回す</button>` : "",
        g.card.yoru ? `<button data-act="pass">無理！罰なしでパス</button>` : "",
        g.card.solo && g.rev[g.doer] ? `<button class="revenge" data-act="revenge">↺ リベンジ権を使う</button>` : "",
      ].join("");
      // 1人用のお題は「やった／できんかった」の2択（札のスワイプでもOK）。他の人に罰をつけたい時だけ一覧を開く
      if (g.card.solo && !needsPick(g.card.tpl) && g.penOpen !== g.card) {
        return `
        ${subs ? `<div class="sub-acts">${subs}</div>` : ""}
        <div class="verdict">
          <button class="vd ng" data-act="fail"><b>アウト</b><small>${esc(S.members[g.doer].name)}に罰</small></button>
          <button class="vd ok" data-act="clear"><b>セーフ！</b><small>→ ${nextLabel}</small></button>
        </div>
        <p class="swipe-hint">${earlyTurns() ? `<span>← アウト</span>` : ""}<button class="link" data-act="penOpen">他の人に罰をつける</button>${earlyTurns() ? `<span>セーフ →</span>` : ""}</p>`;
      }
      return `
        ${subs ? `<div class="sub-acts">${subs}</div>` : ""}
        ${vPenGrid()}
        <button class="big ${g.add.size ? "has-pen" : ""}" data-act="next" ${!g.add.size && mustPick(g.card.tpl) ? "disabled" : ""}>${nextText(nextLabel)}</button>`;
    }
  }
}
// 操作のヒントは最初の3枚だけ（慣れたら消えてスッキリ）
const earlyTurns = () => (S.game?.cards ?? 0) < 3;

function cardClass(c) {
  if (c.bomb) return "bombc";
  if (c.kind?.includes("深夜")) return "deep";
  if (c.yoru) return "yoru";
  if (c.alert) return "event";
  return "";
}
function vCard() {
  const g = S.game, anim = S.anim ? (g.card?.alert ? "shake" : "in") : "";
  if (g.phase === "batsu") {
    const allLucky = g.gacha.every((x) => x.lucky);
    const mixed = !allLucky && g.gacha.some((x) => x.lucky);
    return `<div class="odai ${allLucky ? "lucky" : "batsu"} ${anim}" id="card">
      <div class="head"><span>罰ガチャ</span></div>
      ${S.dual ? `<div class="mirror-list">${g.gacha.map((x) => `<p><b>${esc(S.members[x.i].name)}${x.lucky ? "はセーフ" : "の罰"}</b>${x.html}</p>`).join("")}</div><hr class="dual-line">` : ""}
      <div class="skull-wrap">${allLucky ? `${ANGEL}<b>ラッキー！セーフ</b>` : `${SKULL}<b>罰ゲーム確定</b>`}</div>
      <div class="gacha">${g.gacha.map((x, k) => `
        <div class="gacha-item ${x.night ? "night " + x.night : ""}" style="--d:${(k * 0.35).toFixed(2)}s;--mc:${colorOf(x.i)}">

function fitSize(html, small, scale = 1) {
  const n = html.replace(/<[^>]+>/g, "").length;

  const v = (small ? px * 0.88 : px) * scale;
  return `clamp(${Math.round(v * 0.62)}px, ${(v / 3.9).toFixed(1)}vw, ${Math.round(v)}px)`;
}

function shortKind(k) {

function plainKind(c) {
  return !!c.kind && !c.kind.includes("（") && /^(\d+マス目・)?(アホお題|イジりお題|全員参加)/.test(c.kind);
}

  return needsPick(c.tpl) ? "みんなで判定" : "ひとり";
}

function coachKey() {
  const g = S.game, c = g.card || {};
  const keys = [];
  if (g.phase === "offer") keys.push("double");
  if (g.phase === "bombSet") keys.push("bomb");
  if (g.phase === "play" && !g.double) {
    if (c.ruleCard) keys.push("rule");
    else if (c.alert && !c.bomb) keys.push("event");
    if (mustPick(c.tpl)) keys.push("contest");
    if (c.solo && !needsPick(c.tpl) && g.penOpen !== c) keys.push("swipe");
    if (c.solo && !c.passed && isSituational(c.tpl)) keys.push("notme");
    if (c.yoru) keys.push("pass");
    if (c.solo && g.rev[g.doer]) keys.push("revenge");
  }
  return keys.find((k) => !S.seen[k]) || null;
}

      <p class="vote-rule ${vt.good ? "good" : "bad"}">${vt.good ? "褒める系：票が一番<b>少ない</b>人が罰" : "イジる系：票が一番<b>多い</b>人が罰"}</p>

    case "hand": { const v = vt.order[vt.k]; return `<div class="odai ${nc} mode-card center" id="card">

    </div>`; }
    case "vote": { const v = vt.order[vt.k]; return `<div class="odai ${nc} mode-card" id="card">
      <div class="head"><span class="who" style="--mc:${colorOf(v)}"><i></i><b>${mName(v)}</b><small>の投票</small></span></div>
      <p class="vote-q">${esc(vt.q)}</p>
      <div class="pen-grid vote-grid ${n > 6 ? "many" : ""}">${vt.cands.filter((i) => i !== v).map((i) => `<button class="pen-tile" style="--mc:${colorOf(i)}" data-act="vPick" data-i="${i}"><span class="bar"></span><span class="nm">${mName(i)}</span></button>`).join("")}</div>

      return `<div class="odai ${nc} mode-card" id="card">
        ${qHead}
        <p class="vote-q">${esc(vt.q)}</p>
        ${rule}
        <ul class="vbars">${rows.map((r, k) => `<li class="${vt.top.includes(r.i) ? "top" : ""}" style="--mc:${colorOf(r.i)};--d:${(0.15 + (rows.length - k) * 0.12).toFixed(2)}s"><span class="nm">${mName(r.i)}</span><span class="bar"><i style="--w:${max ? (r.v / max) * 100 : 0}%"></i></span><b>${r.v}</b>${vt.top.includes(r.i) ? `<span class="stamp">罰</span>` : ""}</li>`).join("")}</ul>

function vVoteControls() {

function vVote() {

// ---------- 神経衰弱（画面） ----------

  if (c.up) return `<div class="mm-card up ${c.skull ? "is-skull" : ""} ${c.yoru ? "yoru" : ""}">${c.skull ? SKULL : `<b>${esc(c.ch)}</b>`}</div>`;
  return `<button class="mm-card down" data-act="mmFlip" data-i="${k}" ${g.mm.phase !== "pick" ? "disabled" : ""} aria-label="カードをめくる"><span>?</span></button>`;
}
function vMmInfo() {
  const g = S.game, mm = g.mm;
  const hint = mm.phase === "pick" ? (mm.open.length ? "もう1枚めくれ" : "2枚めくれ") : mm.phase === "miss" ? "ハズレ…場所を覚えとけ" : "";
  return `<div class="mm-info">

}

  const g = S.game, mm = g.mm;

    ${vBar()}
    <div class="deck"><div class="odai mode-card mid" id="card">
      <div class="head"><span class="who"><b>神経衰弱</b></span><span class="meta"><i class="tag">${MM_PAIRS}ペア</i></span></div>

      </ol>

  let controls = "";
  if (mm.phase === "miss") controls = `<button class="big" data-act="mmNext">覚えた → ${esc(S.members[(g.cur + 1) % S.members.length].name)}の番</button>`;
  else if (mm.phase === "over") { const low = mmLowest(); controls = `<button class="big has-pen" data-act="mmLow">${low.map((i) => esc(S.members[i].name)).join("・")}に罰ガチャ</button>`; }
  else if (mm.phase === "end") controls = `<button class="big" data-act="end">結果発表</button>`;

function vMmOver() {
  const g = S.game, mm = g.mm, low = mmLowest();
  const rows = S.members.map((m, i) => ({ m, i, v: mm.score[i] })).sort((a, b) => b.v - a.v);
  return `<div class="deck"><div class="odai mode-card" id="card">

    <ul class="vbars">${rows.map((r, k) => `<li class="${low.includes(r.i) ? "top" : ""}" style="--mc:${colorOf(r.i)};--d:${(0.15 + (rows.length - k) * 0.12).toFixed(2)}s"><span class="nm">${esc(r.m.name)}</span><span class="bar"><i style="--w:${Math.max(...mm.score) ? (r.v / Math.max(...mm.score)) * 100 : 0}%"></i></span><b>${r.v}</b>${low.includes(r.i) ? `<span class="stamp">罰</span>` : ""}</li>`).join("")}</ul>
    <p class="vote-rule bad">点数が一番低い人が罰</p>
  </div></div>`;
}
function vMmSheet() {
  const g = S.game, mm = g.mm;
  if (mm.phase === "match") {
    const c = mm.card;
    return `<div class="deck"><div class="odai ${c.kind.includes("深夜") ? "deep" : c.yoru ? "yoru" : ""} ${S.anim ? "in" : ""}" id="card">
      <div class="head">${vWho()}<span class="meta"><i class="tag">揃った！</i></span></div>
      <p class="txt" style="font-size:${fitSize(c.html, true)}"><span>${c.html}</span></p>
    </div></div>
    <div class="verdict">
      <button class="vd ng" data-act="mmNo"><b>答えられへん</b><small>罰ガチャ</small></button>

  return `<div class="deck">${mm.phase === "skull" ? vCard().replace('<span>罰ガチャ</span>', '<span>ドクロをめくった！</span>') : vCard()}</div>

}

const ROWS = Math.ceil(DATA.board.length / COLS);
// ヘビ型：偶数行は左→右、奇数行は右→左
const cellXY = (i) => { const r = Math.floor(i / COLS), c = r % 2 === 0 ? i % COLS : COLS - 1 - (i % COLS); return { r, c }; };
const pct = (i) => { const { r, c } = cellXY(i); return { x: ((c + 0.5) / COLS) * 100, y: ((r + 0.5) / ROWS) * 100 }; };
function cellFace(c) {
  switch (c.type) {
    case "start": return { cls: "c-start", g: "START" };
    case "goal": return { cls: "c-goal", g: "GOAL" };
    case "odai": return { cls: "c-odai", g: "お題" };
    case "move": return { cls: c.value > 0 ? "c-plus" : "c-minus", g: (c.value > 0 ? "+" : "−") + Math.abs(c.value) };
    case "skip": return { cls: "c-skip", g: "休" };
    case "swap": return { cls: "c-swap", g: "⇄" };
    case "event": return { cls: "c-event", g: "！" };
    default: return { cls: "c-text", g: c.short || c.label };
  }
}
function tokenStyle(i) {
  const g = S.game, p = g.vpos[i];
  const same = g.vpos.map((q, k) => (q === p ? k : -1)).filter((k) => k >= 0);
  const k = same.indexOf(i), n = same.length;
  // STARTはコマを下に横並び（「START」の字が隠れんように）。それ以外は重なったら少しずらす
  const off = p === 0 ? [(k - (n - 1) / 2) * Math.min(14, 44 / Math.max(1, n - 1)), 18]
    : n === 1 ? [0, 0] : [((k % 2) - 0.5) * 18, (Math.floor(k / 2) - (n > 2 ? 0.5 : 0)) * 18];
  const { x, y } = pct(p);
  return `left:calc(${x}% + ${off[0]}px);top:calc(${y}% + ${off[1]}px);--mc:${colorOf(i)}${p === 0 ? ";--s:.62" : ""}`;
}
function vBoard() {

      return `<div class="sg-cell ${f.cls}" style="left:${(col / COLS) * 100}%;top:${(r / ROWS) * 100}%;width:${100 / COLS}%;height:${100 / ROWS}%" title="${esc(c.label || "お題")}">

let tipCache = null;

  if (tipCache && tipCache.key === S.game) return tipCache.t;
  let t;

  else if (S.night === "yoru" && Math.random() < 0.6) t = "噂：夜の、さらに奥があるらしい";

// 結果を1枚の画像にする（インスタのストーリーに貼れる縦長）
function resultImage() {

  x.restore();
  x.fillStyle = "#ffd23f"; x.font = `110px ${disp}`; x.fillText("ノリダン", 90, 200);
  x.fillStyle = "#8d857a"; x.font = `900 40px ${body}`;
  x.fillText(modeLine(g), 90, 270);
  x.fillStyle = "#ff2a2a"; x.font = `150px ${disp}`; x.fillText("本日の戦犯", 90, 470);

  const top = rows[0], who = top.n === 0 ? "該当者なし" : rows.filter((r) => r.n === top.n).map((r) => r.m.name).join("・");
  // MVPカード
  x.fillStyle = "rgba(0,0,0,.4)"; roundRect(x, 90, 560, W - 180, 380, 40); x.fill();
  x.fillStyle = "#ffd23f"; roundRect(x, 90, 540, W - 180, 380, 40); x.fill();
  x.fillStyle = "#141210"; x.font = `900 40px ${body}`; x.fillText("MVP（悪い意味で）", 150, 630);
  let size = 130; x.font = `${size}px ${disp}`;

  x.fillText(who, 150, 790);
  x.font = `900 48px ${body}`; x.fillText(top.n === 0 ? "全員セーフ。平和すぎる" : `罰 ${top.n}回`, 150, 870);

  const ts = titles().slice(0, 4);

  let y = 1040;
  rows.slice(0, ts.length ? 6 : 8).forEach((r, k) => {
    x.fillStyle = "#8d857a"; x.font = `900 46px ${body}`; x.fillText(String(k + 1), 110, y);
    x.fillStyle = colorOf(r.i); x.beginPath(); x.arc(205, y - 16, 22, 0, Math.PI * 2); x.fill();
    x.fillStyle = "#f7f3ea"; x.font = `900 54px ${body}`; x.fillText(r.m.name, 260, y);
    x.font = `60px ${disp}`; const s = String(r.n); x.fillText(s, W - 110 - x.measureText(s).width, y);
    x.fillStyle = "rgba(247,243,234,.15)"; x.fillRect(110, y + 26, W - 220, 3);

  // 称号
  if (ts.length) {

      const w = (W - 200) / 2;

      x.fillStyle = "#ffd23f"; x.font = `900 32px ${body}`; x.fillText(t.title, cx + 28, cy + 50);
      let fs = 48; x.font = `900 ${fs}px ${body}`;
      const nmz = titleNames(t);

      x.fillStyle = "#f7f3ea"; x.fillText(nmz, cx + 28, cy + 108);

  x.fillStyle = "#8d857a"; x.font = `900 36px ${body}`;
  x.fillText("ノリで断れない飲み会ゲーム", 90, H - 60);

function roundRect(x, l, t, w, h, r) {
  x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}
async function shareResult() {
  const blob = await resultImage();
  const name = `noridan-${new Date().toISOString().slice(0, 10)}.png`;
  const say = (m) => { S.shareMsg = m; render(); };
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: blob }); say("保存したで。ストーリーに貼ってな"); return; }
  } catch (e) { if (e?.code === "declined") return; }
  try {
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "本日の戦犯" }); return; }
  } catch { return; }
  // 共有できへんブラウザ（パソコン等）は画像をダウンロード
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    say("画像を保存したで"); return;
  } catch {}
  say("この画面では保存できへんかった。スクショで撮ってな");
}

// ---------- render ----------
document.documentElement.lang = "ja"; // 日本語の改行ルール（小さい「ッ」などを行頭に置かへん）を効かせる
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
let lastSoundKey = "";
function render(anim) {
  const sc = S.screen;
  const onStage = isStage(sc);
  document.body.dataset.level = S.level;
  document.body.classList.toggle("stage", onStage);
  if (onStage) document.body.style.setProperty("--pc", S.game.doer >= 0 ? colorOf(S.game.doer) : modeFrame());
  // 夜お題の間だけ照明が落ちてネオン看板に。ホームも夜モード中はネオン
  const c = onStage ? S.game.card : null;
  const vtNight = sc === "vote" && S.game.vt.phase !== "batsu" ? S.game.vt.night : false; // 投票の夜の質問もネオンに
  const neon = !!(c && c.yoru && S.game.phase !== "batsu") || !!vtNight;
  document.body.classList.toggle("neon", neon);
  // 画面の外側（下のホームバーの所など）も同じ色にして、黒い帯が出んようにする
  document.documentElement.style.backgroundColor = getComputedStyle(document.body).getPropertyValue("--bg").trim() || "";
  document.body.classList.toggle("night-home", sc === "home" && !!(S.night || S.nightAsk));
  document.body.classList.toggle("deep", (neon && (vtNight ? vtNight === "shinya" : c.kind?.includes("深夜"))) || (sc === "home" && (S.nightAsk ? S.nightAsk === "shinya" : S.night === "shinya")));
  S.anim = !!anim;
  // 画面が変わった時だけスライドして入ってくる
  const key = sc === "home" ? (S.nightAsk ? "night" : "home" + S.step) : sc;
  const ORDER = { home1: 0, night: 1, home2: 1, odai: 2, sugoroku: 2, memory: 2, ito: 2, ngword: 2, vote: 2, result: 3 };
  const moved = S.navKey && S.navKey !== key;
  const dir = moved && ORDER[key] < ORDER[S.navKey] ? "back" : "fwd";
  S.navKey = key;
  app.innerHTML = sc === "home" ? vHome() : sc === "odai" ? vOdai() : sc === "sugoroku" ? vSugo() : sc === "memory" ? vMemory() : sc === "ito" ? vIto() : sc === "ngword" ? vNg() : sc === "vote" ? vVote() : vResult();
  if (moved) { app.classList.remove("enter-fwd", "enter-back"); void app.offsetWidth; app.classList.add("enter-" + dir); window.scrollTo(0, 0); }
  overlay.innerHTML = S.tut !== null ? vTut() : S.sheet ? vSheet() : S.menu ? vMenu() : S.ruleSheet && onStage ? vRuleSheet() : S.rules ? vRules() : "";
  if (onStage) { fixHeight(); fitCard(); }
  if (anim) { window.scrollTo(0, 0); cue(); speakNow(); }
  if (!onStage && sc !== "result") stopSpeak();
  syncWake();
  const f = document.getElementById("addForm");
  if (f) f.addEventListener("submit", onAdd);
  const nf = document.getElementById("netaForm");
  if (nf) { nf.addEventListener("submit", onNeta); const ni = document.getElementById("inNeta"); ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }

// 画面が変わった時の効果音と演出
function cue() {
  const sc = S.screen;
  if (sc === "result") { play("fanfare"); return; }
  if (sc === "ngword") { const p = S.game.ng.phase; play(p === "out" ? (S.game.ng.res.lucky ? "lucky" : "boom") : p === "over" ? "alarm" : p === "confirm" ? "warn" : "flip"); if (p === "out" && !S.game.ng.res.lucky) boomFlash(); return; }
  if (sc === "ito") { const p = S.game.it.phase; play(p === "batsu" ? (S.game.gacha.every((x) => x.lucky) ? "lucky" : "pop") : p === "reveal" ? (S.game.it.bad.length ? "warn" : "fanfare") : "flip"); return; }
  if (sc === "memory") { const p = S.game.mm.phase; play(p === "skull" ? "boom" : p === "fail" || p === "low" ? (S.game.gacha.every((x) => x.lucky) ? "lucky" : "pop") : p === "match" ? "coin" : p === "miss" ? "warn" : p === "over" ? "fanfare" : "flip"); if (p === "skull") boomFlash(); return; }
  if (sc === "vote") { const p = S.game.vt.phase; play(p === "batsu" ? (S.game.gacha.every((x) => x.lucky) ? "lucky" : "pop") : p === "reveal" ? "fanfare" : "flip"); return; }
  if (sc !== "odai" && sc !== "sugoroku") return;
  const g = S.game, c = g.card || {};
  if (sc === "sugoroku" && !g.rolled) return; // サイコロ待ちの時は鳴らさない
  if (g.phase === "batsu") play(g.gacha.every((x) => x.lucky) ? "lucky" : "pop");
  else if (c.kind?.includes("ドカン")) { play("boom"); boomFlash(); }
  else if (g.phase === "bombSet") play("alarm");
  else if (g.phase === "offer") play("coin");
  else if (c.alert) play("warn");
  else play("flip");
}
// 1画面に固定してるので、お題が札からはみ出す時は文字を小さくして収める
function fitCard() {
  document.querySelectorAll("#card .txt").forEach((t) => {
    let px = parseFloat(getComputedStyle(t).fontSize);
    let guard = 0;
    while (t.scrollHeight > t.clientHeight + 1 && px > 13 && guard++ < 30) { px -= 1.5; t.style.fontSize = px + "px"; }
  });
}
window.addEventListener("resize", () => { if (document.body.classList.contains("stage")) { document.querySelectorAll("#card .txt").forEach((t) => (t.style.fontSize = "")); render(); } });
// 札が変わった時に声で読む
function speakNow() {
  if (!S.voice) return;
  if (S.screen === "result") {
    const g = S.game, m = Math.max(...g.pen);
    speak(m === 0 ? "本日の戦犯は、該当者なし。平和すぎる" : `本日の戦犯は、${S.members.filter((_, i) => g.pen[i] === m).map((x) => x.name).join("と")}。罰${m}回`);
  } else if (S.screen === "odai" || S.screen === "sugoroku") speak(cardSpeech());
  else if (S.screen === "ito") { const it = S.game.it; if (it.phase === "talk") speak(`お題は、${it.topic.t}`); else if (S.game.phase === "batsu") speak(cardSpeech()); }
  else if (S.screen === "memory") { const mm = S.game.mm; if (mm.phase === "match") speak(plain(mm.card.html)); else if (S.game.phase === "batsu") speak(cardSpeech()); }
  else if (S.screen === "vote") { const vt = S.game.vt; if (vt.phase === "q") speak(vt.q); else if (vt.phase === "batsu") speak(cardSpeech()); }
  // NGワードは絶対に読み上げへん（ワードがバレる）
}
// フチの色：番の人がおらんモードは、その時に画面を見てる人の色
function modeFrame() {
  const g = S.game;
  if (g.ng && ["hand", "look"].includes(g.ng.phase)) return colorOf(g.ng.viewer);
  if (g.ng && ["confirm", "out", "eyes", "newword"].includes(g.ng.phase)) return colorOf(g.ng.out);
  if (g.vt && ["hand", "vote"].includes(g.vt.phase)) return colorOf(g.vt.order[g.vt.k]);
  if (g.it && ["hand", "look"].includes(g.it.phase)) return colorOf(g.it.viewer);
  return "#8d857a";
}
function boomFlash() {
  const el = document.createElement("div");
  el.className = "flash";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
  if (navigator.vibrate) navigator.vibrate([80, 40, 160]);
}
function paintDie() { const d = document.getElementById("die"); if (d) d.innerHTML = dieFace(S.game.die); play("tick"); }

function saveMembers() { S.isExample = false; store.set("nd_members", S.members); }
function onAdd(e) {
  e.preventDefault();
  const name = document.getElementById("inName").value.trim();
  if (!name) return;
  if (S.isExample) S.members = [];
  if (S.members.length >= 12) return;
  S.members.push({ name, neta: "" });
  saveMembers(); play("tick"); render();
  document.getElementById("inName").focus();
}
function onNeta(e) {
  e.preventDefault();
  const i = +e.target.dataset.i;
  S.members[i].neta = document.getElementById("inNeta").value.trim();
  S.editing = null; saveMembers(); render();
}
// ゲームを始めた時のメンバーを「前回のメンバー」として3組まで覚えておく
function rememberGroup() {
  if (S.isExample) return;
  const key = S.members.map((m) => m.name).join();
  const gs = (store.get("nd_groups", []) || []).filter((g) => g.map((m) => m.name).join() !== key);
  gs.unshift(S.members.map((m) => ({ ...m })));
  store.set("nd_groups", gs.slice(0, 3));
}

function onClick(e) {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  // シートの中身をタップしても閉じないように
  if ((b.dataset.act === "sheetClose" || b.dataset.act === "menuClose") && b.classList.contains("sheet-back") && e.target.closest("[data-stop]")) return;
  SFX.unlock();
  if (navigator.vibrate && b.tagName === "BUTTON") navigator.vibrate(6); // 押した手応え（Androidのみ）
  const act = b.dataset.act, g = S.game, i = +b.dataset.i;
  switch (act) {
    // home
    case "del": S.members.splice(i, 1); saveMembers(); render(); break;
    case "lv": S.level = b.dataset.v; store.set("nd_level", S.level); render(); break;
    case "step1": S.step = 1; render(); break;
    case "step2": S.step = 2; render(); window.scrollTo(0, 0); break;
    case "start": rememberGroup(); newGame(b.dataset.m); break;
    case "home": S.menu = false; S.screen = "home"; S.step = 2; render(); break;
    case "again": S.shareMsg = ""; newGame(g.mode); break;
    case "end": S.menu = false; applyAdds(); S.shareMsg = ""; S.screen = "result"; render(true); break;
    case "menu": S.menu = true; render(); break;
    case "menuClose": S.menu = false; render(); break;
    case "share": shareResult(); break;
    case "edit": S.editing = i; render(); break;
    case "clearAll": S.members = []; saveMembers(); render(); document.getElementById("inName")?.focus(); break;
    case "loadGroup": {
      const gs = (store.get("nd_groups", []) || []).filter((x) => x.map((m) => m.name).join() !== S.members.map((m) => m.name).join());
      if (gs[i]) { S.members = gs[i].map((m) => ({ ...m })); saveMembers(); render(); }
      break;
    }

    // settings / tutorial
    case "sheet": S.menu = false; S.sheet = true; render(); break;
    case "sheetClose": S.sheet = false; render(); break;
    case "sound": S.sound = !S.sound; store.set("nd_sound", S.sound); render(); if (S.sound) play("pop"); break;
    case "voice": S.voice = !S.voice; store.set("nd_voice", S.voice); render(); if (S.voice) speak("読み上げオン"); else stopSpeak(); break;
    case "dual": S.dual = !S.dual; store.set("nd_dual", S.dual); render(); break;
    case "tut": S.sheet = false; S.tut = 0; render(); break;
    case "tutNext": S.tut++; render(); break;
    case "tutEnd": S.tut = null; store.set("nd_tut", true); render(); break;
    case "flip": S.flip = !S.flip; S.menu = false; render(); break;

    // play
    case "pen": {
      g.add.has(i) ? g.add.delete(i) : g.add.set(i, 1);
      play(g.add.has(i) ? "warn" : "tick");
      if (navigator.vibrate && g.add.has(i)) navigator.vibrate(30);
      const y = window.scrollY;
      render(); window.scrollTo(0, y);
      break;
    }
    case "next": finishCard(); break;
    case "coachReset": S.seen = {}; store.set("nd_seen", {}); store.set("nd_tut", false); S.sheet = false; S.tut = 0; render(); break;
    case "coachOk": S.seen[b.dataset.k] = 1; store.set("nd_seen", S.seen); render(); break;
    case "rules": S.menu = false; S.rules = true; render(); break;
    case "rulesClose": S.rules = false; render(); break;
    case "ruleOpen": S.ruleK = +b.dataset.k; S.ruleSheet = "pick"; render(); break;
    case "ruleClose": S.ruleSheet = null; render(); break;
    case "ruleTo": {
      const { lucky, html } = drawBatsu(i);
      if (lucky) g.st.lucky[i]++;
      else { g.pen[i]++; g.rev[i] = true; g.st.why[i].rule = (g.st.why[i].rule || 0) + 1; }
      S.ruleSheet = { i, lucky, html };
      if (!lucky && PERSONAL.test(html)) addRule({ html: `${nm(i)}の罰：${html}`, left: untilNext(i), who: i });
      play(lucky ? "lucky" : "pop");
      if (navigator.vibrate) navigator.vibrate(lucky ? 30 : [60, 40, 60]);
      render(); break;
    }
    case "clear": g.add = new Map(); finishCard(); break;
    case "fail": g.add = new Map([[g.doer, 1]]); finishCard(); break;
    case "penOpen": g.penOpen = g.card; render(); break;
    case "accept": advance(); break;
    case "roll": rollDice(); break;

    // ダブルアップ
    case "double":
      g.double = b.dataset.v === "1";
      if (g.double) g.st.dbl[g.doer]++;
      g.card = g.pending; g.pending = null; g.phase = "play";
      render(true); break;
    case "dWin": g.st.dwin[g.doer]++; g.phase = "push"; render(); break;
    case "dLose": g.addReason = "double"; addPen(g.doer, 2); finishCard(); break;
    case "pushTo": g.st.hit[i]++; g.addReason = "push"; addPen(i, 1); finishCard(); break;

    // NGワード
    case "ngMin": g.ng.minutes = +b.dataset.v; store.set("nd_ng_min", g.ng.minutes); render(); break;
    case "ngDeal": ngDeal(); render(true); break;
    case "ngSee": g.ng.phase = "look"; render(true); break;
    case "ngNext":
      if (g.ng.dealing && g.ng.viewer + 1 < S.members.length) { g.ng.viewer++; g.ng.phase = "hand"; }
      else { g.ng.dealing = false; ngPlay(); }
      render(true); break;
    case "ngBack": ngPlay(); render(); break;
    case "ngPeek": ngPause(); g.ng.phase = "who"; render(); break;
    case "ngWho": g.ng.viewer = i; g.ng.phase = "hand"; render(true); break;
    case "ngTopic": g.ng.topic = draw("ngt", DATA.ngwords.topics); render(); break;
    case "ngTap": ngPause(); g.ng.out = i; g.ng.phase = "confirm"; render(true); break;
    case "ngNo": ngPlay(); render(); break;
    case "ngYes": ngOut(g.ng.out); render(true); if (navigator.vibrate) navigator.vibrate([80, 40, 160]); break;
    case "ngNew": g.ng.phase = "eyes"; render(true); break;
    case "ngEyes": g.ng.words[g.ng.out] = ngPick(g.ng.words, g.ng.out); g.ng.phase = "newword"; render(true); break;
    case "ngHide": ngPlay(); render(true); break;

    // 価値観ナンバー
    case "itStart": itRound(); render(true); break;
    case "itSee": g.it.phase = "look"; render(true); break;
    case "itNext": {
      const it = g.it, n = S.members.length;
      if (it.dealing && it.seen + 1 < n) { it.seen++; it.viewer = (it.viewer + 1) % n; it.phase = "hand"; }
      else { it.dealing = false; it.phase = "talk"; }
      render(true); break;
    }
    case "itBack": g.it.phase = "talk"; render(); break;
    case "itPeek": g.it.phase = "who"; render(); break;
    case "itWho": g.it.viewer = i; g.it.phase = "hand"; render(true); break;
    case "itSkip": g.it.topic = itTopic(g.it.night || S.level); render(true); break;
    case "itOrder": g.it.phase = "order"; render(true); break;
    case "itTalk": g.it.phase = "talk"; render(); break;
    case "itPut": g.it.order.push(i); play("tick"); render(); break;
    case "itUndo": g.it.order.pop(); render(); break;
    case "itClear": g.it.order = []; render(); break;
    case "itCheck": itCheck(); render(true); break;
    case "itGacha":
      g.add = new Map(g.it.bad.map((t) => [t, 1])); g.addReason = "ito";
      g.gacha = g.it.bad.map((t) => ({ i: t, n: 1, ...drawBatsu(t) }));
      g.phase = "batsu"; g.it.phase = "batsu"; render(true); break;
    case "itAccept": applyAdds(); g.gacha = []; g.phase = "play"; itRound(); render(true); break;
    case "itNew": itRound(); render(true); break;

    // 神経衰弱
    case "mmStart": g.mm.phase = "pick"; render(true); break;
    case "mmFlip": mmFlip(i); render(g.mm.phase !== "pick"); if (g.mm.phase === "pick") play("tick"); break;
    case "mmNext": g.mm.cards.forEach((c) => { if (!c.gone) c.up = false; }); mmNextPlayer(); render(true); break;
    case "mmYes": mmAnswer(true); render(true); break;
    case "mmNo": mmAnswer(false); render(true); break;
    case "mmAccept": mmAfterBatsu(); render(true); break;
    case "mmLow": {
      const low = mmLowest();
      g.add = new Map(low.map((t) => [t, 1])); g.addReason = "mlow";
      g.gacha = low.map((t) => ({ i: t, n: 1, ...drawBatsu(t) }));
      g.phase = "batsu"; g.mm.phase = "low"; render(true); break;
    }

    // ぶっちゃけ投票
    case "vStart": g.vt.phase = "hand"; render(true); break;
    case "vSkip": g.vt.round--; startVoteRound(); render(true); break;
    case "vHand": g.vt.phase = "vote"; render(true); break;
    case "vPick":
      g.vt.votes[g.vt.order[g.vt.k]] = i; g.vt.k++;
      g.vt.phase = g.vt.k < S.members.length ? "hand" : "done";
      play("tick"); if (navigator.vibrate) navigator.vibrate(20);
      render(true); break;
    case "vReveal": voteReveal(); render(true); break;
    case "vGacha":
      g.add = new Map(g.vt.top.map((t) => [t, 1])); g.addReason = "vote";
      g.gacha = [...g.add].map(([t, n]) => ({ i: t, n, ...drawBatsu(t) }));
      g.phase = "batsu"; g.vt.phase = "batsu"; render(true); break;
    case "vNext": applyAdds(); g.gacha = []; startVoteRound(); render(true); break;

    // 夜モード
    case "logo": {
      const now = Date.now();
      S.taps = (S.taps || []).filter((x) => now - x < 2500).concat(now);
      const lg = document.getElementById("logo");
      // 1回タップするごとにロゴが震えて光る（何か起きそう）
      if (lg && S.taps.length < 3) { lg.classList.remove("tease"); void lg.offsetWidth; lg.classList.add("tease"); play("tick"); }
      if (S.taps.length >= 3) {
        S.taps = [];
        if (!S.night) S.nightAsk = "yoru";
        else if (S.night === "yoru") S.nightAsk = "shinya";
        else break; // 深夜はもう一番奥
        play("warn"); render(); window.scrollTo(0, 0);
      }
      break;
    }
    case "nightPick":
      if (b.dataset.v === "off") { S.night = false; store.set("nd_night", false); render(); break; }
      if (b.dataset.v === "shinya" && S.night !== "shinya") { S.nightAsk = "shinya"; render(); window.scrollTo(0, 0); }
      else { S.night = b.dataset.v; store.set("nd_night", S.night); render(); }
      break;
    case "nightOn": S.night = S.nightAsk || "yoru"; S.nightAsk = false; store.set("nd_night", S.night); render(); break;
    case "nightLv": S.night = b.dataset.v; store.set("nd_night", S.night); render(); break;
    case "nightOff": S.night = false; S.nightAsk = false; S.sheet = false; store.set("nd_night", false); render(); break;
    case "nightCancel": S.nightAsk = false; render(); break;
    case "ng": S.members[i].ng = !S.members[i].ng; saveMembers(); render(); break;
    case "pass": g.st.pass[g.doer]++; g.add = new Map(); advance(); break;

    // 時限爆弾
    case "bombPeek":
      g.phase = "bombPeek";
      g.card = { kind: `${S.members[g.doer].name}だけ見てええ`, bomb: true,
        html: `今から<mark style="--mc:#ff7a1a">${esc(g.bomb.cond)}</mark>奴を、こっそり監視しろ。爆発したら発表してもらう` };
      render(true); break;
    case "bombHide": g.bombJust = false; proceed(); break;

    // 当てはまらん → ランダムで別の人に回す（1枚につき1回、NGの人には夜お題を回さない）
    case "notme": {
      const c = g.card, from = g.doer;
      const pool = others(from).filter((j) => !c.yoru || okForYoru(j));
      if (!pool.length || !c.tpl) break;
      const to = pick(pool);
      g.st.notme[from]++;
      g.doer = to;
      g.card = makeCard(c.kind.replace(/（.*）$/, "") + `（${S.members[from].name}は当てはまらん）`, c.tpl, to, c.opts, { yoru: c.yoru, passed: true });
      render(true); break;
    }

    // リベンジ権
    case "revenge": g.phase = "revenge"; render(); break;
    case "revCancel": g.phase = "play"; render(); break;
    case "revTo": {
      const from = g.doer, c = g.card;
      g.rev[from] = false;
      g.st.rev[from]++; g.st.hit[i]++;
      g.doer = i;
      g.card = makeCard(c.kind.replace(/（.*押し付け）$/, "") + `（${S.members[from].name}から押し付け）`, c.tpl, i, c.opts, { alert: true, yoru: c.yoru });
      g.phase = "play";
      render(true); break;
    }
  }
}
app.addEventListener("click", onClick);

// ---------- 画面の高さ ----------
// ホーム画面に追加して全画面で開くと、iPhoneが高さを時計の分だけ短く数えることがある。
// 時計の裏まで描いてる時（上の安全領域がある時）は、画面そのものの高さを使う
function fixHeight() {
  let h = window.innerHeight;
  try {
    const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden";
    document.body.appendChild(probe);
    const top = probe.offsetHeight; probe.remove();
    const portrait = window.innerHeight > window.innerWidth;
    if (standalone && top > 0 && portrait) h = Math.max(h, screen.height);
  } catch {}
  document.documentElement.style.setProperty("--app-h", h + "px");
}
// 起動直後は上の安全領域がまだ0のことがあるので、少し後にも測り直す
fixHeight();
[150, 600, 1500].forEach((ms) => setTimeout(fixHeight, ms));
window.addEventListener("resize", fixHeight);
window.addEventListener("pageshow", fixHeight);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(fixHeight, 100); });
window.addEventListener("orientationchange", () => setTimeout(fixHeight, 300));

// ---------- 札のスワイプ：右でクリア、左で番の人に罰 ----------
let drag = null;
const canSwipe = () => {
  const g = S.game;
  return g && (S.screen === "odai" || S.screen === "sugoroku") && g.phase === "play" && !g.double && g.card?.solo && !needsPick(g.card.tpl) && g.penOpen !== g.card && !(S.screen === "sugoroku" && !g.rolled);
};
app.addEventListener("pointerdown", (e) => {
  const card = e.target.closest("#card");
  if (!card || !canSwipe() || e.target.closest("button")) return;
  drag = { x: e.clientX, y: e.clientY, card, dx: 0, on: false };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  let dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // 縦の動きはスワイプ扱いしない
    drag.on = true; drag.card.classList.add("dragging");
  }
  if (S.flip) dx = -dx; // 上下反転中は左右も逆
  drag.dx = dx;
  const p = Math.max(-1, Math.min(1, dx / 110));
  drag.card.style.transform = `translateX(${S.flip ? -dx : dx}px) rotate(${(S.flip ? -dx : dx) / 18}deg)`;
  drag.card.style.setProperty("--ok", Math.max(0, p).toFixed(2));
  drag.card.style.setProperty("--ng", Math.max(0, -p).toFixed(2));
});
const endDrag = () => {
  if (!drag) return;
  const { card, dx, on } = drag;
  drag = null;
  card.classList.remove("dragging");
  if (!on) return;
  if (Math.abs(dx) > 90) {
    const g = S.game;
    const out = (S.flip ? -dx : dx) > 0 ? 1 : -1;
    card.style.transition = "transform .22s ease-in";
    card.style.transform = `translateX(${out * 520}px) rotate(${out * 24}deg)`;
    if (navigator.vibrate) navigator.vibrate(dx > 0 ? 20 : [30, 30, 30]);
    setTimeout(() => { g.add = dx > 0 ? new Map() : new Map([[g.doer, 1]]); finishCard(); }, 200);
  } else {
    card.style.transition = "transform .3s cubic-bezier(.3,1.6,.5,1)";
    card.style.transform = "";
    card.style.setProperty("--ok", 0); card.style.setProperty("--ng", 0);
  }
};
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
overlay.addEventListener("click", onClick);

render();

</script>
