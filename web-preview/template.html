<title>ノリダン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen party app. A paper お題札 sits on a flat color field (= 地獄度); the frame glows in the current player's color. */
:root {
  color-scheme: dark;
  --ink: #141210;
  --paper: #f7f3ea;
  --cream: #fffaf0;
  --yuru: #ffd23f;
  --futsu: #ff5d8f;
  --jigoku: #0d0b0b;
  --blood: #ff2a2a;
  --night: #b69cff;
  --deep: #ff4fa8;
  --muted: #8d857a;
  --line: rgba(247,243,234,.16);
  --chip: rgba(247,243,234,.08);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;

  /* stage surface, switched by data-level */
  --bg: var(--ink);
  --fg: var(--paper);
  --card-bg: var(--cream);
  --card-fg: var(--ink);
  --card-edge: transparent;
  --pc: var(--yuru); /* current player color */
}
html, body { height: 100%; }
html { height: 100%; background: var(--ink); }
body {
  margin: 0; min-height: 100%; min-height: 100dvh;
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-weight: 500;
  -webkit-tap-highlight-color: transparent;
  transition: background .35s ease, color .35s ease;
  overflow-x: hidden;
}
body.stage[data-level="yurume"] { --bg: var(--yuru); --fg: var(--ink); --muted: rgba(20,18,16,.6); --chip: rgba(20,18,16,.12); --line: rgba(20,18,16,.2); }
body.stage[data-level="futsu"]  { --bg: var(--futsu); --fg: var(--ink); --muted: rgba(20,18,16,.62); --chip: rgba(20,18,16,.12); --line: rgba(20,18,16,.22); }
body.stage[data-level="jigoku"] { --bg: var(--jigoku); --fg: var(--blood); --muted: rgba(255,42,42,.65); --chip: rgba(255,42,42,.14); --line: rgba(255,42,42,.3); --card-bg: #170b0b; --card-fg: var(--blood); --card-edge: rgba(255,42,42,.55); }

#app {
  min-height: 100%; min-height: 100dvh; box-sizing: border-box;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* ホーム画面に追加した時は時計・電池の下から始める */
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 24px;
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yuru); outline-offset: 2px; }
mark { background: none; color: inherit; }

/* player-color frame around the whole screen */
.frame { position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100%); pointer-events: none; z-index: 5; box-shadow: inset 0 0 0 6px var(--pc), inset 0 0 38px color-mix(in srgb, var(--pc) 55%, transparent); transition: box-shadow .4s ease; }
body:not(.stage) .frame { display: none; }

/* ---------- shared bits ---------- */
.h2 { margin: 0; font-size: 12px; letter-spacing: .24em; font-weight: 900; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; }
.warn { font-size: 12px; color: var(--futsu); margin: 0; font-weight: 700; }
/* 上のバーの「結果」ボタン（2回押しで結果発表） */
.bar-res { flex: 0 0 auto; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--fg) 30%, transparent); background: transparent; color: var(--fg); font: inherit; font-size: 12px; font-weight: 900; cursor: pointer; white-space: nowrap; }
.bar-res svg { width: 15px; height: 15px; }
.bar-res span { font-size: 9px; line-height: 1.1; letter-spacing: -.02em; }
.bar-res.armed { background: #ffd23f; color: #141210; border-color: #ffd23f; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.big { width: 100%; padding: 18px; border-radius: 16px; background: var(--fg); color: var(--bg); font-family: var(--display); font-size: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
.big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
.big:disabled { opacity: .35; box-shadow: none; }
.ghost { padding: 15px; border-radius: 14px; border: 2px solid var(--line); font-weight: 900; }
.add-msg { margin: -4px 0 8px; color: #ff6b6b; font-size: 13px; font-weight: 800; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.round-end { grid-template-columns: 1fr 1.4fr; }
.round-end .ghost { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
.round-end .ghost svg { width: 18px; height: 18px; flex: none; }
.round-end .big { font-size: 17px; padding-left: 8px; padding-right: 8px; line-height: 1.15; }
.round-end .big small { display: block; font-size: 11px; opacity: .75; }
.bp-boom-t { font-size: clamp(40px, 13vw, 60px) !important; white-space: nowrap; }
.sp-res.rf-fly { font-size: clamp(40px, 13vw, 60px); white-space: nowrap; }
.hint { margin: -6px 0 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }

/* ---------- home ---------- */
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.logo { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 17vw, 96px); line-height: .95; color: var(--yuru); white-space: nowrap; }
.logo.is-night { color: var(--night); }
.logo.is-deep { color: var(--deep); }
.logo-btn { font: inherit; color: inherit; padding: 0; line-height: inherit; -webkit-user-select: none; user-select: none; }
.catch { margin: 6px 0 0; font-size: 13px; font-weight: 900; letter-spacing: .3em; color: var(--muted); }
.step-dots { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 900; color: var(--muted); letter-spacing: .14em; }
.step-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.step-dots i.on { background: var(--yuru); }

.members { display: flex; flex-direction: column; gap: 8px; }
.mem { display: grid; grid-template-columns: 34px minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 10px 6px 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.mem .dot, .mchip .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: var(--ink); font-size: 15px; }
.mem .nm b { display: block; font-size: 17px; }
.mem .nm span { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.mem .x { width: 36px; height: 36px; border-radius: 8px; color: var(--muted); font-size: 20px; }
.ng { font-size: 11px; font-weight: 900; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ng[aria-pressed="true"] { background: var(--night); color: var(--ink); border-color: transparent; }
.add { display: grid; gap: 8px; }
.add .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.add input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: rgba(247,243,234,.06); color: var(--paper); }
.add input::placeholder { color: var(--muted); }
.btn-add { padding: 0 18px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 900; }
.dock { position: sticky; bottom: 0; padding-block: 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--chip); font-weight: 900; font-size: 14px; }
.mchip .dot { width: 26px; height: 26px; font-size: 12px; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lv { padding: 18px 6px 14px; border-radius: 14px; font-weight: 900; font-size: 17px; border: 2px solid transparent; opacity: .5; transition: opacity .2s, transform .2s; }
.lv[data-v="yurume"] { background: var(--yuru); color: var(--ink); }
.lv[data-v="futsu"] { background: var(--futsu); color: var(--ink); }
.lv[data-v="jigoku"] { background: #000; color: var(--blood); border-color: var(--blood); }
.lv[aria-pressed="true"] { opacity: 1; transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0,0,0,.4); }
.lv small { display: block; font-size: 10px; font-weight: 700; opacity: .75; margin-top: 3px; }
.modes { display: grid; gap: 10px; }
.mode { text-align: left; padding: 18px 16px; border-radius: 16px; background: var(--paper); color: var(--ink); display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.mode b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; }
.mode span { grid-column: 1; font-size: 12px; color: #5d564c; line-height: 1.5; }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-size: 15px; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 999px; }
.mode:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }

/* settings sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; box-sizing: border-box; background: #1d1a17; color: var(--paper); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 88%; overflow-y: auto; animation: rise .28s cubic-bezier(.2,1.2,.4,1); }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(247,243,234,.25); align-self: center; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(247,243,234,.16); font-weight: 900; font-size: 15px; text-align: left; }
.toggle small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.toggle b { padding: 5px 12px; border-radius: 999px; background: rgba(247,243,234,.1); font-size: 12px; flex: none; }
.toggle[aria-pressed="true"] b { background: var(--yuru); color: var(--ink); }
.night-box { padding: 14px; border-radius: 12px; border: 1px solid var(--night); display: flex; flex-direction: column; gap: 10px; }
.night-box .h2 { color: var(--night); }
.vol-row { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px; align-items: center; margin: -2px 0 2px; }
.vol-row span { font-size: 13px; font-weight: 800; opacity: .7; padding: 0 6px 0 2px; }
.vol-row button { padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); font-weight: 900; font-size: 14px; opacity: .6; }
.vol-row button[aria-pressed="true"] { background: var(--cream, #fff); color: var(--ink); opacity: 1; border-color: transparent; }
.night-lv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.night-lv button { padding: 12px 8px; border-radius: 10px; border: 1px solid var(--night); font-weight: 900; font-size: 16px; opacity: .55; }
.night-lv button small { display: block; font-size: 10px; font-weight: 700; margin-top: 2px; }
.night-lv button[aria-pressed="true"] { opacity: 1; background: var(--night); color: var(--ink); }
.night-lv button[data-v="shinya"][aria-pressed="true"] { background: var(--deep); border-color: var(--deep); }
.sheet .ghost { border-color: rgba(247,243,234,.16); }

/* night ask */
.night-ask { display: flex; flex-direction: column; gap: 18px; padding-top: 24px; }
.night-ask .h2 { color: var(--night); }
.night-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(52px, 17vw, 96px); line-height: 1; color: var(--night); }
.night-lead { margin: 0; font-size: 16px; line-height: 1.8; font-weight: 700; }
.night-rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.night-ask .big { background: var(--paper); color: var(--ink); }

/* ---------- tutorial ---------- */
.tut { position: fixed; inset: 0; z-index: 30; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.tut-in { max-width: 520px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.tut-top { display: flex; justify-content: space-between; align-items: center; }
.tut-skip { font-weight: 900; color: var(--muted); padding: 8px; }
.tut-dots { display: flex; gap: 6px; }
.tut-dots i { width: 26px; height: 5px; border-radius: 3px; background: rgba(247,243,234,.18); }
.tut-dots i.on { background: var(--yuru); }
.tut-art { flex: 1; display: grid; place-items: center; min-height: 200px; }
.tut-step { font-size: 12px; font-weight: 900; letter-spacing: .24em; color: var(--yuru); }
.tut h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.2; text-wrap: balance; }
.tut p { margin: 0; font-size: 15px; line-height: 1.85; color: #cfc7bb; font-weight: 700; }
.tut p b { color: var(--paper); }
.tut .big { background: var(--yuru); color: var(--ink); }
.mini-card { width: min(260px, 70vw); aspect-ratio: 3 / 4; border-radius: 18px; background: var(--cream); color: var(--ink); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 10px; box-shadow: 0 0 0 5px var(--pink, var(--futsu)), 0 12px 0 rgba(0,0,0,.4); transform: rotate(-4deg); animation: flipIn .7s cubic-bezier(.2,1.3,.4,1) both; }
.mini-card small { font-size: 10px; font-weight: 900; letter-spacing: .2em; color: #8d857a; }
.mini-card b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.4; }
.tut-icons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
.tut-icons div { border: 1px solid rgba(247,243,234,.16); border-radius: 14px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.tut-icons b { font-size: 15px; }
.tut-icons span { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ---------- stage ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar .pill { font-weight: 900; font-size: 13px; padding: 9px 12px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.bar .tag { font-size: 11px; font-weight: 900; letter-spacing: .18em; color: var(--muted); text-align: center; min-width: 0; }
.bar .tools { display: flex; gap: 6px; }
.bar .icon-btn { width: 38px; height: 38px; border-radius: 999px; }
.bar .icon-btn svg { width: 18px; height: 18px; }
.flipped { transform: rotate(180deg); }
#stage { display: flex; flex-direction: column; gap: 14px; flex: 1; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }

.turn { display: flex; align-items: center; gap: 12px; min-width: 0; }
.turn .who { width: 14px; height: 54px; border-radius: 7px; background: var(--pc); flex: none; box-shadow: 0 0 0 2px var(--fg); }
.turn small { display: block; font-size: 13px; font-weight: 900; letter-spacing: .08em; }
.turn em { display: block; font-style: normal; font-family: var(--display); font-size: clamp(38px, 12vw, 56px); line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rule { border: 2px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.rule b { font-size: 11px; letter-spacing: .12em; white-space: nowrap; }
.rule.bomb { border-style: solid; border-color: var(--fg); }
.rule.bomb > span:nth-child(2) { flex: 1; min-width: 0; }
.rule.bomb .nowrap { display: block; overflow: hidden; text-overflow: ellipsis; }
.rule-out.look { color: var(--fg); border-color: var(--fg); }
.bomb-look .bomb-cond { font-size: 22px; font-weight: 900; line-height: 1.6; margin: 6px 0 2px; }
.bomb-look .bomb-cond mark { background: color-mix(in srgb, var(--mc) 55%, transparent); color: inherit; padding: 0 2px; }
.sheet-note { color: var(--muted); font-size: 13px; font-weight: 700; margin: 4px 0 8px; }
.fuse { position: relative; width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.fuse::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--fg) 0 6px, transparent 6px 10px); animation: burn 1.2s linear infinite; }
@keyframes burn { from { transform: translateX(-10px); } to { transform: translateX(0); } }

.deck { flex: 1; display: flex; flex-direction: column; padding: 6px 0 4px; perspective: 1000px; min-height: 280px; }
.odai { flex: 1; width: 100%; box-sizing: border-box; border-radius: 22px; background: var(--card-bg); color: var(--card-fg); padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 2px var(--card-edge); position: relative; transform-origin: 50% 50%; }
.odai .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; letter-spacing: .18em; opacity: .62; }
.odai .no { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.odai .txt { flex: 1; display: flex; align-items: center; margin: 0; font-family: var(--display); font-size: clamp(26px, 8vw, 38px); line-height: 1.38; overflow-wrap: anywhere; text-wrap: pretty; }
.odai .txt mark { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--mc, var(--yuru)) 75%, transparent) 58%); padding: 0 .06em; }
body[data-level="jigoku"] .odai .txt mark { background: none; text-decoration: underline; text-decoration-color: var(--mc); text-decoration-thickness: .1em; text-underline-offset: .14em; }
.odai .txt.mirror { transform: rotate(180deg); opacity: .92; }
.dual-line { border: 0; border-top: 2px dashed currentColor; opacity: .22; margin: 0; width: 100%; }
.mirror-list { transform: rotate(180deg); display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; }
.mirror-list p { margin: 0; } .mirror-list b { margin-right: 6px; opacity: .75; }
.odai .foot { font-size: 11px; font-weight: 700; opacity: .55; }
.odai.yoru { --card-bg: #1c1328; --card-fg: #f1e8ff; box-shadow: 0 0 0 2px var(--night); }
.odai.deep { --card-bg: #2a0f1f; --card-fg: #ffe3f1; box-shadow: 0 0 0 2px var(--deep); }
.odai.event { --card-bg: var(--ink); --card-fg: var(--yuru); box-shadow: 0 0 0 3px var(--yuru); }
.odai.bombc { --card-bg: #0e0e0e; --card-fg: #fff; box-shadow: 0 0 0 3px #ff7a1a; }
.badge { display: inline-block; font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 999px; background: var(--card-fg); color: var(--card-bg); letter-spacing: .04em; }
.in { animation: flipIn .5s cubic-bezier(.2,1.25,.4,1) both; }
@keyframes flipIn { from { transform: rotateY(-100deg) scale(.92); opacity: .2; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
.shake { animation: flipIn .5s cubic-bezier(.2,1.25,.4,1) both, jolt .5s .45s; }
@keyframes jolt { 0%,100%{transform:none} 15%{transform:translate(-7px,2px) rotate(-1.5deg)} 30%{transform:translate(7px,-2px) rotate(1deg)} 45%{transform:translate(-4px,1px)} 60%{transform:translate(3px,0)} 80%{transform:translate(-1px,0)} }

/* bomb art */
.bomb-art { width: 92px; height: 92px; align-self: center; }
.bomb-art .spark { transform-origin: 70px 14px; animation: spark .18s steps(2) infinite alternate; }
@keyframes spark { from { transform: scale(.7) rotate(0deg); } to { transform: scale(1.15) rotate(25deg); } }
.flash { position: fixed; inset: 0; z-index: 25; pointer-events: none; background: radial-gradient(circle at 50% 55%, #fff 0, #ffd23f 25%, #ff3b1a 55%, transparent 80%); animation: flash .9s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.6); } }

/* coin (double up) */
.coin-wrap { display: flex; justify-content: center; perspective: 600px; }
.coin { width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffd23f 45%, #c9971a); color: #6b4a00; display: grid; place-items: center; font-family: var(--display); font-size: 34px; box-shadow: inset 0 0 0 5px #e8b52a, 0 8px 0 rgba(0,0,0,.25); animation: spinY 1.1s linear infinite; }
@keyframes spinY { to { transform: rotateY(360deg); } }

/* 罰ガチャ：ドクロ */
.odai.batsu { --card-bg: #1a0606; --card-fg: #fff; box-shadow: 0 0 0 3px #e8202a; }
.skull-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.skull-wrap b { font-family: var(--display); font-weight: 400; font-size: 22px; color: #e8202a; letter-spacing: .08em; animation: reveal .3s .35s ease-out both; }
.skull { width: 104px; height: 104px; animation: skullIn .55s cubic-bezier(.3,1.7,.5,1) both, skullBob 1.4s .6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.4)); }
.skull .eye { animation: glow .9s ease-in-out infinite alternate; }
@keyframes skullIn { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.18) rotate(8deg); } to { transform: none; } }
@keyframes skullBob { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
@keyframes glow { from { fill: #e8202a; } to { fill: #ff8a1a; } }
.odai.batsu .gacha-txt b { opacity: .75; }
.odai.batsu .gacha-item.night .gacha-txt b { opacity: 1; color: var(--night); }
.odai.batsu .gacha-item.shinya .gacha-txt b { opacity: 1; color: var(--deep); }
.odai.lucky { --card-bg: #eef6ff; --card-fg: #1c2a4a; box-shadow: 0 0 0 3px #ffd23f; background-image: radial-gradient(circle at 50% 20%, #fffbe6 0, transparent 60%); }
.odai.lucky .skull-wrap b { color: #d99a00; }
.angel { width: 128px; height: 106px; animation: skullIn .6s cubic-bezier(.3,1.7,.5,1) both, float 1.8s .6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
.angel .halo { animation: halo 1.2s ease-in-out infinite alternate; transform-origin: 60px 14px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes halo { from { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1.12); opacity: .7; } }
.gacha-txt .mark { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
.gacha-txt .mark.ok { background: #ffd23f; color: #141210; }
.gacha-txt .mark.ng { background: #e8202a; color: #fff; }

/* 罰ガチャのマシン：約1秒。ガタガタ→カプセルが出て真ん中へ→パカッと割れて結果（中の演出は全部 --gt だけ遅らせる） */
.odai.drum { --gt: 1s; position: relative; }
.g-machine { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; container-type: size; --gmw: min(58cqw, 220px); --gm-out: calc(var(--gmw) * .5); color: var(--card-fg, #141210); pointer-events: none; animation: gmOut .2s .95s ease-in forwards; }
.g-machine > * { grid-area: 1 / 1; }
.g-machine svg { width: min(58%, 220px); height: auto; overflow: visible; animation: gmIn .25s cubic-bezier(.3,1.6,.5,1) both, gmFade .2s .5s ease-in forwards; }
.gm-body { animation: gmShake .14s linear 4; transform-origin: 60px 150px; }
.gm-balls { animation: gmBalls .22s linear 3; transform-origin: 60px 56px; }
.gm-handle { animation: gmHandle .5s cubic-bezier(.5,0,.5,1) both; transform-origin: 60px 116px; }
.gm-cap { position: relative; width: 84px; height: 84px; opacity: 0; animation: gmCap .38s .38s linear both; }
.gm-cap i { position: absolute; left: 0; right: 0; height: 50%; border: 4px solid #141210; box-sizing: border-box; }
.gm-cap .t { top: 0; border-radius: 42px 42px 0 0; border-bottom-width: 2px; background: #e8202a; box-shadow: inset -8px 8px 0 rgba(255,255,255,.3); animation: capT .22s .76s ease-out forwards; }
.gm-cap .b { bottom: 0; border-radius: 0 0 42px 42px; border-top-width: 2px; background: #f7f3ea; animation: capB .22s .76s ease-out forwards; }
.g-machine.lucky .gm-cap .t { background: #ffd23f; }
.gm-cap .ic { position: absolute; inset: 6px; opacity: 0; transform: scale(.4); animation: capIc .3s .78s cubic-bezier(.3,1.7,.5,1) forwards; }
.gm-cap .ic svg { width: 100%; height: 100%; animation: none; }
.gm-burst { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #fff 0, rgba(255,255,255,.7) 30%, transparent 70%); opacity: 0; animation: gmBurst .35s .76s ease-out both; }
.g-machine.lucky .gm-burst { background: radial-gradient(circle, #fff6c2 0, rgba(255,210,63,.7) 30%, transparent 70%); }
@keyframes gmIn { from { transform: scale(.4); opacity: 0; } }
@keyframes gmFade { to { transform: scale(.85); opacity: 0; } }
@keyframes gmShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
@keyframes gmBalls { 0% { transform: rotate(0) translateY(0); } 33% { transform: rotate(12deg) translateY(-3px); } 66% { transform: rotate(-10deg) translateY(2px); } 100% { transform: rotate(0); } }
@keyframes gmHandle { to { transform: rotate(360deg); } }
/* カプセルはマシンの下の取り出し口から出てきて、ポトッと落ちてから真ん中へ */
@keyframes gmCap { 0% { opacity: 1; transform: translateY(var(--gm-out, 90px)) scale(.26) rotate(-90deg); animation-timing-function: ease-out; } 30% { opacity: 1; transform: translateY(calc(var(--gm-out, 90px) + 22px)) scale(.36) rotate(-60deg); animation-timing-function: cubic-bezier(.3,1.5,.5,1); } 100% { opacity: 1; transform: translateY(0) scale(1.25) rotate(0); } }
@keyframes capT { to { transform: translate(-34px, -46px) rotate(-50deg); opacity: 0; } }
@keyframes capB { to { transform: translate(30px, 46px) rotate(40deg); opacity: 0; } }
@keyframes capIc { 60% { opacity: 1; transform: scale(1.35); } 100% { opacity: 1; transform: scale(1.1); } }
@keyframes gmBurst { 0% { opacity: 0; transform: scale(.3); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(2.4); } }
@keyframes gmOut { to { opacity: 0; transform: scale(1.15); visibility: hidden; } }
.odai.drum > :not(.g-machine) { animation: gmShow .01s var(--gt) both; }
@keyframes gmShow { from { visibility: hidden; } to { visibility: visible; } }
.odai.drum .skull { animation-delay: var(--gt), calc(var(--gt) + .6s); }
.odai.drum .angel { animation-delay: var(--gt), calc(var(--gt) + .6s); }
.odai.drum .skull-wrap b { animation-delay: calc(var(--gt) + .35s); }
.odai.drum .rule-pen, .odai.drum .hand-note { animation: reveal .4s calc(var(--gt) + .45s) ease-out both; }
.odai.drum.batsu { animation: jolt .45s var(--gt) both; }
/* 長押しで見る目隠し */
.peek { position: relative; width: 100%; min-height: 120px; display: grid; place-items: center; border-radius: 18px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; perspective: 800px; }
.peek-in { width: 100%; visibility: hidden; opacity: 0; transition: opacity .12s; }
.peek-cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; background: repeating-linear-gradient(135deg, color-mix(in srgb, currentColor 10%, transparent) 0 10px, color-mix(in srgb, currentColor 4%, transparent) 10px 20px); border: 2.5px dashed color-mix(in srgb, currentColor 35%, transparent); transition: opacity .12s, transform .25s; }
.peek-cover b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.peek-cover small { font-size: 12px; font-weight: 900; opacity: .6; }
.peek-ic { width: 34px; height: 34px; opacity: .7; animation: pulse 1.4s ease-in-out infinite; }
.peek-ic svg { width: 100%; height: 100%; }
.peek.on .peek-in { visibility: visible; opacity: 1; animation: peekFlip .25s cubic-bezier(.3,1.4,.5,1) both; }
.peek.on .peek-cover { opacity: 0; transform: rotateX(80deg); pointer-events: none; }
@keyframes peekFlip { from { transform: rotateX(-70deg); } }
.peek .ng-list { overflow: visible; }
/* 人数が多い時は2列にして、長押ししたまま全部見えるように */
.mode-card .peek.many .ng-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.mode-card .peek.many .ng-list li { flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 10px; border-left-width: 5px; }
.mode-card .peek.many .ng-list .nm { font-size: 12px; max-width: 100%; }
.mode-card .peek.many .ng-list b { font-size: clamp(15px, 4.6vw, 19px); white-space: normal; line-height: 1.25; }
/* 残り10秒：画面のフチが赤く脈打つ */
body.hurry10::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; box-shadow: inset 0 0 0 6px #ff2a2a, inset 0 0 60px rgba(255,42,42,.55); animation: hurryPulse 1s ease-in-out infinite; }
@keyframes hurryPulse { 0%, 100% { opacity: .35; } 15% { opacity: 1; } }
/* 罰2倍：元の数に赤い線が引かれて、倍の数がポンと出る */
.x2-old { text-decoration: none; color: #ff6b62; opacity: .85; font-size: .82em; margin-right: 6px; background: linear-gradient(#ff2a2a, #ff2a2a) no-repeat 0 55% / 0% 4px; animation: x2Strike .3s calc(var(--d, 0s) + 1.15s) ease-out forwards; }
.x2-new { text-decoration: none; display: inline-block; color: #ffd23f; font-size: 1.12em; padding: 0 6px; border-radius: 8px; background: rgba(255,42,42,.28); box-shadow: 0 0 0 2px #ff2a2a; animation: x2Pop .45s calc(var(--d, 0s) + 1.45s) cubic-bezier(.3,1.8,.5,1) both; }
.odai.lucky .x2-new { color: inherit; }
@keyframes x2Strike { to { background-size: 100% 4px; opacity: .7; } }
@keyframes x2Pop { from { transform: scale(2.6) rotate(-10deg); opacity: 0; } }
.x2-badge { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 999px; background: #ff2a2a; color: #fff; font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: 0; opacity: 1; animation: x2Pop .4s calc(var(--d, 0s) + 1s) cubic-bezier(.3,1.8,.5,1) both; }
.odai.batsu .gacha-txt b .x2-badge { opacity: 1; }
/* 罰2倍：ドクロが2体に増えて、ギザギザの「×2」がドン。下に「元の数 → 倍の数」のメーター */
.x2-skulls { position: relative; width: 170px; height: 112px; }
.x2-skulls .skull { position: absolute; top: 4px; width: 100px; height: 100px; }
.x2-skulls .skull:nth-of-type(1) { left: 6px; z-index: 1; }
.x2-skulls .skull:nth-of-type(2) { left: 64px; animation: x2Twin .5s calc(var(--gt, 0s) + .45s) cubic-bezier(.3,1.6,.5,1) both, skullBob 1.4s calc(var(--gt, 0s) + 1s) ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes x2Twin { from { transform: translateX(-58px) scale(.8); opacity: 0; } 60% { opacity: 1; } }
.x2-burst { position: absolute; right: -26px; top: -18px; width: 74px; height: 74px; z-index: 2; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); animation: x2Burst .5s calc(var(--gt, 0s) + .75s) cubic-bezier(.3,1.8,.5,1) both, x2Spin 6s calc(var(--gt, 0s) + 1.3s) linear infinite; }
@keyframes x2Burst { from { transform: scale(0) rotate(-120deg); } }
@keyframes x2Spin { from { transform: rotate(0); } 50% { transform: rotate(12deg) scale(1.06); } to { transform: rotate(0); } }
.skull-wrap.x2 b { font-size: 26px; color: #ff2a2a; text-shadow: 0 0 12px rgba(255,42,42,.6); }
.x2-meter + .x2-meter { margin-left: 0; }
.x2-meter { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 14px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 2px rgba(255,42,42,.6); animation: reveal .35s calc(var(--d, 0s) + 1s) both; }
.x2-meter .old { position: relative; font-family: var(--display); font-size: 18px; color: #ff8a80; opacity: .8; }
.x2-meter .old::after { content: ""; position: absolute; left: -3px; right: -3px; top: 52%; height: 4px; border-radius: 2px; background: #ff2a2a; transform: scaleX(0) rotate(-8deg); transform-origin: left; animation: x2Line .3s calc(var(--d, 0s) + 1.25s) ease-out forwards; }
.x2-meter i { width: 18px; height: 18px; color: #ffd23f; animation: x2Arrow .8s calc(var(--d, 0s) + 1.4s) ease-in-out infinite; }
.x2-meter i svg { width: 100%; height: 100%; }
.x2-meter .new { font-family: var(--display); font-size: 30px; line-height: 1; color: #ffd23f; text-shadow: 0 0 14px rgba(255,210,63,.7), 0 3px 0 #b3001b; animation: x2Pop .5s calc(var(--d, 0s) + 1.5s) cubic-bezier(.3,1.8,.5,1) both, x2Glow 1.2s calc(var(--d, 0s) + 2s) ease-in-out infinite alternate; }
@keyframes x2Line { to { transform: scaleX(1) rotate(-8deg); } }
@keyframes x2Arrow { 50% { transform: translateX(4px); } }
@keyframes x2Glow { to { text-shadow: 0 0 22px rgba(255,210,63,1), 0 3px 0 #b3001b; } }
.odai.drum .x2-skulls .skull:nth-of-type(1) { animation-delay: var(--gt), calc(var(--gt) + .6s); }
/* ジェスチャー：ノルマの判定 */
.gs-quota { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 22px; border-radius: 18px; background: color-mix(in srgb, currentColor 7%, transparent); }
.gs-quota small { font-size: 12px; font-weight: 900; opacity: .65; }
.gs-quota b { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 16vw, 68px); line-height: 1; }
.gs-quota b span { font-family: inherit; font-size: 16px; margin-left: 4px; }
.gs-quota em { font-style: normal; font-family: var(--display); font-size: 22px; animation: stamp2 .35s .3s cubic-bezier(.3,1.6,.5,1) both; }
.gs-quota.q-ok em { color: #1f9d55; }
.gs-quota.q-ng em { color: #ff3b3b; }
/* 傾けたらアウト：水準器 */
.tl-lim { margin: 4px 0 0; font-family: var(--display); font-size: 44px; line-height: 1; }
.tl-lim small { display: block; font-family: inherit; font-size: 13px; opacity: .65; margin-top: 4px; }
.tl-count { margin: 0; font-family: var(--display); font-size: clamp(96px, 34vw, 150px); line-height: 1; animation: pulse .8s ease-in-out infinite; }
/* ため（結果の前のドラムロール） */
.hold-card { cursor: pointer; gap: 18px !important; }
.hold-t { white-space: pre-line; line-height: 1.25; margin: 0; font-family: var(--display); font-size: clamp(40px, 13vw, 60px); animation: holdPulse .5s ease-in-out infinite alternate; }
.hold-dots { display: flex; gap: 10px; margin: 0; }
.hold-dots i { width: 14px; height: 14px; border-radius: 50%; background: currentColor; animation: holdDot .6s ease-in-out infinite; }
.hold-dots i:nth-child(2) { animation-delay: .15s; } .hold-dots i:nth-child(3) { animation-delay: .3s; }
.hold-bar { display: block; width: min(70%, 240px); height: 6px; border-radius: 3px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; position: relative; }
.hold-bar::after { content: ""; position: absolute; inset: 0; background: currentColor; transform-origin: left; animation: holdBar var(--hold, 1.8s) linear both; }
@keyframes holdPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
@keyframes holdDot { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-10px); opacity: 1; } }
@keyframes holdBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
/* 1人ずつ出す：行は --d 秒後にポン。罰の人は赤く光る。ボタンは全部出てから */
.rv-item { animation: rvIn .38s cubic-bezier(.2,1.5,.4,1) var(--d, 0s) both; }
.rv-item.lose { animation: rvIn .38s cubic-bezier(.2,1.5,.4,1) var(--d, 0s) both, rvLose .9s ease-out var(--d, 0s) both; }
.rv-late { animation: rvIn .3s ease-out var(--d, 0s) both; }
#stage.rv-skip .rv-item, #stage.rv-skip .rv-late { animation-delay: 0s !important; animation-duration: .01s !important; }
@keyframes rvIn { from { opacity: 0; transform: translateY(12px) scale(.94); visibility: hidden; } to { opacity: 1; transform: none; visibility: visible; } }
@keyframes rvLose { 0% { background: rgba(255, 59, 59, 0); } 25% { background: rgba(255, 59, 59, .6); transform: scale(1.06); } 100% { background: rgba(255, 59, 59, .12); transform: none; } }
@media (prefers-reduced-motion: reduce) { .rv-item, .rv-late { animation-duration: .01s; } .hold-t, .hold-dots i { animation: none; } }
/* 全力シェイク・ピタッとストップの順位表：人数が多い時は詰めて、それでも入らん時は札の中でスクロール（上から） */
body.stage .odai.board-card { overflow-y: auto; justify-content: flex-start !important; }
.mode-card.board-card > :first-child { margin-top: auto; }
.mode-card.board-card > :last-child { margin-bottom: auto; }
.board-card.dense .sk-board { gap: 2px; }
.board-card.dense .sk-board li { font-size: 13px; }
.board-card.dense .sk-board:not(.sp-board) b { font-size: 16px; }
.board-card.dense .sk-bar { height: 8px; }
.board-card.dense .sk-cnt-l b, .board-card.dense .sp-res { font-size: clamp(44px, 14vw, 64px); }
.board-card.dense .sp-verdict { font-size: 22px !important; }
.board-card.dense .ng-lead { font-size: 20px; margin: 4px 0 0; }
@media (max-height: 600px) { .sk-hand .hand-note { display: none; } .sk-safe { font-size: 12px; padding: 8px 10px; line-height: 1.45; } .sk-safe b { font-size: 13px; } }
/* ロシアンタップ */
.rt-who { margin: 0; font-weight: 900; font-size: 18px; }
.rt-grid { display: grid; gap: 8px; width: 100%; max-width: 320px; }
.rt-tile { aspect-ratio: 1; border-radius: 14px; border: 3px solid color-mix(in srgb, currentColor 25%, transparent); background: color-mix(in srgb, var(--pc, #ffd23f) 22%, transparent); color: inherit; font-family: var(--display); font-size: clamp(20px, 7vw, 30px); cursor: pointer; transition: transform .1s; touch-action: manipulation; }
.rt-tile:active { transform: scale(.92); }
.rt-tile.open { background: color-mix(in srgb, currentColor 6%, transparent); border-style: dashed; font-size: clamp(18px, 6vw, 26px); }
.rt-tile.bomb { background: #ff3b3b; border-color: #ff3b3b; animation: skPop .3s ease-out; }
.rt-tile:disabled { cursor: default; }
/* 爆弾パス */
.bp-topic-l { margin: 0; font-size: 12px; font-weight: 800; }
.bp-topic-l > span:first-child { opacity: .6; }
.bp-tier { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; color: #fff; background: #1f9d55; opacity: 1; }
.bp-tier.normal { background: #e8780a; }
.bp-tier.hard { background: #e8202a; }
.bp-topic.bp-hidden { opacity: .35; letter-spacing: .1em; }
.bp-topic { margin: 0; font-family: var(--display); font-size: clamp(30px, 10vw, 44px); line-height: 1.2; }
.bp-bomb { font-size: 72px; line-height: 1; animation: bpTick .5s ease-in-out infinite alternate; }
@keyframes bpTick { from { transform: rotate(-8deg) scale(1); } to { transform: rotate(8deg) scale(1.08); } }
.big.bp-pass { min-height: 76px; font-size: 20px; }
/* ハイ&ロー */
/* 小さい画面：爆弾パス・ハイ&ローを詰める */
@media (max-height: 640px) {
  .bp-card .hand-who .hand-dot, .hl-cardwrap .hand-who .hand-dot { width: 40px; height: 40px; font-size: 18px; }
  .bp-card .hand-who b, .hl-cardwrap .hand-who b { font-size: 28px; }
  .bp-card .bp-topic { font-size: clamp(24px, 8vw, 32px); }
  .bp-card .bp-bomb { font-size: 48px; }
  .bp-card .hand-note { font-size: 12px; }
  .hl-cardwrap .hl-card { width: clamp(72px, 24vw, 96px); }
  .hl-cardwrap .hl-card span { font-size: clamp(34px, 11vw, 48px); }
}
.hl-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
.hl-card { position: relative; width: clamp(92px, 30vw, 124px); aspect-ratio: 5 / 7; border-radius: 14px; background: #fff; color: #141210; border: 3px solid #141210; display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.hl-card span { font-family: var(--display); font-size: clamp(44px, 15vw, 64px); line-height: 1; }
.hl-card i { position: absolute; top: 6px; left: 8px; font-style: normal; font-size: 20px; }
.hl-card.red { color: #e8202a; }
.hl-card.back { background: repeating-linear-gradient(45deg, #e8202a 0 8px, #c41a22 8px 16px); color: #fff; font-family: var(--display); font-size: 48px; }
.hl-card.dim { opacity: .55; transform: scale(.9); }
.hl-card.flip { animation: hlFlip .35s ease-out; }
@keyframes hlFlip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
.big.hl-btn { min-height: 72px; font-size: 22px; }
/* 反射神経バトル */
.rf-play { padding: 10px !important; }
.rf-box { flex: 1; width: 100%; min-height: 220px; border-radius: 18px; display: grid; place-items: center; background: #3a3530; color: #f7f3ea; transition: background .05s; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.rf-box b { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 13vw, 64px); }
/* 反射神経（みんな同時）：エリアの間は隙間（押しても数えへん） */

/* 全力シェイク */

.sk-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }

.tl-play { gap: 10px; justify-content: flex-start !important; padding-top: 14px; }
.tl-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; }
/* 残り秒数：上に大きく。1秒ごとにドクン、目盛りが1個ずつ減る */
.tl-clock { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }

.tl-clock.beat .tl-sec { animation: tlBeat .45s cubic-bezier(.2,1.6,.4,1); }

.tl-pips { display: flex; gap: 5px; width: min(100%, 280px); }

.tl-pip.on { background: var(--pc, #7be36b); }
.tl-pip.now::after { content: ""; position: absolute; inset: 0; background: var(--pc, #7be36b); transform-origin: left; transform: scaleX(var(--f, 1)); }
.tl-clock.hurry .tl-pip.on, .tl-clock.hurry .tl-pip.now::after { background: #ff3b3b; }
@keyframes tlBeat { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }
/* 傾けたらアウト：限界に近づくほどフチが赤く太く、画面の端から赤がにじむ */
body.tl-hot .frame { transition: box-shadow .08s linear, background .08s linear; box-shadow: inset 0 0 0 calc(3px + 13px * var(--tr)) color-mix(in srgb, #ff2a2a calc(var(--tr) * 100%), var(--pc)), inset 0 0 calc(90px * var(--tr)) color-mix(in srgb, #ff2a2a calc(var(--tr) * 100%), var(--pc)); background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, calc(var(--tr) * var(--tr) * .5)) 100%); }
body.tl-edge .frame { animation: tlPulse .35s ease-in-out infinite alternate; }
body.tl-edge .tl-play { animation: tlShake .12s linear infinite; }
body.tl-hot .odai.tl-play { box-shadow: 0 0 0 calc(3px + 2px * var(--tr)) color-mix(in srgb, #ff2a2a calc(var(--tr) * 100%), var(--card-edge)); }
body.tl-hot .tl-deg b { color: color-mix(in srgb, #ff2a2a calc(var(--tr) * 100%), currentColor); }

@keyframes tlPulse { from { opacity: 1; } to { opacity: .55; } }
@keyframes tlShake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -1px); } 75% { transform: translate(-1px, -1px); } }

.tl-timer { font-variant-numeric: tabular-nums; }
.tl-level { position: relative; width: min(64vw, 240px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, #7be36b 26%, transparent) 0 48%, color-mix(in srgb, #ffd23f 22%, transparent) 48% 70%, color-mix(in srgb, #ff2a2a 20%, transparent) 70%); box-shadow: inset 0 0 0 3px color-mix(in srgb, currentColor 30%, transparent); overflow: hidden; }
.tl-ring { position: absolute; inset: 25%; border-radius: 50%; border: 3px dashed #ff2a2a; }
.tl-cross { position: absolute; inset: 0; background: linear-gradient(currentColor, currentColor) center / 2px 100% no-repeat, linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat; opacity: .15; }
.tl-dot { position: absolute; left: 37.5%; top: 37.5%; width: 25%; height: 25%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #7be36b 55%, #2f9e3a); box-shadow: 0 4px 10px rgba(0,0,0,.3); transition: transform .08s linear; }
.tl-dot.warn { background: radial-gradient(circle at 35% 30%, #fff, #ffb02e 55%, #e8780a); }
.tl-dot.crit { background: radial-gradient(circle at 35% 30%, #fff, #ff3b3b 55%, #b5101a); box-shadow: 0 0 0 3px rgba(255,42,42,.35), 0 4px 12px rgba(255,0,0,.5); }
.tl-deg { margin: 0; font-family: var(--display); font-size: 22px; }
.tl-deg b { font-weight: 400; font-size: clamp(44px, 15vw, 64px); font-variant-numeric: tabular-nums; }

.tl-big { margin: 0; font-family: var(--display); font-size: clamp(54px, 18vw, 80px); line-height: 1.05; animation: stamp2 .4s cubic-bezier(.3,1.6,.5,1) both; }

/* gacha capsules */
.gacha { display: flex; flex-direction: column; gap: 14px; width: 100%; }
.gacha-item { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; align-items: center; }

.capsule { position: relative; width: 64px; height: 64px; animation: drop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d); }
.capsule i { position: absolute; left: 0; right: 0; height: 50%; }
.capsule .top { top: 0; border-radius: 32px 32px 0 0; background: var(--mc); box-shadow: inset -6px 6px 0 rgba(255,255,255,.35); animation: popTop .5s calc(var(--d) + .55s) ease-out both; transform-origin: 10% 100%; }
.capsule .bot { bottom: 0; border-radius: 0 0 32px 32px; background: #f2ede4; box-shadow: inset 0 -5px 0 rgba(0,0,0,.08); }
.capsule::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18); }
@keyframes drop { from { transform: translateY(-140px) rotate(-200deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes popTop { 60% { opacity: 1; } to { transform: rotate(-50deg) translate(-2px,-8px); opacity: 0; } }

.capsule .bot { animation: capFade .3s calc(var(--d) + .95s) ease-in both; }
.capsule::after { animation: capFade .3s calc(var(--d) + .95s) ease-in both; }
.capsule .res { font-style: normal; position: absolute; inset: 6px; height: auto; display: grid; place-items: center; border-radius: 50%; background: #e8202a; color: #fff; font-family: var(--display); font-size: 22px; animation: badgeIn .35s calc(var(--d) + 1.05s) cubic-bezier(.3,1.6,.5,1) both; box-shadow: 0 0 0 3px var(--mc); }
.capsule .res.ok { background: #ffd23f; color: #141210; }
.gacha-txt { animation: reveal .4s calc(var(--d) + .8s) ease-out both; }

/* 罰タイル */
.pen-grid-wrap { display: flex; flex-direction: column; gap: 8px; }

/* controls */

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px 10px 10px; border-radius: 999px; background: var(--chip); font-weight: 900; font-size: 15px; border: 2px solid transparent; min-height: 44px; box-sizing: border-box; }

/* ---------- すごろく ---------- */
.sg-callout { --tx: -50%; --ax: 50%; position: absolute; z-index: 5; transform: translate(var(--tx), -150%); white-space: nowrap; font-family: var(--display); font-size: 20px; padding: 8px 14px; border-radius: 14px; box-shadow: 0 0 0 3px var(--ink), 0 6px 0 rgba(0,0,0,.35); animation: callout 1.5s cubic-bezier(.3,1.6,.5,1) both; pointer-events: none; }
.sg-callout::after { content: ""; position: absolute; left: var(--ax); bottom: -9px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: inherit; }

@keyframes callout { 0% { transform: translate(var(--tx), -100%) scale(0); } 15% { transform: translate(var(--tx), -150%) scale(1.15); } 25%, 85% { transform: translate(var(--tx), -150%) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), -170%) scale(.9); opacity: 0; } }
.sugo2 { gap: 12px; }
.sg-board { position: relative; width: 100%; max-width: 100%; }

/* すごろく：進む向きの矢印 */
