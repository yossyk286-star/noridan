.hm-vs span { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.hm-vs span i { width: 60px; height: 60px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 28px; }
.hm-vs span b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 6vw, 28px); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-vs span small { font-size: 13px; font-weight: 900; opacity: .7; }
.hm-vs em { font-style: normal; font-family: var(--display); font-size: 28px; opacity: .6; }
.hm-result { margin: 0; text-align: center; font-family: var(--display); font-size: 22px; color: var(--fg); }
/* 始める前の説明：マークつきで大きめに */
.how.ic { list-style: none; padding: 0; gap: clamp(12px, 2.4vh, 22px); }
.how.ic li { display: grid; grid-template-columns: 1.6em minmax(0,1fr); gap: 10px; align-items: start; font-size: clamp(16px, 2.6vh, 22px); line-height: 1.5; }
.how.ic .ic { display: grid; place-items: center; width: 1.6em; height: 1.5em; color: var(--card-edge); }
.how.ic .ic svg { width: 1.25em; height: 1.25em; }
/* 遊び方（チュートリアル）の絵 */
.tut-modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; width: 100%; max-width: 300px; }
.tut-modes span { padding: 10px 8px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 900; font-size: 14px; text-align: center; white-space: nowrap; }
.tut-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 260px; }
.tut-menu span { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #26221e; color: var(--paper); font-weight: 900; font-size: 15px; }
.tut-menu svg { width: 20px; height: 20px; color: var(--yuru); }
/* 最初の人ルーレット */
.roul { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; width: 100%; }
.roul.many { grid-template-columns: repeat(4, minmax(0,1fr)); }
.roul-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px; border: 2px solid color-mix(in srgb, currentColor 15%, transparent); transition: transform .08s, background-color .08s; min-width: 0; }
.roul-chip i { width: 40px; height: 40px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 20px; opacity: .45; }
.roul-chip b { font-size: 13px; font-weight: 900; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .55; }
.roul-chip.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 22%, transparent); transform: scale(1.06); }
.roul-chip.on i, .roul-chip.on b { opacity: 1; }
.roul-chip.hit { animation: roulHit .5s cubic-bezier(.3,1.6,.5,1); box-shadow: 0 0 0 3px var(--mc); }
@keyframes roulHit { from { transform: scale(1.35); } to { transform: scale(1.06); } }
.roul-res { min-height: 1.4em; }
/* 価値観ナンバー */
.it-num { margin: 0; font-family: var(--display); font-size: clamp(90px, 30vw, 150px); line-height: 1; font-variant-numeric: tabular-nums; }
.it-topic { margin: 0; font-size: 18px; font-weight: 900; }
.it-big { margin: 0; font-family: var(--display); font-size: clamp(30px, 9vw, 44px); line-height: 1.25; text-align: center; line-break: strict; text-wrap: balance; }
.it-big.long { font-size: clamp(24px, 7.2vw, 36px); }
.it-scale { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; font-weight: 900; }
.it-scale span { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 7.5em; text-align: center; line-break: strict; }
.it-scale span b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.it-scale i { height: 6px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, currentColor 15%, transparent), currentColor); }
.it-line { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
.it-line li { display: grid; grid-template-columns: 1.6em minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, currentColor 7%, transparent); border-left: 6px solid var(--mc); font-weight: 900; }
.it-line li em { font-style: normal; opacity: .55; font-variant-numeric: tabular-nums; }
.it-line li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it-line li.empty { border-left-color: transparent; border: 1.5px dashed color-mix(in srgb, currentColor 30%, transparent); background: none; font-weight: 700; opacity: .7; }
.it-line li b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.it-line.reveal li b { animation: reveal .35s var(--d) both; }
.it-line.reveal li.bad { background: rgba(255,59,59,.14); }
.it-line.reveal li.bad b { color: #ff3b3b; }
.mode-card .vote-rule[style*="--d"] { animation: reveal .35s var(--d) both; }
/* 神経衰弱 */
#stage.mm { gap: 10px; }
.mm-info { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mm-info .who b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.mm-hint { font-size: 14px; font-weight: 900; color: var(--muted); white-space: nowrap; }
.mm-scores { display: flex; flex-wrap: wrap; gap: 6px; }
.mm-scores span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 900; border: 1.5px solid transparent; }
.mm-scores span.on { border-color: var(--mc); }
.mm-scores i { width: 9px; height: 9px; border-radius: 50%; background: var(--mc); }
.mm-scores b { font-family: var(--display); font-weight: 400; font-size: 15px; }
.mm-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-template-rows: repeat(var(--mmr, 4), minmax(0,1fr)); gap: 8px; }
.mm-card { border-radius: 14px; display: grid; place-items: center; min-height: 0; position: relative; overflow: hidden; }
.mm-card.down { background: var(--card-edge, var(--futsu)); background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.14) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 4px 0 rgba(0,0,0,.35); transition: transform .1s; }
.mm-card.down span { font-family: var(--display); font-size: clamp(20px, 6vw, 30px); color: rgba(0,0,0,.35); }
.mm-card.down:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 1px 0 rgba(0,0,0,.35); }
.mm-card.down[disabled] { opacity: .85; }
.mm-card.up { background: var(--card-bg); color: var(--card-fg); box-shadow: 0 0 0 3px var(--pc); animation: mmflip .28s ease-out; }
/* マークは漢字1文字のハンコ（絵文字は機種で見た目が変わるので使わへん） */
.mm-card.up b.mm-mk { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 9vw, 44px); line-height: 1; color: var(--mk); width: 72%; aspect-ratio: 1; max-height: 80%; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--mk); background: color-mix(in srgb, var(--mk) 12%, transparent); transform: rotate(-8deg); }
.mm-card.up.yoru b.mm-mk { color: color-mix(in srgb, var(--mk) 55%, #fff); border-color: color-mix(in srgb, var(--mk) 55%, #fff); }
.mm-card.up.yoru { background: #1c1328; color: #f1e8ff; box-shadow: 0 0 0 3px var(--night); }
.mm-card.up.is-skull { background: #1a0606; box-shadow: 0 0 0 3px #e8202a; }
.mm-card.up.is-skull svg { width: 70% !important; height: 70% !important; max-width: 70%; max-height: 70%; position: static; }
.mm-card.gone { background: color-mix(in srgb, var(--fg) 5%, transparent); border: 1.5px dashed color-mix(in srgb, var(--fg) 15%, transparent); }
.mm-card.gone i { width: 14px; height: 14px; border-radius: 50%; background: var(--mc); opacity: .7; }
@keyframes mmflip { from { transform: rotateY(90deg); } to { transform: none; } }
.mm-foot { margin: 0; }
#stage.mm .deck { min-height: 0; }
.ng-lv { margin: 0; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--card-edge) 16%, transparent); font-size: 14px; font-weight: 900; line-break: strict; }
.ng-lv small { display: block; font-size: 13px; opacity: .75; margin-top: 2px; }
/* 上のバー：上下反転・向かい合わせのボタン、入りきらん人の「…」 */
.bar .bar-btn { width: 40px; height: 40px; border-radius: 50%; color: var(--muted); }
.bar .bar-btn svg { width: 19px; height: 19px; }
.bar .bar-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.av.more { background: var(--chip); color: var(--fg); box-shadow: 0 0 0 2px var(--line); font-size: 16px; letter-spacing: -1px; }
.av.more .cnt { background: var(--fg); color: var(--bg); }
.score { overflow: hidden; }
/* 罰が一番多い人の王冠・罰が増えた時に跳ねる */
.av { position: relative; }
.av .crown { position: absolute; top: -13px; left: 50%; width: 22px; height: 15px; transform: translateX(-50%) rotate(-8deg); filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); animation: crownIn .5s cubic-bezier(.3,1.7,.5,1) both; z-index: 2; }
.av .crown.still { animation: none; }
@keyframes crownIn { from { transform: translateX(-50%) translateY(-10px) scale(0) rotate(-40deg); } }
.av.bump { animation: avBump .6s cubic-bezier(.3,1.8,.5,1) both; }
.av.bump .cnt { animation: cntPop .6s cubic-bezier(.3,1.8,.5,1) both; }
@keyframes avBump { 0% { transform: scale(1); } 30% { transform: scale(1.35) translateY(-4px); } 100% { transform: scale(1); } }
@keyframes cntPop { 0% { transform: scale(.4); background: #fff; } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
.score { padding-top: 14px; }
/* メニューの結果発表は目立たせる */
.menu-item.hot { background: var(--yuru); color: var(--ink); }
.menu-item:disabled { opacity: .45; }
.big.danger-btn { background: #e8202a; color: #fff; }
.i2 { font-size: .74em; letter-spacing: -.06em; white-space: nowrap; }
.menu-item.hot small { color: rgba(20,18,16,.65); }
.rank li small { display: block; font-size: 13px; color: var(--muted); }
/* 説明・ワード一覧は札の真ん中に寄せて、画面の高さに合わせて文字も大きくする（下にぽっかり余白が出んように） */
/* はみ出す時は上から（center のままやと上が切れてスクロールでも戻られへん） */
.mode-card.mid .mid-body > :first-child { margin-top: auto; }
.mode-card.mid .mid-body > :last-child { margin-bottom: auto; }
.mode-card.mid .mid-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: clamp(10px, 2vh, 24px); overflow-y: auto; }
.mode-card.mid .how { font-size: clamp(14px, 2.3vh, 22px); gap: clamp(6px, 1.4vh, 16px); }
.mode-card.mid .how-note { font-size: clamp(12px, 1.6vh, 14px); }
.mode-card.mid .ng-min-wrap { margin-top: 0; }
.mode-card.mid .ng-min button { padding: clamp(10px, 1.8vh, 16px) 0; font-size: clamp(15px, 2vh, 18px); }
.mode-card.mid .ng-list { flex: 0 1 auto; gap: clamp(8px, 1.3vh, 12px); }
.mode-card.mid .ng-list li { padding: clamp(10px, 2.4vh, 26px) 16px; }
.mode-card.mid .ng-list .nm { font-size: clamp(15px, 2vh, 18px); }
.mode-card.mid .ng-list b { font-size: clamp(22px, 4.4vh, 40px); white-space: normal; text-align: right; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.mode-card.mid .ng-list b.l2 { font-size: clamp(19px, 3.6vh, 30px); }
.mode-card.mid .ng-list b.l3 { font-size: clamp(16px, 3vh, 24px); }
/* 札の上の名前：左の丸が切れんように少しすき間 */
.odai .head .who { padding-left: 3px; margin-left: -3px; }
.vote-rule { margin: 0; align-self: flex-start; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 900; line-break: strict; }
.vote-rule b { font-size: 15px; }
.vote-rule.bad { background: rgba(255,59,59,.14); color: #ff3b3b; }
.vote-rule.good { background: rgba(60,180,110,.16); color: #1f9d55; }
body.stage.neon .vote-rule.good, body[data-level="jigoku"] .vote-rule.good { color: #5fe39a; }

/* ===== 罰・ラッキー・連続罰・深夜の演出 ===== */
.redflash { position: fixed; inset: 0; z-index: 24; pointer-events: none; box-shadow: inset 0 0 0 6px #ff2a2a, inset 0 0 90px 30px rgba(255,30,30,.75); animation: redflash .85s ease-out forwards; }
@keyframes redflash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
.streak { position: fixed; inset: 0; z-index: 62; pointer-events: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(10,0,0,.82) 0, rgba(10,0,0,.6) 38%, transparent 72%); animation: streakBg 1.85s ease forwards; }
@keyframes streakBg { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
.streak-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 28px 16px; animation: streakIn 1.85s cubic-bezier(.2,1.4,.4,1) forwards; }
.streak-in b { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); position: relative; }
.streak-in strong { font-family: var(--display); font-size: 64px; line-height: 1; color: #ffe14a; -webkit-text-stroke: 2px #8a1200; text-shadow: 0 0 18px #ff5a00, 0 0 36px #ff2a00, 0 5px 0 #8a1200; position: relative; transform: rotate(-6deg); }
.streak .fl { position: absolute; bottom: 8px; width: 70px; height: 110px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; background: radial-gradient(ellipse at 50% 85%, #fff6a0 0, #ffb21a 30%, #ff4a00 60%, transparent 72%); filter: blur(2px); mix-blend-mode: screen; animation: flame .22s ease-in-out infinite alternate; transform-origin: 50% 100%; }
.streak .fl:nth-child(1) { left: -6px; animation-delay: -.1s; }
.streak .fl:nth-child(2) { left: calc(50% - 45px); width: 90px; height: 140px; bottom: 0; }
.streak .fl:nth-child(3) { right: -6px; animation-delay: -.05s; }
@keyframes flame { from { transform: scaleY(.88) skewX(-4deg); opacity: .8; } to { transform: scaleY(1.08) skewX(5deg); opacity: 1; } }
@keyframes streakIn { 0% { transform: scale(3); opacity: 0; } 14% { transform: scale(.92); opacity: 1; } 22% { transform: scale(1.04); } 30%, 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.15) translateY(-20px); opacity: 0; } }
/* 深夜モード：画面のフチがピンクにぼわっと光って、ハートがゆっくり昇る */
body.deep::after { content: ""; position: fixed; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 28px 4px rgba(255,79,168,.55), inset 0 0 70px 10px rgba(255,79,168,.18); animation: deepGlow 2.6s ease-in-out infinite alternate; }
@keyframes deepGlow { from { opacity: .55; } to { opacity: 1; } }
#hearts { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; display: none; }
body.deep #hearts { display: block; }
#hearts i { position: absolute; bottom: -30px; width: var(--s); height: var(--s); opacity: 0; animation: heartUp var(--t) linear var(--d) infinite; }
#hearts svg { width: 100%; height: 100%; fill: var(--deep); filter: drop-shadow(0 0 6px var(--deep)); }
@keyframes heartUp { 0% { transform: translate(0, 0) rotate(-10deg); opacity: 0; } 10% { opacity: .55; } 50% { transform: translate(14px, -50vh) rotate(8deg); opacity: .4; } 100% { transform: translate(-10px, -105vh) rotate(-6deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .streak-in, .streak .fl, body.deep::after, #hearts i { animation: none !important; } #hearts { display: none !important; } }
.intro-acts { display: flex; gap: 8px; align-items: stretch; }
.intro-acts .big { flex: 1; min-width: 0; width: auto; }
.intro-back { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 16px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 900; color: var(--muted); }
.intro-back svg { width: 20px; height: 20px; }
body.neon .intro-back { border-color: color-mix(in srgb, var(--nc) 60%, transparent); color: #fff; }
/* 上のバー：結果・上下反転・向かい合わせ・⋯ の4つ並べても顔が4人入るように詰める */
.bar { gap: 6px; }
.bar .score { gap: 6px; padding-left: 9px; padding-right: 6px; }
.bar .menu-btn { width: 38px; height: 38px; }
.bar .bar-res { width: 74px; height: 38px; }
.bar .icon-btn.bar-btn { width: 36px; height: 36px; }
.bar .icon-btn.bar-btn svg { width: 19px; height: 19px; }
/* ===== 爆弾パスの大爆発 ===== */
.bigboom { position: fixed; inset: 0; z-index: 70; pointer-events: none; overflow: hidden; }
.bigboom > i, .bb-ball, .bb-ring { position: absolute; left: 50%; top: 45%; }
.bb-white { position: fixed; inset: 0; background: #fff; animation: bbWhite .5s ease-out forwards; }
@keyframes bbWhite { 0% { opacity: 1; } 100% { opacity: 0; } }
.bb-ball { width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; animation: bbBall 1.1s cubic-bezier(.15,.8,.3,1) forwards; filter: drop-shadow(0 0 30px #ff7a1a); }
.bb-ball svg { width: 100%; height: 100%; }
@keyframes bbBall { 0% { transform: scale(.05) rotate(0deg); opacity: 1; } 30% { opacity: 1; } 100% { transform: scale(1.1) rotate(25deg); opacity: 0; } }
.bb-ring { width: 60px; height: 60px; margin: -30px 0 0 -30px; box-sizing: border-box; border-radius: 50%; border: 10px solid rgba(255,240,200,.9); animation: bbRing .7s ease-out forwards; }
.bb-ring.r2 { border-color: rgba(255,120,30,.7); animation-delay: .12s; animation-duration: .9s; }
@keyframes bbRing { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(14); opacity: 0; border-width: 1px; } }
.bb-bit { width: var(--s); height: calc(var(--s) * .7); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); background: var(--c); border-radius: 2px; animation: bbBit var(--t) cubic-bezier(.1,.7,.4,1) .05s both; }
@keyframes bbBit { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--x), calc(var(--y) + 80px)) rotate(var(--r)); opacity: 0; } }
.bb-smoke { width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%; background: radial-gradient(circle, rgba(70,60,55,.85), rgba(40,35,30,.5) 55%, transparent 72%); filter: blur(4px); animation: bbSmoke 1.8s ease-out var(--d) both; }
@keyframes bbSmoke { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--x), var(--y)) scale(2.2); opacity: 0; } }
#app.bb-shake { animation: bbShake .85s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes bbShake { 0% { transform: translate(0,0); } 8% { transform: translate(-18px, 10px) rotate(-2.5deg); } 16% { transform: translate(16px, -12px) rotate(2deg); } 26% { transform: translate(-14px, 6px) rotate(-1.5deg); } 36% { transform: translate(12px, -6px) rotate(1.2deg); } 48% { transform: translate(-8px, 4px) rotate(-.8deg); } 60% { transform: translate(6px, -2px); } 74% { transform: translate(-3px, 1px); } 100% { transform: none; } }
/* 爆発のあとの札：焦げて、まだ火がくすぶってる */
.odai.bp-burnt { --card-bg: #1a0d08; --card-fg: #fff; box-shadow: 0 0 0 3px #ff4a00, 0 0 28px rgba(255,90,0,.55), inset 0 0 50px rgba(255,80,0,.35); overflow: hidden; }
.bp-burnt .bp-scorch { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 40%, rgba(255,140,30,.35), transparent 45%), radial-gradient(circle at 20% 80%, rgba(0,0,0,.6), transparent 40%), radial-gradient(circle at 85% 15%, rgba(0,0,0,.55), transparent 35%); animation: bbEmber 1.4s ease-in-out infinite alternate; }
.bp-burnt > *:not(.bp-scorch) { position: relative; z-index: 1; }
@keyframes bbEmber { from { opacity: .7; } to { opacity: 1; } }
.bp-burnt .bp-boom-t { color: #ffe14a !important; -webkit-text-stroke: 4px #8a1200; paint-order: stroke fill; text-shadow: 0 0 16px #ff5a00, 0 0 34px #ff2a00, 0 4px 0 #8a1200; }
.bp-blast { animation: bbCard .7s cubic-bezier(.2,1.5,.4,1) .15s both; }
.bp-blast .bp-boom-t { animation: bbText .6s cubic-bezier(.2,1.6,.4,1) .3s both; }
@keyframes bbCard { from { transform: scale(.6) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bbText { from { transform: scale(3) rotate(-12deg); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bigboom, #app.bb-shake { animation: none !important; } .bigboom { display: none; } }
/* 傾けたらアウト：ふたりで（深夜だけ） */
.tl-pairsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.tl-pairsel button { padding: 9px 4px; border-radius: 12px; white-space: nowrap; border: 1.5px solid color-mix(in srgb, var(--card-fg) 25%, transparent); font-weight: 900; font-size: 13px; color: var(--card-fg); opacity: .6; }
.tl-pairsel button small { display: block; font-size: 13px; font-weight: 700; margin-top: 2px; opacity: .8; }
.tl-pairsel button[aria-pressed="true"] { opacity: 1; border-color: var(--deep); background: color-mix(in srgb, var(--deep) 18%, transparent); }
.tl-pairsel button[data-v="1"][aria-pressed="true"] { color: var(--deep); }
.tl-duo { display: flex; align-items: center; justify-content: center; gap: 6px; }
.tl-duo .hand-who { min-width: 0; }
.tl-x { font-family: var(--display); font-size: 28px; color: var(--deep); }
/* メンバーの性別（男・女。どっちも押してへんかったら未設定） */
.mem .sex { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.mem .sex button { width: 30px; height: 28px; font-size: 13px; font-weight: 900; color: var(--muted); }
.mem .sex button + button { border-left: 1px solid var(--line); }
.mem .sex button.m[aria-pressed="true"] { background: #3ec7ff; color: #0b1a24; }
.mem .sex button.f[aria-pressed="true"] { background: #ff5aa5; color: #2a0716; }
/* 深夜だけのモード（目隠し当て・ポッキー） */
.mode.deep-mode { box-shadow: 0 0 0 2px var(--deep), 0 6px 0 rgba(0,0,0,.35); }
.mode.deep-mode .mode-ic { color: var(--deep); }
.bl-l { margin: 4px 0 0; font-size: 13px; font-weight: 800; opacity: .6; }
.bl-touch { margin: 0; font-family: var(--display); font-size: clamp(24px, 8vw, 34px); color: var(--deep); text-shadow: 0 0 10px color-mix(in srgb, var(--deep) 50%, transparent); }
.pk-go { font-size: clamp(36px, 12vw, 54px) !important; color: var(--deep); }
.pk-res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pk-res .big { font-size: 15px; padding: 14px 8px; }
.pk-res .ghost, .pk-res .pk-full { grid-column: span 1; }
.pk-res .pk-full { background: var(--deep); color: #fff; }
.bl-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 8px; }
.bl-grid .pen-tile { min-height: 64px; width: 100%; }
.bl-grid .pen-tile .nm { font-size: 18px; }
.tk-by { margin: 0; font-size: 22px; font-weight: 900; }
.tk-pass svg { transform: none; }
.big.hg-stop { min-height: 96px; font-size: 26px; }
/* 早押し雑学クイズ・テンション伝言 */
.qz-card { justify-content: flex-start !important; gap: 10px; }
.qz-q { margin: 4px 0; font-family: var(--display); font-size: clamp(20px, 6.4vw, 28px); line-height: 1.35; }
.qz-q.small { font-size: 15px; font-family: var(--body); font-weight: 800; opacity: .7; }
.qz-zones { display: grid; gap: 8px; width: 100%; flex: 1; min-height: 140px; }
.qz-zone { min-height: 56px; cursor: pointer; }
.qz-zone.out { opacity: .3; border-style: solid; }
.qz-opts { display: grid; grid-template-columns: 1fr; gap: 8px; width: 100%; }
.qz-opt { min-height: 52px; width: 100%; text-align: left; }
.qz-opt .nm { font-size: 17px; white-space: normal; }
.qz-ans { margin: 0; font-family: var(--display); font-size: clamp(26px, 8.5vw, 38px); line-height: 1.25; }
.fc-t { margin: 0; font-family: var(--display); font-size: clamp(22px, 7vw, 32px); line-height: 1.3; }
/* おでこ当て・ダウト */
.dk-play { transition: background-color .15s; }
.dk-play.ok { --card-bg: #1f9d55; --card-fg: #fff; }
.dk-play.pass { --card-bg: #e8780a; --card-fg: #fff; }
.dk-time { margin: 0; font-size: 16px; font-weight: 900; opacity: .75; }
.dk-time b { font-family: var(--display); font-size: 26px; font-weight: 400; }
.dk-cat { margin: 0; font-size: 14px; font-weight: 800; opacity: .6; }
.dk-word { margin: 0; font-family: var(--display); line-height: 1.15; overflow-wrap: anywhere; }
.dk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dk-list li { padding: 4px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--card-fg) 25%, transparent); font-weight: 800; font-size: 14px; opacity: .55; }
.dk-list li.ok { opacity: 1; border-color: #1f9d55; color: #1f9d55; }
.dk-list li i { font-style: normal; margin-right: 4px; }
.du-mode { margin: 6px 0 0; display: inline-block; padding: 6px 14px; border-radius: 999px; background: #1f9d55; color: #fff; font-weight: 900; font-size: 18px; }
.du-mode.lie { background: #e8202a; }
.du-votes { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.du-votes li { display: grid; grid-template-columns: minmax(0,1fr) 70px 70px; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 12px; border-left: 5px solid var(--mc); background: color-mix(in srgb, var(--card-fg) 6%, transparent); }
.du-votes .nm { font-weight: 900; font-size: 16px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.du-votes button { padding: 9px 0; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--card-fg) 25%, transparent); font-weight: 900; font-size: 14px; color: var(--card-fg); }
.du-votes button[aria-pressed="true"] { background: #1f9d55; border-color: #1f9d55; color: #fff; }
.du-votes button.l[aria-pressed="true"] { background: #e8202a; border-color: #e8202a; }
/* 遊び方の一覧：タブ＋2列のカード */
.mode-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; scroll-snap-type: x proximity; }
.mode-tabs::-webkit-scrollbar { display: none; }
.mode-tabs button { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--chip, rgba(247,243,234,.08)); color: var(--muted); font-weight: 900; font-size: 13px; white-space: nowrap; scroll-snap-align: center; }
.mode-tabs button[aria-selected="true"] { background: var(--yuru, #ffd23f); color: var(--ink); }
.mode-tabs button.deep { border: 1.5px solid var(--deep); color: var(--deep); }
.mode-tabs button.deep[aria-selected="true"] { background: var(--deep); color: #fff; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card2 { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 16px; background: var(--paper); color: var(--ink); text-align: left; min-height: 120px; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.mode-card2:active:not(:disabled) { transform: translateY(3px) scale(.985); box-shadow: 0 2px 0 rgba(0,0,0,.35); transition-duration: .06s; }
.mode-card2:disabled { opacity: .45; }
.mode-card2 .mc-top { display: flex; width: 100%; justify-content: space-between; align-items: center; }
.mode-card2 .mode-ic { width: 34px; height: 34px; border-radius: 10px; grid-row: auto; }
.mode-card2 .mode-ic svg { width: 20px; height: 20px; }
.mode-card2 em { font-style: normal; font-size: 13px; font-weight: 900; color: #8d857a; background: rgba(20,18,16,.06); padding: 3px 7px; border-radius: 999px; }
.mode-card2 b { font-weight: 900; font-size: 17px; line-height: 1.2; }
.mode-card2 .mc-desc { font-size: 13px; color: #5d564c; line-height: 1.45; }
.mode-card2.deep-mode { box-shadow: 0 0 0 2px var(--deep), 0 5px 0 rgba(0,0,0,.35); }
.qz-how { margin: 0; padding-left: 1.4em; text-align: left; font-size: 13px; line-height: 1.6; font-weight: 700; }
.qz-tip { margin: 0; font-size: 14px; line-height: 1.5; }
.qz-tip b { color: var(--yuru, #ffd23f); }
body[data-level="yurume"] .qz-tip b, body[data-level="futsu"] .qz-tip b { color: #e8202a; }
.qz-who { margin: 0; font-size: 20px; font-weight: 900; }
.qz-who b { font-family: var(--display); font-weight: 400; font-size: 30px; padding: 0 6px; border-bottom: 4px solid var(--mc); }
.qz-zone .rf-zv { color: inherit !important; opacity: .7; font-size: 13px; }
.qz-zone b { color: inherit !important; text-shadow: none !important; }
/* 王様ゲーム */
.kg-big { margin: 0; font-family: var(--display); font-size: 72px; line-height: 1; }
.kg-big small { font-size: 26px; margin-left: 4px; }
.kg-big.king { color: #e8b52a; text-shadow: 0 3px 0 #8a5a00; }
.kg-call { margin: 0; font-family: var(--display); font-size: clamp(34px, 11vw, 48px); line-height: 1.25; }
.kg-king { margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 18px; font-weight: 900; }
.kg-king .crown { width: 34px; height: 24px; }
.kg-king b { font-family: var(--display); font-weight: 400; font-size: 30px; }
.kg-cmd { margin: 0; font-family: var(--display); font-size: clamp(22px, 7vw, 30px); line-height: 1.4; }
.kg-cmd small { font-family: var(--body); font-size: 13px; font-weight: 800; opacity: .7; }
.kg-no { display: inline-block; min-width: 1.4em; padding: 0 .2em; border-radius: 8px; background: #e8202a; color: #fff; font-family: var(--display); font-weight: 400; }
.kg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.kg-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border-left: 6px solid var(--mc); background: color-mix(in srgb, var(--card-fg) 6%, transparent); }
.kg-list b { font-family: var(--display); font-weight: 400; font-size: 24px; min-width: 2.6em; }
.kg-list span { font-size: 20px; font-weight: 900; }
.kg-refuse { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.kg-refuse button { padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--mc); font-weight: 900; font-size: 14px; color: var(--card-fg); }
.kg-refuse button[aria-pressed="true"] { background: #e8202a; border-color: #e8202a; color: #fff; }
/* お絵かき伝言 */
.dr-card { justify-content: flex-start !important; gap: 8px; }
.dr-src { margin: 0; font-size: 16px; font-weight: 800; }
.dr-src b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.dr-canvas { width: 100%; flex: 1; min-height: 220px; border-radius: 12px; background: #fff; touch-action: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
.dr-time { margin: 0; font-size: 14px; font-weight: 900; }
.dr-time b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.dr-img { width: 100%; flex: 1; min-height: 0; object-fit: contain; border-radius: 12px; background: #fff; }
.dr-in { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--card-fg) 30%, transparent); background: transparent; color: var(--card-fg); font-size: 20px; font-weight: 900; text-align: center; }
.dr-reveal { overflow-y: auto; }
.dr-chain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; width: 100%; }
.dr-chain li { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dr-chain img { width: 70%; border-radius: 10px; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.12); }
.dr-chain b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.dr-by { font-size: 13px; font-weight: 900; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--mc, #8d857a) 25%, transparent); }
/* ワニワニタップ */
.wk-card { justify-content: flex-start !important; gap: 12px; }
/* 上のHUD：のこり時間（バー付き）・点数・ドクロ */
.wk-hud { display: flex; gap: 8px; width: 100%; align-items: stretch; }
.wk-pill { position: relative; display: flex; align-items: baseline; gap: 4px; padding: 6px 12px 8px; border-radius: 16px; background: #141210; color: #f7f3ea; box-shadow: 0 4px 0 rgba(0,0,0,.25); overflow: hidden; }
.wk-pill b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.wk-pill small { font-size: 13px; font-weight: 900; opacity: .7; }
.wk-lbl { font-size: 13px; font-weight: 900; opacity: .65; margin-right: 2px; max-width: 5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-time { flex: 1; }
.wk-tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.12); }
.wk-tbar i { display: block; height: 100%; background: #ffd23f; transform-origin: left; animation: wkBar linear forwards; }
@keyframes wkBar { from { transform: scaleX(1); } 80% { background: #ffd23f; } to { transform: scaleX(0); background: #ff2a2a; } }
.wk-pt { box-shadow: 0 4px 0 rgba(0,0,0,.25), inset 0 0 0 2.5px var(--mc); }
.wk-skp { align-items: center; background: #3a0b0b; color: #ff4a4a; }
.wk-skp .skull { width: 22px; height: 22px; animation: none; filter: none; }
.wk-pill .pop, .wk-pill.pop { animation: wkNum .25s cubic-bezier(.3,1.7,.5,1); }
@keyframes wkNum { from { transform: scale(1.5); } }
/* 水場のボード */
.wk-board { flex: 1; width: 100%; padding: 12px; border-radius: 24px; background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.35) 0 8%, transparent 9%), radial-gradient(circle at 85% 80%, rgba(255,255,255,.25) 0 6%, transparent 7%), linear-gradient(160deg, #5ec8f2, #2a86cc); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 0 0 3px rgba(255,255,255,.25), 0 6px 0 #1d5f94; display: flex; align-items: center; }
.wk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; width: 100%; }
.wk-hole { position: relative; aspect-ratio: 1; background: radial-gradient(ellipse 44% 16% at 50% 82%, #0b2a44 0 92%, rgba(255,255,255,.55) 93% 100%, transparent 101%), radial-gradient(ellipse 50% 20% at 50% 82%, rgba(255,255,255,.18) 0 99%, transparent 100%); overflow: hidden; touch-action: none; border-radius: 0 0 40% 40%; }
.wk-hole::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 2%; height: 16%; border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(#3aa0e0, #2a86cc); border-top: 2px solid rgba(255,255,255,.55); z-index: 1; pointer-events: none; }
.wk-face { position: absolute; left: 12%; right: 12%; bottom: 17%; top: 4%; display: block; animation: wkUp .22s cubic-bezier(.3,1.5,.5,1); }
.wk-face .mole { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
.wk-hole.bad .wk-face { left: 18%; right: 18%; top: 14%; bottom: 14%; }
.wk-hole.bad .wk-face .skull { width: 100%; height: 100%; animation: none; }
.wk-skn { font-size: clamp(30px, 10vw, 44px); white-space: nowrap; }
.wk-hole.ouch { animation: wkOuch .26s ease-out; }
.wk-hole.ouch::before { content: "-1"; color: #ff3b3b; }
@keyframes wkOuch { 0%, 100% { transform: none; } 30% { transform: translateX(-5px) rotate(-4deg); } 60% { transform: translateX(5px) rotate(4deg); } }
.wk-hole.hit::before, .wk-hole.ouch::before { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 34px; -webkit-text-stroke: 5px #141210; paint-order: stroke fill; animation: wkHit .3s ease-out forwards; z-index: 2; pointer-events: none; }
.wk-hole.hit::before { content: "+1"; color: #ffd23f; }
@keyframes wkUp { from { transform: translateY(85%); } to { transform: none; } }
@keyframes wkHit { from { transform: scale(.5); opacity: 1; } 60% { transform: scale(1.25) translateY(-18%); opacity: 1; } to { transform: scale(1.3) translateY(-30%); opacity: 0; } }

/* 人を選ぶボタン（B3）：本人の色の枠と下の厚み＋頭文字の丸。中身の色はカード（地獄度）に合わせる */
.pen-tile { display: grid; grid-template-columns: auto minmax(0, 1fr); align-content: center; justify-content: stretch; align-items: center; column-gap: 9px; row-gap: 1px; padding: 6px 10px; border: 2px solid var(--mc); border-bottom-width: 6px; background: color-mix(in srgb, var(--mc) 9%, #1d1a17); color: var(--paper); transition: transform .08s, border-bottom-width .08s, margin-top .08s, background .15s; }
.pen-tile > :not(.bar):not(.stamp) { grid-column: 2; }
.pen-tile:active { transform: none; border-bottom-width: 3px; margin-top: 3px; }
.pen-tile .bar { position: static; grid-row: 1 / span 2; align-self: center; justify-content: center; align-content: center; width: 30px; height: 30px; border-radius: 50%; background: var(--mc); color: #141210; display: grid; place-items: center; font-size: 14px; font-weight: 900; line-height: 1; }
.pen-tile .bar .i2 { font-size: 10px; letter-spacing: -.04em; }
.pen-tile .bar:empty { display: none; }
.pen-tile .nm:last-child { grid-row: 1 / span 2; }
.pen-tile .bar:empty ~ * { grid-column: 1 / -1; }
.pen-tile.is-doer { box-shadow: 0 0 0 2px var(--fg); }
.odai .pen-tile { background: var(--tile-bg, color-mix(in srgb, var(--card-fg) 7%, var(--card-bg))); color: var(--tile-fg, var(--card-fg)); }
body:not([data-level="jigoku"]) .odai { --tile-bg: #fff; }
body[data-level="jigoku"] .odai { --tile-fg: #f7f3ea; }
.odai.yoru, .odai.deep, .odai.event, .odai.bombc, .odai.batsu, .odai.bp-burnt { --tile-bg: initial; --tile-fg: initial; }
.odai .pen-tile[aria-pressed="true"], body[data-level="jigoku"] .odai .pen-tile[aria-pressed="true"] { background: var(--mc); border-color: color-mix(in srgb, var(--mc) 60%, #000); color: #141210; border-bottom-width: 3px; margin-top: 3px; }
.odai .pen-tile[aria-pressed="true"] .bar { background: #fff; }
.pen-tile.none { border-style: dashed; border-bottom-style: solid; }
.qz-opt { min-height: 54px; }
/* 罰をつける人（3列で狭い）は丸を出さずに枠と厚みだけ */
.pen-grid-wrap .pen-tile .bar { display: none; }
.pen-grid-wrap .pen-tile > * { grid-column: 1 / -1; }
.pen-grid-wrap .pen-tile .nm:last-child, .pen-grid-wrap .pen-tile .nm { grid-row: auto; }

/* 案2：お題文は読みやすい太ゴシック（名前と見出しは看板文字のまま）。札の種類はタグの色で */
.odai .txt { font-family: var(--body); font-weight: 900; line-height: 1.55; letter-spacing: .01em; }
.odai .head .who b { font-size: 26px; }
.odai .head .tag[data-t] { border: 0; color: #141210; opacity: 1; padding: 3px 10px; }
.odai .head .tag[data-t="ひとり"] { background: #ff5d8f; }
.odai .head .tag[data-t="全員"] { background: var(--paper); }
.odai .head .tag[data-t="勝負"] { background: #4dd4ff; }
.odai .head .tag[data-t="みんなで判定"] { background: #7cf06b; }
.odai .head .tag[data-t="ルール"] { background: #ff9a3c; }
.odai .head .tag[data-t="緊急"] { background: #ff2a2a; color: #fff; }
.odai .head .meta:has(.tag[data-t]) { opacity: 1; }

/* 案3：結果のあとは「もう1回」を一番押しやすく */
.res-actions { display: flex; flex-direction: column; gap: 10px; }
.res-actions .again-btn { background: var(--yuru); color: var(--ink); box-shadow: 0 6px 0 #b8901a; }
.res-actions .again-btn small { display: block; font-family: var(--body); font-weight: 900; font-size: 13px; opacity: .75; margin-top: 2px; }
.res-actions .row2 .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.res-actions .row2 .ghost svg { width: 18px; height: 18px; }

/* 案3：夜モードは設定から（隠しコマンドはやめた） */
.night-box .h2 .age { margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--night); color: var(--ink); font-size: 13px; letter-spacing: 0; vertical-align: 2px; }
.night-box.off { border-color: color-mix(in srgb, var(--night) 60%, transparent); }
.sheet-foot { margin: 2px 0 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.sheet-foot a { color: inherit; }

/* 案5：メンバー入力（前回のメンバーを一番上に・名前はチップで） */
.home-top .logo { font-size: clamp(44px, 14vw, 64px); }
.last-group { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 16px 18px; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 #a89f8c; }
.last-group small { font-size: 13px; font-weight: 900; letter-spacing: .08em; }
.last-group .lg-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.last-group .lg-row .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--ink); box-shadow: 0 0 0 2px var(--ink); flex: none; }
.last-group .lg-row b { margin-left: 6px; font-size: 16px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.last-group .lg-go { align-self: flex-end; font-family: var(--display); font-size: 18px; }
.mem-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mem-chip { display: inline-flex; align-items: center; border-radius: 999px; background: rgba(247,243,234,.08); border: 1.5px solid transparent; }
.mem-chip.open { border-color: var(--mc); }
.mem-chip .mc-name { display: inline-flex; align-items: center; gap: 7px; padding: 5px 4px 5px 5px; color: var(--paper); font-weight: 900; font-size: 16px; }
.mem-chip .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--ink); }
.mem-chip em { font-style: normal; font-size: 13px; color: var(--muted); }
.mem-chip em.ngm { color: var(--night); }
.mem-chip .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.mem-chip .x svg { width: 15px; height: 15px; }
.mem-detail { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--mc); }
.mem-detail b { flex: 1; font-size: 15px; }
.mem-detail .sex { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.mem-detail .sex button { width: 44px; height: 34px; font-size: 14px; font-weight: 900; color: var(--muted); }
.mem-detail .sex button + button { border-left: 1px solid var(--line); }
.mem-detail .sex button.m[aria-pressed="true"] { background: #3ec7ff; color: #0b1a24; }
.mem-detail .sex button.f[aria-pressed="true"] { background: #ff5aa5; color: #2a0716; }
/* 案1：遊び方選び（地獄度はスイッチ・迷ったらこれ・行の一覧） */
.home-top.bar2 { align-items: center; }
.mem-pill { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; padding: 6px 12px 6px 6px; border-radius: 14px; background: rgba(247,243,234,.08); color: var(--paper); }
.mem-pill .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--ink); flex: none; }
.mem-pill b { margin-left: 4px; font-size: 14px; font-weight: 900; }
.mem-pill small { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg-lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(247,243,234,.08); }
.seg-lv button { padding: 8px 0; border-radius: 10px; font-weight: 900; font-size: 15px; color: var(--muted); line-height: 1.2; }
.seg-lv button small { display: block; font-size: 13px; font-weight: 700; opacity: .8; }
.seg-lv button.lv-yurume[aria-pressed="true"] { background: var(--yuru); color: var(--ink); }
.seg-lv button.lv-futsu[aria-pressed="true"] { background: var(--futsu); color: var(--ink); }
.seg-lv button.lv-jigoku[aria-pressed="true"] { background: #000; color: var(--blood); box-shadow: inset 0 0 0 2px var(--blood); }
.hero-mode { display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; border-radius: 22px; background: var(--yuru); color: var(--ink); box-shadow: 0 6px 0 #b8901a; }
.hero-mode > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hero-mode small { font-size: 13px; font-weight: 900; letter-spacing: .08em; }
.hero-mode b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; }
.hero-mode em { font-style: normal; font-size: 13px; font-weight: 700; }
.hero-mode i { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--yuru); display: grid; place-items: center; font-style: normal; font-size: 22px; }
.mode-tabs button em { font-style: normal; margin-left: 5px; font-size: 13px; opacity: .6; }
.mode-list { display: flex; flex-direction: column; gap: 8px; }
.mode-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(247,243,234,.06); text-align: left; color: var(--paper); }
.mode-row:active { transform: translateY(2px); }
.mode-row[disabled] { opacity: .45; }
.mode-row .mode-ic { grid-row: auto; flex: none; width: 44px; height: 44px; color: var(--ink); background: var(--paper); }
.mode-row.cat-phone .mode-ic { background: #4dd4ff; }
.mode-row.cat-talk .mode-ic { background: var(--futsu); }
.mode-row.cat-brain .mode-ic { background: #7cf06b; }
.mode-row.cat-deep .mode-ic { background: var(--deep); color: #fff; }
.mode-row .mr-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mode-row .mr-tx b { font-size: 16px; font-weight: 900; }
.mode-row .mr-tx span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode-row .mr-meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; font-weight: 700; line-height: 1.3; }
.mode-row .mr-meta .bd-t { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 14%, transparent); color: var(--paper); font-weight: 900; white-space: nowrap; }
.mode-row .mr-meta .bd-p { padding: 0 2px; color: var(--muted); white-space: nowrap; }

/* 始める前の説明：3コマ（絵＋大きい1行＋小さい補足） */
.koma { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
.koma li { display: flex; gap: 14px; align-items: center; background: color-mix(in srgb, currentColor 5%, transparent); border-radius: 18px; padding: clamp(8px, 1.4vh, 14px) 12px; }
.koma .k-ic { position: relative; flex: none; width: clamp(52px, 8vh, 70px); height: clamp(52px, 8vh, 70px); border-radius: 18px; display: grid; place-items: center; color: #141210; }
.koma .k-ic svg { width: 55%; height: 55%; }
.koma .k-ic b { position: absolute; left: -7px; top: -7px; width: 26px; height: 26px; border-radius: 50%; background: #141210; color: #fff8e7; font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: 14px; display: grid; place-items: center; }
.koma .k1 .k-ic { background: #ffd23f; }
.koma .k2 .k-ic { background: #ff5d8f; }
.koma .k3 .k-ic { background: #ff2a2a; }
.koma .k-tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.koma .k-tx b { font-weight: 900; font-size: clamp(17px, 2.7vh, 23px); line-height: 1.3; }
.koma .k-tx small { font-size: clamp(12px, 1.7vh, 14px); font-weight: 700; opacity: .62; line-height: 1.4; }
.koma-more { align-self: flex-end; font-size: 13px; font-weight: 900; opacity: .7; text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; }

/* 番の交代画面 */
.handoff { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); background: var(--mc); color: #141210; text-align: center; animation: hoIn .28s ease-out; }
@keyframes hoIn { from { opacity: 0; transform: scale(1.04); } }
.ho-top { display: flex; justify-content: space-between; font-weight: 900; font-size: 14px; opacity: .75; }
.ho-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 0; }
.ho-next { font-weight: 900; font-size: 22px; letter-spacing: .2em; }
.ho-dot { width: min(150px, 20vh); height: min(150px, 20vh); border-radius: 50%; background: #141210; color: var(--mc); display: grid; place-items: center; font-family: "Dela Gothic One", sans-serif; font-size: min(78px, 10vh); }
.ho-name { font-family: "Dela Gothic One", sans-serif; font-weight: 400; font-size: clamp(48px, 10vh, 84px); line-height: 1.1; max-width: 100%; overflow-wrap: anywhere; }
.ho-pass { font-weight: 900; font-size: 18px; background: rgba(20,18,16,.12); padding: 8px 18px; border-radius: 999px; }
.ho-btn { background: #141210; color: #fff8e7; border-radius: 20px; padding: 18px; font-family: "Dela Gothic One", sans-serif; font-size: 22px; }
.ho-after { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; font-weight: 900; font-size: 14px; flex-wrap: wrap; }
.ho-after small { opacity: .6; font-size: 14px; }
.ho-av { width: 26px; height: 26px; border-radius: 50%; background: var(--mc); box-shadow: 0 0 0 2px #141210; display: inline-grid; place-items: center; font-size: 13px; }

/* ===== 第3弾 ===== */
/* チーム戦 */
.av.tm::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -7px; height: 4px; border-radius: 2px; background: var(--tc); }
.team-box { display: flex; flex-direction: column; gap: 8px; }
.team-box .toggle { border-color: var(--line); }
.team-box .toggle[aria-pressed="true"] b { background: var(--yuru); color: var(--ink); }
.team-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.team-col { display: flex; flex-wrap: wrap; gap: 4px 8px; align-content: flex-start; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.team-col b { width: 100%; color: var(--tc); font-size: 13px; }
.team-col span { font-weight: 900; font-size: 14px; }
.team-box .text-btn { align-self: flex-end; }
.team-res { display: flex; flex-direction: column; gap: 10px; }
.team-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.team-vs .vs { align-self: center; font-style: normal; font-family: var(--display); color: var(--muted); }
.tv { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; border-radius: 16px; border: 3px solid var(--tc); text-align: center; }
.tv small { font-weight: 900; color: var(--tc); }
.tv b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
.tv span { font-size: 13px; color: var(--muted); font-weight: 700; }
.tv em { font-style: normal; font-weight: 900; padding: 2px 12px; border-radius: 999px; background: var(--chip); }
.tv.lose { background: color-mix(in srgb, var(--tc) 22%, transparent); }
.tv.lose em { background: #e8202a; color: #fff; }
.team-batsu { margin: 0; padding: 12px 14px; border-radius: 14px; background: #1a0606; border: 2px solid #e8202a; font-weight: 900; line-height: 1.6; }
.team-batsu b { display: block; color: #ff6b62; font-size: 13px; }
/* メンバーの出入り */
.inout-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.inout-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; background: rgba(247,243,234,.06); border-left: 6px solid var(--mc); }
.inout-list .nm { font-weight: 900; display: flex; align-items: baseline; gap: 8px; }
.inout-list .nm small { color: var(--muted); font-size: 13px; }
.ghost.sm { padding: 8px 12px; font-size: 13px; }
/* 帰る時間・幹事の道具 */
.tools-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
.rl-list { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.rl-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); font-weight: 900; font-size: 16px; transition: background .08s, transform .08s; }
.rl-item .pc { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.rl-item.on { background: var(--paper); color: var(--ink); border-color: var(--paper); transform: scale(1.04); }
.rl-item.win { background: var(--c-danger); color: #fff; border-color: var(--c-danger); }
.rl-msg { text-align: center; font-weight: 900; font-size: 18px; margin: 4px 0 14px; min-height: 1.6em; }
.gohome, .kanji-btn { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); text-align: left; font-weight: 900; font-size: 14px; position: relative; }
.gohome small, .kanji-btn small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.gohome.set { border-color: #4dd4ff; }
.gohome input { font: inherit; font-size: 16px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: rgba(247,243,234,.06); color: var(--paper); color-scheme: dark; max-width: 100%; box-sizing: border-box; }
.gohome .text-btn { position: absolute; top: 10px; right: 10px; font-size: 13px; }
.kanji-btn { flex-direction: row; align-items: center; }
.kanji-btn svg { width: 24px; height: 24px; flex: none; }
.toast { position: fixed; z-index: 60; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%); max-width: min(520px, calc(100% - 24px)); width: max-content; padding: 14px 18px; border-radius: 16px; background: #f7f3ea; color: #141210; font: inherit; font-weight: 900; font-size: 15px; line-height: 1.5; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: transform .35s cubic-bezier(.2,1.3,.4,1); cursor: pointer; }
.toast.on { transform: translate(-50%, 0); }
.toast.train { background: #4dd4ff; }
.toast.water { background: #7cf06b; }
.kj-tabs { margin: 0; padding: 2px 0 4px; }
.kj-shape { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kj-shape button { padding: 9px; border-radius: 12px; border: 1px solid rgba(247,243,234,.16); font-weight: 900; font-size: 13px; color: var(--muted); }
.kj-shape button[aria-pressed="true"] { background: var(--yuru); color: var(--ink); border-color: transparent; }
.kj-p { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(247,243,234,.08); font-size: 14px; white-space: nowrap; max-width: 100%; overflow: hidden; }
.kj-p .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; color: var(--ink); flex: none; }
.kj-face { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 8px; align-items: stretch; }
.kj-side { display: flex; flex-direction: column; gap: 8px; }
.kj-side:last-child { align-items: flex-end; }
.kj-tbl { display: block; border-radius: 12px; background: #5a3d27; min-height: 120px; }
.kj-round { position: relative; width: min(100%, 330px); aspect-ratio: 1; margin: 0 auto; }
.kj-tbl.round { position: absolute; inset: 30%; border-radius: 50%; min-height: 0; }
.kj-rs { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
.kj-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.kj-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(247,243,234,.05); }
.kj-list li small { font-weight: 900; color: var(--muted); font-size: 13px; }
.kj-list li.top { background: var(--yuru); color: var(--ink); }
.kj-list li.top small { color: var(--ink); }
.kj-vote { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* QR */
.qr-sheet { align-items: center; text-align: center; }
.qr-sheet h2, .qr-sheet .ghost { align-self: stretch; }
.qr { width: min(240px, 70vw); height: auto; border-radius: 14px; }
.qr-url { margin: 0; font-weight: 900; font-size: 18px; letter-spacing: .02em; }
.qr-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
.qr-btn svg { width: 18px; height: 18px; }
/* 通算 */
.last-group .lg-tally { font-size: 13px; font-weight: 700; line-height: 1.5; }
/* 大画面モード */
body.bigscreen #app { max-width: 560px; min-height: var(--app-h); }
#bigRank { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); z-index: 6; width: 260px; display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 22px; background: rgba(20,18,16,.82); color: #f7f3ea; font-family: var(--body); }
#bigRank small { font-weight: 900; letter-spacing: .2em; color: #8d857a; }
#bigRank p { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; }
#bigRank p i { font-style: normal; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--mc); color: #141210; font-weight: 900; flex: none; }
#bigRank p b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bigRank p em { font-style: normal; font-family: var(--display); font-size: 26px; }
#bigRank p.tm { border-top: 1px solid rgba(247,243,234,.16); padding-top: 8px; }
#bigRank p.tm i { width: 14px; height: 14px; }

.lv-note { margin: 0 0 -8px; font-size: 13px; font-weight: 900; color: var(--muted); letter-spacing: .06em; }
.gohome { display: grid !important; grid-template-columns: auto 1fr; align-items: center; gap: 4px 12px !important; }
.gohome .gh-ic svg { width: 24px; height: 24px; display: block; }
.gohome .gh-tx { font-weight: 900; font-size: 15px; padding-right: 40px; }
.gohome input { grid-column: 1 / -1; }
.toast { display: flex; align-items: center; gap: 10px; }
.toast svg { width: 22px; height: 22px; flex: none; }
.ho-pass svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; }
.rt-tile svg { width: 60%; height: 60%; display: block; margin: auto; }
.rt-tile.bomb { color: #fff; }
.bp-bomb svg, .odai .bp-bomb .bomb-art { width: 112px; height: 112px; display: block; margin: 0 auto; }
.bp-card .bp-bomb .bomb-art { margin-top: 0; }
.sk-safe b svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
.skull-wrap .quip { font-size: 14px; font-weight: 900; color: #8a6a00; opacity: .85; animation: reveal .3s .55s ease-out both; }
.odai.drum .skull-wrap .quip { animation-delay: calc(var(--gt) + .55s); }

/* ===== 第4弾：動きと演出 ===== */
/* 20 実況ひとこと：キャラのツッコミ */
.host-say { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); bottom: auto; align-items: flex-start !important; transform: translateX(-50%); z-index: 40; width: min(92vw, 520px); display: flex; align-items: flex-end; gap: 10px; padding: 0; text-align: left; animation: hostIn .42s cubic-bezier(.3,1.6,.5,1) both; }
.host-say i { width: 54px; height: 54px; flex: none; transform: rotate(-6deg); animation: hostBob .9s ease-in-out .4s 2; }
.host-say i svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
.host-say span { flex: 1; background: var(--paper); color: var(--ink); border-radius: 4px 18px 18px 18px; padding: 11px 15px; font-weight: 900; font-size: 16px; line-height: 1.4; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
.host-say.out { animation: hostOut .35s ease-in forwards; }
@keyframes hostIn { from { opacity: 0; transform: translateX(-50%) translateY(-24px) scale(.9); } }
@keyframes hostOut { to { opacity: 0; transform: translateX(-50%) translateY(-16px); } }
@keyframes hostBob { 50% { transform: rotate(6deg) translateY(-4px); } }
/* 21 カプセルの色 */
.g-machine.cap-white .gm-cap .t { background: #f7f3ea; }
.g-machine.cap-red .gm-cap .t { background: #e8202a; }
.g-machine.cap-gold .gm-cap .t, .g-machine.cap-gold .gm-cap .b { background: linear-gradient(135deg, #fff1a8, #ffd23f 45%, #e0a800); }
.g-machine.cap-rainbow .gm-cap .t, .g-machine.cap-rainbow .gm-cap .b { background: linear-gradient(90deg, #ff5d8f, #ffd23f, #7cf06b, #4dd4ff, #b69cff); }
.g-machine.cap-gold .gm-cap, .g-machine.cap-rainbow .gm-cap { filter: drop-shadow(0 0 14px rgba(255,210,63,.95)) drop-shadow(0 0 30px rgba(255,210,63,.6)); }
.g-machine.cap-rainbow .gm-cap { filter: drop-shadow(0 0 14px #ff5d8f) drop-shadow(0 0 26px #4dd4ff); }
.gm-rare { position: absolute; left: 0; right: 0; top: 54%; z-index: 3; text-align: center; font-family: var(--display); font-weight: 400; font-size: 30px; color: #ffd23f; text-shadow: 0 3px 0 #141210, 0 0 18px rgba(255,210,63,.8); opacity: 0; animation: gmRare .7s .5s cubic-bezier(.3,1.6,.5,1) both; pointer-events: none; }
.cap-rainbow .gm-rare { color: #fff; text-shadow: 0 3px 0 #141210, 0 0 14px #ff5d8f, 0 0 26px #4dd4ff; }
@keyframes gmRare { 0% { opacity: 0; transform: scale(2.2); } 35% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
.rareflash { position: fixed; inset: 0; z-index: 25; pointer-events: none; background: #fff; animation: rareflash .45s ease-out forwards; }
@keyframes rareflash { from { opacity: .85; } to { opacity: 0; } }
/* 22 手触り：罰の瞬間に札が揺れる */
#card.hit { animation: cardHit .16s linear 1; }
@keyframes cardHit { 25% { translate: -8px 0; } 50% { translate: 7px 0; } 75% { translate: -4px 0; } }
/* 23 選手入場 */
.entrance { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 18px; background: radial-gradient(circle at 50% 30%, #3a1226, #141210 70%); color: var(--paper); animation: enIn .25s ease-out both; overflow: hidden; }
.entrance > small { font-weight: 900; letter-spacing: .3em; color: var(--futsu); }
.en-h { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 12vw, 60px); line-height: 1.1; animation: enH .5s cubic-bezier(.3,1.7,.5,1) .05s both; }
.en-list { display: flex; flex-direction: column; gap: 10px; width: min(100%, 460px); margin-top: 12px; }
.en-row { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 20px; background: linear-gradient(90deg, color-mix(in srgb, var(--mc) 30%, transparent), transparent); transform: skewX(-6deg); opacity: 0; animation: enL .4s cubic-bezier(.2,1.4,.5,1) var(--d) both; }
.en-row.r { flex-direction: row-reverse; text-align: right; background: linear-gradient(270deg, color-mix(in srgb, var(--mc) 30%, transparent), transparent); animation-name: enR; }
.en-av { width: 54px; height: 54px; border-radius: 50%; background: var(--mc); color: var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 24px; flex: none; transform: skewX(6deg); }
.en-tx { display: flex; flex-direction: column; transform: skewX(6deg); min-width: 0; }

.en-tx em { font-style: normal; font-weight: 900; font-size: 13.5px; color: var(--mc); }
.entrance.many .en-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

@keyframes enIn { from { opacity: 0; } }
@keyframes enOut { to { opacity: 0; transform: scale(1.04); } }
@keyframes enH { from { opacity: 0; transform: scale(2); } }
@keyframes enL { from { opacity: 0; transform: translateX(-60vw) skewX(-6deg); } to { opacity: 1; transform: skewX(-6deg); } }
@keyframes enR { from { opacity: 0; transform: translateX(60vw) skewX(-6deg); } to { opacity: 1; transform: skewX(-6deg); } }
/* 24 伏せて出す・振ってガチャ */
.face-card { gap: 14px; }
.face-art { display: flex; align-items: center; gap: 16px; color: var(--card-fg, var(--ink)); }
.face-art svg { width: 30px; height: 30px; }
.face-art .ph { font-style: normal; width: 66px; height: 110px; border-radius: 14px; border: 3.5px solid currentColor; display: grid; place-items: center; font-weight: 900; font-size: 13px; }
.face-art .ph.down { transform: perspective(240px) rotateX(55deg); opacity: .7; }
.face-art .ph.upc { background: var(--yuru); color: var(--ink); border-color: var(--ink); }
.face-card.up .face-art .ph.down { opacity: .3; }

@keyframes faceUp { 50% { transform: translateY(-6px) rotate(-3deg); } }
.face-h { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 34px); line-height: 1.25; text-align: center; }
.spin-wait { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.sw-art { width: 140px; height: 140px; border-radius: 50%; background: #e8202a; color: #fff; display: grid; place-items: center; animation: swShake .5s ease-in-out infinite; }
.sw-art svg { width: 76px; height: 76px; }
.sw-h { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; }
.spin-wait .big { width: 100%; margin-top: 6px; }
@keyframes swShake { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
#stage:has(.spin-wait) .deck ~ * { visibility: hidden; }
/* 25 罰の瞬間カメラ */
.cam-btn { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 2px solid currentColor; font-weight: 900; font-size: 13px; opacity: .85; }
.cam-btn svg { width: 18px; height: 18px; }
.cam-btn.done { background: currentColor; } .cam-btn.done, .cam-btn.done svg { color: inherit; }
.cam-box { position: fixed; inset: 0; z-index: 80; background: #000; color: #fff; }
.cam-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-box video.mirror { transform: scaleX(-1); }
.cam-top { position: absolute; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top)); background: rgba(20,18,16,.8); border: 2px solid #ff2a2a; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }

.cam-bar button { font-weight: 900; font-size: 16px; color: #fff; min-width: 60px; }
.cam-shot { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff !important; display: grid; place-items: center; }

.cam-box.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: rareflash .26s ease-out forwards; }

.pola { margin: 0; min-width: 0; background: #fff; color: var(--ink); padding: 7px 7px 10px; transform: rotate(var(--r)); box-shadow: 0 10px 20px rgba(0,0,0,.45); animation: polaIn .5s cubic-bezier(.3,1.5,.5,1) both; }

.qb-host { display: flex; align-items: flex-end; gap: 10px; text-align: left; }

.qb-host span { background: #efe8da; border-radius: 16px 16px 16px 4px; padding: 9px 13px; font-weight: 900; } .qb-host small { display: block; font-size: 13px; opacity: .6; }

@keyframes qbUp { from { transform: translateY(100%); } }
.mgraph { position: relative; background: rgba(247,243,234,.06); border-radius: 18px; padding: 14px 12px 8px; }
.mgraph svg { width: 100%; height: 120px; display: block; }
.mg-pk { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--yuru); border: 3px solid var(--ink); transform: translate(-50%, -50%); box-shadow: 0 0 0 5px rgba(255,210,63,.3); }
.mg-ax { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.note-box { margin-top: 10px; background: rgba(247,243,234,.06); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.note-box b { font-size: 14px; } .note-box span { font-weight: 700; color: var(--muted); }
/* 27 夜が深まると画面も変わる */
.logo-wrap { position: relative; }
.tod-sub { display: block; font-size: 13px; font-weight: 900; letter-spacing: .14em; }

body[data-tod="peak"] { --tod: #ff5d8f; background: linear-gradient(180deg, #1f0f2e, var(--bg) 340px) var(--bg); }
body[data-tod="late"] { --tod: #b69cff; background: linear-gradient(180deg, #0b1020, var(--bg) 340px) var(--bg); }
body[data-tod] .tod-sub { color: var(--tod); }
body[data-tod="peak"] .logo:not(.is-night) { color: var(--tod); text-shadow: 0 0 10px rgba(255,93,143,.6); }
body[data-tod="late"] .logo:not(.is-night) { color: var(--tod); }
.tod-deco { position: absolute; left: -16px; right: -16px; top: -20px; height: 110px; pointer-events: none; overflow: hidden; z-index: -1; }

@keyframes lantern { 50% { transform: rotate(4deg) translateY(2px); } }
@keyframes twinkle { 50% { opacity: .1; } }
@keyframes neonBuzz { 0%, 100% { opacity: .35; } 92% { opacity: .1; } 94% { opacity: .35; } 96% { opacity: .15; } }

@media (prefers-reduced-motion: reduce) { .entrance, .en-row, .en-h, .host-say, #card.hit, .gm-rare, .sw-art { animation-duration: .01s !important; } }
/* ===== 第6弾：アプリ全体の動きとデザイン ===== */
/* 38 色の役割：黄=押すとこ／ピンク=今の番・今の人／赤=罰・危ない／水色=お知らせ・情報／紫=夜（メンバーの色は丸の中だけ） */
:root { --c-press: #ffd23f; --c-turn: #ff5d8f; --c-danger: #ff2a2a; --c-info: #4dd4ff; --c-night: #b69cff; --press-t: .1s; }
/* 34 ボタンは3種類：主役（.big 黄/白の太いボタン）・副（.ghost 暗い色）・文字だけ（.link）。押すと下に沈む速さは全部同じ */
.ghost:active:not(:disabled), .menu-item:active:not(:disabled), .mode-row:active:not(:disabled), .hero-mode:active, .btn-add:active, .mb:active:not(:disabled), .kanji-btn:active { transform: translateY(2px) scale(.99); transition: transform var(--press-t); }
.hero-mode:active { box-shadow: 0 2px 0 #b8901a; transform: translateY(4px); }
.hero-mode i svg { width: 26px; height: 26px; stroke-width: 2.6; }
.lg-go { display: inline-flex; align-items: center; gap: 4px; }
.lg-go svg { width: 18px; height: 18px; stroke-width: 3; }
/* ON/OFFは本物のスイッチ（つまみが0.15秒で滑る） */
.toggle b { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border-radius: 999px; font-size: 0; color: transparent; background: rgba(247,243,234,.16); transition: background .15s; }
.toggle b::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #b8b0a2; transition: transform .15s cubic-bezier(.3,1.4,.5,1), background .15s; }
.toggle[aria-pressed="true"] b, .team-box .toggle[aria-pressed="true"] b { background: var(--c-press); }
.toggle[aria-pressed="true"] b::after { transform: translateX(20px); background: var(--ink); }
/* 37 メニューは大きい3つ＋リスト、設定はまとまりごとに畳む */
.menu-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; padding: 10px 4px; border-radius: 16px; background: rgba(247,243,234,.08); color: var(--paper); font-weight: 900; font-size: 13px; }
.mb svg { width: 26px; height: 26px; }
.mb.hot { background: var(--c-press); color: var(--ink); }
.mb:disabled { opacity: .4; }
.sheet .menu-item.danger { color: #ff6b6b; }
.sg-grp { border-radius: 14px; background: rgba(247,243,234,.05); }
.sg-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; text-align: left; font-weight: 900; font-size: 15px; color: var(--paper); }
.sg-head span { display: block; min-width: 0; }
.sg-head em { font-style: normal; font-size: 13px; opacity: .55; margin-left: 6px; }
.sg-head small { display: block; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sg-head svg { flex: none; width: 20px; height: 20px; opacity: .6; transition: transform .2s; }
.sg-grp.open .sg-head svg { transform: rotate(180deg); }
.sg-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s cubic-bezier(.2,.9,.3,1); }
.sg-grp.open .sg-body { grid-template-rows: 1fr; }
.sg-in { overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 0 10px; min-height: 0; }
.sg-grp.open .sg-in { padding-bottom: 10px; }
.sheet { touch-action: pan-y; }
/* 33 広がる札 */
.mv-card { position: fixed; z-index: 30; pointer-events: none; }
/* 35 起動：ロゴがポン→前のメンバーが順に出る */
body.boot .logo { animation: bootPop .34s cubic-bezier(.2,1.7,.4,1) both; }
body.boot .last-group { animation: bootUp .3s .18s cubic-bezier(.2,.9,.3,1) both; }

body.boot .last-group .lg-row > *:nth-child(1) { animation-delay: .24s; }
body.boot .last-group .lg-row > *:nth-child(2) { animation-delay: .29s; }
body.boot .last-group .lg-row > *:nth-child(3) { animation-delay: .34s; }
body.boot .last-group .lg-row > *:nth-child(4) { animation-delay: .39s; }
@keyframes bootPop { from { transform: scale(.7); opacity: 0; } }
@keyframes bootUp { from { transform: translateY(14px); opacity: 0; } }
/* 39 +1がポンと出る */
.av .plus1 { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-style: normal; font-family: var(--display); font-size: 16px; color: var(--c-danger); text-shadow: 0 0 0 #000; pointer-events: none; animation: plus1 .7s cubic-bezier(.2,1.2,.4,1) both; z-index: 4; }
@keyframes plus1 { 0% { transform: translate(-50%, 8px) scale(.5); opacity: 0; } 25% { transform: translate(-50%, -2px) scale(1.25); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -12px) scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toggle b, .toggle b::after, .sg-body, .sg-head svg { transition: none; } body.boot .logo, body.boot .last-group, body.boot .last-group .lg-row > *, .av .plus1 { animation: none; } .av .plus1 { display: none; } }
/* ===== 第8弾 G2 駆け引き ===== */
.hl-dots { display: flex; gap: 8px; justify-content: center; margin: 6px 0 2px; }
.hl-dots i { width: 14px; height: 14px; border-radius: 50%; background: color-mix(in srgb, currentColor 18%, transparent); transition: background .2s, transform .2s; }
.hl-dots i.on { background: var(--c-press); transform: scale(1.15); }
.hl-pts { font-size: 13px; opacity: .75; font-weight: 800; margin-top: 8px; }
.hl-pts b { color: var(--c-turn); }
.hl-stop, .rt-pass { display: block; width: 100%; min-height: 54px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: inherit; font-weight: 900; font-size: 16px; text-align: center; cursor: pointer; }
.hl-stop small { display: block; font-weight: 700; font-size: 13px; opacity: .7; margin-top: 3px; }
.hl-stop:active, .rt-pass:active { transform: scale(.98); }

/* ===== 第8弾 G3 価値観ナンバー協力型 ===== */
.it-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
.it-mode button { padding: 10px 8px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: inherit; text-align: center; cursor: pointer; }
.it-mode button b { display: block; font-size: 17px; }
.it-mode button small { display: block; font-size: 13px; font-weight: 700; opacity: .7; margin-top: 2px; }
.it-mode button[aria-pressed="true"] { background: var(--c-press); color: var(--ink); border-color: var(--c-press); }
.it-mode button[aria-pressed="true"] small { opacity: .8; }
.it-life { display: flex; justify-content: center; gap: 8px; margin: 8px 0 0; }
.it-life i { width: 26px; height: 26px; color: color-mix(in srgb, currentColor 24%, transparent); transition: transform .25s, color .25s; }
.it-life i.on { color: var(--c-danger); }
.it-life svg { width: 100%; height: 100%; display: block; fill: currentColor; }

/* ===== 第8弾 G7 結果画像シート ===== */
.share-prev { display: flex; justify-content: center; margin: 4px 0 10px; }
.share-prev img { height: min(42vh, 360px); aspect-ratio: 9 / 16; object-fit: cover; border-radius: 14px; border: 2px solid var(--line); background: #141210; }
.share-prev span { height: 120px; display: flex; align-items: center; opacity: .6; font-weight: 800; }

/* ===== 第8弾 G5 おまかせメドレー ===== */
.med-box { margin: 12px 0; padding: 14px; border-radius: 18px; background: color-mix(in srgb, var(--fg) 7%, transparent); }
.med-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.med-head b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.med-head small { font-size: 13px; opacity: .7; font-weight: 700; }
.med-n { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.med-n button { padding: 10px 0; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: inherit; font-weight: 900; font-size: 15px; cursor: pointer; }
